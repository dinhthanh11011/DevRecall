overview: |-
  ## TL;DR

  - TypeScript là **type checker chạy lúc compile**; lúc runtime chỉ còn JavaScript (**type erasure**). Mọi dữ liệu đi qua boundary (HTTP body, JSON, Kafka message, env) phải **validate runtime** (zod/valibot) rồi mới tin type.
  - Hệ thống type là **structural** (so sánh theo shape), không phải nominal — cần **branded types** nếu muốn phân biệt `TenantId` với `UserId`.
  - Senior interview hỏi về **narrowing, discriminated union, generics có constraint, conditional/mapped types, variance** và **chỗ nào TS unsound** (`as`, `any`, `!`, index access, type guard sai).
  - Tooling quan trọng không kém: `strict`, `noUncheckedIndexedAccess`, `verbatimModuleSyntax`, `moduleResolution`, và tốc độ type-check trên monorepo lớn (TS 7 native compiler — verify version khi đọc).

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Structural typing | Hai type tương thích nếu shape tương thích, không quan tâm tên | `type A = {id: string}` nhận được object `{id, name}` qua biến |
  | `unknown` vs `any` | `any` tắt type check; `unknown` bắt phải narrow trước khi dùng | `JSON.parse` nên được coi là `unknown` |
  | `never` | Tập rỗng — giá trị không thể tồn tại | Exhaustive check trong `switch` |
  | Narrowing | TS thu hẹp type theo control flow | `if (typeof x === "string")` |
  | Discriminated union | Union có field literal chung để phân nhánh | `{status: "ok", data} \| {status: "err", error}` |
  | Generics + constraint | Tham số hoá type, giới hạn bằng `extends` | `<T, K extends keyof T>(o: T, k: K) => T[K]` |
  | Conditional type | "if/else" ở tầng type, **distributive** trên union | `T extends string ? "s" : "o"` |
  | Mapped type | "for-loop" qua key | `{ [K in keyof T]?: T[K] }` = `Partial<T>` |
  | `satisfies` | Kiểm tra value khớp type **mà không làm mất** literal type đã infer | `const cfg = {...} satisfies Config` |
  | Branded type | Giả lập nominal typing bằng phantom property | `type TenantId = string & { __brand: "TenantId" }` |

  ## Cơ chế hoạt động

  TypeScript chỉ tồn tại ở build time. Có hai con đường từ `.ts` ra runtime, và cả hai đều **xoá type**:

  ```mermaid
  flowchart LR
    SRC["source .ts"] --> TC["tsc --noEmit<br/>(type check)"]
    SRC --> EMIT["Transpile / strip types<br/>(tsc emit, esbuild, swc,<br/>Node type stripping)"]
    TC -- "errors" --> CI["CI fails"]
    EMIT --> JS["plain JavaScript<br/>(no types)"]
    JS --> RT["Runtime: Node / browser"]
    EXT["HTTP body / JSON / Kafka / env"] --> VAL{"Runtime validation<br/>(zod parse)"}
    VAL -- "ok: typed value" --> RT
    VAL -- "fail" --> ERR["400 / DLQ / crash early"]
  ```

  - Transpiler kiểu esbuild/swc/Node type stripping **không type-check** — phải chạy `tsc --noEmit` riêng trong CI.
  - Node (v22.18+/v23.6+) chạy được `.ts` trực tiếp bằng **type stripping**, nhưng không hỗ trợ syntax cần transform (enum, namespace có runtime code, parameter properties, decorators) và **bỏ qua tsconfig** — xem `erasableSyntaxOnly`. (verify theo version Node)

  Narrowing theo control flow:

  ```mermaid
  flowchart TD
    A["x: string | number | User | null"] --> B{"x === null?"}
    B -- yes --> N["x: null"]
    B -- no --> C{"typeof x === 'string'?"}
    C -- yes --> S["x: string"]
    C -- no --> D{"typeof x === 'number'?"}
    D -- yes --> NUM["x: number"]
    D -- no --> U["x: User"]
  ```

  ## Trade-offs

  | Lựa chọn | Ưu | Nhược | Dùng khi |
  |---|---|---|---|
  | `interface` | Declaration merging, error message gọn, `extends` báo lỗi xung đột sớm | Không biểu diễn union/tuple/conditional | Object contract, public API, module augmentation |
  | `type` alias | Union, intersection, mapped, conditional | Không merge; `&` xung đột → `never` âm thầm | Logic ở tầng type, state machine |
  | `enum` | Có runtime object, reverse mapping (numeric) | Sinh code, không erasable, numeric enum dễ nhận số bất kỳ | Hiếm; ưu tiên union literal / `as const` object |
  | `as` cast | Nhanh | Nói dối compiler, không kiểm tra runtime | Chỉ khi bạn biết hơn compiler (DOM, test) |
  | zod schema → `z.infer` | Một nguồn sự thật cho runtime + type | Chi phí parse, bundle size | Mọi boundary không tin cậy |
  | Transpile-only (swc/esbuild) | Build rất nhanh | Không check type, `isolatedModules` hạn chế | Dev loop; CI vẫn cần `tsc --noEmit` |

  ## Pitfalls

  - Tin `as User` cho response API → crash runtime ở chỗ xa nguồn lỗi.
  - `obj[key]` với index signature trả `T` chứ không phải `T | undefined` nếu không bật `noUncheckedIndexedAccess`.
  - `Object.keys(obj)` trả `string[]` — đúng thiết kế vì structural typing cho phép thừa property.
  - Type guard tự viết (`x is T`) **không được compiler kiểm tra** — viết sai là unsound.
  - Array là **covariant** (unsound): `Dog[]` gán được cho `Animal[]` rồi `push(cat)`.
  - Method shorthand trong interface bị **bivariant** kể cả khi bật `strictFunctionTypes`.
  - `useDefineForClassFields` (mặc định `true` khi `target >= ES2022`) đổi semantics class field — có thể ghi đè giá trị do base class/decorator set.
  - Conditional type **distributive** trên union — `IsString<string | number>` ra `boolean`, không phải `false`.

  ## Cheat sheet

  - Assignability: mọi thứ → `unknown` ✅; `any` → mọi thứ trừ `never` ✅; `unknown` → type cụ thể ❌ (phải narrow); `never` → mọi thứ ✅; không gì → `never`, kể cả `any` (`TS2322: Type 'any' is not assignable to type 'never'`).
  - Exhaustive: `default: { const _x: never = value; throw new Error(...) }`.
  - `satisfies` giữ literal type; annotation `: T` widen về `T`; `as T` bỏ qua check.
  - Tắt distributive: `[T] extends [U] ? X : Y`. Check `never`: `[T] extends [never]`.
  - `infer` chỉ dùng trong nhánh `extends` của conditional type.
  - Version cần nhớ (verify): `satisfies` 4.9 · `const` type params & `verbatimModuleSyntax` 5.0 · `using` 5.2 · `NoInfer` 5.4 · inferred type predicates & `isolatedDeclarations` 5.5 · `erasableSyntaxOnly` 5.8 · TS 6.0 đổi default (`strict: true`, `module: esnext`, `types: []`) · TS 7.0 = compiler viết lại bằng Go.
