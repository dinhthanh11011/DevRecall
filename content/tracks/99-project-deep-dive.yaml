overview: |-
  ## TL;DR

  - Phần deep-dive là nơi senior interview **thắng hoặc thua**: interviewer chọn một dòng trên CV và hỏi liên tục "**what exactly did you do → why that way → what broke → what would you change → numbers?**" tới khi chạm giới hạn hiểu biết của bạn.
  - Mỗi claim trên CV phải có: **một kiến trúc vẽ được trên bảng**, **một câu chuyện STAR**, **2–3 con số thật**, và **một điều bạn sẽ làm khác**.
  - Nguyên tắc vàng: **không bịa**. Nếu không có số chính xác, nói ước lượng và cách bạn biết. Nếu phần đó do người khác làm, nói rõ phần của bạn.
  - Bốn dự án: **P1** e-commerce multi-tenant B2B2C (2024–2026, trọng tâm), **P2** monolith → microservices back-office (2023–2024), **P3** banking React SPA (2022–2023), **P4** financial web apps real-time (2022).
  - Khoảng trống đã biết (NestJS, AWS chưa dùng production; CV chưa có số liệu) → chuẩn bị câu trả lời trung thực từ trước.

  ## Khái niệm cốt lõi — chuỗi prove-it

  | Bước | Interviewer hỏi | Bạn cần có |
  |---|---|---|
  | What | "What exactly did you build/change?" | Phạm vi cụ thể, phần **của bạn** |
  | Why | "Why that approach and not X?" | Ít nhất 1 phương án đã loại + lý do |
  | How | "Walk me through the flow / schema / code" | Diagram, tên bảng/endpoint/key |
  | Broke | "What went wrong?" | Một sự cố/bug thật và cách xử lý |
  | Numbers | "How much? How did you measure?" | Số trước/sau + công cụ đo |
  | Change | "What would you do differently?" | Một cải thiện thực tế, không phải "không có gì" |

  ```mermaid
  flowchart LR
    C["Claim trên CV"] --> W["What: phần bạn làm"]
    W --> Y["Why: trade-off, phương án loại"]
    Y --> H["How: diagram, schema, code"]
    H --> B["What broke: sự cố thật"]
    B --> N["Numbers: trước/sau, cách đo"]
    N --> D["Change: làm khác gì"]
    D -. "interviewer chọn claim khác" .-> C
  ```

  ## P1 — Multi-tenant B2B2C e-commerce platform (2024–2026)

  Nền tảng phục vụ retailer và khách hàng ở hai quốc gia; team quốc tế (PO, QA, Designer, Tech Lead), giao tiếp tiếng Anh, phân tán. Stack: Node, TS, Express, React, Next.js, relational DB (SQL Server), Redis, Elasticsearch.

  ```mermaid
  flowchart LR
    U["Customer / Retailer staff"] --> FE["Next.js / React apps"]
    FE --> API["Node/TS API<br/>auth + tenant middleware"]
    API --> AUTH["JWT / OAuth<br/>Google OAuth, RBAC"]
    API --> R[("Redis cache<br/>hot APIs")]
    API --> DB[("Relational DB<br/>tenant_id scoped")]
    API --> ES[("Elasticsearch")]
    EXT["External product providers"] --> DE["Data Enrichment Service<br/>sync + normalize"]
    DE --> DB
    DB --> IX["Indexer Service<br/>transform + index"]
    IX --> ES
  ```

  **Claims sẽ bị đào**: (1) own feature end-to-end · (2) schema change, indexing, query optimization cho high-traffic API · (3) tenant-aware data access & authorization · (4) zero-downtime, zero-data-loss migration · (5) giới thiệu Redis caching cho hot API · (6) JWT/OAuth, Google OAuth, RBAC, permission check · (7) Checkout, Address Management, Shift Management · (8) Data Enrichment Service · (9) Indexer Service → Elasticsearch · (10) refactor legacy, xử lý prod issue BE/DB/FE · (11) AI-assisted workflow có human review.

  **STAR template (dùng cho mỗi claim)**
  - **S**: API/feature nào, traffic/tenant/dữ liệu cỡ nào, vấn đề gì.
  - **T**: bạn được giao gì / tự nhận gì.
  - **A**: các bước bạn làm, phương án đã loại, khó khăn giữa chừng.
  - **R**: số trước/sau, tác động kinh doanh.
  - **Reflection**: sẽ làm khác gì.

  **Numbers to collect** (điền số liệu thật của bạn): số tenant/retailer · số user/đơn hàng/ngày · RPS của hot API · p95/p99 latency trước/sau cache và index · cache hit ratio, TTL · kích thước bảng khi migration · thời gian backfill · số lần migration zero-downtime · số sản phẩm được enrich/index, thời gian reindex · số provider · số role/permission · tỷ lệ lỗi checkout.

  ## P2 — Enterprise back-office: monolith → Node/Express microservices (2023–2024)

  ```mermaid
  flowchart LR
    C["Clients / UI"] --> GW["Routing layer<br/>(strangler facade)"]
    GW -->|"chưa migrate"| MONO["Legacy monolith"]
    GW -->|"đã migrate"| S1["Service A (Node/Express)"]
    GW --> S2["Service B"]
    S1 -- "events" --> K[["Kafka"]]
    K --> S2
    S1 --> MC[("Memcached<br/>TTL + refresh")]
    S1 --> DB1[("DB")]
    MONO --> DB0[("Legacy DB")]
  ```

  **Claims**: decomposition thành service · Kafka async communication · caching + data transformation · backward compatibility trong incremental migration · Memcached TTL + refresh giảm tải DB đáng kể.

  **STAR template**: S = monolith gặp vấn đề gì (deploy, scale, coupling) → T = phần bạn phụ trách (service/luồng nào) → A = cách chọn boundary, routing, event, cache, đảm bảo tương thích → R = số service/luồng migrate, DB load giảm bao nhiêu → Reflection.

  **Numbers to collect**: số service bạn tham gia extract · thời gian migration · throughput Kafka (msg/s), số topic/partition · DB load trước/sau Memcached (QPS, CPU) · hit ratio, TTL · số incident do migration.

  ## P3 — Banking React SPA (2022–2023)

  ```mermaid
  flowchart TD
    R["Route-level code splitting<br/>React.lazy + Suspense"] --> P["Pages"]
    P --> H["Custom hooks<br/>business logic"]
    H --> S["Redux Toolkit store<br/>slices"]
    H --> API["REST API"]
    P --> L["Core component library<br/>reusable, themed"]
  ```

  **Claims**: reusable component architecture · memoization, code splitting, lazy loading, dynamic imports · business logic trong custom hooks · core component library · Redux Toolkit.

  **STAR template**: S = vấn đề performance/maintainability cụ thể → T = phần bạn own → A = profile (React DevTools Profiler, bundle analyzer), thay đổi cụ thể → R = bundle size/render time trước/sau → Reflection.

  **Numbers to collect**: bundle size initial trước/sau · số route/chunk · thời gian render của màn hình nặng · số component trong library, số màn hình dùng · LCP/TTI nếu có.

  ## P4 — Financial web apps, real-time (2022)

  ```mermaid
  sequenceDiagram
    participant B as Browser (React)
    participant S as Node/Express + Socket.IO
    participant D as DB
    B->>S: connect (auth)
    S-->>B: joined room (account/tenant)
    D-->>S: data change
    S-->>B: emit update
    B->>S: upload CSV
    S->>S: stream parse + batch insert
    S->>D: bulk write
  ```

  **Claims**: reliability · Socket.IO real-time · React class components · unit + load testing · fix CSV processing bottleneck.

  **Numbers to collect**: số connection đồng thời · kích thước CSV, thời gian xử lý trước/sau · memory peak trước/sau · công cụ load test, target RPS/concurrent user, cái gì hỏng đầu tiên.

  ## Trade-offs — cách kể về quyết định

  | Tình huống | Câu trả lời yếu | Câu trả lời senior |
  |---|---|---|
  | Không nhớ số | Bịa số chính xác | "Khoảng X theo dashboard lúc đó; đây là cách tôi đo" |
  | Phần do người khác làm | Nhận là của mình | "Phần đó do teammate; tôi làm Y và tích hợp với nó" |
  | Quyết định bạn không đồng ý | Chê quyết định | "Team chọn A vì ràng buộc Z; tôi đề xuất B; nhìn lại…" |
  | Không biết câu trả lời | Nói vòng vo | "Tôi không chắc; tôi sẽ kiểm tra bằng…" |
  | Thứ chưa dùng production | Nói như đã dùng | "Chưa dùng production; tôi đã POC và hiểu trade-off…" |

  ## Pitfalls

  - Không vẽ được kiến trúc của chính dự án mình.
  - Không phân biệt được phần mình làm với phần team làm.
  - "Significantly", "much faster" không có số; hoặc số không bảo vệ được.
  - Không nhớ tên bảng/endpoint/key/topic — dấu hiệu làm hời hợt.
  - Không có câu chuyện "cái gì đã hỏng" — interviewer nghi ngờ độ sâu.
  - Tiết lộ thông tin mật của client (tên, số liệu nội bộ nhạy cảm) — nói ở mức khái quát hoá.

  ## Cheat sheet

  - Mỗi claim: **1 diagram · 1 STAR · 2–3 số · 1 phương án đã loại · 1 điều hỏng · 1 điều làm khác**.
  - Tenant: token → middleware → repository/query → cache key → search index — tenant ở **mọi** tầng.
  - Migration: expand → dual-write/backfill theo batch → verify → switch read → contract; luôn có rollback.
  - Cache: key có tenant, TTL + invalidation on write, stampede protection, fallback khi Redis down.
  - Microservices: strangler fig, boundary theo domain, Kafka key theo entity, idempotent consumer, outbox, backward compat.
  - Frontend: đo trước (Profiler, bundle analyzer), memo có lý do, split theo route.
  - Real-time/CSV: Socket.IO scale bằng adapter + sticky session; CSV bằng stream + batch + backpressure.
