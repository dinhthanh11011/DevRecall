id: 08-api-design
slug: api-design
title: API Design
tier: 2
status: drafted
summary: REST semantics, idempotency, pagination, versioning, error format (RFC 9457), rate limiting, webhooks, GraphQL, gRPC — thiết kế API sống được qua nhiều năm và nhiều client.
cvLinked: true
