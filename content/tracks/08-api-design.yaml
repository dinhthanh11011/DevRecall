overview: |-
  ## TL;DR

  - API là **contract** lâu dài: một khi client đã phụ thuộc, mọi thay đổi đều có giá. Senior interview hỏi về **evolution** (versioning, backward compatibility, deprecation) nhiều hơn là "REST là gì".
  - Nắm chắc **HTTP semantics** (RFC 9110): method nào *safe*, method nào *idempotent*, status code nào nói gì — đây là nền cho retry, caching và proxy hoạt động đúng.
  - Mạng không tin cậy → mọi mutation quan trọng (payment, checkout) cần **idempotency key**; mọi list endpoint cần **pagination ổn định** (cursor/keyset); mọi lỗi cần **format thống nhất** (Problem Details, RFC 9457).
  - Bảo vệ hệ thống: **rate limiting** (token bucket / sliding window), timeout, quota theo tenant; bảo vệ client: `429` + `Retry-After`.
  - REST vs GraphQL vs gRPC không phải "cái nào tốt hơn" mà là **ai là client**: public/partner → REST + OpenAPI; nhiều UI cần shape khác nhau → GraphQL/BFF; service-to-service nội bộ, latency thấp, streaming → gRPC.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Safe method | Không thay đổi state phía server (về mặt ngữ nghĩa) | `GET`, `HEAD`, `OPTIONS` |
  | Idempotent method | Gọi N lần = gọi 1 lần (về state) | `PUT /users/1`, `DELETE /users/1`; `POST` thì **không** |
  | Idempotency key | Client gửi key duy nhất để server dedupe retry của một `POST` | `Idempotency-Key: 5f1c…` trên `POST /payments` |
  | Cursor / keyset pagination | Trang kế tiếp dựa trên vị trí (giá trị sort cuối), không dựa trên offset | `?after=eyJpZCI6MTIzfQ&limit=50` |
  | Problem Details | Format lỗi chuẩn `application/problem+json` (RFC 9457) | `{ "type", "title", "status", "detail", "instance" }` |
  | Conditional request | Dùng `ETag` + `If-Match` / `If-None-Match` cho cache & optimistic concurrency | `PUT` với `If-Match: "v7"` → `412` nếu đã đổi |
  | Rate limiting | Giới hạn số request theo key (user, tenant, IP) trong cửa sổ thời gian | `429 Too Many Requests` + `Retry-After: 30` |
  | Webhook | Server gọi ngược tới client khi có event; cần ký (HMAC) + retry + dedupe | `X-Signature: sha256=…` |
  | Breaking change | Thay đổi làm client cũ hỏng | Đổi tên field, đổi kiểu, thêm required field vào request |

  ## Cơ chế hoạt động

  ### Idempotency key cho `POST /payments`

  ```mermaid
  sequenceDiagram
    participant C as Client
    participant API as API
    participant S as Idempotency store
    participant P as Payment provider
    C->>API: POST /payments (Idempotency-Key K)
    API->>S: INSERT K status=processing (unique)
    alt key mới
      API->>P: charge
      P-->>API: ok
      API->>S: save K -> 201 + body
      API-->>C: 201 Created
    else key đã tồn tại và xong
      S-->>API: stored response
      API-->>C: replay 201 (same body)
    else key đang processing
      API-->>C: 409 Conflict (retry later)
    end
    Note over C,API: Client timeout rồi retry với CÙNG key → không charge 2 lần
  ```

  ### Lựa chọn pagination

  ```mermaid
  flowchart TD
    A["List endpoint"] --> B{"Cần nhảy tới trang N<br/>(admin table)?"}
    B -- yes --> C{"Dataset nhỏ và<br/>ít thay đổi?"}
    C -- yes --> D["Offset/limit<br/>+ total count"]
    C -- no --> E["Offset có giới hạn max page<br/>hoặc search engine"]
    B -- no --> F["Cursor / keyset<br/>(infinite scroll, feed, sync, export)"]
    F --> G["Sort key UNIQUE & ổn định<br/>(created_at, id)"]
  ```

  ### Vòng đời một thay đổi API (evolution)

  ```mermaid
  flowchart LR
    A["Thêm field optional<br/>(additive)"] --> B["Ship + document"]
    C["Cần breaking change"] --> D["Version mới / field mới<br/>song song"]
    D --> E["Deprecation header<br/>+ Sunset date"]
    E --> F["Đo traffic client cũ"]
    F --> G{"Traffic ~ 0?"}
    G -- no --> F
    G -- yes --> H["Remove"]
  ```

  ## Trade-offs

  | Tiêu chí | REST (JSON/HTTP) | GraphQL | gRPC |
  |---|---|---|---|
  | Client phù hợp | Public, partner, browser, mobile | Nhiều UI cần shape khác nhau | Service-to-service nội bộ |
  | HTTP caching | Tốt (GET + ETag + CDN) | Khó (thường POST, 1 endpoint) — cần persisted queries | Không dùng HTTP cache |
  | Over/under-fetching | Có (giải bằng `fields`/`expand`, BFF) | Client chọn field | Schema cố định theo RPC |
  | Contract | OpenAPI | SDL schema, introspection | `.proto`, codegen mạnh |
  | Streaming | SSE/WebSocket riêng | Subscriptions | Native (client/server/bidi) |
  | Rủi ro chính | Endpoint sprawl, versioning | N+1 resolver, query quá phức tạp (DoS) | Browser cần gRPC-Web/proxy; debug khó hơn |

  | Versioning | Ưu | Nhược |
  |---|---|---|
  | URL `/v2/orders` | Rõ ràng, dễ route, dễ cache | Nhân đôi routes; "big bang" version |
  | Header / media type | URL sạch, version theo resource | Khó test bằng browser, dễ quên ở proxy/cache (`Vary`) |
  | Không version, chỉ additive + deprecation | Ít overhead | Cần kỷ luật contract testing rất cao |

  ## Pitfalls

  - Dùng `200 OK` cho mọi thứ kèm `{ "success": false }` → phá monitoring, retry logic và cache.
  - Retry `POST` không có idempotency key → charge/đơn hàng trùng.
  - Offset pagination trên bảng lớn đang được ghi → trùng/mất item, `OFFSET 1000000` quét cả triệu row.
  - Trả thẳng entity DB ra API → lộ field nội bộ, mỗi đổi schema DB thành breaking change.
  - `404` vs `403` cho resource của tenant khác: trả `403` làm lộ sự tồn tại (enumeration) — thường trả `404`.
  - Webhook không ký hoặc so sánh chữ ký bằng `===` (timing attack), không chống replay (timestamp).
  - GraphQL public không giới hạn depth/complexity → một query có thể hạ DB.
  - Rate limit in-memory trên nhiều instance → limit thực tế = N × limit.

  ## Cheat sheet

  - Safe: `GET HEAD OPTIONS TRACE` · Idempotent: safe + `PUT DELETE` · Không idempotent: `POST`, (thường) `PATCH`.
  - `201` + `Location` khi tạo · `202` cho job dài (trả status URL) · `204` không body · `304` Not Modified.
  - `400` malformed · `401` chưa xác thực (kèm `WWW-Authenticate`) · `403` đã xác thực nhưng không có quyền · `404` · `409` conflict state · `412` precondition failed · `422` validation · `429` rate limit.
  - Lỗi: `application/problem+json` (RFC 9457 thay RFC 7807).
  - Pagination: cursor opaque (base64 của sort key), sort key phải unique (`created_at, id`).
  - Breaking: xoá/đổi tên field, đổi type, thêm required input, đổi ý nghĩa enum, đổi default. Non-breaking: thêm field optional, thêm endpoint — **nhưng** client phải tolerant với field/enum lạ.
  - Webhook: HMAC-SHA256 trên raw body + timestamp, constant-time compare, at-least-once → consumer dedupe theo event id.
