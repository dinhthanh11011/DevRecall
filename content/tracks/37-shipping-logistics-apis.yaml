id: 37-shipping-logistics-apis
slug: shipping-apis
title: "Mock: Shipping & Logistics API Integration (FedEx, UPS, USPS, DHL, EasyPost, Shippo)"
tier: 9
status: drafted
summary: Bộ mock theo yêu cầu JD "proven experience integrating FedEx, UPS, USPS, DHL, EasyPost, Shippo" — domain vận chuyển (rate, label, tracking, address, customs, billable weight), cách carrier API và aggregator hoạt động, và cách thiết kế integration chịu lỗi (adapter, idempotency khi mua label, webhook, retry, reconcile, multi-tenant carrier account).
