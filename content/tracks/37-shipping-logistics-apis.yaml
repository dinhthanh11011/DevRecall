overview: |-
  ## TL;DR

  - Một shipping integration làm 5 việc chính: **address validation → rate shopping → mua label (label purchase) → tracking → post-shipment** (void/refund, return label, reconcile hoá đơn carrier). Customs chỉ cần khi gửi quốc tế. Nói được flow này end-to-end là qua được 50% câu hỏi.
  - Có 2 cách tích hợp: **trực tiếp từng carrier** (FedEx, UPS, USPS, DHL: mỗi hãng một API, auth, format, mã lỗi khác nhau) hoặc qua **aggregator** (EasyPost, Shippo, ShipEngine: một API chung cho hàng chục carrier). Trade-off: aggregator rẻ effort, đắt per-label và phụ thuộc vendor; direct thì kiểm soát và giá tốt hơn nhưng phải tự maintain N adapter.
  - Thao tác nguy hiểm nhất là **mua label**: nó **tốn tiền thật** và **không idempotent** phía carrier. Timeout rồi retry mù là bị tính tiền 2 label. Phải dùng idempotency key/reference, ghi trạng thái trước khi gọi, và reconcile.
  - Tracking là **event stream không tin cậy**: webhook có thể trùng lặp, đến sai thứ tự, hoặc mất. Status phải **normalize** về một state machine chung, xử lý idempotent theo event id, và có polling làm fallback.
  - Kiến trúc chuẩn: **canonical model + carrier adapter** (anti-corruption layer), một **OAuth token cache** cho mỗi carrier account, timeout/retry/circuit breaker cho từng carrier, và queue cho tác vụ nặng (label hàng loạt, tracking sync). Tiền lưu theo minor unit, đơn vị cân/đo phải quy đổi tường minh.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Carrier | Hãng vận chuyển thật, cầm hàng đi giao | FedEx, UPS, USPS, DHL Express |
  | Aggregator / multi-carrier API | Lớp API chung bọc nhiều carrier, có thêm tính năng (address verify, tracker, insurance) | EasyPost, Shippo, ShipEngine |
  | Service level | Gói dịch vụ của carrier, quyết định tốc độ và giá | `FEDEX_GROUND`, UPS `03` (Ground), USPS Priority Mail |
  | Rate shopping | Hỏi giá nhiều carrier/service cho cùng một kiện, rồi chọn theo giá, thời gian hoặc rule | Ground $8.20 / 5 ngày vs 2Day $17.40 / 2 ngày |
  | Label | Nhãn vận đơn có barcode + tracking number, mua xong thì carrier tính tiền | PDF 4x6, PNG, hoặc **ZPL** cho máy in nhiệt |
  | Tracking number | Mã định danh kiện, dùng để tra trạng thái | `1Z999AA10123456784` (định dạng UPS) |
  | Tracking event | Một mốc trên hành trình kiện (scan) | `in_transit` tại Memphis TN, 2026-10-14T03:12Z |
  | Address validation | Chuẩn hoá và kiểm tra địa chỉ có thật/giao được, kèm cờ residential | "123 main st apt 4" → `123 MAIN ST APT 4`, ZIP+4, residential=true |
  | Actual vs dimensional (DIM) weight | DIM weight = thể tích / divisor. **Billable weight = max(actual, DIM)** | Thùng 20×16×12 in, 5 lb → DIM = 3840/139 ≈ 27.6 → tính 28 lb |
  | Surcharge / accessorial | Phụ phí ngoài giá gốc | Residential, fuel, delivery area, additional handling, signature |
  | Manifest / end-of-day close | Chốt danh sách kiện trong ngày gửi cho carrier | USPS SCAN Form, FedEx Ground close |
  | Void / refund label | Huỷ label chưa dùng để lấy lại tiền, có thời hạn | EasyPost `refund`, UPS void shipment |
  | Return label | Label cho khách gửi trả, thường **pay-on-use** (chỉ trả tiền khi được scan) | Label in sẵn trong hộp hàng |
  | Customs / commercial invoice | Khai hải quan khi gửi quốc tế: mô tả, HS code, giá trị, xuất xứ | CN22/CN23 cho bưu chính, commercial invoice cho express |
  | Incoterms (DDP/DAP) | Ai trả thuế và phí nhập khẩu: người gửi (DDP) hay người nhận (DAP/DDU) | DDP: khách không bị thu thêm tiền khi nhận hàng |
  | Carrier account (BYOA) | Tài khoản carrier của merchant, có giá đã đàm phán riêng | Tenant A dùng UPS account riêng, tenant B dùng rate của aggregator |
  | Webhook | Carrier hoặc aggregator gọi về endpoint của mình khi có event | `tracker.updated` từ EasyPost |

  ## Cơ chế hoạt động

  ### Vòng đời một shipment end-to-end

  ```mermaid
  flowchart LR
    A["Checkout: nhập địa chỉ"] --> B["Address validation<br/>+ residential flag"]
    B --> C["Rate shopping<br/>N carrier × service"]
    C --> D["Khách chọn rate<br/>(lưu quote + expiry)"]
    D --> E["Order paid → fulfillment"]
    E --> F["Re-rate + mua label<br/>(idempotency key)"]
    F --> G["Lưu label PDF/ZPL vào S3<br/>in label, dán kiện"]
    G --> H["Manifest / pickup"]
    H --> I["Tracking events<br/>webhook + polling"]
    I --> J{"Kết quả"}
    J -->|delivered| K["Đóng shipment<br/>notify khách"]
    J -->|exception / return| L["Xử lý ngoại lệ<br/>reship / refund"]
    F -. "không dùng" .-> V["Void / refund label"]
    K --> R["Reconcile hoá đơn carrier<br/>(DIM adjustment)"]
  ```

  Có 3 thời điểm tiền thật bị trừ hoặc điều chỉnh: lúc **mua label**, lúc **carrier audit lại cân/đo** (adjustment trên invoice), và khi **void/refund**. Rate hiển thị ở checkout chỉ là **quote**; giá thật chốt lúc mua label và có thể khác.

  ### Mua label an toàn khi mạng chập chờn

  ```mermaid
  sequenceDiagram
    participant W as Label worker
    participant DB as Postgres
    participant AG as Carrier / Aggregator
    W->>DB: INSERT shipment_label status=PENDING, idem_key=order_id+parcel_no
    W->>AG: Buy label (Idempotency-Key / reference = idem_key)
    AG--xW: Timeout, không biết đã mua hay chưa
    W->>AG: Lookup theo reference hoặc retry cùng idempotency key
    AG-->>W: Label đã tồn tại, trả tracking + label_url
    W->>DB: UPDATE status=PURCHASED, tracking_no, cost
    Note over W,DB: Không bao giờ tạo request mua mới với key mới khi chưa rõ kết quả lần trước
  ```

  ### Tracking: từ event thô về state machine chung

  ```mermaid
  stateDiagram-v2
    [*] --> pre_transit: label created
    pre_transit --> in_transit: first scan
    in_transit --> out_for_delivery
    out_for_delivery --> delivered
    in_transit --> exception: delay / damaged / address issue
    out_for_delivery --> exception: delivery attempt failed
    exception --> in_transit: resolved
    exception --> return_to_sender
    out_for_delivery --> available_for_pickup
    available_for_pickup --> delivered
    delivered --> [*]
    return_to_sender --> [*]
  ```

  Mỗi carrier có hàng trăm mã scan riêng. Adapter map chúng về khoảng 8–10 status chung. Status chỉ được **tiến lên** theo thứ tự hợp lệ (event cũ đến muộn không được kéo `delivered` về `in_transit`), trừ các nhánh hợp lệ như `exception → in_transit`.

  ### Kiến trúc tích hợp nhiều carrier

  ```mermaid
  flowchart TB
    API["Shipping service API<br/>(canonical model)"] --> RS["Rate service<br/>cache + timeout budget"]
    API --> LS["Label service<br/>idempotent, queue"]
    API --> TS["Tracking service<br/>webhook + poller"]
    RS --> REG["Carrier registry<br/>(strategy theo carrier)"]
    LS --> REG
    TS --> REG
    REG --> FX["FedEx adapter"]
    REG --> UP["UPS adapter"]
    REG --> US["USPS adapter"]
    REG --> EP["EasyPost / Shippo adapter"]
    FX & UP & US & EP --> TOK["OAuth token cache<br/>theo carrier account"]
    FX & UP & US & EP --> CB["Timeout · retry · circuit breaker<br/>· rate limit theo carrier"]
    SEC["Secrets: carrier credentials<br/>mã hoá theo tenant (KMS)"] -.-> TOK
  ```

  ## Trade-offs

  | Quyết định | Lựa chọn A | Lựa chọn B | Khi nào chọn |
  |---|---|---|---|
  | Cách tích hợp | Direct carrier API | Aggregator (EasyPost/Shippo) | A: volume lớn, ít carrier, cần tính năng sâu (freight, pickup đặc thù), muốn bỏ phí per-label. B: cần nhiều carrier nhanh, team nhỏ, muốn tracking và address verify có sẵn |
  | Rate ở checkout | Gọi carrier realtime | Bảng giá tĩnh / flat rate / cache | Realtime cho chính xác khi giá biến động. Bảng tĩnh khi cần nhanh và ổn định, chấp nhận chênh lệch. Thực tế: realtime có cache và fallback |
  | Mua label | Đồng bộ trong request | Bất đồng bộ qua queue | Đồng bộ cho UI "in label ngay" từng kiện. Queue cho batch hàng trăm kiện, có retry và rate limit |
  | Tracking | Webhook | Polling | Webhook nhanh và rẻ nhưng có thể mất hoặc trùng. Polling chắc chắn nhưng tốn quota. Dùng cả hai: webhook chính, poll định kỳ những kiện "im lặng" |
  | Address validation | Chặn cứng (block checkout) | Gợi ý + cho khách xác nhận | Gợi ý gần như luôn đúng hơn: validator có false negative (nhà mới, địa chỉ nông thôn, quốc tế) |
  | Carrier account | Dùng account của aggregator | BYOA, mỗi tenant tự kết nối account | BYOA khi merchant có giá đàm phán, đổi lại phải lưu credential an toàn và xử lý lỗi auth theo tenant |
  | Label format | PDF/PNG | ZPL | ZPL cho máy in nhiệt ở kho (nhanh, sắc nét). PDF cho merchant nhỏ in bằng máy văn phòng |

  ## Pitfalls

  - ❌ Retry mua label khi timeout bằng request mới. ✅ Idempotency key/reference cố định, lookup trước khi mua lại, reconcile cuối ngày.
  - ❌ Lưu tiền bằng float, trộn currency. ✅ Integer minor unit (cents) + currency code; giữ nguyên chuỗi số carrier trả về để audit.
  - ❌ Trộn lb/oz/kg, in/cm. ✅ Canonical unit (ví dụ gram + mm) và convert tại adapter; test riêng phần convert.
  - ❌ Tin rate ở checkout bằng giá label. ✅ Re-rate lúc mua, có ngưỡng chênh lệch và cảnh báo; lưu quote kèm thời hạn.
  - ❌ Xin OAuth token mới cho mỗi request. ✅ Cache token theo account, refresh trước khi hết hạn, single-flight để tránh đua.
  - ❌ Map status bằng `if` rải khắp codebase. ✅ Bảng mapping trong adapter + state machine chỉ cho phép chuyển hợp lệ.
  - ❌ Webhook handler xử lý nặng rồi mới trả 200. ✅ Verify signature → lưu event (dedupe theo id) → trả 2xx nhanh → xử lý async.
  - ❌ Phụ thuộc `label_url` của carrier/aggregator lâu dài. ✅ Tải file về S3 ngay sau khi mua.
  - ❌ Sandbox chạy ngon là xong. ✅ Sandbox khác production (dữ liệu giả, tracking giả, thiếu service). Có checklist go-live và test với vài label production rồi void.
  - ❌ Log nguyên request/response. ✅ Mask PII (tên, địa chỉ, SĐT) và credential; giữ correlation id và carrier request id.

  ## Cheat sheet

  - Flow: **validate address → rate → mua label → manifest/pickup → track → void/return → reconcile**.
  - Billable weight = **max(actual, DIM)**; DIM = L×W×H / divisor. Divisor phổ biến: 139 (in³/lb, FedEx/UPS daily rates), 166 (USPS cho kiện lớn), 5000 (cm³/kg, nhiều carrier quốc tế). Divisor có thể khác theo hợp đồng (verify).
  - Auth: FedEx, UPS và USPS API mới đều dùng **OAuth 2.0 client credentials** (token sống khoảng 1 giờ, verify). EasyPost dùng API key (Basic auth), Shippo dùng `ShippoToken`.
  - Legacy đã hoặc đang bị khai tử: FedEx SOAP Web Services, UPS access-key auth, USPS Web Tools XML (verify mốc thời gian). Câu "đã migrate lên API mới" là điểm cộng lớn.
  - Mua label = **side effect có tiền**: idempotency key, trạng thái PENDING trước khi gọi, không retry mù, reconcile.
  - Tracking = **at-least-once, out-of-order**: dedupe theo event id, chỉ tiến state theo thứ tự, poll fallback cho kiện im lặng.
  - Resilience theo carrier: timeout ngắn ở checkout (khoảng 2–3 s), circuit breaker, fallback rate, rate limit 429 kèm backoff và jitter.
  - Quốc tế: HS code, giá trị khai báo, xuất xứ, Incoterms (DDP/DAP), giấy tờ điện tử (ETD/paperless), hàng cấm và pin lithium.
  - Multi-tenant: credential carrier mã hoá theo tenant, token cache key theo account, rate limit và circuit breaker theo account.
  - Observability: metrics theo carrier × operation (latency, error rate, % fallback), cảnh báo tỉ lệ label fail và kiện kẹt quá N ngày.
