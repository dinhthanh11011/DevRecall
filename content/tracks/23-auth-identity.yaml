id: 23-auth-identity
slug: auth-identity
title: Authentication, OAuth2, OIDC & Authorization
tier: 6
status: drafted
summary: Session vs JWT, refresh rotation/revocation, OAuth 2.0 flows + PKCE, OIDC, SSO/SAML, passkeys, RBAC vs ABAC vs ReBAC, tenant-scoped roles, policy engines.
cvLinked: true
prerequisites: []
overview: |-
  ## TL;DR

  - **AuthN** = bạn là ai; **AuthZ** = bạn được làm gì **với resource nào**. Phần lớn sự cố thật nằm ở AuthZ (thiếu check object/tenant), không ở login.
  - **OAuth 2.0** là framework **ủy quyền** (client lấy access token để gọi API thay user); **OIDC** thêm lớp **định danh** (ID token, userinfo, discovery). Flow chuẩn cho mọi client có user: **Authorization Code + PKCE**. Implicit và Password grant đã bị loại (RFC 9700, hướng OAuth 2.1).
  - Session vs JWT không phải "cũ vs mới": session dễ revoke, JWT tiện cho phân tán nhưng **khó thu hồi** → access token ngắn + refresh token **rotation + reuse detection**.
  - JWT pitfalls kinh điển: tin `alg` trong header (`none`, HS/RS confusion), không check `aud`/`iss`, dùng `decode` thay `verify`, token sống quá lâu, nhét quá nhiều quyền vào token.
  - Authorization models: **RBAC** (role → permission), **ABAC** (thuộc tính + điều kiện), **ReBAC** (quan hệ, Zanzibar). Multi-tenant: role gắn với **membership (user, tenant)**, không gắn với user.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Session | Server lưu state, client giữ session id trong cookie | `__Host-sid=...` → Redis `sess:...` |
  | JWT (JWS) | Token tự chứa claims, **ký** (không mã hoá) | `header.payload.signature`, payload đọc được bằng base64 |
  | Access token | Credential để gọi **resource server** | `Authorization: Bearer eyJ...`, sống 5–15 phút |
  | Refresh token | Đổi lấy access token mới, sống lâu | Rotation: mỗi lần dùng cấp token mới, huỷ token cũ |
  | ID token | JWT cho **client** biết user là ai (OIDC) | `sub`, `iss`, `aud=client_id`, `nonce` |
  | PKCE | Ràng buộc code với client tạo ra nó | `code_challenge = BASE64URL(SHA256(verifier))` |
  | Scope | Quyền client được ủy quyền | `orders:read` |
  | RBAC | User → role → permission | `store_manager` → `order.refund` |
  | ABAC | Quyết định theo thuộc tính user/resource/context | `resource.tenant == user.tenant && amount < 5M` |
  | ReBAC | Quyết định theo quan hệ đồ thị | `user:alice` là `editor` của `folder:x` → edit `doc:y` trong folder |
  | Passkey | Credential WebAuthn (public-key) gắn với origin | Chống phishing, không có shared secret |

  ## Cơ chế hoạt động

  ### Authorization Code + PKCE (OIDC)

  ```mermaid
  sequenceDiagram
    participant U as User browser
    participant C as Client (BFF / app)
    participant AS as Authorization server (IdP)
    participant RS as Resource server (API)
    C->>C: create code_verifier, state, nonce
    C->>U: 302 to /authorize?response_type=code&client_id&redirect_uri&scope=openid...&state&nonce&code_challenge&code_challenge_method=S256
    U->>AS: login + MFA + consent
    AS->>U: 302 redirect_uri?code=...&state=...
    U->>C: GET /callback?code&state
    C->>C: check state matches
    C->>AS: POST /token (code, code_verifier, redirect_uri, client auth)
    AS->>AS: SHA256(verifier) == challenge?
    AS-->>C: access_token, id_token, refresh_token
    C->>C: verify id_token (signature via JWKS, iss, aud, exp, nonce)
    C->>RS: API call with Bearer access_token
    RS->>RS: verify token (sig, iss, aud, exp, scope) + authorize resource
    RS-->>C: 200
  ```

  ### Refresh token rotation + reuse detection

  ```mermaid
  sequenceDiagram
    participant A as Legit client
    participant X as Attacker (stole RT1)
    participant AS as Auth server
    A->>AS: refresh with RT1
    AS-->>A: AT2 + RT2 (RT1 marked used, same family)
    X->>AS: refresh with RT1 (reuse!)
    AS->>AS: RT1 already used -> revoke whole family
    AS-->>X: 400 invalid_grant
    A->>AS: refresh with RT2
    AS-->>A: 400 invalid_grant -> user must log in again
  ```

  ### Quyết định authorization trong một request multi-tenant

  ```mermaid
  flowchart TD
    R["Request + token"] --> V{"Token valid?<br/>sig, iss, aud, exp"}
    V -- no --> E401["401"]
    V -- yes --> T{"User has membership<br/>in requested tenant?"}
    T -- no --> E403["403 / 404"]
    T -- yes --> P{"Role in that tenant<br/>grants permission?"}
    P -- no --> E403
    P -- yes --> O{"Resource belongs to tenant<br/>and passes object rules?"}
    O -- no --> E404["404"]
    O -- yes --> OK["Allow + audit"]
  ```

  ## Trade-offs

  | Quyết định | Lựa chọn A | Lựa chọn B | Ghi chú |
  |---|---|---|---|
  | Web session | Server session (cookie) | JWT stateless | Session: revoke tức thì; JWT: không cần lookup nhưng revoke khó |
  | Token của SPA | BFF giữ token, browser chỉ có cookie | Token trong JS memory | BFF an toàn nhất; memory + refresh rotation chấp nhận được |
  | Access token format | JWT (verify local) | Opaque + introspection | JWT nhanh; opaque revoke tức thì, không lộ claims |
  | Ký JWT | Asymmetric (RS256/ES256/EdDSA) | Symmetric HS256 | Nhiều verifier → asymmetric; HS chỉ khi issuer = verifier |
  | Quyền trong token | Nhét role/permission vào claims | Tra cứu lúc request | Claims nhanh nhưng stale tới khi hết hạn và token phình to |
  | Model | RBAC | ABAC / ReBAC | RBAC đủ cho đa số; share/hierarchy → ReBAC; điều kiện động → ABAC |
  | Enterprise SSO | OIDC | SAML 2.0 | OIDC cho app mới; SAML vì khách hàng enterprise yêu cầu |
  | Policy | Code trong service | Policy engine (OPA/Cedar/OpenFGA) | Engine khi nhiều service/nhiều team cần một nguồn luật |

  ## Pitfalls

  - `jwt.decode()` thay `jwt.verify()`; không truyền `algorithms` allowlist; không check `aud`/`iss`.
  - Dùng **ID token** để gọi API, hoặc chấp nhận access token cấp cho service khác (thiếu `aud`).
  - Access token sống 24h, không có refresh rotation, không có cách revoke khi user bị xoá khỏi tenant.
  - Lưu refresh token trong `localStorage`.
  - Role lưu trên bảng `users` (một role toàn cục) trong khi user thuộc nhiều tenant.
  - Check role ở route nhưng không check resource thuộc tenant nào.
  - Tin `email` từ IdP làm khoá định danh / auto-link account khi `email_verified` không đúng.
  - `redirect_uri` so khớp prefix/wildcard → rò code.
  - Không xử lý **JWKS rotation** (cache key mãi mãi, hoặc fetch JWKS mỗi request).

  ## Cheat sheet

  - Flows: có user → **Auth Code + PKCE**; machine-to-machine → **Client Credentials**; TV/CLI → **Device Authorization Grant** (RFC 8628). Không dùng Implicit/ROPC.
  - `state` = chống CSRF ở callback · `nonce` = gắn ID token với request (chống replay/injection) · PKCE = chống code interception/injection.
  - Verify JWT: allowlist `alg` → key theo `kid` từ JWKS của **issuer đã cấu hình** → signature → `iss` → `aud` → `exp`/`nbf` (leeway ~60s) → claims nghiệp vụ.
  - Access token 5–15', refresh token rotation + reuse detection + absolute lifetime; revoke family khi reuse.
  - Revoke JWT: TTL ngắn, denylist `jti`, `token_version`/`sessions` table, introspection.
  - Multi-tenant RBAC: `memberships(user_id, tenant_id)` + `membership_roles` + `role_permissions`; check (tenant membership → permission → object).
  - SAML = XML assertion, enterprise legacy; OIDC = JSON/JWT, discovery, mobile-friendly.
  - Passkeys: WebAuthn, phishing-resistant vì bound với RP ID (origin), private key không rời authenticator.
