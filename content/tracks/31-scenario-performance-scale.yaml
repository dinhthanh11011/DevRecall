overview: |-
  ## TL;DR

  - Đây là track **mock interview**: câu hỏi là một tình huống production ("API phải chịu 10k rps", "RAM tăng 100% sau 2 ngày", "JSON 3MB"). Điểm không nằm ở việc kể tên công nghệ mà ở **thứ tự suy nghĩ**: hỏi lại → ước lượng → đo → khoanh vùng → fix theo ưu tiên → nói trade-off.
  - Mọi câu "scale" đều quy về vài con số: **throughput (rps)**, **latency (p50/p99)**, **concurrency = rps × latency** (Little's Law), và **tài nguyên hữu hạn** đầu tiên cạn (CPU event loop, DB connection, memory, quota bên thứ ba).
  - Node.js có một điểm yếu cố định: **một event loop cho mọi request**. Việc sync nặng (`JSON.stringify` vài MB, regex backtracking, bcrypt sync, vòng lặp O(n²)) làm chậm **tất cả** request chứ không chỉ request đó.
  - Memory leak = **heap tăng đơn điệu sau GC**, không phải "RSS cao". Chứng minh bằng heap snapshot (3-snapshot technique), mitigation trước (restart có kiểm soát, giới hạn cache), root cause sau.
  - Quá tải là chuyện **khi nào**, không phải **nếu**: thiết kế sẵn rate limit (429), load shedding (503 + `Retry-After`), queue làm buffer (202), backpressure, và timeout/retry có budget.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Throughput vs latency | Số request/giây vs thời gian một request | 10k rps, p99 = 120 ms |
  | Little's Law | `L = λ × W`: số request đang xử lý = arrival rate × thời gian ở trong hệ thống | 2000 rps × 0.05 s = 100 request in-flight |
  | Percentile (p50/p95/p99) | Giá trị mà X% request nhanh hơn | p99 = 800 ms: 1/100 request chậm hơn 800 ms |
  | Tail amplification | Request gọi N dependency → xác suất dính 1 cái chậm tăng nhanh | 100 call, mỗi call 1% chậm → 63% request chậm |
  | Event loop lag / ELU | Độ trễ timer so với lịch / tỷ lệ thời gian event loop bận | `monitorEventLoopDelay()` p99 = 250 ms |
  | Pool wait | Thời gian chờ **lấy** connection, trước khi query chạy | `pool.waitingCount = 180` |
  | Backpressure | Tín hiệu "chậm lại" từ phía nhận truyền ngược về phía gửi | `res.write()` trả `false` → chờ `'drain'` |
  | Load shedding | Chủ động từ chối một phần request để phần còn lại sống | Lag > 200 ms → `503` + `Retry-After: 2` |
  | Rate limiting | Giới hạn theo client/key, lỗi phía client | `429 Too Many Requests` |
  | 202 Accepted + queue | Nhận việc, xử lý sau, trả link theo dõi | `POST /exports` → `202`, `Location: /jobs/42` |
  | Heap vs RSS vs external | V8 heap (JS object) / toàn bộ memory process / Buffer ngoài heap | `heapUsed 300MB`, `rss 1.1GB`, `external 600MB` |
  | Retained size | Memory được giải phóng nếu object này bị GC | `Map` 1 entry nhưng retain 400 MB |
  | Structured clone | Thuật toán copy object giữa thread (`workerData`, `postMessage`) | Gửi object 3MB sang worker = copy trên main thread |
  | Redaction | Xoá/che field nhạy cảm **trước khi** log được ghi | pino `redact: ['req.headers.authorization']` |

  ## Cơ chế hoạt động

  ### Một request đi qua đâu và thời gian nằm ở đâu

  ```mermaid
  sequenceDiagram
    participant U as Client
    participant L as LB / CDN
    participant N as Node (event loop)
    participant P as DB pool
    participant D as Postgres
    participant X as 3rd-party API
    U->>L: HTTPS (DNS, TCP, TLS)
    L->>N: forward
    Note over N: chờ event loop rảnh (lag)
    N->>P: acquire connection (pool wait)
    P->>D: query
    D-->>N: rows
    N->>X: HTTP call (timeout!)
    X-->>N: response
    Note over N: JSON.stringify + gzip (CPU, sync)
    N-->>U: body 3MB (network download)
  ```

  Mỗi mũi tên là một nơi latency có thể nằm. "API chậm" chỉ có ý nghĩa khi biết **đoạn nào** chậm: đo bằng tracing (span cho DB, HTTP), `Server-Timing`, metric pool wait, event loop lag.

  ### Quyết định khi quá tải

  ```mermaid
  flowchart TD
    S["Traffic tăng / latency tăng"] --> Q{"Tài nguyên nào cạn trước?"}
    Q -- "CPU / event loop lag" --> C["Profile (--cpu-prof)<br/>bỏ việc sync nặng<br/>scale ngang"]
    Q -- "DB pool wait / DB CPU" --> D["Cache, bỏ N+1, index<br/>read replica, PgBouncer"]
    Q -- "Memory tăng dần" --> M["Heap snapshot<br/>giới hạn cache/buffer"]
    Q -- "3rd party chậm" --> X["Timeout, circuit breaker<br/>bounded concurrency"]
    Q -- "Spike ngắn, có thể xử lý sau" --> B["Queue + 202<br/>worker scale theo lag"]
    C & D & M & X & B --> P{"Vẫn vượt capacity?"}
    P -- yes --> SH["Rate limit (429) theo client<br/>load shedding (503 + Retry-After)"]
    P -- no --> OK["Ổn định → load test lại, đặt alert"]
  ```

  ### Peak ×1000: API nhận nhanh, worker xử lý đều

  ```mermaid
  flowchart LR
    C[Client] --> LB[LB] --> API["API stateless<br/>validate + auth + enqueue"]
    API -- "202 + jobId" --> C
    API --> Q[("Queue / Kafka / SQS")]
    Q --> W["Workers<br/>autoscale theo lag"]
    W --> DB[("DB: batch write<br/>idempotency key")]
    SCH["Scheduled scale-up<br/>trước giờ cao điểm"] -.-> API
    SCH -.-> W
  ```

  ### Memory leak: 3-snapshot technique

  ```mermaid
  flowchart LR
    A["Warm up<br/>(chạy tải vài phút)"] --> S1["Snapshot 1"]
    S1 --> L1["Chạy tải N lần"] --> S2["Snapshot 2"]
    S2 --> L2["Chạy tải N lần"] --> S3["Snapshot 3"]
    S3 --> CMP["Xem object allocated giữa S1 và S2<br/>mà VẪN còn trong S3"]
    CMP --> R["Retainers → ai giữ reference<br/>(Map, listener, closure, timer)"]
  ```

  ## Khung trả lời

  Dùng lại cho mọi câu "hệ thống chậm / quá tải / phải chịu X rps":

  1. **Hỏi lại (30 giây)**: loại request (đọc/ghi, CPU/I-O), payload size, SLO (p99 bao nhiêu), peak vs trung bình, data có cache được không, consistency yêu cầu gì.
  2. **Ước lượng**: rps peak, concurrency (Little's Law), số instance, số DB connection, bandwidth (rps × payload).
  3. **Cầm máu trước (nếu đang cháy)**: rate limit, tắt feature nặng bằng flag, trả stale cache, scale ngang, rollback deploy.
  4. **Đo, không đoán**: tracing, RED metrics theo endpoint, event loop lag, pool wait, DB slow query, heap/RSS.
  5. **Fix theo ưu tiên**: làm ít việc hơn (cache, projection, pagination) → làm việc rẻ hơn (index, batch, bỏ N+1) → làm song song có giới hạn → scale ngang → đổi kiến trúc (queue, CQRS, sharding).
  6. **Trade-off + chứng minh**: nói cái giá (stale data, eventual consistency, chi phí, độ phức tạp) và cách verify (load test, dashboard, alert).

  ## Trade-offs

  | Lựa chọn | Được | Mất | Khi nào |
  |---|---|---|---|
  | Scale ngang thêm pod | Nhanh, không đổi code | Dồn tải xuống DB, tốn tiền, DB connection tăng theo số pod | Bottleneck là CPU app, app stateless |
  | Cache (CDN/Redis/in-process) | Giảm DB load mạnh nhất cho read-heavy | Stale data, invalidation, stampede | Đọc nhiều, chấp nhận stale vài giây–phút |
  | Queue + 202 | Hấp thụ spike, worker chạy đều | Không có kết quả ngay, cần idempotency, UX polling/webhook | Việc không cần kết quả sync (order processing, export, email) |
  | Rate limit (429) | Bảo vệ khỏi 1 client/tenant ồn ào | Có thể chặn nhầm client hợp lệ | Multi-tenant, public API |
  | Load shedding (503) | Giữ latency cho phần request được nhận | Một phần user bị lỗi | Toàn hệ thống vượt capacity |
  | Compression ở proxy/CDN | Giảm bandwidth 5–10× với JSON (verify theo data) | CPU (nhất là brotli quality cao) | Payload > vài KB, client mạng chậm |
  | Pre-serialize + cache string | Bỏ hẳn chi phí stringify mỗi request | Memory, invalidation | Response giống nhau cho nhiều user |
  | worker_threads | Không block event loop chính | Chi phí clone dữ liệu vào/ra, pool phức tạp | CPU nặng với input nhỏ, output nhỏ |
  | Provision cho peak | Đơn giản, không lo scale lag | Tốn tiền 23/24 giờ | Peak không đoán trước, cost không quan trọng |
  | Scheduled + reactive autoscale | Rẻ, chịu được peak đã biết | Phải dự đoán; reactive scale mất vài phút | Peak có giờ cố định |

  ## Pitfalls

  - Trả lời "scale thêm server" trước khi hỏi bottleneck là gì — thêm pod khi DB đang 95% CPU chỉ làm DB chết nhanh hơn.
  - Nói về **average latency**; interviewer muốn nghe p99 và tail.
  - `Promise.all` trên 10k phần tử — tự DDoS DB/bên thứ ba, cạn pool.
  - Retry ở mọi tầng không có budget → retry storm nhân tải lên 10–30×.
  - Autoscale theo CPU cho worker I/O-bound, hoặc tin rằng autoscale phản ứng kịp spike 30 giây.
  - Tin rằng `worker_threads` làm `JSON.stringify` "miễn phí" — dữ liệu phải clone qua thread.
  - Stream JSON mà quên dấu phẩy, quên backpressure, gọi `res.end()` trước khi data tới.
  - Nhầm RSS cao là leak; hoặc set `--max-old-space-size` lớn hơn memory limit của container.
  - Không consume body của `fetch` response → giữ socket/memory.
  - Log `req.headers`/`req.body` nguyên con → token, password, số thẻ nằm trong log store 30 ngày và ai cũng đọc được.

  ## Cheat sheet

  - Little's Law: `in-flight = rps × latency(s)`. 2000 rps × 50 ms = 100 concurrent → pool 20/pod × 5 pod là vừa khít, không có headroom.
  - Postgres `max_connections` mặc định 100; `pods × pool size` phải nhỏ hơn con số đó (trừ connection cho admin/replication) → PgBouncer khi nhiều pod.
  - Fan-out tail: `P(slow) = 1 - (1 - p)^N`; p = 1%, N = 100 → 63%.
  - Bandwidth: 3 MB × 1000 rps = 3 GB/s = 24 Gbit/s — một endpoint có thể làm đầy NIC trước khi CPU cạn.
  - Log: 100 MB/ngày ≈ 1.2 KB/s (không phải vấn đề); 100 GB/ngày ≈ 1.2 MB/s ≈ ~1,200 dòng 1 KB mỗi giây (vấn đề là chi phí lưu trữ + index).
  - 429 = client vượt quota của **nó**; 503 = server không còn capacity. Cả hai nên có `Retry-After`.
  - Đo event loop: `perf_hooks.monitorEventLoopDelay()`, `performance.eventLoopUtilization()`; CPU: `node --cpu-prof`; memory: `--heapsnapshot-signal=SIGUSR2`, `--heapsnapshot-near-heap-limit=3`.
  - `--max-old-space-size` ≈ 70–75% memory limit container (phần còn lại cho Buffer, native, stack) — con số kinh nghiệm, verify với workload.
  - Log an toàn: redact ở logger, không bao giờ log password/token/PAN/CVV, retention có hạn, quyền đọc log theo vai trò.
