id: 31-scenario-performance-scale
slug: scenario-scale
title: "Scenarios: Performance, Scale & Memory"
tier: 9
status: drafted
summary: Mock interview tình huống production — 10k rps, peak ×1000, slow API, 3MB JSON, JSON.stringify block event loop, memory leak, CPU 100%, pool exhaustion, logs 100GB/ngày và log dữ liệu nhạy cảm.
cvLinked: true
prerequisites: [05-nodejs, 16-caching, 21-system-design]
# Must-know questions, highest priority first (study plans take the first few).
