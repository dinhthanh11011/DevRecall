id: 14-multi-tenancy
slug: multi-tenancy
title: Multi-tenancy & Data Isolation
tier: 4
status: drafted
summary: Silo/pool/bridge, tenant context propagation, Postgres RLS, tenant-aware cache, noisy neighbor, per-tenant migration, chống cross-tenant leak.
cvLinked: true
prerequisites: []
overview: |-
  ## TL;DR

  - Multi-tenancy = một hệ thống phục vụ nhiều tenant, dữ liệu và cấu hình **cách ly logic hoặc vật lý**. Ba mô hình (thuật ngữ AWS SaaS Lens): **silo** (tài nguyên riêng mỗi tenant), **pool** (dùng chung, phân biệt bằng `tenant_id`), **bridge** (lai: ví dụ app chung, DB/schema riêng, hoặc tenant lớn silo còn lại pool).
  - Lỗi đắt nhất không phải chậm mà là **cross-tenant leak**. Phòng thủ nhiều lớp: tenant context từ nguồn tin cậy (token/subdomain đã xác thực) → propagate (AsyncLocalStorage) → data layer bắt buộc filter (repository/RLS) → **mọi** kênh phụ (cache key, search index, queue, file storage, log) cũng mang tenant.
  - **Noisy neighbor** là cái giá của pool: quota, rate limit per tenant, fair queuing, tách tenant lớn ra.
  - Vận hành: migration phải chạy cho mọi tenant (hoặc mọi schema/DB), onboarding/offboarding, xoá dữ liệu tenant, cost attribution.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Tenant | Đơn vị khách hàng được cách ly (công ty, merchant, shop) | Merchant A và B cùng chạy trên platform |
  | Silo | Mỗi tenant một stack/DB riêng | Enterprise tenant có DB riêng, key KMS riêng |
  | Pool | Mọi tenant chung table, cột `tenant_id` | `orders(tenant_id, id, ...)` |
  | Bridge | Kết hợp: chung compute, tách storage; hoặc tier-based | Free/Pro ở pool, Enterprise ở silo |
  | Schema-per-tenant | Một DB, mỗi tenant một schema | `tenant_42.orders` |
  | Tenant resolution | Xác định tenant của request | Subdomain `acme.app.com`, claim `tenant_id` trong JWT |
  | Tenant context | Tenant hiện tại đi theo request qua mọi lớp | `AsyncLocalStorage<{ tenantId }>` |
  | Row-Level Security | DB tự thêm điều kiện theo policy | `USING (tenant_id = current_setting('app.tenant_id')::bigint)` |
  | Tenant-aware cache key | Key cache luôn chứa tenant | `t:42:product:123:v3` |
  | Noisy neighbor | Một tenant chiếm tài nguyên chung làm tenant khác chậm | Import 5M sản phẩm làm DB CPU 100% |
  | Cross-tenant leak | Tenant A thấy/sửa được dữ liệu tenant B | `GET /orders/991` không check tenant |

  ## Cơ chế hoạt động

  ### Tenant context từ edge tới database

  ```mermaid
  sequenceDiagram
    participant C as Client
    participant GW as API / Middleware
    participant ALS as AsyncLocalStorage
    participant SVC as Service / Repository
    participant DB as Postgres (RLS)
    participant R as Redis / ES / Queue
    C->>GW: Request + JWT (sub, tenant_id)
    GW->>GW: Verify JWT, check user is member of tenant
    GW->>ALS: als.run({ tenantId, userId }, next)
    SVC->>ALS: getStore() → tenantId
    SVC->>DB: BEGIN, set_config app.tenant_id = 42 (local), query, COMMIT
    DB-->>SVC: chỉ row của tenant 42 (policy)
    SVC->>R: key/index/message luôn có tenantId
  ```

  ### Chọn mô hình isolation

  ```mermaid
  flowchart TD
    A["Tenant mới"] --> B{"Yêu cầu compliance / hợp đồng<br/>đòi cách ly vật lý?"}
    B -- yes --> S["Silo: DB/account riêng"]
    B -- no --> C{"Tenant rất lớn / tải đột biến<br/>ảnh hưởng người khác?"}
    C -- yes --> BR["Bridge: tách DB/shard riêng,<br/>code & control plane chung"]
    C -- no --> P["Pool: chung table + tenant_id + RLS"]
    P --> M["Theo dõi usage per tenant"]
    M -- "vượt ngưỡng" --> BR
  ```

  ## Trade-offs

  | Tiêu chí | Silo (DB per tenant) | Bridge (schema per tenant / tier) | Pool (shared table) |
  |---|---|---|---|
  | Isolation | Mạnh nhất, blast radius nhỏ | Trung bình | Logic — phụ thuộc code/RLS |
  | Chi phí / tenant | Cao | Trung bình | Thấp nhất |
  | Onboarding | Chậm (provision) | Trung bình | Tức thì (insert row) |
  | Migration | N lần, dễ lệch version | N schema, catalog phình | Một lần |
  | Noisy neighbor | Gần như không | Còn chung compute | Rủi ro cao nhất |
  | Backup/restore 1 tenant | Dễ | Khá dễ | Khó (phải trích xuất theo tenant_id) |
  | Cross-tenant analytics | Khó | Khó | Dễ |
  | Connection pool | Bùng nổ số pool | Có thể dùng `search_path` (cẩn thận pooler) | Một pool |

  ## Pitfalls

  - Lấy `tenant_id` từ **body/query param/header do client gửi** mà không đối chiếu với identity đã xác thực.
  - Chỉ filter theo `tenant_id` ở list endpoint, quên ở `GET /:id`, `UPDATE`, `DELETE`, export, webhook, admin tool.
  - Cache key, Elasticsearch query, S3 prefix, queue message thiếu tenant.
  - `SET app.tenant_id` (session-level) sau PgBouncer transaction mode → context dính sang request khác.
  - Owner của table/superuser **bypass RLS**; view tạo bởi owner cũng bypass (trừ `security_invoker`, PG 15+).
  - Background job/consumer không có HTTP request → tenant context rỗng → code "fallback" chạy không filter.
  - Unique constraint toàn cục (`email`) thay vì theo tenant `(tenant_id, email)`, và lỗi unique có thể **lộ sự tồn tại** dữ liệu của tenant khác.
  - Log/trace không có `tenant_id` → không điều tra được incident theo tenant.

  ## Cheat sheet

  - Nguồn tenant đáng tin: claim trong token đã verify / subdomain map qua DB + kiểm tra membership. Không tin header thô.
  - Propagate: `AsyncLocalStorage.run()` ở middleware; job/message mang `tenantId` trong payload rồi `run()` lại ở consumer.
  - DB: `tenant_id` trong mọi table nghiệp vụ, đầu mọi index, trong unique và **composite FK** `(tenant_id, parent_id)`.
  - RLS: `ENABLE` + `FORCE ROW LEVEL SECURITY`, app role không phải owner, `set_config('app.tenant_id', $1, true)` trong transaction, policy `USING` + `WITH CHECK`.
  - Cache: `t:{tenantId}:...`; ES: filter `tenant_id` bắt buộc (alias có filter / routing) hoặc index per tenant cho tenant lớn.
  - Noisy neighbor: rate limit & quota per tenant, fair queue, statement_timeout, tách tenant lớn.
  - Test: tạo 2 tenant trong mọi integration test, gọi mọi endpoint bằng token tenant A với id của tenant B → expect 404.
