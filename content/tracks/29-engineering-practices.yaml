overview: |-
  ## TL;DR

  - Ở level senior, interviewer đánh giá **cách bạn làm việc với người và hệ thống**, không chỉ code: bạn chia task thế nào, review ra sao, xử lý bất đồng, quản lý tech debt, viết design doc.
  - Git: hiểu **trunk-based vs GitFlow**, **rebase vs merge**, và công cụ cứu hộ (`reflog`, `bisect`, `revert`) — đủ để nói "tại sao team chọn cách này".
  - Code review là **cơ chế chia sẻ kiến thức và giảm rủi ro**, không phải gatekeeping; PR nhỏ, review nhanh, comment có mức độ (blocking vs nit).
  - Estimation là **giao tiếp về bất định**: chia nhỏ, nêu giả định và rủi ro, cập nhật sớm khi sai — không phải hứa một con số.
  - Quyết định kỹ thuật quan trọng → **design doc/RFC** trước khi làm, **ADR** ghi lại sau khi chốt; "disagree and commit" khi đã quyết.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Trunk-based development | Mọi người merge vào `main` thường xuyên (≤1–2 ngày), branch ngắn, feature flag che phần chưa xong | Checkout mới sau flag `checkout_v2` |
  | GitFlow | Nhánh `develop`, `release/*`, `hotfix/*`, `feature/*` dài hơn; hợp với release theo đợt | App mobile phát hành 2 tuần một lần |
  | Rebase vs merge | Rebase viết lại lịch sử cho thẳng; merge giữ lịch sử thật với merge commit | `git rebase main` trên branch cá nhân trước khi mở PR |
  | `git bisect` | Binary search qua commit để tìm commit gây lỗi | 1.000 commit → ~10 bước |
  | Feature flag | Tách **deploy** khỏi **release** | Bật cho 5% tenant trước |
  | Tech debt | Chi phí tương lai do lựa chọn hiện tại; có loại cố ý và vô ý | Hard-code tỷ giá để kịp demo |
  | Design doc / RFC | Tài liệu đề xuất trước khi build: vấn đề, phương án, trade-off | RFC "Chuyển search sang Elasticsearch" |
  | ADR | Bản ghi ngắn một quyết định kiến trúc: context, decision, consequences | `ADR-012: Dùng outbox cho event đơn hàng` |
  | Definition of Done | Tiêu chí chung để coi một task là xong | Code + test + review + docs + deployed + monitored |
  | Blameless postmortem | Phân tích sự cố tập trung vào hệ thống, không đổ lỗi cá nhân | "Tại sao hệ thống cho phép deploy migration chưa test?" |

  ## Cơ chế hoạt động

  ### Vòng đời một thay đổi (trunk-based)

  ```mermaid
  flowchart LR
    A["Ticket + acceptance criteria"] --> B["Breakdown thành PR nhỏ"]
    B --> C["Branch ngắn từ main"]
    C --> D["Commit + test local"]
    D --> E["PR: description, screenshots, test plan"]
    E --> F["CI: lint, type, test, build"]
    F --> G{"Review"}
    G -- "changes requested" --> D
    G -- approve --> H["Squash/rebase merge vào main"]
    H --> I["Deploy tự động (sau feature flag)"]
    I --> J["Bật flag dần + monitor"]
    J --> K["Dọn flag"]
  ```

  ### Code review flow

  ```mermaid
  sequenceDiagram
    participant A as Author
    participant CI
    participant R as Reviewer
    A->>A: Self-review diff, viết description + test plan
    A->>CI: Push
    CI-->>A: Lint/test fail? sửa trước khi nhờ review
    A->>R: Request review (PR nhỏ, context rõ)
    R->>R: Đọc description → design → correctness → tests → style
    R-->>A: Comment: blocking / suggestion / nit / question
    A->>R: Trả lời hoặc sửa, resolve thread
    R-->>A: Approve (trong SLA, vd. < 1 ngày làm việc)
  ```

  ### Quyết định kỹ thuật

  ```mermaid
  flowchart TD
    P["Vấn đề / đề xuất"] --> Q{"Đảo ngược dễ không?<br/>(two-way door)"}
    Q -- "dễ" --> R["Quyết nhanh trong team, ghi chú ngắn"]
    Q -- "khó / ảnh hưởng nhiều team" --> S["Design doc / RFC"]
    S --> T["Review async + meeting ngắn"]
    T --> U{"Đồng thuận?"}
    U -- no --> V["Decision owner quyết, ghi dissent"]
    U -- yes --> W["ADR"]
    V --> W
    W --> X["Implement + review lại khi context đổi"]
  ```

  ## Trade-offs

  | Chủ đề | Lựa chọn A | Lựa chọn B | Khi nào chọn |
  |---|---|---|---|
  | Branching | Trunk-based: integrate liên tục, ít merge conflict, cần CI + flag tốt | GitFlow: kiểm soát release, nhiều nhánh sống lâu, merge hell | Web/SaaS deploy liên tục → trunk; release theo version/cần hỗ trợ nhiều version → GitFlow-ish |
  | Integrate | Rebase: lịch sử thẳng, dễ bisect | Merge: giữ lịch sử thật, an toàn với branch chung | Rebase branch cá nhân; không rebase branch người khác đang dùng |
  | Merge PR | Squash: 1 commit/PR, main sạch | Merge commit: giữ từng commit | Squash cho PR nhỏ; giữ commit khi mỗi commit có ý nghĩa riêng |
  | Estimation | Story points: tương đối, team-level | Time-based: dễ hiểu với business | Nói bằng range + độ tự tin, không một con số |
  | Tech debt | Trả dần (boy-scout, % capacity mỗi sprint) | Dự án trả nợ riêng | Nợ lan tỏa → trả dần; nợ tập trung, rủi ro cao → dự án riêng có mục tiêu đo được |
  | Docs | Design doc dài, review kỹ | ADR ngắn | Quyết định khó đảo ngược → doc; mọi quyết định đáng nhớ → ADR |

  ## Pitfalls

  - PR 1.500 dòng, description trống, "please review ASAP".
  - Review chỉ soi style (việc của linter) mà bỏ qua design/correctness; hoặc ngược lại dùng review để áp đặt sở thích cá nhân.
  - `git push --force` lên branch chung; rebase branch đã share.
  - Estimate một con số rồi im lặng tới deadline mới báo trễ.
  - Gọi mọi thứ là "tech debt" để xin viết lại — không nêu được tác động kinh doanh.
  - Bất đồng kéo dài trong comment PR thay vì gọi 15 phút.
  - Trong team phân tán: quyết định trong call không ghi lại; người ở timezone khác bị loại khỏi quyết định.
  - Deprecate API mà không có timeline, không đo ai còn dùng.

  ## Cheat sheet

  - **Git cứu hộ**: `git reflog` (tìm lại commit mất) · `git revert <sha>` (undo trên branch chung) · `git bisect start/bad/good/run` · `git push --force-with-lease` thay `--force`.
  - **PR tốt**: < ~400 dòng thay đổi logic, một mục đích, description = what/why/how tested/risk, screenshots cho UI.
  - **Comment tốt**: nêu mức độ (`blocking:`, `nit:`, `question:`), giải thích why, đề xuất cụ thể.
  - **Estimate**: breakdown → spike cho phần chưa rõ → range (best/likely/worst) → nêu giả định → cập nhật sớm.
  - **Tech debt**: ghi vào backlog với tác động (thời gian mất/incident/rủi ro), ưu tiên theo "lãi suất".
  - **Design doc**: context, goals/non-goals, options + trade-offs, decision, rollout, rollback, open questions.
  - **Bất đồng**: data > opinion, hiểu lý do bên kia, đề xuất thử nghiệm nhỏ, escalate có văn bản, disagree & commit.
  - **Distributed team**: async-first, viết quyết định, overlap hours, demo/record, rõ owner.
