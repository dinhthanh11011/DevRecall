overview: |-
  ## TL;DR

  - Senior interview hiếm khi hỏi cây đỏ-đen; họ hỏi **cài đặt một primitive production** (LRU cache, rate limiter, promise pool, debounce) và **lý do chọn cấu trúc dữ liệu** cho một workload thật.
  - Big-O là để **so sánh khi n lớn**; ngoài đời còn hằng số, cache locality, allocation/GC, và **I/O** (một query N+1 đắt hơn mọi vòng lặp O(n²) trên 100 phần tử).
  - Bộ công cụ tối thiểu: **hash map, array, heap, deque, trie, graph (BFS/DFS/topo sort), sliding window, two pointers, binary search, interval merge**, cộng các cấu trúc xác suất (**Bloom filter, HyperLogLog**).
  - Biết cấu trúc nào đang nằm **bên trong** công cụ bạn dùng: B-tree (index DB), skip list (Redis sorted set), hash ring (sharding), inverted index (Elasticsearch).

  ## Khái niệm cốt lõi

  | Cấu trúc / kỹ thuật | Một câu | Ví dụ backend |
  |---|---|---|
  | Hash map (`Map`) | Tra cứu trung bình O(1), `Map` trong JS giữ **thứ tự chèn** | Dedupe, index theo id, LRU |
  | Dynamic array | Truy cập O(1), push amortized O(1), chèn/xoá đầu O(n) | Buffer, batch |
  | Deque / ring buffer | Thêm/bớt hai đầu O(1) | Queue job, sliding window log |
  | Binary heap | Lấy min/max O(1), push/pop O(log n) | Top-K, scheduler, merge k sorted |
  | Trie | Cây theo ký tự, tra prefix O(độ dài key) | Autocomplete, routing theo path |
  | Graph + BFS/DFS | Duyệt quan hệ; BFS cho đường ngắn nhất không trọng số | Dependency, permission inheritance |
  | Topological sort | Thứ tự tuyến tính của DAG, phát hiện cycle | Build order, migration order |
  | Sliding window | Duy trì cửa sổ trên stream thay vì tính lại | Rate limit, moving average |
  | Binary search | O(log n) trên dữ liệu **có thứ tự** (hoặc hàm đơn điệu) | Tìm version lỗi, cursor pagination |
  | B-tree / B+tree | Cây nhiều nhánh tối ưu cho disk page | Index PostgreSQL/SQL Server |
  | Bloom filter | "Chắc chắn không có" hoặc "có thể có", tốn ít bộ nhớ | Chặn lookup key không tồn tại |
  | HyperLogLog | Đếm distinct xấp xỉ với vài KB | Unique visitors (`PFCOUNT`) |

  ## Cơ chế hoạt động

  ### Chọn cấu trúc dữ liệu cho một yêu cầu

  ```mermaid
  flowchart TD
    A["Thao tác chính là gì?"] --> B{"Tra cứu theo key?"}
    B -- có --> C{"Cần thứ tự / range?"}
    C -- không --> H["Hash map"]
    C -- "có, in-memory" --> T["Sorted array + binary search<br/>hoặc balanced tree / skip list"]
    C -- "có, trên disk" --> BT["B+tree (DB index)"]
    B -- không --> D{"Luôn cần min/max hoặc top-K?"}
    D -- có --> HP["Heap / priority queue"]
    D -- không --> E{"Theo prefix chuỗi?"}
    E -- có --> TR["Trie"]
    E -- không --> F{"FIFO / hai đầu?"}
    F -- có --> DQ["Deque / ring buffer"]
    F -- không --> G{"Quan hệ phụ thuộc?"}
    G -- có --> GR["Graph + BFS/DFS/topo sort"]
    G -- không --> AR["Array"]
  ```

  ### LRU cache = hash map + thứ tự truy cập

  ```mermaid
  flowchart LR
    subgraph Map["Map (insertion order = recency)"]
      direction LR
      K1["oldest: sku-1"] --> K2["sku-7"] --> K3["sku-3"] --> K4["newest: sku-9"]
    end
    G["get(sku-7)"] -- "delete + set lại → cuối" --> K4
    S["set khi đầy"] -- "xoá key đầu tiên (oldest)" --> K1
  ```

  Trong JS, `Map` giữ thứ tự chèn nên `delete` + `set` đưa key về cuối, và `map.keys().next().value` là key cũ nhất → mọi thao tác O(1) mà không cần tự viết doubly linked list.

  ### Token bucket rate limiter

  ```mermaid
  sequenceDiagram
    participant C as Client
    participant L as Limiter (capacity 10, refill 5/s)
    C->>L: request (t=0, tokens=10)
    L-->>C: allow (tokens=9)
    Note over L: tokens = min(cap, tokens + elapsed × rate)
    C->>L: 12 requests burst
    L-->>C: 9 allow, 3 reject (429 + Retry-After)
  ```

  ## Trade-offs

  | Bài toán | Cách A | Cách B | Chọn khi |
  |---|---|---|---|
  | Top-K trên n phần tử | Sort toàn bộ O(n log n) | Min-heap kích thước K: O(n log K) | K ≪ n hoặc dữ liệu là stream |
  | Rate limit | Fixed window counter: rẻ, burst ở ranh giới | Sliding window log: chính xác, tốn memory | Token bucket khi cần cho phép burst có kiểm soát |
  | Membership | `Set`: chính xác, O(n) memory | Bloom filter: false positive, rất ít memory | Hàng trăm triệu key, chấp nhận sai một chiều |
  | Distinct count | `Set`: chính xác | HyperLogLog: sai ~1%, vài KB | Analytics quy mô lớn |
  | Queue in-memory | `Array.shift()`: có thể O(n) | Ring buffer / head index: O(1) | Queue lớn, throughput cao |
  | Autocomplete | `LIKE 'abc%'` với index | Trie in-memory / search engine (edge n-gram) | Tập từ nhỏ vs lớn/đa ngôn ngữ |
  | Dedupe stream | Lưu hết id | TTL window / Bloom | Tuỳ yêu cầu chính xác |

  ## Pitfalls

  - `[10, 9, 1].sort()` → `[1, 10, 9]` — sort mặc định so sánh **chuỗi**; luôn truyền comparator.
  - `arr.includes`/`indexOf` trong vòng lặp → O(n²) ẩn; đổi sang `Set`.
  - `Array.shift()` trên queue lớn, `arr.splice(0, 1)` trong vòng lặp.
  - Đệ quy sâu (cây 100k node, DFS) → `RangeError: Maximum call stack size exceeded`; dùng stack tường minh.
  - Object làm hash map với key từ user (`__proto__`, `constructor`) → dùng `Map` hoặc `Object.create(null)`.
  - Tối ưu Big-O mà quên I/O: N+1 query, gọi Redis trong vòng lặp thay vì `MGET`/pipeline.
  - Rate limiter/LRU in-memory trên nhiều pod → mỗi pod một trạng thái riêng.

  ## Cheat sheet

  - Hash map: get/set O(1) trung bình, O(n) worst · Heap: push/pop O(log n), peek O(1), heapify O(n) · Binary search: O(log n).
  - Sort so sánh: tối thiểu O(n log n); `Array.prototype.sort` **stable** từ ES2019.
  - Top-K lớn nhất → **min**-heap size K; K nhỏ nhất → max-heap.
  - Interval merge: sort theo `start`, gộp nếu `next.start <= cur.end` → O(n log n).
  - Topo sort (Kahn): đếm in-degree, queue các node in-degree 0; nếu output < số node → có cycle.
  - Debounce: chạy **sau khi ngừng** gọi X ms · Throttle: chạy **tối đa một lần** mỗi X ms.
  - Promise pool: N worker cùng kéo từ một iterator chung; giữ kết quả theo **index**.
  - Amortized O(1): push vào dynamic array (thỉnh thoảng resize O(n) nhưng trung bình vẫn O(1)).
