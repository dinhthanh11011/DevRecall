id: 20-design-patterns
slug: design-patterns
title: Design Principles & Patterns
tier: 5
status: drafted
summary: SOLID, GoF trong TypeScript, DI, Clean/Hexagonal architecture, DDD tactical, CQRS — và khi nào KHÔNG dùng.
cvLinked: false
prerequisites: []
overview: |-
  ## TL;DR

  - Pattern là **tên chung cho một giải pháp đã lặp lại nhiều lần**, không phải checklist phải áp dụng. Senior interview đo **judgment**: bạn biết khi nào pattern giúp và khi nào nó chỉ thêm indirection.
  - Trong TypeScript, rất nhiều GoF pattern **co lại thành function**: Strategy = truyền function, Command = closure, Factory = function trả object, Observer = `EventEmitter`. Class hierarchy là lựa chọn cuối.
  - SOLID là về **quản lý thay đổi và coupling**: module nào đổi vì lý do gì, ai phụ thuộc vào ai. DIP + DI là nền của Clean/Hexagonal architecture.
  - DDD tactical (Entity, Value Object, Aggregate, Domain Event) giải bài toán **invariant nghiệp vụ phức tạp**; CRUD đơn giản thì không cần. CQRS/Event Sourcing mạnh nhưng đắt — chỉ dùng cho một bounded context có lý do rõ ràng.
  - Câu hỏi luôn đi kèm: **"When would you NOT use it?"** — chuẩn bị sẵn câu trả lời cho mọi pattern.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn (TS) |
  |---|---|---|
  | SRP | Một module chỉ có **một actor** khiến nó phải đổi | Tách `InvoicePdfRenderer` khỏi `InvoiceCalculator` |
  | OCP | Mở để mở rộng, đóng để sửa — thêm hành vi bằng code mới | Thêm `PaypalProvider` mà không sửa `CheckoutService` |
  | LSP | Subtype dùng thay được supertype mà không phá contract | `ReadonlyRepo extends Repo` rồi `save()` throw → vi phạm |
  | ISP | Client không bị ép phụ thuộc method nó không dùng | `Reader` / `Writer` thay vì `Repository` 30 method |
  | DIP | High-level phụ thuộc **abstraction**, không phụ thuộc chi tiết | `OrderService(repo: OrderRepository)` thay vì `new PrismaClient()` |
  | Composition over inheritance | Ghép hành vi bằng object/function thay vì cây kế thừa | `withRetry(withCache(fetcher))` |
  | Strategy | Hoán đổi thuật toán lúc runtime | `const pricing: PricingRule = vipRule` |
  | Decorator | Bọc object để thêm hành vi, cùng interface | `new CachedRepo(new SqlRepo())` |
  | Adapter | Chuyển interface lạ về interface mình cần | `StripeAdapter implements PaymentGateway` |
  | Repository / UoW | Collection-like access cho aggregate / gom thay đổi trong một transaction | `uow.orders.add(o); await uow.commit()` |
  | Aggregate | Cụm object có **một root**, bảo vệ invariant trong một transaction | `Order` giữ `OrderLine[]`, chỉ sửa qua `order.addLine()` |
  | CQRS | Tách model ghi (command) và model đọc (query) | Ghi vào SQL, đọc từ Elasticsearch projection |

  ## Cơ chế hoạt động

  ### Hexagonal (Ports & Adapters) — dependency rule

  ```mermaid
  flowchart LR
    subgraph Driving["Driving adapters (inbound)"]
      HTTP["Express/Nest controller"]
      CLI["CLI / cron job"]
      MQ["Kafka consumer"]
    end
    subgraph Core["Application core (không import framework)"]
      UC["Use cases<br/>PlaceOrder, CancelOrder"]
      DOM["Domain model<br/>Order, Money, events"]
      PIN["Inbound port<br/>PlaceOrderUseCase"]
      POUT["Outbound ports<br/>OrderRepository, PaymentGateway"]
    end
    subgraph Driven["Driven adapters (outbound)"]
      SQL["SqlOrderRepository"]
      STRIPE["StripePaymentGateway"]
      KAFKA["KafkaEventPublisher"]
    end
    HTTP --> PIN
    CLI --> PIN
    MQ --> PIN
    PIN --> UC --> DOM
    UC --> POUT
    SQL -. implements .-> POUT
    STRIPE -. implements .-> POUT
    KAFKA -. implements .-> POUT
  ```

  Mũi tên source-code dependency **luôn hướng vào core**. Core định nghĩa interface (port); adapter ở ngoài implement. Nhờ vậy test use case bằng in-memory adapter, đổi DB/provider không chạm domain.

  ### Chain of Responsibility — Express middleware là ví dụ sống

  ```mermaid
  sequenceDiagram
    participant C as Client
    participant A as authn
    participant T as tenantResolver
    participant R as rateLimit
    participant H as handler
    C->>A: request
    A->>T: next()
    T->>R: next()
    R-->>C: 429 (dừng chuỗi)
    R->>H: next() nếu còn quota
    H-->>C: 200
  ```

  ## Trade-offs

  | Lựa chọn | Được | Mất | Khi KHÔNG dùng |
  |---|---|---|---|
  | Inheritance | Tái dùng nhanh, polymorphism sẵn | Coupling chặt, fragile base class | Khi quan hệ không phải "is-a" thật sự hoặc cần ghép nhiều hành vi |
  | Composition | Linh hoạt, test dễ | Nhiều object nhỏ, wiring dài hơn | Khi hierarchy thực sự ổn định (AST node, UI widget framework) |
  | Repository trên ORM | Tách domain khỏi ORM, test dễ | Thêm một lớp, dễ thành "generic repo" vô nghĩa | CRUD app mỏng, query phức tạp dùng trực tiếp query builder |
  | DI container | Wiring tự động, scopes | Magic, lỗi runtime thay vì compile | Service nhỏ — manual constructor injection là đủ |
  | Clean/Hexagonal | Core độc lập framework, test nhanh | Nhiều file, mapping DTO ↔ domain | Prototype, CRUD admin, lambda nhỏ |
  | CQRS | Scale đọc/ghi độc lập, read model tối ưu | Eventual consistency, 2 model | Domain đơn giản, đọc-ghi cùng shape |
  | Event Sourcing | Audit đầy đủ, time travel, rebuild projection | Schema evolution khó, query khó, học khó | Hầu hết CRUD; team chưa có kinh nghiệm |

  ## Pitfalls

  - **Pattern-driven design**: chọn pattern trước rồi tìm vấn đề. Bắt đầu từ lực đẩy thay đổi (what varies?).
  - **DRY sai chỗ**: gộp hai đoạn code *trông giống* nhưng đổi vì lý do khác nhau → abstraction sai, đầy boolean flag. "Duplication is far cheaper than the wrong abstraction" (Sandi Metz).
  - **Singleton giữ state theo request** trong Node → rò dữ liệu giữa user/tenant.
  - **Generic `Repository<T>`** với `findAll/findById/save` cho mọi entity → leak ORM, không mang ngữ nghĩa domain.
  - **Anemic domain model** + service 2000 dòng gọi là "DDD".
  - **Aggregate quá to** (Order chứa Customer chứa mọi Order khác) → lock contention, load chậm.
  - **Event Sourcing cho cả hệ thống** thay vì một bounded context cần audit.
  - **Observer không unsubscribe** → memory leak, handler chạy nhiều lần.

  ## Cheat sheet

  - SOLID = **S**ingle actor · **O**pen for extension · **L**iskov contract · **I**nterface nhỏ · **D**epend on abstraction.
  - Creational: Factory (ẩn `new`, chọn implementation), Builder (object nhiều bước/tuỳ chọn), Singleton (một instance — **thường là smell**, dùng DI scope thay thế).
  - Structural: Adapter (đổi interface), Facade (đơn giản hoá subsystem), Decorator (thêm hành vi, cùng interface), Proxy (kiểm soát truy cập, cùng interface).
  - Behavioral: Strategy (hoán thuật toán), Observer (pub/sub in-process), Command (request thành object → queue/undo), Chain of Responsibility (middleware), Template Method (khung cố định, bước tuỳ biến qua kế thừa).
  - Decorator vs Proxy: cùng cấu trúc; Decorator **thêm** hành vi, Proxy **kiểm soát** truy cập (lazy, cache, auth).
  - Aggregate rule: tham chiếu aggregate khác **bằng ID**, một transaction sửa **một** aggregate, nhất quán giữa aggregate bằng domain event (eventual).
  - Refactor legacy: characterization tests → tìm seam → Strangler Fig → xoá code cũ.
