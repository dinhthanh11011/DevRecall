overview: |-
  ## TL;DR

  - JD này chấm 4 thứ: **(1)** dựng internal platform từ đầu (data model + auth + permissions), **(2)** Supabase/Vercel là *firm requirement*, **(3)** dùng agent (Claude Code/Cursor) có kiểm soát, **(4)** tự chịu trách nhiệm chất lượng: schema integrity, security, test, CI/CD, observability, production readiness.
  - Trục xuyên suốt là **tenant isolation nhiều lớp**: tenant lấy từ token đã verify → app check permission → **Postgres RLS** chặn ở DB → cache key/Storage path/Realtime cũng scoped theo tenant.
  - Supabase = Postgres + Auth (GoTrue, JWT) + PostgREST + Realtime + Storage. Client gọi thẳng DB qua PostgREST bằng anon/publishable key → **RLS là ranh giới bảo mật thật**, không phải "defense in depth tùy chọn".
  - Vercel = serverless/Fluid functions + preview deployment theo PR. Hệ quả: dùng **connection pooler**, không giữ state trong memory, job dài đưa ra queue/cron.
  - Agentic coding: nói được **workflow + guardrails** (context file, plan trước, task nhỏ, test/validator làm gate, human review cho auth/migration/tiền).

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Row Level Security (RLS) | Postgres tự thêm điều kiện vào mọi query theo policy của role hiện tại | `USING (tenant_id = (select private.current_tenant()))` |
  | `USING` vs `WITH CHECK` | `USING` lọc row được thấy/sửa/xoá; `WITH CHECK` chặn row mới/sau update không hợp lệ | Chặn user đổi `tenant_id` của row sang tenant khác |
  | `auth.uid()` / `auth.jwt()` | Hàm Supabase đọc claim `sub` / toàn bộ claims của JWT request hiện tại | `auth.jwt() -> 'app_metadata' ->> 'tenant_id'` |
  | anon/publishable vs service_role/secret key | Key public cho client (bị RLS) vs key server (**bypass RLS**) | service_role chỉ ở server, không bao giờ `NEXT_PUBLIC_` |
  | `app_metadata` vs `user_metadata` | `app_metadata` chỉ server sửa; `user_metadata` user tự sửa được | Role/tenant **không** đặt trong `user_metadata` |
  | Custom Access Token Hook | Postgres function chạy khi phát JWT, thêm claim (tenant, role) | Claim `active_tenant_id` (verify API hiện tại) |
  | Membership table | Bảng nối user ↔ tenant ↔ role, nguồn sự thật cho RBAC | `memberships(user_id, tenant_id, role)` PK kép |
  | Security definer function | Function chạy với quyền owner → bỏ qua RLS | Helper `is_member(tenant)` để tránh policy đệ quy; đặt ở schema private |
  | `security_invoker` view | View (PG15+) áp RLS theo người gọi thay vì owner | `create view ... with (security_invoker = true)` |
  | Supavisor pooler | Pooler Postgres của Supabase; transaction mode cho serverless | Port 6543 transaction mode (verify) |
  | Preview deployment | Mỗi PR có URL deploy riêng với env Preview | QA test PR trước khi merge |
  | Expand → contract | Đổi schema qua nhiều release tương thích ngược | Add column → dual-write → backfill → switch read → drop |

  ## Cơ chế hoạt động

  ### Một request từ Next.js tới Supabase, qua các lớp kiểm soát

  ```mermaid
  sequenceDiagram
    participant B as Browser
    participant P as Next.js proxy.ts
    participant S as Server Component / Action
    participant A as Supabase Auth
    participant DB as Postgres + RLS
    B->>P: Request + auth cookies
    P->>A: Refresh session nếu access token hết hạn
    P-->>B: Set-Cookie mới (nếu refresh)
    B->>S: Render page / gọi Server Action
    S->>A: getUser() hoặc getClaims() verify JWT
    S->>S: Check permission ở app (role, resource)
    S->>DB: Query bằng client mang JWT của user
    DB->>DB: RLS thêm điều kiện tenant và role vào query
    DB-->>S: Chỉ các row thuộc tenant hợp lệ
    S-->>B: HTML / kết quả action
  ```

  Điểm mấu chốt: proxy (middleware cũ) chỉ **refresh session và redirect sớm**; quyết định bảo mật nằm ở **Server Component/Action** và ở **RLS**. Nếu app check sót, RLS vẫn chặn. Nếu dùng `service_role`, RLS bị tắt, nên toàn bộ trách nhiệm quay về code.

  ### Mô hình dữ liệu tenant + RBAC tối thiểu

  ```mermaid
  flowchart LR
    U["auth.users"] --> M["memberships<br/>user_id, tenant_id, role"]
    T["tenants"] --> M
    R["role_permissions<br/>role, permission"] -.-> M
    T --> D["business tables<br/>tenant_id NOT NULL + FK"]
    M -. "RLS: is_member(tenant_id)" .-> D
  ```

  ### Pipeline chất lượng cho một PR

  ```mermaid
  flowchart LR
    PR["Pull request"] --> CI["lint + typecheck + unit"]
    CI --> IT["integration test với Postgres thật<br/>+ RLS test matrix"]
    IT --> MIG["migration check trên DB tạm / Supabase branch"]
    MIG --> PV["Vercel preview deployment"]
    PV --> RV["code review + QA trên preview"]
    RV --> PROD["merge main → deploy prod<br/>→ theo dõi error rate, p95"]
    PROD -- "lỗi" --> RB["instant rollback<br/>+ migration expand-only nên an toàn"]
  ```

  ## Trade-offs

  | Quyết định | Lựa chọn A | Lựa chọn B | Khi nào chọn |
  |---|---|---|---|
  | Truy cập DB | Client gọi Supabase trực tiếp (PostgREST + RLS) | Mọi thứ qua API server (Route Handler/Server Action) | A: CRUD đơn giản, realtime. B: logic nghiệp vụ phức tạp, nhiều bước, cần transaction |
  | Chỗ enforce tenant | Chỉ app layer | App layer + RLS | Supabase gần như luôn B, vì client có thể gọi DB trực tiếp |
  | Tenant trong JWT claim | Nhanh (không query), nhưng stale đến khi token refresh | Tra bảng membership mỗi query | Claim cho tenant đang active; membership table cho quyền nhạy cảm/cần revoke ngay |
  | Tenancy model | Shared schema + `tenant_id` | Schema/DB riêng mỗi tenant | Internal platform nhiều tenant nhỏ: shared + RLS. Tenant lớn/compliance: tách |
  | RBAC | Role cố định (enum) | Permission-based (role → permissions) | Bắt đầu enum đơn giản, chuyển permission khi có >3–4 role hoặc custom role |
  | Chạy logic server | Server Action | Route Handler | Action: mutation từ form UI. Handler: webhook, API cho client ngoài, public contract |
  | Function runtime | Node.js runtime | Edge runtime | Node: mặc định, đầy đủ lib, DB driver. Edge: logic nhẹ gần user (verify khuyến nghị hiện tại) |

  ## Pitfalls

  - ❌ Tạo bảng mới mà quên `enable row level security` → bảng mở toàn bộ cho anon key. ✅ Migration template luôn có RLS + policy; CI chạy query kiểm tra bảng `public` nào chưa bật RLS.
  - ❌ Đặt role/tenant trong `user_metadata`. ✅ `app_metadata`, membership table, hoặc access token hook.
  - ❌ Dùng `service_role` trong Server Component "cho tiện" → bypass RLS. ✅ Client theo user cho request của user; admin client chỉ cho job hệ thống, luôn filter tenant tường minh.
  - ❌ Chỉ check auth trong `proxy.ts`/middleware. ✅ Check lại trong từng Server Action/Route Handler (Server Action là POST endpoint public).
  - ❌ Tin `getSession()` ở server. ✅ `getUser()`/`getClaims()` để verify token (verify theo docs Supabase hiện tại).
  - ❌ Policy gọi `auth.uid()` trên từng row, không index `tenant_id`. ✅ `(select auth.uid())` và index cột trong policy.
  - ❌ View thường trên bảng có RLS → view chạy quyền owner, lộ data. ✅ `security_invoker = true` hoặc revoke quyền view.
  - ❌ Kết nối Postgres trực tiếp từ mỗi serverless invocation. ✅ Pooler transaction mode, pool nhỏ mỗi instance.
  - ❌ Để agent sinh migration/RLS rồi merge vì test pass. ✅ Đọc từng dòng, chạy test matrix cross-tenant.

  ## Cheat sheet

  - Tenant isolation = token verify → app permission → **RLS** → cache key/Storage path/Realtime channel có tenant.
  - Mọi bảng `public`: `tenant_id NOT NULL` + FK + index + RLS bật + policy SELECT/INSERT/UPDATE/DELETE rõ ràng.
  - Policy INSERT/UPDATE cần `WITH CHECK`; UPDATE còn cần row nhìn thấy được qua SELECT policy.
  - Helper `security definer` đặt ở schema **không expose** qua API, `set search_path = ''`.
  - Next.js: Server Action = public endpoint; proxy chỉ refresh session; `NEXT_PUBLIC_*` lộ ra browser.
  - Vercel: env theo Production/Preview/Development; preview dùng DB riêng, **không** dùng DB prod; instant rollback chỉ an toàn khi migration là expand-only.
  - Migration Postgres an toàn: `lock_timeout`, `CREATE INDEX CONCURRENTLY`, constraint `NOT VALID` → `VALIDATE`, backfill theo batch.
  - Test: RLS test matrix (role × action × same/other tenant) chạy trên Postgres thật trong CI.
  - Observability: log có `request_id`, `tenant_id`, `user_id`; alert theo error rate + p95 + slow query.
  - Agent: context file → plan → task nhỏ → test/validator gate → human review cho auth/migration/tiền.
