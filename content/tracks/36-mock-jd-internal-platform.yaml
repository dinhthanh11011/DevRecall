id: 36-mock-jd-internal-platform
slug: mock-internal-platform
title: "Mock: Internal Business Platform on Next.js + Supabase/Vercel"
tier: 9
status: drafted
summary: Bộ mock theo một JD thật — build internal business platform từ đầu trên Next.js + Node/TS + PostgreSQL, auth/RBAC/multi-tenant, Supabase (RLS, Auth, pooler) + Vercel là bắt buộc, agentic coding (Claude Code/Cursor), và ownership chất lượng end-to-end (schema, security, test, CI/CD, observability).
cvLinked: true
prerequisites: [11-nextjs, 13-sql-postgres, 14-multi-tenancy, 23-auth-identity, 27-testing, 28-ai-assisted-engineering]
# Must-know questions, highest priority first (study plans take the first few).
essentials:
