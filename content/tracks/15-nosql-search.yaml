overview: |-
  ## TL;DR

  - NoSQL không phải "SQL nhưng nhanh hơn": mỗi loại tối ưu cho **access pattern** cụ thể. DynamoDB: key-value/wide-column, thiết kế **từ query ngược về schema**. MongoDB: document linh hoạt, embed vs reference. Relational vẫn là mặc định cho dữ liệu quan hệ + transaction.
  - Elasticsearch là **search engine** (Lucene) — tuyệt cho full-text, relevance, facet, aggregation; **không phải source of truth**: near-real-time (refresh ~1s), không transaction đa document, mapping khó đổi.
  - Pattern chuẩn: DB là nguồn sự thật → **sync sang ES** qua event/CDC → indexer idempotent, có versioning → **reconcile** để phát hiện drift → reindex bằng **alias** không downtime.
  - Senior interview hỏi: mapping explosion, text vs keyword, analyzer tiếng Việt, shard sizing, deep pagination, dual-write, ordering/idempotency của indexer, hot partition DynamoDB.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Partition key (DynamoDB) | Hash quyết định partition vật lý; cần phân tán đều | `PK = TENANT#42#ORDER#991` |
  | Sort key | Sắp xếp item trong cùng partition; cho phép range query | `SK = ITEM#0001`, `begins_with(SK, 'ITEM#')` |
  | GSI / LSI | Index phụ: GSI khác partition key (eventual), LSI cùng PK khác SK (tạo lúc tạo table) | GSI `GSI1PK = CUSTOMER#7` |
  | Single-table design | Nhiều entity trong một table, key overload để một Query lấy đủ dữ liệu | Order + items cùng `PK` |
  | Embed vs reference (MongoDB) | Nhúng dữ liệu đọc cùng nhau; tham chiếu khi lớn/không giới hạn/chia sẻ | Address nhúng trong user; order tham chiếu product |
  | Inverted index | term → danh sách document chứa term | `"cotton" → [doc1, doc7]` |
  | Analyzer | char filter → tokenizer → token filter | `"Áo Thun" → [ao, thun]` với lowercase + asciifolding |
  | `text` vs `keyword` | text: analyze để full-text; keyword: nguyên giá trị cho filter/sort/agg | `name` text + `name.keyword` |
  | Mapping | Schema của index; field đã map **không đổi kiểu** được | `dynamic: strict` |
  | Shard / replica | Primary shard chia dữ liệu (cố định khi tạo, trừ split/shrink); replica cho HA + đọc | 3 primary × 1 replica |
  | Refresh | Làm document mới searchable (mặc định 1s) → near-real-time | `refresh_interval: 30s` khi bulk |
  | Alias | Tên ảo trỏ tới một/nhiều index → đổi index không đổi code | `products` → `products_v7` |
  | CDC | Đọc log thay đổi của DB (WAL/binlog/CDC table) để phát event | Debezium → Kafka → indexer |

  ## Cơ chế hoạt động

  ### Sync DB → Elasticsearch (outbox/CDC + indexer)

  ```mermaid
  flowchart LR
    A["API ghi DB<br/>(product + outbox row<br/>trong cùng transaction)"] --> B[("SQL DB<br/>source of truth")]
    B -- "CDC / outbox relay" --> K[["Kafka topic<br/>key = productId"]]
    K --> I["Indexer service<br/>load latest from DB,<br/>transform, enrich"]
    I -- "bulk index<br/>version = row version" --> E[("Elasticsearch<br/>alias: products")]
    R["Reconciler (định kỳ)<br/>so count/checksum/updated_at"] --> B
    R --> E
    R -- "drift → re-emit" --> K
  ```

  ### Reindex không downtime bằng alias

  ```mermaid
  sequenceDiagram
    participant Ops
    participant ES
    participant Idx as Indexer
    Ops->>ES: PUT products_v8 (mapping mới, replicas 0, refresh -1)
    Idx->>ES: dual-write: products_v7 (qua alias) + products_v8
    Ops->>ES: _reindex / backfill từ DB vào products_v8
    Ops->>ES: bật lại replicas & refresh, so sánh count + sample query
    Ops->>ES: POST _aliases (remove v7, add v8) — atomic
    Ops->>ES: giữ v7 vài ngày để rollback, rồi xoá
  ```

  ### Search: query then fetch

  Coordinating node gửi query tới **một bản copy của mỗi shard** (scatter) → mỗi shard trả top-N id + score → gộp, sort → **fetch** `_source` của top kết quả. `from + size` lớn = mỗi shard phải trả `from + size` kết quả → deep pagination đắt.

  ## Trade-offs

  | Nhu cầu | Relational (Postgres/SQL Server) | DynamoDB | MongoDB | Elasticsearch |
  |---|---|---|---|---|
  | Transaction đa entity | Mạnh | Có (TransactWriteItems, giới hạn số item) | Có (multi-document, tốn hơn) | Không |
  | Query ad-hoc / join | Mạnh | Yếu (phải biết trước access pattern) | Khá (`$lookup`, aggregation) | Không join; denormalize |
  | Full-text + relevance | Cơ bản (FTS, pg_trgm) | Không | Có (Atlas Search) | Mạnh nhất |
  | Scale ngang | Khó hơn (shard thủ công/Citus) | Tự động, gần như vô hạn | Sharding có sẵn | Shard có sẵn |
  | Schema | Chặt | Linh hoạt, thiết kế key chặt | Linh hoạt (+ validator) | Mapping — khó đổi |
  | Vận hành | Trung bình | Managed hoàn toàn | Trung bình / Atlas | Nặng (heap, shard, upgrade) |

  | Cách sync DB → ES | Ưu | Nhược |
  |---|---|---|
  | Dual-write trong request | Đơn giản | Không atomic → drift khi một bên lỗi; tăng latency |
  | Outbox + relay | Atomic với DB, thứ tự theo entity | Thêm table + relay |
  | CDC (Debezium) | Không đụng code app, bắt mọi thay đổi | Hạ tầng Kafka/Connect, event mức row (cần transform) |
  | Batch theo `updated_at` | Dễ | Trễ, bỏ sót delete, clock/transaction commit muộn |

  ## Pitfalls

  - Dùng ES làm source of truth hoặc đọc-sau-ghi từ ES rồi ngạc nhiên vì chưa refresh.
  - `dynamic: true` cho object có key do user/provider định nghĩa → **mapping explosion** (vượt `index.mapping.total_fields.limit`, mặc định 1000).
  - `term` trên field `text`; sort/aggregate trên `text`.
  - Quá nhiều shard nhỏ (index per tenant per ngày...) → cluster state phình, heap cạn.
  - `from/size` sâu (mặc định chặn ở `index.max_result_window = 10000`) → dùng `search_after` + PIT.
  - Indexer không idempotent/không versioning → event cũ đến sau ghi đè dữ liệu mới.
  - DynamoDB: partition key thấp cardinality (`status`) → hot partition; `Scan` + `FilterExpression` vẫn tính capacity cho mọi item đã đọc.
  - MongoDB: mảng không giới hạn trong document (vượt 16MB, index multikey phình).

  ## Cheat sheet

  - ES: `text` cho search, `keyword` cho filter/sort/agg, multi-field cho cả hai; `filter` context không tính score và cache được.
  - ES đổi mapping field đã có → index mới + `_reindex` + alias swap. Primary shard count: cố định (có `_split`/`_shrink` với điều kiện).
  - Bulk load: `refresh_interval: -1`, `number_of_replicas: 0`, bulk 5–15MB/request, bật lại sau.
  - Indexer: key Kafka = entity id, `version_type: external` với version từ DB, retry idempotent, DLQ.
  - DynamoDB: liệt kê access pattern trước; Query > Scan; GSI eventual; item ≤ 400KB; conditional write cho optimistic locking.
  - MongoDB: index theo ESR (Equality → Sort → Range); embed khi "đọc cùng nhau, giới hạn kích thước".
