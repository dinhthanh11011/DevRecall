slug: nestjs
title: NestJS
tier: 2
status: drafted
summary: Modules, DI & injection scopes (chi phí request scope), request lifecycle middleware → guard → interceptor → pipe → handler → interceptor → filter, custom decorators, microservices transports, testing, circular deps.
