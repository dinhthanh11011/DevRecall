overview: |-
  ## TL;DR

  - NestJS là framework **opinionated** trên Node: module + **DI container** + decorator, chạy trên HTTP adapter **Express** (mặc định) hoặc **Fastify**. Bản chất vẫn là Express/Fastify bên dưới.
  - Nắm chắc **request lifecycle**: middleware → guards → interceptors (trước) → pipes → handler → interceptors (sau) → exception filters. Nhiều ghi chú trên mạng đặt pipe trước interceptor — **sai** theo docs chính thức.
  - DI có 3 scope: **DEFAULT (singleton)**, **REQUEST**, **TRANSIENT**. Request scope **lan ngược lên** chuỗi dependency (controller, service phụ thuộc cũng thành request-scoped) → tốn chi phí khởi tạo mỗi request; dùng durable providers hoặc AsyncLocalStorage/CLS khi cần context.
  - Microservices module: transport TCP, Redis, NATS, MQTT, RabbitMQ, Kafka, gRPC, custom; `@MessagePattern` (request-response) vs `@EventPattern` (event).
  - Version (verify): Nest 11 dùng **Express 5** mặc định cho platform-express (cú pháp route wildcard mới); Nest 12 chuyển core package sang **ESM-only** và nâng yêu cầu Node.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Module | Đơn vị đóng gói: `imports`, `controllers`, `providers`, `exports` | `@Module({ providers: [OrdersService], exports: [OrdersService] })` |
  | Provider | Thứ được DI container tạo và inject (class, value, factory) | `@Injectable() class OrdersService` |
  | Injection token | Khoá tra cứu provider: class, string, symbol | `@Inject("PAYMENT_CLIENT")` |
  | Middleware | Như Express middleware, chạy trước route handler, không biết handler nào sẽ chạy | Logging, raw body |
  | Guard | `canActivate()` → cho qua hay không (authz), biết `ExecutionContext` | `RolesGuard` đọc metadata `@Roles()` |
  | Interceptor | Bọc handler (RxJS), chạy trước + sau | Logging thời gian, map response, timeout, cache |
  | Pipe | Validate/transform **argument** của handler | `ValidationPipe`, `ParseIntPipe` |
  | Exception filter | Bắt exception, tạo response | `@Catch(HttpException)` |
  | Custom decorator | Metadata (`SetMetadata`/`Reflector.createDecorator`) hoặc param decorator | `@CurrentUser()` |
  | Dynamic module | Module cấu hình được lúc import | `ConfigModule.forRoot()`, `forRootAsync` |

  ## Cơ chế hoạt động

  ### Request lifecycle

  ```mermaid
  flowchart TD
    IN["Incoming request"] --> MW["Middleware<br/>(global -> module-bound)"]
    MW --> G["Guards<br/>(global -> controller -> route)"]
    G -- "false / throw" --> F
    G --> IB["Interceptors - before next.handle()<br/>(global -> controller -> route)"]
    IB --> P["Pipes<br/>(global -> controller -> route -> param)"]
    P -- "validation error" --> F
    P --> H["Route handler -> services"]
    H --> IA["Interceptors - after<br/>(route -> controller -> global, RxJS)"]
    H -- "throw" --> F["Exception filters<br/>(route -> controller -> global;<br/>first match handles it)"]
    IA --> OUT["Response"]
    F --> OUT
  ```

  - Guard chạy **sau** middleware nên biết handler/metadata (`context.getHandler()`), middleware thì không.
  - Filter được chọn từ mức **thấp nhất** (route) lên global; filter đã bắt thì exception không truyền tiếp lên filter khác.

  ### DI & scope bubbling

  ```mermaid
  flowchart LR
    C["OrdersController<br/>(becomes REQUEST)"] --> S["OrdersService<br/>(becomes REQUEST)"]
    S --> R["OrdersRepository<br/>(becomes REQUEST)"]
    R --> L["TenantContext<br/>scope: REQUEST"]
    S --> CACHE["CacheService<br/>(DEFAULT singleton, unaffected)"]
  ```

  - Một provider REQUEST ở "đáy" → mọi thứ phụ thuộc vào nó (trực tiếp hoặc gián tiếp) phải tạo lại **mỗi request**.
  - TRANSIENT không lan kiểu này: mỗi consumer nhận instance riêng.

  ### Bootstrap & shutdown hooks

  ```mermaid
  sequenceDiagram
    participant App as NestFactory
    participant M as Modules/Providers
    App->>M: resolve dependency graph, instantiate providers
    App->>M: onModuleInit()
    App->>M: onApplicationBootstrap()
    App->>App: listen()
    Note over App: SIGTERM (needs app.enableShutdownHooks()) or app.close()
    App->>M: onModuleDestroy()
    App->>M: beforeApplicationShutdown(signal)
    App->>App: close connections (HTTP server, microservice transports)
    App->>M: onApplicationShutdown(signal)
  ```

  ## Trade-offs

  | Chủ đề | Lựa chọn A | Lựa chọn B | Ghi chú |
  |---|---|---|---|
  | Request context | REQUEST-scoped provider (inject `REQUEST`) | AsyncLocalStorage / `nestjs-cls` | Scope gây chi phí + lan ngược; ALS rẻ hơn nhưng "ngầm" |
  | Global enhancer | `app.useGlobalGuards(new X())` | Provider `APP_GUARD` trong module | `APP_*` được DI inject dependency; `useGlobal*` tạo ngoài container |
  | Validation | `class-validator` + `ValidationPipe` | Schema (zod/Standard Schema) pipe | class-validator dựa decorator + metadata; schema gọn, dùng chung FE |
  | Adapter | Express | Fastify | Fastify nhanh hơn, nhưng middleware Express không dùng trực tiếp được |
  | Microservice | Transport của Nest (`@nestjs/microservices`) | Dùng client lib trực tiếp (kafkajs, amqplib) | Nest trừu tượng hoá, nhưng giấu bớt control (commit offset, retry) |
  | Circular dep | `forwardRef()` | Refactor tách module/event | `forwardRef` là băng keo, không phải thiết kế |

  ## Pitfalls

  - Nhớ sai thứ tự lifecycle (pipe trước interceptor) → đặt logic ở sai tầng.
  - Provider dùng ở module khác nhưng quên `exports` hoặc quên `imports` → "Nest can't resolve dependencies".
  - Request-scoped logger/tenant context inject vào repository → toàn bộ graph thành request-scoped → latency và GC tăng; và **không dùng được** trong cron, Kafka consumer, WebSocket gateway.
  - `app.useGlobalGuards(new AuthGuard())` → guard không có DI (Reflector, ConfigService undefined).
  - `ValidationPipe` không bật `whitelist`/`forbidNonWhitelisted` → mass assignment; không bật `transform` → `@Query() page: number` vẫn là string.
  - Nested DTO thiếu `@ValidateNested()` + `@Type(() => X)` → object con không được validate.
  - `import type` cho class dùng ở constructor → mất metadata `design:paramtypes` → DI không resolve.
  - Quên `app.enableShutdownHooks()` → `onModuleDestroy`/`onApplicationShutdown` không chạy khi nhận SIGTERM.
  - Barrel file (`index.ts`) gây circular import → dependency `undefined` lúc decorator chạy.

  ## Cheat sheet

  - Lifecycle: **MW → Guard → Interceptor(before) → Pipe → Handler → Interceptor(after) → Filter (khi có lỗi)**.
  - Custom provider: `useClass` · `useValue` · `useFactory` + `inject` · `useExisting` (alias). Async factory = await trước khi app start.
  - `APP_GUARD` / `APP_INTERCEPTOR` / `APP_PIPE` / `APP_FILTER` để đăng ký global enhancer có DI.
  - Scope: `@Injectable({ scope: Scope.REQUEST })`; durable: `{ scope: Scope.REQUEST, durable: true }` + `ContextIdFactory.apply(strategy)`.
  - Testing: `Test.createTestingModule({...}).overrideProvider(X).useValue(mock).compile()`; scoped provider lấy bằng `moduleRef.resolve()` chứ không phải `get()`.
  - Microservices: `@MessagePattern` (có response) · `@EventPattern` (fire-and-forget); hybrid app = `app.connectMicroservice()` + `startAllMicroservices()`.
  - Circular: `forwardRef(() => OtherModule)` ở cả hai phía + `@Inject(forwardRef(() => OtherService))`.
