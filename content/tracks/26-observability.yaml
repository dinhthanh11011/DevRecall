overview: |-
  ## TL;DR

  - **Monitoring** trả lời "có hỏng không?" (câu hỏi biết trước); **observability** trả lời "tại sao hỏng?" cho cả câu hỏi **chưa biết trước** — nhờ telemetry giàu ngữ cảnh (high-cardinality, liên kết được với nhau).
  - Ba tín hiệu: **metrics** (rẻ, tổng hợp, để alert), **logs** (chi tiết từng sự kiện), **traces** (đường đi của một request qua nhiều service). Chìa khoá là **nối** chúng bằng `trace_id` / correlation ID.
  - **OpenTelemetry** là chuẩn vendor-neutral để instrument (API + SDK + Collector + OTLP) — instrument một lần, gửi tới backend nào cũng được.
  - Reliability đo bằng **SLI → SLO → error budget**; alert theo **triệu chứng người dùng thấy** (burn rate), không theo mọi nguyên nhân (CPU 80%).
  - Senior interview hay hỏi: "Kể sự cố khó nhất bạn debug" → cần **phương pháp** (khoanh vùng, giả thuyết, bằng chứng), không phải may mắn. Kết thúc bằng **postmortem blameless** có action item.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Structured logging | Log là JSON có field cố định, query được | `{"level":"error","trace_id":"4bf9…","tenant_id":"t_42","msg":"payment failed"}` |
  | Correlation ID | ID đi theo request qua mọi service/log | Header `traceparent` / `x-request-id` → `AsyncLocalStorage` → mọi log line |
  | Span / trace | Span = một đơn vị công việc có start/end + attributes; trace = cây span của một request | `GET /checkout` → span `SELECT orders` 120 ms → span `POST stripe` 800 ms |
  | Cardinality | Số giá trị khác nhau của một label | Label `user_id` trên metric → hàng triệu time series → backend nổ |
  | RED | Rate, Errors, Duration — cho **service** (request-driven) | API: 1.2k rps, 0.3% 5xx, p99 450 ms |
  | USE | Utilization, Saturation, Errors — cho **resource** | DB CPU 85%, 40 connection chờ, 0 disk error |
  | Golden signals | Latency, Traffic, Errors, Saturation (Google SRE) | Dashboard đầu tiên của mọi service |
  | SLI | Tỉ lệ sự kiện tốt / tổng sự kiện | `requests < 300ms và không 5xx / total requests` |
  | SLO | Mục tiêu cho SLI trong cửa sổ thời gian | 99.9% trong 30 ngày |
  | Error budget | `1 − SLO` — lượng "được phép hỏng" | 99.9%/30 ngày ≈ 43 phút downtime tương đương |
  | Burn rate | Tốc độ tiêu budget so với mức "vừa đủ hết đúng hạn" | Burn rate 14.4 trong 1h = tiêu 2% budget tháng trong 1 giờ |
  | Percentile | p50/p95/p99 — không bao giờ lấy trung bình của percentile | p99 = 1% request chậm hơn giá trị này |

  ## Cơ chế hoạt động

  **Telemetry pipeline với OpenTelemetry:**

  ```mermaid
  flowchart LR
    subgraph App["Node service"]
      SDK["OTel SDK<br/>auto-instrumentation<br/>(http, express, pg, redis, kafkajs)"]
      LOG["pino logger<br/>+ trace_id"]
    end
    FE["Browser RUM<br/>(Web Vitals, errors)"] -- "traceparent" --> App
    SDK -- "OTLP" --> COL["OTel Collector<br/>batch · sampling · redact"]
    LOG -- "stdout" --> COL
    COL --> TR[("Traces backend<br/>Jaeger/Tempo/X-Ray")]
    COL --> MET[("Metrics<br/>Prometheus/CloudWatch")]
    COL --> LG[("Logs<br/>Loki/Elasticsearch/CloudWatch")]
    MET --> AL["Alerting (SLO burn rate)"] --> ONC["On-call"]
  ```

  **Phương pháp debug sự cố production (BE / DB / FE):**

  ```mermaid
  flowchart TD
    A["Alert / user report"] --> B["Xác nhận tác động: ai, bao nhiêu, từ khi nào?<br/>(SLO dashboard)"]
    B --> C{"Có thay đổi gần đây?<br/>deploy, config, flag, traffic, dependency"}
    C -- "có" --> M["Mitigate trước: rollback / tắt flag / scale"]
    C -- "không rõ" --> D["Khoanh vùng theo tầng"]
    D --> FE["FE: RUM, JS error, network tab,<br/>chỉ một browser/region?"]
    D --> BE["BE: RED theo endpoint, trace chậm nhất,<br/>log lỗi theo trace_id"]
    D --> DB["DB: slow query, lock/blocking, connection pool,<br/>CPU/IO, plan thay đổi"]
    FE --> H["Giả thuyết → kiểm chứng bằng dữ liệu"]
    BE --> H
    DB --> H
    H --> M
    M --> P["Postmortem blameless + action items"]
  ```

  ## Trade-offs

  | Tín hiệu | Mạnh | Yếu | Chi phí |
  |---|---|---|---|
  | Metrics | Rẻ, lưu lâu, alert, xu hướng | Mất chi tiết; high-cardinality đắt | Theo số time series |
  | Logs | Chi tiết đầy đủ, ngữ cảnh | Đắt khi volume lớn, khó tổng hợp nếu không structured | Theo GB ingest + retention |
  | Traces | Thấy latency qua nhiều service, critical path | Cần propagation đúng; phải sampling | Theo span; sampling quyết định |
  | Head sampling | Đơn giản, rẻ, quyết định ở đầu request | Có thể bỏ mất trace lỗi/chậm hiếm | Thấp |
  | Tail sampling | Giữ trace lỗi/chậm, bỏ trace bình thường | Collector phải buffer toàn bộ trace, phức tạp | Cao hơn |

  | Load test type | Mục đích | Hình dạng tải |
  |---|---|---|
  | Smoke | Script chạy đúng, baseline | Rất ít VU, ngắn |
  | Average-load | Hành vi ở tải bình thường | Ramp tới mức trung bình, giữ |
  | Stress | Hành vi trên mức bình thường | Tải cao hơn peak |
  | Spike | Tăng đột ngột (flash sale) | Nhảy vọt trong vài giây |
  | Soak / endurance | Leak, degrade theo thời gian | Tải vừa trong nhiều giờ |
  | Breakpoint | Tìm giới hạn | Tăng dần tới khi vỡ |

  ## Pitfalls

  - Log text tự do, không có `trace_id`/`tenant_id` → không nối được log giữa các service.
  - Log PII/secret (token, password, số thẻ) → sự cố bảo mật + compliance.
  - Label metric high-cardinality (`user_id`, URL có ID) → chi phí và backend quá tải.
  - Dùng **average latency** hoặc lấy trung bình của p99 giữa các instance.
  - Alert theo nguyên nhân (CPU, memory) thay vì triệu chứng → alert fatigue, on-call bỏ qua alert thật.
  - SLO 100% hoặc SLO không ai dùng để ra quyết định.
  - Load test từ laptop, closed model (VU chờ response) → **coordinated omission**, số đẹp giả tạo.
  - Postmortem tìm "người có lỗi" → mọi người giấu thông tin lần sau.
  - OTel SDK khởi tạo **sau** khi đã import `express`/`pg` → auto-instrumentation không patch được.

  ## Cheat sheet

  - Log: JSON, level đúng, `trace_id`, `span_id`, `request_id`, `tenant_id`, `service`, `version`; không PII; ra stdout.
  - Node: `AsyncLocalStorage` giữ context request; pino (nhanh) + OTel log correlation.
  - W3C Trace Context: `traceparent: 00-<trace-id 32 hex>-<span-id 16 hex>-<flags>`.
  - RED cho service, USE cho resource; bốn golden signals cho dashboard mặc định.
  - 99.9% / 30 ngày ≈ 43.2 phút · 99.95% ≈ 21.6 phút · 99.99% ≈ 4.3 phút.
  - Alert: multi-window multi-burn-rate (ví dụ page khi 2% budget cháy trong 1h, ticket khi 10% cháy trong 3 ngày).
  - Load test: open model (arrival-rate) khi mô phỏng user thật; đo p95/p99, error rate, throughput, và **saturation** của DB/pool.
  - Little's Law: `concurrency = throughput × latency`.
  - Incident: phân vai (incident commander, comms, ops), **mitigate trước, root cause sau**, timeline, postmortem blameless trong vài ngày.
