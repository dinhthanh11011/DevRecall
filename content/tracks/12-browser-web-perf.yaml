id: 12-browser-web-perf
slug: browser-web-perf
title: Browser, Web Performance & Frontend Security
tier: 3
status: drafted
summary: Critical rendering path, Core Web Vitals (LCP, INP, CLS), code splitting, HTTP caching, service worker, storage, XSS trong React, CSP, thay đổi third-party cookie.
cvLinked: true
prerequisites: []
overview: |-
  ## TL;DR

  - Trình duyệt biến HTML/CSS/JS thành pixel qua **critical rendering path**: DOM + CSSOM → render tree → layout → paint → composite. CSS **render-blocking**, `<script>` thường **parser-blocking** → `defer`/`async`/`type="module"`.
  - **Core Web Vitals** (đo ở **p75** dữ liệu thực tế của user): **LCP** ≤ 2.5s (tải), **INP** ≤ 200ms (phản hồi — thay **FID** từ 2024-03-12), **CLS** ≤ 0.1 (ổn định layout).
  - Perf thực chiến = gửi **ít JS hơn** (code splitting, tree shaking), **cache đúng** (hashed asset `immutable`, HTML revalidate), ưu tiên tài nguyên quan trọng (preload/`fetchpriority`), không chặn main thread (long task > 50ms).
  - Frontend security: React escape mặc định nhưng có lối thoát (`dangerouslySetInnerHTML`, URL `javascript:`, inject vào `<script>` khi SSR); **CSP** nonce/hash + Trusted Types là lớp thứ hai; token không để trong `localStorage` nếu có thể dùng cookie `HttpOnly`.
  - Third-party cookies: Safari/Firefox chặn mặc định; Chrome **giữ** third-party cookie (bỏ kế hoạch deprecate, Privacy Sandbox APIs bị retire 2025) — nhưng vẫn thiết kế như thể không có (CHIPS, storage partitioning).

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Critical rendering path | Chuỗi bước từ byte → pixel | CSS lớn trong `<head>` làm trễ first paint |
  | Render-blocking | Tài nguyên phải xong trước khi render | `<link rel="stylesheet">` |
  | `defer` / `async` | defer: tải song song, chạy sau parse theo thứ tự; async: chạy ngay khi tải xong | analytics → `async`; app bundle → `defer` |
  | LCP | Thời điểm phần tử nội dung lớn nhất trong viewport render xong | Ảnh hero sản phẩm |
  | INP | Độ trễ tương tác (input → next paint) gần như tệ nhất trong phiên | Click "Add to cart" mất 450ms mới đổi UI |
  | CLS | Tổng dịch chuyển layout bất ngờ (session window lớn nhất) | Banner cookie đẩy nội dung xuống |
  | Long task | Task > 50ms trên main thread | JSON.parse 5MB, render list 10k row |
  | Code splitting | Tách bundle, tải theo route/tính năng | `React.lazy(() => import('./Reports'))` |
  | Cache-Control | Chỉ thị cache cho browser/CDN | `public, max-age=31536000, immutable` |
  | ETag / 304 | Validator để revalidate rẻ | `If-None-Match: "abc"` → `304 Not Modified` |
  | stale-while-revalidate | Trả bản cũ ngay, revalidate nền | `max-age=60, stale-while-revalidate=600` |
  | Service worker | Proxy mạng chạy nền theo origin/scope | Offline, cache chiến lược, push |
  | CSP | Header giới hạn nguồn script/style/... | `script-src 'nonce-r4nd' 'strict-dynamic'` |
  | CHIPS | Cookie `Partitioned` theo top-level site | Widget chat nhúng |

  ## Cơ chế hoạt động

  ### Critical rendering path

  ```mermaid
  flowchart LR
    H["HTML bytes"] --> P["Parse → DOM"]
    P -- "gặp script thường" --> S["Tải + chạy JS<br/>(parser blocked)"]
    S --> P
    C["CSS"] --> CS["CSSOM"]
    P --> RT["Render tree"]
    CS --> RT
    RT --> L["Layout<br/>(vị trí, kích thước)"]
    L --> PT["Paint"]
    PT --> CO["Composite (GPU layers)"]
    CS -. "JS đọc style phải chờ CSSOM" .-> S
  ```

  ### Quyết định HTTP cache của browser

  ```mermaid
  flowchart TD
    R["Request asset"] --> A{"Có trong cache?"}
    A -- no --> N["Tải từ network"]
    A -- yes --> F{"Còn fresh?<br/>(max-age / s-maxage)"}
    F -- yes --> U["Dùng cache, không request"]
    F -- no --> SWR{"Trong cửa sổ<br/>stale-while-revalidate?"}
    SWR -- yes --> U2["Trả bản cũ ngay + revalidate nền"]
    SWR -- no --> V["Revalidate: If-None-Match / If-Modified-Since"]
    V -- "304" --> U3["Dùng lại body cache, cập nhật freshness"]
    V -- "200" --> N2["Body mới"]
  ```

  ### Service worker lifecycle

  ```mermaid
  sequenceDiagram
    participant Page
    participant SW1 as SW v1 (active)
    participant SW2 as SW v2 (new)
    Page->>SW2: navigator.serviceWorker.register (script đổi byte)
    SW2->>SW2: install (precache assets)
    Note over SW2: waiting — v1 vẫn điều khiển các tab đang mở
    SW2->>SW2: skipWaiting() (tuỳ chọn)
    SW2->>SW2: activate (dọn cache cũ)
    SW2->>Page: clients.claim() — điều khiển tab hiện tại
    Page->>SW2: fetch events
  ```

  ## Trade-offs

  | Chủ đề | Lựa chọn | Ưu | Nhược |
  |---|---|---|---|
  | Rendering | CSR SPA | Tương tác mượt sau khi tải, server đơn giản | LCP chậm, JS nhiều, SEO kém |
  | | SSR / streaming (Next.js) | LCP nhanh, SEO | Hydration cost ảnh hưởng INP, server phức tạp |
  | Code splitting | Theo route | Đơn giản, hiệu quả lớn | Chuyển route có độ trễ → prefetch |
  | | Theo component | Chi tiết | Quá nhiều chunk nhỏ, waterfall |
  | Lưu token | Cookie `HttpOnly; Secure; SameSite` | JS (XSS) không đọc được | Cần chống CSRF, cấu hình CORS/domain |
  | | `localStorage` | Dễ | Bất kỳ XSS nào cũng đánh cắp được |
  | Cache HTML | `no-cache` + ETag | Luôn mới, 304 rẻ | Một round-trip mỗi lần |
  | | `max-age` dài | Nhanh | User kẹt ở version cũ, chunk 404 |
  | SW strategy | Cache-first | Nhanh, offline | Stale nếu không version |
  | | Network-first | Mới | Chậm khi mạng yếu |

  ## Pitfalls

  - `loading="lazy"` cho ảnh LCP; ảnh hero chèn bằng JS/CSS background → browser phát hiện muộn.
  - Cache `index.html` lâu → sau deploy, HTML cũ trỏ chunk đã bị xoá → `ChunkLoadError`.
  - Ảnh/iframe/ads không có kích thước → CLS; font swap đổi metric → CLS.
  - Handler nặng đồng bộ trong `onChange`/`onClick` → INP tệ; `useMemo` khắp nơi không thay được việc bớt công việc.
  - `dangerouslySetInnerHTML` với nội dung từ CMS/user không sanitize; `href={userUrl}` không kiểm scheme.
  - CSP có `'unsafe-inline'` + `'unsafe-eval'` = gần như vô dụng chống XSS.
  - Service worker cache-first cho HTML không có cơ chế update → user kẹt version cũ "mãi mãi".
  - Đo perf chỉ bằng Lighthouse trên laptop mạnh (lab) thay vì RUM p75 trên thiết bị thật.

  ## Cheat sheet

  - Ngưỡng "good" (p75): LCP ≤ 2.5s · INP ≤ 200ms · CLS ≤ 0.1. "Poor": LCP > 4s · INP > 500ms · CLS > 0.25.
  - LCP: SSR/HTML có sẵn ảnh, `<img fetchpriority="high">`, preload, CDN, nén ảnh (AVIF/WebP), không lazy-load.
  - INP: chia nhỏ long task (`await` yield, `scheduler.yield()` nơi hỗ trợ), `startTransition`, virtualize list, bớt hydration, debounce.
  - CLS: `width`/`height` hoặc `aspect-ratio`, reserve chỗ cho ads/banner, `font-display` + fallback metric, animation bằng `transform`.
  - Cache: hashed assets `max-age=31536000, immutable`; HTML `no-cache` (+ ETag); API tuỳ dữ liệu; dữ liệu nhạy cảm `no-store` hoặc `private`.
  - Script: app `defer`/module, third-party `async` hoặc tải sau tương tác; `preconnect` tới origin quan trọng.
  - Security headers: CSP (nonce + `strict-dynamic`, `object-src 'none'`, `base-uri 'none'`, `frame-ancestors`), `Strict-Transport-Security`, `X-Content-Type-Options: nosniff`, `Referrer-Policy`.
