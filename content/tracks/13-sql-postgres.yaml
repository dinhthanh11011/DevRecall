id: 13-sql-postgres
slug: sql-postgres
title: SQL & PostgreSQL
tier: 4
status: drafted
summary: Indexes, EXPLAIN, transactions & isolation, MVCC/VACUUM, locking, pooling, replication, zero-downtime migrations — kèm so sánh với SQL Server.
cvLinked: true
prerequisites: []
overview: |-
  ## TL;DR

  - PostgreSQL là **MVCC thuần**: mỗi `UPDATE` tạo **tuple version mới**, bản cũ thành dead tuple chờ **VACUUM** dọn. Reader không block writer, writer không block reader — khác SQL Server mặc định (lock-based `READ COMMITTED`, trừ khi bật **RCSI**).
  - Postgres **không có clustered index**: mọi table là **heap**, mọi index (kể cả PK) là secondary index trỏ tới `ctid`. `CLUSTER` chỉ sắp xếp lại một lần, không duy trì.
  - Senior interview xoáy vào: **đọc `EXPLAIN (ANALYZE, BUFFERS)`**, **vì sao planner bỏ qua index**, **anomaly ở từng isolation level**, **bloat / long transaction / xid wraparound**, **lock queue khi migrate**, **PgBouncer transaction mode**, **replica lag**.
  - Zero-downtime migration = **expand → migrate (backfill theo batch) → contract**, cộng `lock_timeout`, `CREATE INDEX CONCURRENTLY`, constraint `NOT VALID` + `VALIDATE`.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | B-tree index | Cây cân bằng, sắp xếp theo key; hỗ trợ `=`, `<`, `>`, `BETWEEN`, `ORDER BY`, prefix `LIKE 'abc%'` (cần C collation hoặc `text_pattern_ops`) | `CREATE INDEX ON orders (tenant_id, created_at DESC)` |
  | Composite index | Thứ tự cột quan trọng: equality trước, range/sort sau | `(tenant_id, status, created_at)` phục vụ `WHERE tenant_id=? AND status=? ORDER BY created_at` |
  | Covering index | `INCLUDE` cột payload để có **Index Only Scan** (PG 11+) | `CREATE INDEX ON orders (customer_id) INCLUDE (total)` |
  | Partial index | Index chỉ một tập con row | `CREATE INDEX ON jobs (run_at) WHERE status = 'pending'` |
  | Expression index | Index trên biểu thức; query phải dùng đúng biểu thức | `CREATE INDEX ON users (lower(email))` |
  | GIN / GiST / BRIN | GIN: inverted (jsonb, array, full-text) · GiST: range/geo/nearest · BRIN: block range tóm tắt cho data tăng dần | `CREATE INDEX ON events USING brin (created_at)` |
  | MVCC | Mỗi row version có `xmin`/`xmax`; transaction nhìn theo **snapshot** | `SELECT xmin, xmax, ctid FROM t` |
  | VACUUM | Dọn dead tuple, cập nhật visibility map, **freeze** xid cũ | `VACUUM (VERBOSE, ANALYZE) orders` |
  | HOT update | Update không đụng cột indexed + còn chỗ trên page → không cần sửa index | `fillfactor = 90` cho table update nhiều |
  | Row lock | Lưu trong tuple header, **không lock escalation** như SQL Server | `SELECT ... FOR UPDATE SKIP LOCKED` |
  | Advisory lock | Lock theo số do app định nghĩa | `SELECT pg_try_advisory_xact_lock(hashtext('job:daily'))` |
  | PgBouncer | Pooler nhẹ; mode `session` / `transaction` / `statement` | Transaction mode phá `SET`, session advisory lock, `LISTEN` |
  | Streaming replication | Replica apply WAL; async mặc định → **replica lag** | `pg_stat_replication.replay_lag` |
  | Declarative partitioning | Chia table theo range/list/hash; **partition pruning** | `PARTITION BY RANGE (created_at)` |
  | Keyset pagination | Phân trang bằng `WHERE (k) > (last_k)` thay vì `OFFSET` | `WHERE (created_at, id) < ($1, $2) ORDER BY created_at DESC, id DESC LIMIT 50` |

  ## Cơ chế hoạt động

  ### Vòng đời một UPDATE dưới MVCC

  ```mermaid
  flowchart TD
    A["UPDATE orders SET status='paid' WHERE id=42"] --> B["Tìm tuple hiện tại (ctid 7,3)"]
    B --> C{"Row đang bị transaction khác lock?"}
    C -- yes --> W["Chờ (hoặc lỗi nếu NOWAIT / lock_timeout)"]
    W --> B
    C -- no --> D["Set xmax = my xid trên tuple cũ"]
    D --> E["Ghi tuple mới (xmin = my xid)"]
    E --> F{"Cột indexed không đổi và page còn chỗ?"}
    F -- yes --> G["HOT update: không đụng index"]
    F -- no --> H["Thêm entry mới vào MỌI index"]
    G --> I["COMMIT: ghi WAL, clog"]
    H --> I
    I --> J["Tuple cũ = dead khi không còn snapshot nào cần"]
    J --> K["(auto)VACUUM dọn, cập nhật visibility map & FSM"]
  ```

  > SQL Server khác: update thường **in-place** trên page của clustered index; chỉ khi bật RCSI/SNAPSHOT thì bản cũ được copy vào **version store** (tempdb, hoặc Persistent Version Store khi bật ADR — SQL Server 2019+).

  ### Zero-downtime column change (expand / contract)

  ```mermaid
  flowchart LR
    A["1. Expand: ADD COLUMN nullable<br/>(metadata-only)"] --> B["2. Deploy app: dual-write<br/>old + new"]
    B --> C["3. Backfill theo batch<br/>(1k-10k rows, sleep, theo dõi lag)"]
    C --> D["4. CHECK (...) NOT VALID<br/>→ VALIDATE CONSTRAINT"]
    D --> E["5. Deploy app: đọc cột mới"]
    E --> F["6. Contract: ngừng ghi cột cũ<br/>→ DROP COLUMN"]
  ```

  Mỗi DDL chạy với `SET lock_timeout = '3s'` + retry: nếu `ALTER TABLE` phải chờ `ACCESS EXCLUSIVE` sau một transaction dài, **mọi query mới sẽ xếp hàng sau nó** → outage dù DDL "chỉ mất 1ms".

  ### Đường đi của query qua pool & replica

  ```mermaid
  sequenceDiagram
    participant App as Node app
    participant PB as PgBouncer (transaction mode)
    participant P as Primary
    participant R as Replica (async)
    App->>PB: BEGIN, UPDATE ..., COMMIT
    PB->>P: mượn server connection cho 1 transaction
    P-->>R: stream WAL (lag vài ms → vài giây)
    App->>R: SELECT ngay sau khi ghi
    R-->>App: dữ liệu cũ (read-your-writes bị vỡ)
    Note over App,R: Fix: đọc primary sau khi ghi / so LSN / sticky theo session
  ```

  ## Trade-offs

  | Chủ đề | Lựa chọn A | Lựa chọn B | Khi nào chọn gì |
  |---|---|---|---|
  | Concurrency control | Postgres MVCC (heap + VACUUM) | SQL Server lock-based RC (mặc định on-prem) / RCSI | MVCC: đọc không block; trả giá bằng bloat & vacuum. Lock-based: không bloat nhưng reader/writer block nhau, dễ deadlock |
  | Pagination | `OFFSET` | Keyset | OFFSET cho admin nhỏ, cần nhảy trang; keyset cho feed/API lớn |
  | PK | `bigint identity` | UUID (v4 / v7) | bigint nhỏ & nhanh; UUID khi sinh ở client / merge nhiều nguồn; v4 random làm B-tree phân mảnh, v7 time-ordered tốt hơn |
  | Isolation | Read Committed + lock tường minh | Serializable (SSI) + retry | RC cho đa số OLTP; SSI khi invariant phức tạp (write skew), chấp nhận retry |
  | Pooler mode | Session | Transaction | Transaction scale tốt hơn nhiều nhưng mất session state |
  | Replication | Physical streaming | Logical | Physical: HA/read replica cả cluster; Logical: chọn table, khác major version, CDC |
  | Chia dữ liệu | Partitioning (1 node) | Sharding (nhiều node, vd Citus) | Partition cho retention/pruning; shard khi 1 node không đủ write/storage |
  | JSON | Cột quan hệ | `jsonb` | jsonb cho attribute thưa/động; field hay filter/join nên là cột thật |

  ## Pitfalls

  - `EXPLAIN ANALYZE` **thực thi thật** câu lệnh — với `UPDATE/DELETE` hãy bọc trong `BEGIN; ... ROLLBACK;`.
  - Hàm/cast trên cột (`WHERE date(created_at) = ...`, so sánh `varchar` với tham số sai kiểu) làm index vô dụng.
  - Transaction mở lâu (kể cả `idle in transaction`) giữ `xmin` → VACUUM không dọn được gì → bloat toàn DB.
  - `CREATE INDEX` thường lock ghi cả table; dùng `CONCURRENTLY` — nhưng không chạy được trong transaction block (nhiều migration tool mặc định bọc transaction!).
  - Thêm cột `DEFAULT now()`/`gen_random_uuid()` (volatile) vẫn **rewrite table**; default hằng số thì instant từ PG 11.
  - Đọc từ replica ngay sau khi ghi → dữ liệu cũ.
  - `timestamp without time zone` cho sự kiện thực tế → bug khi đổi DST / đa múi giờ; dùng `timestamptz`.
  - Tin rằng `NOLOCK`-style dirty read tồn tại trong Postgres: `READ UNCOMMITTED` ở Postgres hoạt động như `READ COMMITTED`.

  ## Cheat sheet

  - Chẩn đoán query: `EXPLAIN (ANALYZE, BUFFERS)` → so **estimated vs actual rows**, tìm node tốn thời gian nhất, `shared read` (disk) vs `shared hit` (cache).
  - Top query: `pg_stat_statements` (total_exec_time, calls, mean). Lock: `pg_locks` + `pg_blocking_pids(pid)`. Activity: `pg_stat_activity` (state, xact_start, backend_xmin).
  - Bloat/vacuum: `pg_stat_user_tables` (n_dead_tup, last_autovacuum). Wraparound: `age(datfrozenxid)` trong `pg_database`.
  - Isolation Postgres: RU≈RC (mặc định) · RR = snapshot isolation (không phantom, có write skew) · Serializable = SSI (lỗi `40001` → retry).
  - Lock hàng: `FOR UPDATE` > `FOR NO KEY UPDATE` > `FOR SHARE` > `FOR KEY SHARE`; queue: `FOR UPDATE SKIP LOCKED`.
  - Migration an toàn: `lock_timeout`, `ADD COLUMN` nullable, `CREATE INDEX CONCURRENTLY`, `ADD CONSTRAINT ... NOT VALID` → `VALIDATE CONSTRAINT`, backfill batch, `SET NOT NULL` sau khi có CHECK hợp lệ (PG 12+ bỏ qua full scan).
  - Timeouts nên có: `statement_timeout`, `lock_timeout`, `idle_in_transaction_session_timeout`, (PG 17+) `transaction_timeout`.
  - SQL Server ↔ Postgres: `TOP` ↔ `LIMIT` · `IDENTITY` ↔ `GENERATED ... AS IDENTITY` · filtered index ↔ partial index · `datetimeoffset` ↔ `timestamptz` (Postgres không lưu offset, chỉ lưu instant UTC) · `MERGE` ↔ `INSERT ... ON CONFLICT` (Postgres có `MERGE` từ PG 15) · `WITH (NOLOCK)` ↔ không có.
