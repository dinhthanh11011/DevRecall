overview: |-
  ## TL;DR

  - JavaScript là ngôn ngữ **single-threaded** chạy trên một **event loop**; mọi thứ bất đồng bộ (timer, I/O, promise) đều là callback được xếp hàng chờ call stack rỗng.
  - Senior interview hiếm khi hỏi "closure là gì" — họ hỏi **tại sao đoạn code này in ra thế này**, **leak ở đâu**, **promise nào bị nuốt lỗi**.
  - Nắm chắc 5 trục: **scope & closure**, **`this` binding**, **prototype chain**, **event loop (macro vs micro task)**, **promise error propagation**.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Closure | Function "nhớ" biến của scope nơi nó được tạo | `const inc = counter(); inc(); inc()` giữ `count` riêng |
  | `this` | Được quyết định **lúc gọi**, không phải lúc khai báo (trừ arrow function) | `obj.fn()` → `this = obj`; `const f = obj.fn; f()` → `undefined` (strict) |
  | Prototype | Object tra cứu property theo chuỗi `__proto__` | `class` chỉ là syntax sugar trên prototype |
  | Microtask | Promise callbacks, `queueMicrotask` — chạy **hết** trước macrotask kế tiếp | `Promise.resolve().then(...)` chạy trước `setTimeout(..., 0)` |
  | TDZ | `let`/`const` bị hoisted nhưng chưa khởi tạo | Truy cập trước khai báo → `ReferenceError` |
  | ESM live binding | `import` là tham chiếu sống tới binding của module xuất | `export let n` thay đổi → importer thấy giá trị mới |
  | Generator / iterator | Function tạm dừng được (`yield`), trả iterator lazy | Duyệt API phân trang bằng `for await...of` |
  | WeakMap / WeakRef | Giữ reference **không ngăn GC** thu hồi key/target | Metadata gắn vào DOM node / request object |
  | Number (IEEE 754 double) | Mọi `number` là float 64-bit; số nguyên an toàn tới `2^53 - 1` | `0.1 + 0.2 !== 0.3`; id 64-bit từ DB phải là string/`BigInt` |

  ## Cơ chế hoạt động

  ### Event loop (browser & Node, mô hình chung)

  ```mermaid
  flowchart TD
    A["Run sync code<br/>(call stack)"] --> B{"Stack empty?"}
    B -- no --> A
    B -- yes --> C["Drain ALL microtasks<br/>(promise.then, queueMicrotask)"]
    C --> D["Take ONE macrotask<br/>(setTimeout, I/O, message)"]
    D --> A
    C -. "browser" .-> R["Render (if needed)"]
    R --> D
  ```

  > Node.js có thêm `process.nextTick` queue (chạy trước promise microtasks) và các phase của libuv — xem track **05 Node.js Internals**.

  ### Promise lifecycle & error propagation

  ```mermaid
  flowchart LR
    P["pending"] -- "resolve(v)" --> F["fulfilled"]
    P -- "reject(e) / throw" --> R["rejected"]
    F -- ".then(onF)" --> N1["promise mới<br/>(giá trị return của onF)"]
    R -- ".then(onF) không có onR" --> N2["promise mới<br/>vẫn rejected (lỗi đi tiếp)"]
    R -- ".catch(onR)" --> N3["promise mới<br/>fulfilled nếu onR return bình thường"]
    N2 -- "không ai handle" --> U["unhandledrejection<br/>(Node ≥ 15: crash)"]
  ```

  - Mỗi `.then/.catch` trả về **promise mới**; lỗi "trôi" xuống tới handler gần nhất.
  - `return` trong `.then` quan trọng: quên `return` (hoặc quên `await`) = promise bị "floating", lỗi không tới caller.

  ### Scope chain & closure

  ```mermaid
  flowchart TD
    G["Global scope<br/>(config)"] --> M["Module scope<br/>(cache = new Map())"]
    M --> F["function handler(req)<br/>(userId)"]
    F --> C["callback () => cache.get(userId)"]
    C -. "tra cứu biến đi ngược lên" .-> F
    C -. "giữ reference → cache sống mãi" .-> M
  ```

  Closure giữ **cả environment**, không chỉ biến nó dùng (engine có tối ưu, nhưng đừng dựa vào) → callback sống lâu (timer, listener, cache) có thể giữ object lớn khỏi GC.

  ## Trade-offs

  | Lựa chọn | Ưu | Nhược | Dùng khi |
  |---|---|---|---|
  | `async/await` tuần tự | Dễ đọc, stack trace rõ | Chậm nếu các bước độc lập | Bước sau phụ thuộc bước trước |
  | `Promise.all` | Song song, fail-fast | Không giới hạn concurrency, không huỷ phần còn lại | Vài request độc lập bắt buộc |
  | Promise pool / `p-limit` | Song song có giới hạn | Thêm code/dependency | Hàng trăm+ task gọi DB/API |
  | Callback / EventEmitter | Nhiều sự kiện theo thời gian, không cần promise | Dễ leak listener, lỗi không propagate | Stream, socket, event bus |
  | Async iterator (`for await`) | Lazy, có backpressure tự nhiên | Tuần tự theo mặc định | Duyệt phân trang, stream lớn |
  | `class` | Rõ ràng, private `#field`, tooling tốt | `this` binding khi truyền method làm callback | Domain object có state |
  | Closure / factory | Private tự nhiên, không lo `this` | Mỗi instance một bản function (memory) | Module nhỏ, hook, middleware |
  | `number` | Nhanh, native | Mất chính xác với tiền/số lớn | Đếm, tính toán thông thường |
  | `BigInt` / decimal lib / minor units | Chính xác | Chậm hơn, không trộn với `number` | Tiền, id 64-bit |

  ## Pitfalls

  - `forEach(async ...)` không chờ gì cả; `array.map(async)` mà quên `Promise.all`.
  - Truyền `obj.method` làm callback → mất `this`; sửa bằng arrow field hoặc `.bind`.
  - `const` chỉ chặn **gán lại**, không làm object bất biến; `Object.freeze` chỉ freeze **một tầng**.
  - Spread `{...obj}` / `[...arr]` là **shallow copy** → mutate nested vẫn ảnh hưởng bản gốc (state React, Redux).
  - `sort`, `reverse`, `splice` **mutate** mảng gốc — dùng `toSorted`, `toReversed`, `toSpliced` (ES2023).
  - `JSON.parse` id 64-bit (`9007199254740993`) → mất chính xác; `JSON.stringify` BigInt → `TypeError`.
  - `new Date('2026-09-29')` là **UTC** nhưng `new Date('2026-09-29T00:00')` là **local time** → lệch ngày theo timezone.
  - Event listener / interval không cleanup → memory leak (SPA, Socket.IO client, long-running Node).
  - `||` thay cho `??` làm mất giá trị hợp lệ `0`, `''`, `false`.

  ## Cheat sheet

  - `Promise.all` fail-fast · `allSettled` không bao giờ reject · `race` = cái settle đầu tiên · `any` = cái fulfill đầu tiên (reject bằng `AggregateError` nếu tất cả fail).
  - `async` function **luôn** trả về Promise; `throw` trong nó = reject.
  - `==` coercion: `null == undefined` là `true`, nhưng `null == 0` là `false`.
  - `typeof null === "object"` (bug lịch sử) · `typeof function(){} === "function"`.
  - Arrow function: không có `this`, `arguments`, `prototype`; không dùng làm constructor.
  - `var` function-scoped + hoisted `undefined` · `let/const` block-scoped + TDZ · function declaration hoisted **cả body**.
  - `??` chỉ fallback khi `null/undefined` · `?.` short-circuit khi `null/undefined`.
  - `Number.MAX_SAFE_INTEGER = 2^53 - 1`; so sánh float dùng epsilon; tiền dùng minor units (cents) hoặc decimal library.
  - `structuredClone` cho deep copy; spread chỉ shallow.
  - `WeakMap` key phải là object (hoặc non-registered symbol); không iterate được, không có `size`.
  - Microtask chạy **hết** trước macrotask kế tiếp → vòng lặp microtask vô hạn làm treo cả timer và render.
  - `for...in` duyệt key enumerable (kể cả kế thừa) · `for...of` duyệt giá trị qua iterator.
