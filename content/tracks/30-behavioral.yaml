id: 30-behavioral
slug: behavioral
title: Behavioral Interview (STAR)
tier: 8
status: drafted
summary: "Story bank theo STAR cho senior full-stack: incident, conflict, ownership, failure, influence, trade-off dưới deadline, mentoring, feedback, why leaving — kèm red flags."
cvLinked: false
overview: |-
  ## TL;DR

  - Behavioral interview đánh giá **hành vi trong quá khứ** để dự đoán tương lai: ownership, judgment, giao tiếp, xử lý xung đột, học hỏi. Ở senior, interviewer đào **follow-up** tới khi thấy rõ phần *bạn* làm.
  - Dùng **STAR** (Situation → Task → Action → Result) + **Reflection**. Dành ~60% thời lượng cho **Action**, nói "**I**" cho phần của bạn, "we" cho team.
  - Chuẩn bị **story bank 8–10 câu chuyện** thật, mỗi câu phục vụ được 3–4 loại câu hỏi. Không học thuộc — nhớ khung và số liệu.
  - **Numbers** biến câu chuyện thành bằng chứng: latency, số user/tenant, thời gian, tần suất lỗi. Không bịa — nếu không có số chính xác, nói ước lượng và cách bạn biết.
  - Red flags lớn nhất: không có kết quả, đổ lỗi người khác, chỉ "we", câu chuyện không có xung đột/khó khăn thật, không rút ra bài học.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Situation | Bối cảnh tối thiểu để hiểu câu chuyện (≤ 20% thời lượng) | "Nền tảng e-commerce multi-tenant, checkout API bị timeout giờ cao điểm" |
  | Task | Trách nhiệm/mục tiêu **của bạn** | "Tôi được giao tìm root cause và fix trong 48 giờ" |
  | Action | Những gì **bạn** làm, theo bước, kèm lý do chọn | "Tôi đọc query plan, thấy scan toàn bảng, đề xuất composite index…" |
  | Result | Kết quả đo được + tác động kinh doanh | "p95 từ X xuống Y, không còn timeout (điền số thật)" |
  | Reflection | Bài học, sẽ làm khác gì | "Lẽ ra nên có alert cho slow query từ đầu" |
  | Story bank | Bộ câu chuyện dùng lại cho nhiều câu hỏi | Một incident dùng cho: pressure, ownership, debugging, learning |
  | Signal | Phẩm chất interviewer đang đo | Conflict question → đo sự đồng cảm + khả năng đạt kết quả |

  ## Cơ chế hoạt động — trả lời một câu behavioral

  ```mermaid
  flowchart TD
    Q["Câu hỏi: 'Tell me about a time…'"] --> P["Xác định signal cần chứng minh<br/>(ownership? conflict? judgment?)"]
    P --> B["Chọn story từ story bank"]
    B --> S["S + T: 20–30 giây"]
    S --> A["Action: 60–90 giây<br/>'I' + lý do + khó khăn"]
    A --> R["Result: số liệu + tác động"]
    R --> F["Reflection: bài học / làm khác"]
    F --> U{"Follow-up?"}
    U -- "why that way?" --> A
    U -- "what went wrong?" --> F
    U -- "numbers?" --> R
  ```

  ### Story bank matrix (chuẩn bị trước)

  | Story (của bạn) | Ownership | Conflict | Failure | Incident | Influence | Deadline | Learning | Mentoring |
  |---|---|---|---|---|---|---|---|---|
  | Feature end-to-end (vd. checkout) | ✓ | | | | | ✓ | | |
  | Production incident BE/DB/FE | ✓ | | | ✓ | | ✓ | ✓ | |
  | Zero-downtime migration | ✓ | | ✓ | | ✓ | | | |
  | Bất đồng với lead/PO | | ✓ | | | ✓ | | | |
  | Monolith → microservices | | | ✓ | | ✓ | | ✓ | |
  | Học nhanh công nghệ mới | | | | | | ✓ | ✓ | |
  | Hỗ trợ đồng nghiệp/junior | | | | | ✓ | | | ✓ |

  ## Trade-offs

  | Lựa chọn khi kể | Tốt khi | Rủi ro |
  |---|---|---|
  | Story gần đây (1–2 năm) | Chi tiết còn nhớ, phản ánh level hiện tại | Có thể bị hỏi sâu về kỹ thuật — phải nắm chắc |
  | Story lớn, nhiều người | Cho thấy scope | Khó tách phần "I" |
  | Story nhỏ, bạn làm chủ hoàn toàn | Rõ ownership | Có thể trông không đủ senior |
  | Thừa nhận thất bại thật | Tạo tin tưởng, cho thấy tự nhận thức | Chọn thất bại quá nghiêm trọng/không có bài học |
  | Nói ngắn (1.5–2 phút) + để follow-up | Tương tác tốt | Thiếu chi tiết nếu interviewer không hỏi thêm |

  ## Pitfalls

  - Chỉ nói "we" — interviewer không biết bạn làm gì.
  - Situation dài 2 phút, Action 20 giây.
  - Không có Result hoặc Result mơ hồ ("mọi thứ tốt hơn nhiều").
  - Đổ lỗi PO/QA/lead, nói xấu công ty cũ.
  - "Weakness" giả (perfectionist) hoặc failure không có trách nhiệm của mình.
  - Bịa số liệu — follow-up sẽ lộ.
  - Kể câu chuyện giả định ("I would…") khi được hỏi về quá khứ ("Tell me about a time…").
  - Không có câu hỏi cho interviewer.

  ## Cheat sheet

  - **Cấu trúc**: S/T 20% · A 60% · R 20% · + 1 câu reflection. Mục tiêu 2 phút.
  - **Ngôn ngữ**: "I decided / I proposed / I wrote / I asked…", động từ mạnh, cụ thể.
  - **Numbers to collect** (điền số thật của bạn): p95/p99 latency trước/sau · RPS · số tenant/user · kích thước bảng · thời gian migration · downtime (0?) · MTTR · số bug/incident trước/sau · bundle size · thời gian xử lý CSV · số người trong team · số timezone.
  - **Senior signals**: nói về trade-off, rủi ro, người khác bị ảnh hưởng, cách phòng ngừa lần sau, cách bạn nhân rộng bài học cho team.
  - **Honest gaps**: "Tôi chưa dùng X trong production; tôi đang học bằng Y; đây là cách tôi sẽ tiếp cận".
  - **Luôn có** 3–5 câu hỏi cho interviewer về team, kỹ thuật, kỳ vọng.
