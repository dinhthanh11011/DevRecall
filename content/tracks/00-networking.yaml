overview: |-
  ## TL;DR

  - Mỗi HTTP request đi qua chuỗi **DNS → TCP (hoặc QUIC) → TLS → HTTP**; latency thật nằm ở số **round-trip (RTT)**, không phải băng thông.
  - Senior interview hỏi networking qua **triệu chứng production**: 502 lẻ tẻ sau load balancer, `ECONNRESET`, DNS đổi mà client vẫn gọi IP cũ, CORS preflight làm chậm, WebSocket rớt khi scale.
  - Nắm 5 trục: **connection lifecycle & keep-alive**, **HTTP versions & head-of-line blocking**, **TLS handshake & certificate**, **DNS caching/TTL**, **proxy/LB/CDN** (header nào bị đổi, timeout nào đứng trước timeout nào).
  - CORS là cơ chế **browser nới lỏng Same-Origin Policy** để JS được **đọc** response cross-origin — nó **không** phải cơ chế chống CSRF.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | TCP | Stream tin cậy, có thứ tự, có congestion control; mở bằng 3-way handshake | `SYN → SYN-ACK → ACK` = 1 RTT trước khi gửi byte đầu tiên |
  | UDP | Datagram không kết nối, không đảm bảo thứ tự/đến nơi | DNS query, QUIC, video call |
  | DNS | Hệ thống phân giải tên → record (A, AAAA, CNAME, MX, TXT...) có TTL | `api.example.com A 203.0.113.10 TTL 60` |
  | TLS | Mã hoá + xác thực server (certificate) + toàn vẹn dữ liệu trên TCP | TLS 1.3 handshake = 1 RTT |
  | HTTP/1.1 | Text protocol, 1 request "đang bay" mỗi connection | Browser mở ~6 connection/origin để song song |
  | HTTP/2 | Binary framing, **multiplex** nhiều stream trên 1 TCP connection, HPACK | 100 request nhỏ chung 1 connection |
  | HTTP/3 | HTTP trên **QUIC (UDP)**; loại bỏ TCP head-of-line blocking, 0-RTT/1-RTT | Mạng di động đổi IP vẫn giữ connection (connection ID) |
  | Reverse proxy / LB | Đứng trước server, terminate TLS, phân phối tải, thêm `X-Forwarded-*` | Nginx, ALB, Envoy |
  | CDN | Cache ở edge gần user theo `Cache-Control`/`Vary` | `Cache-Control: public, s-maxage=300` |
  | CORS | Server khai báo origin nào được **đọc** response qua header `Access-Control-*` | Preflight `OPTIONS` cho `Content-Type: application/json` |
  | WebSocket | Kênh full-duplex nâng cấp từ HTTP (`101 Switching Protocols`) | Chat, realtime dashboard |
  | SSE | Stream một chiều server → client qua HTTP thường (`text/event-stream`) | Notification, progress bar |

  ## Cơ chế hoạt động

  ### Từ URL tới response

  ```mermaid
  flowchart TD
    A["User gõ https://shop.example.com/cart"] --> B{"DNS cache<br/>(browser/OS/resolver)?"}
    B -- hit --> D
    B -- miss --> C["Recursive resolver → root → TLD → authoritative"]
    C --> D["IP address (A/AAAA)"]
    D --> E{"Có connection<br/>keep-alive sẵn?"}
    E -- có --> H
    E -- không --> F["TCP 3-way handshake (1 RTT)<br/>hoặc QUIC"]
    F --> G["TLS 1.3 handshake (1 RTT)<br/>verify certificate + SNI + ALPN"]
    G --> H["HTTP request → CDN / LB / reverse proxy"]
    H --> I{"CDN cache hit?"}
    I -- hit --> K["Response từ edge"]
    I -- miss --> J["Origin: LB → app server → DB"]
    J --> K
  ```

  ### TLS 1.3 handshake (rút gọn)

  ```mermaid
  sequenceDiagram
    participant C as Client
    participant S as Server
    C->>S: ClientHello (versions, cipher suites, key_share, SNI, ALPN)
    S->>C: ServerHello (key_share) + {EncryptedExtensions, Certificate, CertificateVerify, Finished}
    Note over C: Verify cert chain + hostname,<br/>check CertificateVerify signature
    C->>S: {Finished} + HTTP request đầu tiên
    S->>C: {HTTP response}
  ```

  - Key exchange dùng **(EC)DHE** → forward secrecy; public key trong certificate dùng để **ký** (CertificateVerify), không phải để "mã hoá dữ liệu". RSA key exchange đã bị loại khỏi TLS 1.3.
  - Dữ liệu thật được mã hoá bằng **symmetric key** (AES-GCM / ChaCha20-Poly1305) suy ra từ shared secret.

  ### Timeout chain qua proxy

  ```mermaid
  flowchart LR
    Client -- "idle 60s?" --> LB["Load balancer<br/>idle timeout"]
    LB -- "keep-alive pool" --> App["Node server<br/>keepAliveTimeout"]
    App --> DB[(DB)]
  ```

  Quy tắc vàng: **upstream (app) phải giữ connection idle lâu hơn downstream (LB)**; nếu app đóng trước, LB có thể gửi request vào socket vừa bị đóng → 502 lẻ tẻ.

  ## Trade-offs

  | Lựa chọn | Ưu | Nhược | Khi nào dùng |
  |---|---|---|---|
  | HTTP/1.1 | Đơn giản, debug dễ, mọi proxy hỗ trợ | HOL blocking theo connection, nhiều connection | Service nội bộ đơn giản |
  | HTTP/2 | Multiplex, header compression, 1 connection | TCP HOL khi mất gói; một connection = một điểm nghẽn/LB kém đều | Browser ↔ edge, gRPC |
  | HTTP/3 (QUIC) | Không TCP HOL, handshake nhanh, connection migration | UDP có thể bị firewall chặn, CPU cao hơn, tooling kém hơn | Mobile, mạng loss cao, edge/CDN |
  | L4 LB | Nhanh, không hiểu HTTP, pass-through TLS | Không route theo path/header | TCP/gRPC throughput cao |
  | L7 LB | Route theo host/path, retry, header, TLS termination | Tốn CPU, thêm hop, phải cấu hình timeout | API gateway, web app |
  | Polling | Dễ, cache được, stateless | Trễ + lãng phí request | Cập nhật hiếm |
  | SSE | HTTP thường, auto-reconnect, qua proxy dễ | Một chiều, text only | Notification, stream log |
  | WebSocket | Hai chiều, latency thấp | Stateful, sticky/pub-sub khi scale, proxy phải hỗ trợ Upgrade | Chat, collaboration, game |

  ## Pitfalls

  - Nghĩ CORS chặn request: browser **vẫn gửi** simple request (kể cả cookie nếu `SameSite` cho phép); CORS chỉ quyết định JS có **đọc** được response không.
  - `Access-Control-Allow-Origin: *` cùng `credentials: 'include'` → browser từ chối. Echo origin động thì **phải** whitelist và thêm `Vary: Origin`.
  - Node `keepAliveTimeout` (mặc định 5s) nhỏ hơn idle timeout của LB (ALB mặc định 60s) → 502 ngẫu nhiên.
  - Hạ TTL DNS **ngay lúc** migrate là muộn — phải hạ trước ít nhất một chu kỳ TTL cũ.
  - Tin `X-Forwarded-For` từ client mà không cấu hình `trust proxy` đúng số hop → IP spoofing, rate limit sai.
  - Retry tự động request **không idempotent** (POST) khi timeout → tạo đơn trùng.
  - HTTP/2 Server Push đã bị các browser lớn bỏ — đừng thiết kế dựa vào nó; dùng `103 Early Hints` / preload.

  ## Cheat sheet

  - RTT cold HTTPS (TCP + TLS 1.3): ~2 RTT trước byte response đầu; TLS 1.2 full handshake: ~3 RTT; HTTP/3: ~1 RTT (0-RTT khi resume, có rủi ro replay).
  - `502` = proxy nhận response lỗi/connection bị đóng từ upstream · `504` = upstream không trả lời kịp · `499` (nginx) = client tự đóng.
  - Idempotent: `GET, HEAD, PUT, DELETE, OPTIONS`; không idempotent: `POST`, `PATCH` (thường).
  - Simple CORS request: method `GET/HEAD/POST` + chỉ CORS-safelisted headers + `Content-Type` ∈ `text/plain`, `multipart/form-data`, `application/x-www-form-urlencoded`.
  - `TIME_WAIT` nằm ở phía **chủ động đóng** connection; nhiều connection ngắn → cạn ephemeral port.
  - DNS: CNAME không đặt được ở zone apex → dùng ALIAS/ANAME/CNAME flattening của provider.
  - WebSocket: `Upgrade: websocket` + `101`; proxy phải forward `Upgrade`/`Connection` headers và có idle timeout đủ dài / ping.
