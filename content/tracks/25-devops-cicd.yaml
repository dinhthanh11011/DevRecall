overview: |-
  ## TL;DR

  - Interviewer muốn biết bạn **ship code an toàn và lặp lại được**: image nhỏ và an toàn, pipeline nhanh và đáng tin, deploy có đường lui, hạ tầng mô tả bằng code.
  - Với Node, 80% câu hỏi Docker xoay quanh: **multi-stage build**, **layer caching** (`package*.json` trước, `npm ci`), **non-root user**, **PID 1 & SIGTERM** (graceful shutdown), `.dockerignore`.
  - Kubernetes basics cần nói chắc: Pod/Deployment/Service/Ingress, **readiness vs liveness vs startup probe**, **requests/limits** và `OOMKilled`, HPA, ConfigMap/Secret.
  - Deploy strategy là trade-off giữa **tốc độ rollback, chi phí, và blast radius**; DB migration là thứ quyết định bạn có rollback được hay không (**expand/contract**).
  - IaC: Terraform **state** là trái tim (remote backend + locking + drift detection); GitOps = Git là source of truth, cluster tự **pull** trạng thái mong muốn.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Multi-stage build | Build ở stage có devDependencies, copy **chỉ artifact** sang stage runtime | Image từ ~1 GB xuống ~150 MB |
  | Layer caching | Mỗi instruction là một layer; layer đổi → mọi layer sau build lại | `COPY package*.json` + `npm ci` trước `COPY . .` |
  | PID 1 | Process đầu tiên trong container nhận signal, và kernel **không** áp default handler cho nó | `CMD npm start` → SIGTERM không tới `node` → bị SIGKILL sau grace period |
  | Readiness probe | "Có nhận traffic được không?" — fail thì bị rút khỏi Service endpoints | Đang warm cache → chưa ready |
  | Liveness probe | "Có cần restart không?" — fail thì kubelet restart container | Event loop treo hẳn |
  | requests / limits | requests dùng để **schedule**; limits là **trần** (memory vượt → OOMKilled, CPU vượt → throttle) | `memory: 512Mi` limit, Node heap vượt → exit 137 |
  | Rolling update | Thay dần pod cũ bằng pod mới | `maxSurge: 25%`, `maxUnavailable: 0` |
  | Blue/green | Hai môi trường đầy đủ, đổi traffic một lần | Rollback = chuyển router về blue |
  | Canary | Đẩy % traffic nhỏ sang bản mới, đo, rồi tăng dần | 5% → 25% → 100% nếu error rate ổn |
  | Feature flag | Tách **deploy** (code lên prod) khỏi **release** (bật cho user) | Bật checkout mới cho 10% tenant |
  | Terraform state | File ánh xạ resource trong code ↔ resource thật | Mất state = Terraform muốn tạo lại mọi thứ |
  | GitOps | Agent trong cluster (Argo CD/Flux) reconcile theo Git | Merge PR = deploy; revert commit = rollback |

  ## Cơ chế hoạt động

  **Pipeline chuẩn cho một Node/Next.js service:**

  ```mermaid
  flowchart LR
    PR["Pull request"] --> CI["CI: install (cache) → lint → typecheck → unit → integration (testcontainers)"]
    CI --> B["Build image once<br/>tag = git SHA"]
    B --> SCAN["Scan (CVE, secrets) + SBOM + sign"]
    SCAN --> REG[("Registry")]
    REG --> STG["Deploy staging<br/>+ migrate (expand)"]
    STG --> E2E["Smoke / e2e"]
    E2E --> GATE{"Approval / auto gate"}
    GATE --> CAN["Prod canary 5%"]
    CAN --> M{"SLO ok?<br/>(error rate, p95)"}
    M -- "yes" --> FULL["100%"]
    M -- "no" --> RB["Auto rollback"]
    FULL --> CON["Later release: contract migration"]
  ```

  **Graceful shutdown của một pod:**

  ```mermaid
  sequenceDiagram
    participant K as kubelet
    participant EP as Endpoints / LB
    participant C as Node container
    K->>EP: pod Terminating → rút khỏi endpoints (bất đồng bộ)
    K->>C: preStop hook (vd. sleep 5–10s)
    K->>C: SIGTERM
    C->>C: server.close() — ngừng nhận mới, xử lý nốt request, đóng DB pool
    C-->>K: exit 0
    Note over K,C: quá terminationGracePeriodSeconds (mặc định 30s) → SIGKILL
  ```

  ## Trade-offs

  | Strategy | Rollback | Chi phí hạ tầng | Blast radius | Yêu cầu |
  |---|---|---|---|---|
  | Recreate | Chậm (deploy lại) | Thấp | 100% + downtime | Chấp nhận downtime |
  | Rolling | Vừa (rollout undo) | Thấp (+surge) | Tăng dần, khó dừng giữa chừng có kiểm soát | Code cũ & mới chạy song song, schema tương thích |
  | Blue/green | Tức thì (đổi router) | x2 trong lúc deploy | 100% khi switch | Stateless hoặc DB tương thích cả hai |
  | Canary | Nhanh (dồn traffic về bản cũ) | Thấp | Nhỏ, có kiểm soát | Metric tốt theo version, tự động phân tích |
  | Feature flag | Tức thì (tắt flag) | Không | Theo segment | Kỷ luật dọn flag, test cả hai nhánh |

  | IaC | Mạnh | Yếu |
  |---|---|---|
  | Terraform/OpenTofu | Multi-cloud + SaaS provider, plan rõ ràng, ecosystem lớn | Tự quản state, HCL hạn chế logic |
  | AWS CDK | TypeScript thật, construct tái sử dụng, sinh CloudFormation | Chỉ AWS (chủ yếu), CloudFormation chậm/giới hạn |
  | CloudFormation | Native, state do AWS quản, rollback stack | YAML dài, ít trừu tượng |
  | Pulumi | Ngôn ngữ thật, multi-cloud | Ecosystem nhỏ hơn Terraform |

  ## Pitfalls

  - `FROM node:latest` → build không tái lập; dùng tag cụ thể (hoặc digest) và cập nhật có chủ đích.
  - `COPY . .` trước `npm install` → mỗi lần sửa code đều cài lại dependency; thiếu `.dockerignore` → copy cả `node_modules`, `.env`, `.git` vào image.
  - Chạy container bằng **root**; secret trong `ENV`/`ARG` (lộ qua `docker history`) — dùng BuildKit secret mount.
  - `CMD npm start` / shell form → signal không tới Node; không xử lý SIGTERM → cắt ngang request mỗi lần deploy.
  - Liveness probe gọi DB → DB chậm làm restart **toàn bộ** pod (cascading failure).
  - Không đặt memory limit hoặc đặt heap Node lớn hơn limit → OOMKilled.
  - Build image riêng cho từng môi trường thay vì **build once, promote** cùng một digest.
  - Migration phá vỡ tương thích (rename/drop cột) chạy cùng release code mới → không rollback được.
  - Terraform state local / trong git; không có locking → hai người `apply` cùng lúc hỏng state.
  - Feature flag không bao giờ được dọn → nợ kỹ thuật, tổ hợp nhánh không ai test.

  ## Cheat sheet

  - Dockerfile Node: multi-stage · `npm ci` · `--omit=dev` · `USER node` · `CMD ["node","server.js"]` (exec form) · `--init`/tini nếu cần reap zombie · `.dockerignore`.
  - Next.js: `output: "standalone"` để image runtime chỉ chứa server tối thiểu.
  - Probes: startup (khởi động chậm) → readiness (dependency cần thiết cho traffic) → liveness (chỉ process tự thân, rẻ).
  - Exit code 137 = SIGKILL (thường OOMKilled); 143 = SIGTERM.
  - HPA scale theo % **requests** → không có requests thì HPA CPU không hoạt động đúng.
  - K8s Secret chỉ là base64 → bật encryption at rest, hoặc External Secrets / CSI driver.
  - Pipeline: fail fast (lint/typecheck trước), cache dependency, song song hoá, artifact bất biến theo SHA.
  - Rollback code phải luôn khả thi → migration expand trước, contract sau.
  - Terraform: remote state + lock, `plan` trong PR, `apply` từ CI, drift detection định kỳ, module có version.
  - 12-factor: config trong env, stateless process, logs ra stdout, dev/prod parity, disposability (start nhanh, shutdown êm).
