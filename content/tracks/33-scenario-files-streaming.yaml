      (3) Kiến trúc: tách **market data (lossy, last-value)** khỏi **account events (lossless, seq + replay)**; fan-out theo topic (sharded pub/sub/NATS), gateway stateless với snapshot service; autoscale theo connections + outbound msg/s; drop client chậm.
