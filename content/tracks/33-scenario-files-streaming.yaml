  - id: scenario-files-043
    level: hard
    type: design
    q: "Video uploads trigger transcoding jobs that take 2-30 minutes. You see the same video transcoded three times and a job that loops forever. Design the job processing properly."
    hint: |-
      (1) Nguyên nhân: SQS **visibility timeout** (vd 5 phút) < thời gian transcode → message hiện lại, worker khác lấy → chạy trùng; job luôn crash (file lỗi) → retry vô hạn nếu không có `maxReceiveCount` → DLQ.
      (2) Fix: gia hạn visibility định kỳ (`ChangeMessageVisibility` heartbeat) hoặc dùng orchestrator (Step Functions, MediaConvert job + EventBridge); **redrive policy** maxReceiveCount 3–5 → DLQ + alarm.
      (3) **Idempotent**: job key = `uploadId + preset + version`; output key xác định (`hls/<uploadId>/v2/720p/...`); claim job bằng `UPDATE jobs SET status='running', lease_until=now()+interval '10 min' WHERE id=$1 AND (status='queued' OR lease_until < now())`; ghi `ready` chỉ khi mọi rendition xong.
      (4) Cost/ops: spot instances cho worker, ưu tiên queue (premium vs free), giới hạn độ dài/độ phân giải input, ffprobe validate trước khi transcode.
    followUp: "How do you reprocess 2 million existing videos with a new preset without starving new uploads?"
    redFlags:
      - "Set visibility timeout to 12 hours and move on"
    verify: true
