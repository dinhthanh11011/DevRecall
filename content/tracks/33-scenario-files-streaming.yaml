      (3) Headers đúng: `Content-Type: text/event-stream`, `Cache-Control: no-cache`, `Connection: keep-alive` (HTTP/1.1), gửi `res.flushHeaders()` sớm, heartbeat comment khi model "suy nghĩ" lâu để LB không cắt.
      (4) Timeout: idle/total timeout mỗi tầng phải > thời gian sinh dài nhất; retry khi rớt giữa chừng = sinh lại (tốn tiền) → cân nhắc lưu partial output + resume.
