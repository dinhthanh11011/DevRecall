id: 33-scenario-files-streaming
slug: scenario-files
title: "Scenarios: File Upload, Download & Streaming"
tier: 9
status: drafted
summary: Mock interview production scenarios — upload 100MB đồng thời, presigned URL/POST, multipart & resumable, streaming qua backend với backpressure, validate file, download/Range/zip, SSE/NDJSON/LLM streaming, Socket.IO realtime ở scale, media pipeline và chi phí S3.
cvLinked: true
prerequisites: [05-nodejs, 24-aws]
overview: |-
  ## TL;DR

  - Quy tắc số 1: **bytes không đi qua API server nếu không bắt buộc**. Client upload/download thẳng với object storage (S3) bằng **presigned URL/POST** hoặc **CloudFront signed URL/cookie**; API chỉ ký, kiểm quyền, lưu metadata.
  - Khi bytes **bắt buộc** đi qua backend: **stream end-to-end** (busboy → `@aws-sdk/lib-storage` `Upload`), giới hạn size **trong lúc stream**, abort khi client ngắt, và hiểu memory thật = `partSize × queueSize × số upload đồng thời`, không phải "64KB".
  - Upload không "xong" khi client nói xong: dùng **state machine** trong DB (`pending → uploaded → scanned → ready | rejected`), xác nhận bằng `HeadObject`/S3 event, xử lý nặng (scan, thumbnail, transcode) qua **queue + worker idempotent**.
  - Validate như kẻ tấn công: không tin `Content-Type`/extension, sniff magic bytes, re-encode ảnh, giới hạn giải nén, key do server sinh, serve từ **domain riêng** + `Content-Disposition` + `nosniff`.
  - Streaming response (NDJSON, SSE, LLM tokens, Socket.IO) chết vì **buffering ở giữa** (proxy, compression), **slow consumer** và **reconnect không resync**. Luôn có heartbeat, sequence number, và chiến lược drop/coalesce.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Presigned PUT | URL ký SigV4 cho phép PUT đúng 1 key, trong TTL | `getSignedUrl(s3, new PutObjectCommand({Bucket, Key}), { expiresIn: 300 })` |
  | Presigned POST | Form POST + **policy** có điều kiện (size, content-type prefix, key prefix) | `["content-length-range", 1, 104857600]` |
  | Multipart upload | Chia object thành part (≥5 MiB trừ part cuối, tối đa 10,000 part), upload song song, `Complete` bằng danh sách ETag | 100 MB → 10 part × 10 MB |
  | Resumable upload | Lưu `uploadId` + part đã xong, `ListParts` để tiếp tục | Browser đóng tab, mở lại upload tiếp part 7 |
  | Backpressure | Consumer chậm báo producer dừng (`write()` trả `false` → chờ `'drain'`) | S3 chậm → busboy ngừng đọc socket → TCP window co lại |
  | `highWaterMark` | Ngưỡng buffer nội bộ của stream trước khi báo "đầy" | `fs.createReadStream` mặc định 64 KiB |
  | `pipeline()` | Nối stream + propagate error + destroy tất cả khi lỗi/abort | `await pipeline(s3Body, gzip, res)` |
  | Range request | Client xin một đoạn byte → server trả `206 Partial Content` | `Range: bytes=0-1048575` |
  | NDJSON | Mỗi dòng một JSON object, parse được từng dòng | `{"id":1}\n{"id":2}\n` |
  | SSE | `text/event-stream` một chiều server→client, tự reconnect với `Last-Event-ID` | `id: 42\ndata: {...}\n\n` |
  | Conflation / coalesce | Gộp nhiều update của cùng key, chỉ gửi bản mới nhất cho client chậm | Giá AAPL đổi 50 lần/s, gửi 4 lần/s |
  | Magic bytes | Chữ ký đầu file xác định format thật | PNG bắt đầu `89 50 4E 47` |

  ## Cơ chế hoạt động

  ### Direct-to-S3 upload với confirm + async processing

  ```mermaid
  sequenceDiagram
    participant C as Browser
    participant A as API
    participant D as DB
    participant S as S3 (quarantine bucket)
    participant Q as SQS
    participant W as Worker
    C->>A: POST /uploads {name, size, type}
    A->>A: auth, quota, validate size/type khai báo
    A->>D: INSERT upload(status='pending', key=uuid)
    A-->>C: presigned POST (content-length-range, Content-Type, key)
    C->>S: POST file (thẳng, không qua API)
    S-->>Q: ObjectCreated event (at-least-once)
    C->>A: POST /uploads/:id/complete
    A->>S: HeadObject (size, ETag, ContentType)
    A->>D: UPDATE status='uploaded' WHERE status='pending'
    Q->>W: message
    W->>S: GetObject (stream) → magic bytes, AV scan, re-encode
    W->>D: UPDATE status='ready' hoặc 'rejected' (idempotent)
    Note over S: Lifecycle: xoá object pending > 24h, AbortIncompleteMultipartUpload 1-7 ngày
  ```

  ### Upload bắt buộc qua backend — streaming với backpressure

  ```mermaid
  flowchart LR
    N["nginx / ALB<br/>client_max_body_size<br/>proxy_request_buffering off"] --> B["busboy<br/>limits.fileSize, files=1"]
    B -->|"file stream"| V["Transform: sniff magic bytes<br/>+ hash + đếm bytes"]
    V --> U["lib-storage Upload<br/>partSize × queueSize buffer"]
    U --> S3[("S3 multipart")]
    U -. "S3 chậm → buffer đầy" .-> V
    V -. "pause" .-> B
    B -. "ngừng đọc socket<br/>TCP backpressure" .-> N
    X["req 'close' / 'limit'"] -->|"upload.abort()"| U
  ```

  ### Realtime stream (Socket.IO) với resync

  ```mermaid
  sequenceDiagram
    participant P as Price feed
    participant K as Kafka/Redis Streams
    participant G as WS Gateway (N node)
    participant C as Client
    P->>K: tick(symbol, seq)
    K->>G: fan-out tới node có subscriber
    G->>G: conflate theo symbol nếu client chậm
    G-->>C: {symbol, price, seq: 1001}
    Note over C: mất mạng 10s
    C->>G: reconnect + lastSeq=1001
    alt gap nhỏ, còn trong buffer
      G-->>C: replay 1002..1050
    else gap lớn
      G-->>C: snapshot (seq=2000) rồi delta tiếp
    end
  ```

  ## Khung trả lời

  Dùng cho mọi câu "file lớn / streaming trong production":

  1. **Hỏi lại con số**: kích thước file (p50/p99/max), số upload/download đồng thời, client (browser/mobile/server), SLA, data nhạy cảm không, có yêu cầu compliance bắt bytes đi qua mình không.
  2. **Tính memory/bandwidth trên giấy**: `concurrent × buffered bytes`. 100 × 100 MB buffered = 10 GB; 100 × (5 MB × 4) lib-storage = 2 GB; 100 × 64 KB stream thuần = 6.4 MB.
  3. **Đưa bytes ra khỏi API**: presigned POST/PUT, multipart presigned từng part, CloudFront cho download.
  4. **Nếu phải qua backend**: stream end-to-end, size limit lúc stream, abort + cleanup, giới hạn ở proxy/LB, admission control (số upload đồng thời/pod → 429/503).
  5. **Trạng thái & bất đồng bộ**: state machine DB, event → queue → worker idempotent, không serve trước khi scan xong.
  6. **Bảo mật**: magic bytes, re-encode, zip/decompression limits, key server-generated, domain riêng, `nosniff`, `Content-Disposition`.
  7. **Vận hành & chi phí**: lifecycle rules, incomplete multipart, request cost, egress, metrics (bytes in-flight, upload fail rate, p99 duration), alert.

  ## Trade-offs

  | Cách upload | Memory API | Enforce size | Validate trước khi lưu | Resumable | Phức tạp | Hợp khi |
  |---|---|---|---|---|---|---|
  | Multer `memoryStorage` | Toàn bộ file × N | `limits.fileSize` | Có | Không | Thấp | File nhỏ (avatar < 5 MB), traffic thấp |
  | Multer `diskStorage` | Thấp, nhưng tốn disk tạm | Có | Có (đọc lại từ disk) | Không | Thấp | Cần CLI xử lý file local |
  | busboy → lib-storage | `partSize × queueSize` mỗi upload | Có, lúc stream | Có (inline) | Không (trừ tự làm) | Trung bình | Compliance bắt đi qua backend |
  | Presigned PUT | ~0 | **Không** (chỉ ký header) | Sau khi upload | Không | Thấp | File vừa, client tin cậy tương đối |
  | Presigned POST | ~0 | **Có** (`content-length-range`) | Sau khi upload | Không | Thấp | Browser form upload, cần chặn size |
  | Multipart presigned từng part | ~0 | Qua số part × part size + check khi Complete | Sau khi upload | **Có** | Cao | File > 100 MB, mạng yếu |
  | tus protocol (tusd/Uppy) | Tuỳ server | Có (`Upload-Length`, max-size) | Có hook | **Có**, chuẩn hoá | Trung bình | Cần resumable đa nền tảng, không lock vào S3 API |

  | Streaming response | Hướng | Reconnect | Qua proxy | Hợp khi |
  |---|---|---|---|---|
  | Chunked + NDJSON | Server → client, 1 request | Tự làm (cursor) | Dễ bị buffer | Export lớn, batch API |
  | SSE | Server → client | Built-in `Last-Event-ID` | Cần tắt buffering, HTTP/1.1 giới hạn ~6 connection/host | LLM tokens, notification, dashboard |
  | WebSocket / Socket.IO | Hai chiều | Tự làm (Socket.IO có connection state recovery) | Cần Upgrade, sticky session | Trading, chat, collaborative |

  ## Pitfalls

  - Tin rằng "dùng Multer là stream": `memoryStorage` giữ nguyên file trong `file.buffer`; `diskStorage` ghi ra disk. `file.stream` không có trong engine built-in.
  - Presigned PUT **không giới hạn size được** — cần presigned POST hoặc kiểm tra sau upload + xoá.
  - `PQueue({ concurrency: 5 })` trong handler chỉ giới hạn việc xử lý; 500 request vẫn đang mở socket và nhận bytes. Admission control phải ở LB/proxy hoặc trước khi đọc body.
  - Dùng `.pipe()` cho download S3 → client abort thì S3 socket không bị destroy → leak connection trong pool của SDK (mặc định `maxSockets` 50 — verify).
  - Không có `AbortIncompleteMultipartUpload` → part rác tính tiền storage vô thời hạn và **không hiện** trong `ListObjects`.
  - Serve file user upload từ cùng domain app với `Content-Type` do client gửi → SVG/HTML chạy script = stored XSS.
  - Zip-on-the-fly: status 200 đã gửi, lỗi giữa chừng → file zip hỏng mà client không biết.
  - SSE/NDJSON bị `compression()` hoặc nginx `proxy_buffering on` gom lại → client nhận một cục ở cuối.
  - Socket.IO server `emit` cho client chậm → buffer của socket phình vô hạn → OOM ở giờ mở cửa thị trường.

  ## Cheat sheet

  - S3: single PUT ≤ 5 GiB; multipart part 5 MiB–5 GiB, ≤ 10,000 part; object tối đa 5 TiB (AWS có thông báo nâng lên 50 TB cuối 2025 — verify). Presigned URL tối đa 7 ngày (SigV4), nhưng hết hạn sớm hơn nếu ký bằng temporary credentials.
  - Part size cho file lớn: `ceil(size / 10000)` làm tròn lên ≥ 5 MiB; 100 GB → ≥ ~10.5 MB/part.
  - `@aws-sdk/lib-storage` `Upload`: mặc định `partSize` 5 MiB, `queueSize` 4 → ~20 MB buffer mỗi upload (verify). Có `upload.abort()` và event `httpUploadProgress`.
  - Proxy/LB: nginx `client_max_body_size` mặc định 1m, `proxy_request_buffering on` mặc định; ALB idle timeout mặc định 60s; API Gateway payload 10 MB; Lambda sync invoke 6 MB request/response (verify).
  - Node streams: `highWaterMark` mặc định 64 KiB cho byte stream từ Node 22 (trước đó 16 KiB), 16 object cho object mode; `fs.createReadStream` 64 KiB (verify). Luôn `await pipeline(...)` từ `node:stream/promises`.
  - Validate: `file-type` đọc magic bytes; `sharp` re-encode + `limitInputPixels`; unzip giới hạn tổng bytes, số entry, ratio, và chặn `../`.
  - Download: presigned GET TTL ngắn + `ResponseContentDisposition`; CloudFront signed **cookies** cho HLS (nhiều segment), signed **URL** cho 1 file.
  - Realtime: sticky session (khi có polling), Redis/Streams adapter, heartbeat, `seq` mỗi message, snapshot + delta khi gap lớn, conflate cho client chậm.
