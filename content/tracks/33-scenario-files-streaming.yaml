  - id: scenario-files-042
    level: hard
    type: scenario
    q: "Your LLM chat endpoint streams tokens via SSE. In production users see the whole answer appear at once after 20 seconds, and your model bill is higher than the number of completed answers suggests. Investigate."
    hint: |-
      (1) Buffering: nginx `proxy_buffering on` (fix: `X-Accel-Buffering: no` hoặc `proxy_buffering off` cho route), `compression()` middleware gom chunk (loại trừ `text/event-stream` hoặc gọi `res.flush()`), CDN/API Gateway buffer response (REST API Gateway không stream — dùng Lambda response streaming/Function URL hoặc ALB — verify).
