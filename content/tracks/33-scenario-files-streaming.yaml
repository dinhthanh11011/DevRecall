    q: "You inherit a real-time market data service on Socket.IO: 100k clients, 2,000 symbols, p99 latency 3 s at market open, and the cloud bill doubled. You have one quarter. What is your plan?"
    hint: |-
      (1) Đo trước: latency theo từng chặng (feed → broker → gateway → client, cần timestamp trong message), outbound msg/s, bytes/client, buffered bytes, Redis adapter traffic, connection churn, cost breakdown (compute vs egress vs Redis).
