  - id: scenario-files-044
    level: hard
    type: compare
    q: "Your course platform serves 1080p MP4 files directly with Range requests. Users on slow networks buffer constantly. Why move to HLS/DASH, and what changes in storage and delivery?"
    hint: |-
      (1) MP4 progressive: 1 bitrate cố định (vd 5 Mbps) → mạng 2 Mbps thì buffer mãi; seek cần `moov` atom ở đầu (faststart). **ABR (HLS/DASH)**: transcode ra nhiều rendition (240p–1080p), cắt segment 2–6 s, manifest (`.m3u8`/`.mpd`); player chọn bitrate theo bandwidth đo được, đổi giữa chừng.
      (2) Storage: nhiều rendition ≈ 1.5–2× dung lượng gốc; nhiều object nhỏ → nhiều GET request (rẻ nhưng đếm được); CMAF (fMP4) dùng chung cho HLS + DASH.
      (3) Delivery: CloudFront cache segment rất tốt (immutable, TTL dài), manifest TTL ngắn nếu live; bảo vệ bằng **signed cookies** (không ký từng segment), DRM nếu cần chống tải.
      (4) Pipeline: MediaConvert/ffmpeg worker, thumbnails sprite, trạng thái `transcoding → ready`.
    followUp: "How would you estimate monthly CloudFront egress cost for 10k students watching 2 hours of video per week?"
    verify: true
    tags: [hls, video, cdn]
  - id: scenario-files-045
    level: hard
    type: scenario
    q: "A customer says a 3 GB file downloaded from your platform is corrupt, though the upload succeeded. After upgrading the AWS SDK v3, uploads to your S3-compatible storage in another region also started failing. How do integrity checks fit in?"
    hint: |-
      (1) Integrity end-to-end: client tính checksum từng part (`Content-MD5` hoặc `x-amz-checksum-crc32/crc32c/sha256/crc64nvme`) → S3 verify và reject part hỏng; lưu **full-object checksum** (CRC64NVME hỗ trợ full-object cho multipart — verify) hoặc SHA-256 riêng trong DB để client verify khi download.
      (2) ETag multipart = MD5 của các MD5 part + `-N`, **không** phải MD5 file → đừng so với md5sum.
      (3) SDK v3 (từ đầu 2025) **mặc định thêm CRC32 checksum** cho upload (`requestChecksumCalculation: "WHEN_SUPPORTED"` — verify) → nhiều S3-compatible (MinIO bản cũ, một số provider) và presigned flow cũ báo lỗi; set `requestChecksumCalculation/responseChecksumValidation: "WHEN_REQUIRED"` cho các endpoint đó.
      (4) Corrupt khi download: thường do proxy cắt giữa chừng (không có `Content-Length` → client không biết), resume ghép sai phiên bản (thiếu `If-Range`) → kiểm log bytes sent vs size.
    followUp: "How would you let a customer verify a download themselves?"
    verify: true
    tags: [checksum, integrity, sdk-v3]
  - id: scenario-files-046
    level: hard
    type: debug
    q: "This hand-written Range handler serves videos from disk. Safari refuses to play them and some requests crash the process. Find the bugs."
    example: |-
      ```ts
      app.get("/media/:id", async (req, res) => {
        const file = pathFor(req.params.id);
        const { size } = await fs.promises.stat(file);
        const [s, e] = (req.headers.range ?? "bytes=0-").replace("bytes=", "").split("-");
        const start = Number(s);
        const end = e ? Number(e) : size;
        res.writeHead(206, {
          "Content-Range": `bytes ${start}-${end}/${size}`,
          "Content-Length": end - start,
          "Content-Type": "video/mp4",
        });
        fs.createReadStream(file, { start, end }).pipe(res);
      });
      ```
    hint: |-
      (1) **Off-by-one**: range là **inclusive**; `end` mặc định phải là `size - 1`, `Content-Length = end - start + 1`. `createReadStream` `end` cũng inclusive. Sai → Safari (rất khắt khe, gửi `bytes=0-1` trước) từ chối.
      (2) Không có `Range` thì phải trả **200** full + `Accept-Ranges: bytes`, không phải 206. Range không hợp lệ/ngoài size (`start >= size`, `bytes=-500` suffix, multi-range `0-1,5-9`) → `416` + `Content-Range: bytes */size`; `Number("abc")` = NaN → createReadStream throw.
      (3) `.pipe` không xử lý lỗi (ENOENT → crash/unhandled 'error'), không destroy khi client abort → fd leak; dùng `await pipeline(...)` + try/catch.
      (4) Thêm `ETag`/`Last-Modified`, hỗ trợ `If-Range`; và hỏi: sao không để S3/CloudFront hay `res.sendFile` (có sẵn Range) làm việc này?
    followUp: "What does the suffix range `bytes=-500` mean, and how should the server answer?"
    tags: [range, http, debug]
