    tags: [capacity, upload, burst]
  - id: scenario-files-030
    level: hard
    type: debug
    q: "A 'Download all as ZIP' endpoint streams thousands of S3 objects with archiver. Users report corrupted ZIPs, and memory climbs on large folders. Review it."
    example: |-
      ```ts
      app.get("/folders/:id/zip", async (req, res) => {
        const keys = await listKeys(req.params.id); // 8,000 keys
        const archive = archiver("zip");
        archive.pipe(res);
        for (const key of keys) {
          const obj = await s3.send(new GetObjectCommand({ Bucket, Key: key }));
          archive.append(obj.Body as Readable, { name: key });
        }
        archive.finalize();
      });
      ```
    hint: |-
      (1) Vòng `for` mở **8,000 GetObject gần như cùng lúc** (append chỉ xếp hàng, archiver đọc tuần tự) → 8,000 socket/stream mở, pool SDK cạn, S3 timeout body chưa đọc → entry hỏng; memory giữ buffer của từng body.
      (2) Không lắng nghe `archive.on("error")`/`"warning"`; lỗi giữa chừng sau khi đã gửi `200` → client nhận zip **cụt** mà không biết (không có `Content-Length`). Phải `res.destroy(err)` để browser báo lỗi mạng thay vì lưu file hỏng.
      (3) Fix: mở object **lười** — chỉ `GetObject` khi entry trước xong (append theo event `entry`, hoặc stream factory), giới hạn song song 1–4; `archiver("zip", { zlib: { level: 0 } })` cho file đã nén (jpg, mp4) để tiết kiệm CPU; `req.on("close")` → `archive.abort()`; `name` sanitize (không `../`). Tổng > 4 GB hoặc > 65,535 entry cần ZIP64 (archiver `forceZip64` — verify).
      (4) Folder lớn: **async job** tạo zip lên S3 (multipart) rồi gửi presigned link — resume được, không giữ connection hàng chục phút.
    followUp: "How would you tell the user which files failed without breaking the whole archive?"
    redFlags:
      - "Wrap it in try/catch and send res.status(500) (headers already sent)"
    verify: true
    tags: [zip, archiver, streaming, debug]
  - id: scenario-files-031
    level: hard
    type: scenario
    q: "Uploads stream through your backend into S3. After a week, `ListMultipartUploads` shows 40,000 in-progress uploads and pods show growing socket counts. What is leaking?"
    hint: |-
      (1) Client ngắt giữa chừng (mobile, tab đóng) → `req` emit `aborted`/`close`, nhưng code chỉ `file.pipe(body)` → `Upload.done()` treo hoặc reject mà **không `abort()`** → multipart dở dang ở S3 + socket tới S3 giữ tới timeout.
      (2) Chứng minh: correlate log `req close before finish` với `CreateMultipartUpload` không có `Complete`/`Abort`; metric active sockets của SDK agent; `ListMultipartUploads` theo thời gian tạo.
      (3) Fix: `pipeline(file, inspect, body)` + `req.once("close", () => !done && upload.abort())`, abort cả khi validate fail; set `requestHandler` timeout cho S3 client; **lifecycle `AbortIncompleteMultipartUpload`** làm lưới an toàn (1–3 ngày).
      (4) Test: integration test cắt connection giữa chừng (`req.destroy()` ở client) và assert không còn upload in-progress.
    followUp: "How do you distinguish in logs and metrics between a client abort and a server-side failure?"
    redFlags:
      - "Only relies on the lifecycle rule and ignores the socket leak"
    tags: [abort, multipart, leak]
  - id: scenario-files-032
    level: hard
    type: debug
    q: "Your streaming upload enforces a 50 MB limit with busboy, yet 200 MB files end up in S3 as 50 MB objects and are marked ready. Why?"
    example: |-
      ```ts
      const bb = busboy({ headers: req.headers, limits: { fileSize: 50 * 1024 * 1024 } });
      bb.on("file", (_n, file) => {
        const upload = new Upload({ client: s3, params: { Bucket, Key: key, Body: file } });
        upload.done().then(() => markReady(key)).then(() => res.sendStatus(201));
      });
      req.pipe(bb);
      ```
    hint: |-
      (1) Khi chạm `fileSize`, busboy **không lỗi**: nó emit `'limit'`, đặt `file.truncated = true`, rồi **kết thúc stream bình thường** → `Upload` thấy EOF, `Complete` một object 50 MB cắt cụt → hỏng nhưng được đánh dấu ready.
      (2) Fix: `file.on("limit", () => { upload.abort(); file.resume(); reply 413 })`, và trước `markReady` kiểm `file.truncated`. Không tin `Content-Length` header (có thể thiếu với chunked, hoặc nói dối) — nhưng dùng nó để **reject sớm** nếu > limit trước khi đọc body.
      (3) `@fastify/multipart` mặc định `throwFileSizeLimit: true` → ném `RequestFileTooLargeError` (verify); Multer ném `LIMIT_FILE_SIZE` — mỗi lib hành xử khác, phải đọc docs.
      (4) Chặn thêm ở nginx `client_max_body_size` để bytes vượt không tới Node.
    followUp: "The client sends Expect: 100-continue. How can you reject an oversized upload before any body bytes are sent?"
    redFlags:
      - "Assumes hitting the limit throws an error automatically"
    verify: true
    tags: [busboy, limits, debug]
  - id: scenario-files-033
    level: hard
    type: scenario
    q: "Users can upload a ZIP of product images that your worker extracts. A 40 KB upload just filled a worker's 20 GB disk. What happened and how do you harden extraction?"
    hint: |-
      (1) **Zip bomb**: nén tỉ lệ cực cao (hoặc zip lồng zip, overlapping entries) → 40 KB giải ra hàng GB/TB. Kèm rủi ro **zip slip** (`../../` trong tên entry), symlink entry, hàng triệu entry nhỏ (inode).
      (2) Không tin header `uncompressedSize` trong central directory (giả được) → đếm **bytes thực sự giải ra** khi stream, dừng khi vượt tổng (vd 500 MB), giới hạn **số entry** (vd 1,000), **ratio** (vd > 100:1 → reject), không giải đệ quy archive lồng, không theo symlink.
      (3) Mỗi entry: sanitize path (resolve + kiểm prefix), ghi vào thư mục tạm riêng với quota, hoặc stream thẳng từng entry lên S3 thay vì disk; chạy trong container giới hạn disk/memory/time (ephemeral storage limit).
      (4) Cũng áp dụng cho `Content-Encoding: gzip` request body và ảnh (decompression bomb pixel) — giới hạn bytes sau giải nén.
    followUp: "Your API accepts gzip-compressed JSON request bodies. Where is the same bomb risk and how do you cap it?"
    redFlags:
      - "Check the ZIP file size before extracting and call it safe"
    tags: [zip-bomb, security, validation]
  - id: scenario-files-034
    level: hard
    type: scenario
    q: "Your thumbnail worker (sharp) occasionally OOMs on a 2 MB PNG, and users complain their uploaded photos reveal their home location. Address both."
    hint: |-
      (1) **Decompression bomb ảnh**: PNG 2 MB có thể khai báo 50,000 × 50,000 px → decode = 50k×50k×4 byte ≈ **10 GB**. `sharp` có `limitInputPixels` (mặc định ~268 MP = 16383×16383 — verify) → đặt thấp hơn theo nghiệp vụ (vd 40 MP) và đọc `metadata()` trước khi resize.
      (2) **EXIF GPS**: ảnh điện thoại chứa toạ độ, model máy, thời gian. Re-encode bằng sharp **mặc định bỏ metadata** (trừ khi gọi `withMetadata()`/`keepMetadata()`), nhưng nhớ áp `rotate()` theo EXIF orientation trước khi bỏ.
      (3) Re-encode (sang WebP/AVIF/JPEG mới) cũng phá **polyglot** và payload giấu trong chunk lạ; serve bản re-encode, giữ bản gốc ở bucket private (hoặc xoá).
      (4) Worker: giới hạn concurrency sharp (`sharp.concurrency`, UV threadpool), memory limit container, timeout mỗi job, message quá hạn → DLQ.
    followUp: "Should you keep the original upload after generating the sanitized version? Consider legal, cost, and security."
    redFlags:
      - "Strip EXIF on the client and trust it"
    verify: true
    tags: [images, sharp, exif, security]
  - id: scenario-files-035
    level: hard
    type: design
    q: "Design malware scanning for user uploads so that nothing is downloadable before it is scanned, and explain what happens when the scanner is down for an hour."
    hint: |-
      (1) Upload vào **bucket quarantine** (không ai GET trực tiếp được, chỉ worker); row `uploaded`. Event → queue → scanner (ClamAV trên ECS/Lambda container, hoặc GuardDuty Malware Protection for S3 — verify phạm vi/giá) → sạch: copy sang bucket `clean` + `status='ready'`; bẩn: tag `infected`, chuyển bucket `quarantine-infected`, notify, audit.
      (2) API chỉ ký GET cho row `ready` → không có đường tắt (kể cả UI preview).
      (3) Scanner down: message nằm trong queue (retention đủ dài, vd 4 ngày), status `scanning` hiển thị "đang kiểm tra" cho user; **fail closed** (không tự chuyển ready); alarm theo queue age; khi phục hồi worker autoscale xả backlog; message lỗi lặp → DLQ + manual review.
      (4) Chi tiết: signature DB update thường xuyên (freshclam), giới hạn size scan (file > giới hạn scanner → policy riêng), archive lồng, timeouts; rescan định kỳ file cũ khi có signature mới là tuỳ chọn.
    followUp: "Business asks to show the file immediately to the uploader while the scan runs. Is there a safe way?"
    redFlags:
      - "Scan synchronously in the upload request for 1 GB files"
      - "Fail open: mark ready if the scanner times out"
    verify: true
    tags: [malware, security, pipeline]
  - id: scenario-files-036
    level: hard
    type: debug
    q: "An import pipeline reads a CSV stream and inserts rows. Memory grows linearly and the DB pool is exhausted, even though it 'uses streams'. Find the bug."
    example: |-
      ```ts
      const toDb = new Transform({
        objectMode: true,
        transform(row, _enc, cb) {
          db.insert("items", row); // returns a Promise
          cb();
        },
      });
      await pipeline(fs.createReadStream(file), csvParser(), toDb, new Writable({ objectMode: true, write(_c, _e, cb) { cb(); } }));
      ```
    hint: |-
      (1) `transform` gọi `cb()` **ngay** mà không await insert → stream nghĩ chunk đã xử lý xong → đọc tiếp tốc độ disk → hàng trăm nghìn Promise insert đang chờ, pool DB (vd 10 connection) cạn, query xếp hàng trong RAM → **mất backpressure**. Promise reject còn bị nuốt (unhandled rejection).
      (2) Fix: `async transform(row, _e, cb) { try { await db.insert(...); cb(); } catch (e) { cb(e); } }` — hoặc tốt hơn **batch** 500–1,000 row rồi `INSERT ... VALUES (...), (...)`/`COPY FROM STDIN` (Postgres), `flush()` ghi batch cuối.
      (3) Cách hiện đại: `for await (const batch of batched(parser))` với concurrency giới hạn (p-limit 4).
      (4) Transform cuối là Writable rỗng → dùng Writable trực tiếp cho sink. Object mode `highWaterMark` mặc định 16 object; đo `process.memoryUsage().rss` + pool wait để chứng minh fix.
    followUp: "How much faster is COPY than batched INSERT for 5 million rows, and what are its downsides (triggers, error handling)?"
    redFlags:
      - "Increase the DB pool size to 200"
    tags: [streams, backpressure, debug]
  - id: scenario-files-037
    level: hard
    type: gotcha
    q: "In a Next.js route handler you return an S3 object as a Response. Downloads work, but memory rises under load and cancelled downloads keep S3 connections open. What is going on with Web Streams vs Node streams?"
    hint: |-
      (1) Route handler dùng **Web Streams** (`ReadableStream`); SDK v3 trên Node trả `Body` là Node `Readable` (`IncomingMessage`) — bọc sai (vd `new Response(await body.transformToByteArray())`) = buffer toàn bộ; tự viết `new ReadableStream({ start(c) { body.on("data", d => c.enqueue(d)) } })` = **bỏ qua backpressure** (enqueue vô hạn).
      (2) Đúng: `Readable.toWeb(body)` (tôn trọng pull/backpressure) hoặc `body.transformToWebStream()`; khi client huỷ, `ReadableStream.cancel()` → destroy Node stream → trả socket.
      (3) Chuyển ngược: `Readable.fromWeb(webStream)`; `pipeline` từ `node:stream/promises` nhận được cả Web streams ở Node mới (verify).
      (4) Lưu ý runtime Edge không có Node streams/SDK đầy đủ; file lớn vẫn nên redirect presigned URL thay vì proxy qua Next.
    example: |-
      ```ts
      import { Readable } from "node:stream";
      export async function GET(req: Request) {
        const obj = await s3.send(new GetObjectCommand({ Bucket, Key }), { abortSignal: req.signal });
        return new Response(Readable.toWeb(obj.Body as Readable) as ReadableStream, {
          headers: { "Content-Type": obj.ContentType ?? "application/octet-stream", "Content-Length": String(obj.ContentLength) },
        });
      }
      ```
    followUp: "Where does `req.signal` fire when the browser cancels, and what does passing it to the SDK change?"
    verify: true
    tags: [web-streams, nextjs, streaming]
  - id: scenario-files-038
    level: hard
    type: scenario
    q: "At market open, your Socket.IO price server's memory jumps from 400 MB to 3 GB and some clients see prices 20 seconds late. Ticks come in at 5,000/s. Diagnose and fix."
    hint: |-
      (1) **Slow consumers**: `socket.emit` luôn xếp message vào buffer của từng socket (engine.io `writeBuffer`/TCP send buffer); client mạng yếu đọc chậm → buffer phình, message cũ vẫn gửi theo thứ tự → client thấy giá trễ 20 s. 5,000 tick/s × 10k client = 50M message/s là không khả thi nếu gửi hết.
      (2) Đo: per-socket buffered bytes (`socket.conn.transport` / ws `bufferedAmount`), event loop lag, message/s outbound, GC.
      (3) Fix: **conflation** — mỗi client chỉ giữ giá mới nhất mỗi symbol, flush theo nhịp (vd 250 ms) thay vì mỗi tick; `socket.volatile.emit` (bỏ nếu không gửi được); chỉ gửi symbol client subscribe (room theo symbol); ngưỡng buffer vượt → drop/disconnect client chậm; payload nhỏ (delta, số thay vì chuỗi, binary/msgpack parser).
      (4) Giá realtime là dữ liệu "last value wins" → drop an toàn; **order/fill events thì không** → kênh riêng có seq và replay.
    followUp: "Which data on this platform can be dropped or coalesced, and which must be delivered exactly in order? How do you separate them?"
    redFlags:
      - "Add more RAM and a bigger instance"
      - "Queue every tick per client in Redis"
    verify: true
    tags: [socketio, backpressure, realtime]
  - id: scenario-files-039
    level: hard
    type: design
    q: "After a WiFi drop of 30 seconds, a trading client reconnects and shows a wrong account balance until refresh. Design reconnect and resync."
    hint: |-
      (1) Mỗi stream (per account / per symbol) có **sequence number** tăng đơn điệu từ nguồn (không phải từ từng gateway node). Client lưu `lastSeq`.
      (2) Reconnect: gửi `{ stream, lastSeq }` → server replay từ buffer (Redis Stream/Kafka, giữ vài phút) nếu gap nhỏ; gap lớn hoặc buffer đã trôi → gửi **snapshot** (balance hiện tại + seq) rồi delta tiếp. Client **bỏ delta có seq ≤ snapshot.seq**, phát hiện gap (seq nhảy) → xin resync.
      (3) Socket.IO v4.6+ có **Connection State Recovery** (khôi phục room + missed packets trong `maxDisconnectionDuration`) nhưng phụ thuộc adapter (Redis Streams adapter hỗ trợ, adapter Redis pub/sub thường không — verify) và không thay thế seq ở tầng business.
      (4) UI: đánh dấu "stale" khi mất kết nối > N giây, reconnect backoff + jitter để tránh reconnect storm khi gateway restart.
    followUp: "Your gateway restarts and 100k clients reconnect within 2 seconds. What protects the backend snapshot service?"
    redFlags:
      - "Rely on Socket.IO auto-reconnect alone"
      - "Send the full state on every message"
    verify: true
    tags: [socketio, reconnect, sequence]
  - id: scenario-files-040
    level: hard
    type: scenario
    q: "You scaled a Socket.IO cluster from 4 to 40 nodes with the Redis adapter, but Redis CPU is at 100% and per-node CPU did not drop. Why, and what do you change?"
    hint: |-
      (1) Redis adapter (pub/sub) **broadcast mọi emit tới mọi node**: 1 tick × 40 node = 40 lần deliver, mỗi node deserialize rồi mới biết không ai trong room → chi phí tăng tuyến tính theo số node; Redis pub/sub cũng single-threaded cho fan-out.
      (2) Fix: **sharded pub/sub** (Redis 7 `SPUBLISH`, `@socket.io/redis-adapter` với `createShardedAdapter` — verify) theo channel/room để node chỉ nhận room có subscriber; hoặc thiết kế gateway tự subscribe topic theo symbol (Kafka/NATS subject) chỉ khi có client local.
      (3) Giảm lượng: conflate ở upstream (gửi 4 update/s/symbol thay vì 50), gom batch nhiều symbol mỗi message.
      (4) Nhắc: cần sticky session khi dùng HTTP long-polling (hoặc ép `transports: ["websocket"]`), heartbeat, và giới hạn connection/node (~vài chục nghìn tuỳ payload).
    followUp: "Estimate messages per second through Redis before and after sharding for 2,000 symbols at 10 updates/s."
    verify: true
    tags: [socketio, redis-adapter, scale]
  - id: scenario-files-041
    level: hard
    type: scenario
    q: "Your WebSocket gateway shows 80k connections in metrics but only 30k active users, and some mobile users stop receiving updates without any disconnect event. Explain."
    hint: |-
      (1) **Half-open connections**: mobile đổi mạng/NAT timeout, TCP không gửi FIN → server vẫn nghĩ connection sống (tính trong metric, giữ memory, nhận emit vào buffer) còn client đã "chết"; client thì chưa phát hiện nên không reconnect.
      (2) Cần **heartbeat hai chiều ở tầng application**: Socket.IO có ping/pong (`pingInterval` 25 s, `pingTimeout` 20 s mặc định — verify); ws thuần phải tự ping và `terminate()` nếu không pong. Client phát hiện không nhận ping trong N giây → reconnect.
      (3) Căn timeout với LB: ALB idle timeout 60 s, nginx `proxy_read_timeout` 60 s mặc định → heartbeat < idle timeout, nếu không LB cắt connection im lặng.
      (4) Metric: connections vs authenticated active sessions, disconnect reasons, pong latency; TCP keepalive OS (2 giờ mặc định) quá chậm để dựa vào.
