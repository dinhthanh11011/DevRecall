  - id: scenario-files-048
    level: senior
    type: design
    q: "Users want 'Download all' for project folders up to 50 GB and 100k files. On-the-fly streaming ZIP or asynchronous export? Defend your choice and the edge cases."
    hint: |-
      (1) On-the-fly (archiver/`zip-stream`, STORE không nén): không tốn storage, bắt đầu tải ngay; nhược: connection giữ hàng giờ (LB/proxy timeout, deploy cắt ngang), **không resume được** (không có Content-Length/Range), lỗi giữa chừng = file hỏng, chiếm 1 pod.
