    verify: true
    tags: [sse, reconnect, http2]
  - id: scenario-files-027
    level: medium
    type: design
    q: "While streaming an upload to S3 you must compute a SHA-256, count bytes, and reject non-PDF files based on the first bytes. Design the Transform stream."
    hint: |-
      (1) Một `Transform` (hoặc 2 nhỏ) nằm giữa source và `Upload`: trong `transform(chunk, enc, cb)` → `hash.update(chunk)`, `bytes += chunk.length`; khi chưa đủ 5 byte đầu thì gom vào buffer nhỏ, đủ rồi kiểm `%PDF-` → sai thì `cb(new Error("type"))` → `pipeline` huỷ toàn bộ + `upload.abort()`.
      (2) Vượt size → `cb(err)` ngay (không đợi hết file). `flush(cb)` → ghi `sha256` ra ngoài (event/closure) để lưu DB.
      (3) Phải gọi `cb` **đúng 1 lần** mỗi chunk; không làm async không await trong transform (mất backpressure). Không cần object mode — đây là byte stream.
      (4) SHA-256 trên CPU ~ vài trăm MB/s mỗi core → 1 GB tốn vài giây CPU; nhiều upload đồng thời cân nhắc S3 checksum (`ChecksumAlgorithm: "SHA256"`/CRC32) thay vì tự hash.
    example: |-
      ```ts
      import { Transform } from "node:stream";
      import { createHash } from "node:crypto";

      export function inspect(maxBytes: number) {
        const hash = createHash("sha256");
        let seen = 0; let head = Buffer.alloc(0); let checked = false;
        const t = new Transform({
          transform(chunk: Buffer, _enc, cb) {
            seen += chunk.length;
            if (seen > maxBytes) return cb(new Error("too_large"));
            if (!checked) {
              head = Buffer.concat([head, chunk]).subarray(0, 5);
              if (head.length >= 5) {
                checked = true;
                if (head.toString("latin1") !== "%PDF-") return cb(new Error("not_pdf"));
              }
            }
            hash.update(chunk);
            cb(null, chunk);
          },
          flush(cb) { t.emit("digest", hash.digest("hex"), seen); cb(); },
        });
        return t;
      }
      ```
    followUp: "If the Transform errors, what exactly happens to the S3 multipart upload that is in progress?"
    tags: [transform, streams, checksum]
  - id: scenario-files-028
    level: medium
    type: scenario
    q: "Product wants a progress bar, a cancel button, and automatic retry for large browser uploads. How do you implement each?"
    hint: |-
      (1) **Progress**: `fetch()` chưa có upload progress event chuẩn → dùng `XMLHttpRequest.upload.onprogress` (loaded/total), hoặc với multipart tự cộng bytes của part đã xong + part đang chạy. `lib-storage` phía Node có `httpUploadProgress`.
      (2) **Cancel**: `AbortController` (fetch) / `xhr.abort()` cho request đang chạy + gọi API huỷ → server `AbortMultipartUpload`, row `cancelled`.
      (3) **Retry**: theo **part**, exponential backoff + jitter, giới hạn số lần; lỗi 4xx (403 URL hết hạn) → xin URL mới rồi retry; 5xx/network → retry. Idempotent vì PUT cùng part number ghi đè.
      (4) Integrity: gửi checksum mỗi part (`Content-MD5` hoặc `x-amz-checksum-crc32` ký trong URL) để S3 reject part hỏng. Thư viện sẵn: Uppy (`@uppy/aws-s3` multipart, tus).
    followUp: "Progress hits 100% but the server says the file is not ready for another 40 seconds. How do you communicate that state to the user?"
    verify: true
    tags: [ux, progress, retry]
  - id: scenario-files-029
    level: hard
    type: scenario
    q: "An exam platform: 5,000 students submit 50-200 MB project archives in the last 10 minutes before a hard 23:59 deadline. Last term the API fell over at 23:55. What do you change?"
    hint: |-
      (1) Tính: 5,000 × ~100 MB = 500 GB trong 10 phút ≈ **830 MB/s ≈ 6.7 Gbps** vào. Không API fleet nào nên gánh bytes này → **presigned multipart thẳng S3** (S3 scale theo prefix: ~3,500 PUT/s mỗi prefix — verify; key có prefix phân tán).
      (2) Deadline công bằng: ghi `submitted_at` **lúc cấp presigned URL/khởi tạo upload** (server time), cho phép hoàn tất muộn thêm N phút; không để deadline phụ thuộc vào tốc độ mạng lúc 23:59.
      (3) API chỉ còn phần nhẹ: sign, confirm (`HeadObject`), ghi DB — vẫn cần rate limit per user, connection pool DB đủ cho ~vài trăm confirm/s, retry idempotent (idempotency key theo `uploadId`).
