questions:
  - id: scenario-files-001
    level: easy
    type: scenario
    q: "An upload endpoint uses Multer with the default memory storage. Marketing runs a campaign and 100 users upload 100 MB videos at the same time. What happens to a pod with a 2 GB memory limit, and what is your first fix?"
    hint: |-
      (1) Tính trước: 100 × 100 MB = **10 GB Buffer** giữ đồng thời trong RAM (Buffer nằm ngoài V8 heap nên `--max-old-space-size` không cứu) → pod OOMKilled, mọi request khác trên pod cũng chết, K8s restart → retry của client lại dồn vào.
      (2) Nguyên nhân: `memoryStorage` đọc hết multipart body vào `file.buffer` trước khi handler chạy.
      (3) Fix theo ưu tiên: ngay lập tức giới hạn `limits.fileSize` + số upload đồng thời (429) → đúng hướng: **client upload thẳng S3 bằng presigned POST/multipart**, API chỉ nhận metadata → nếu bắt buộc qua backend thì stream (busboy → lib-storage).
      (4) Con số: stream thuần ~64 KB/upload, lib-storage ~20 MB/upload (5 MB × 4), buffer toàn bộ = 100 MB/upload.
    followUp: "You switch to streaming through the backend. Recompute memory for 100 concurrent uploads with `@aws-sdk/lib-storage` defaults."
    redFlags:
      - "Just raise the pod memory limit to 16 GB"
      - "Increase --max-old-space-size (Buffers live outside the V8 heap)"
    tags: [upload, memory, multer]
  - id: scenario-files-002
    level: easy
    type: compare
    q: "Product wants to cap uploads at 100 MB. A teammate proposes a presigned PUT URL. Can that enforce the limit? What would you use instead?"
    hint: |-
      (1) Presigned PUT ký method + key + (tuỳ chọn) một số header như `Content-Type`; nó **không có điều kiện về size** → client có thể PUT tới 5 GiB (giới hạn single PUT). Ký `ContentLength` vào URL cũng chỉ ép đúng một con số, không phải khoảng, và dễ vỡ.
      (2) **Presigned POST** có **policy document** với condition `["content-length-range", min, max]`, `["starts-with", "$Content-Type", "image/"]`, `["starts-with", "$key", "uploads/<userId>/"]`; S3 tự reject nếu vi phạm.
      (3) Dù dùng gì vẫn **verify sau**: `HeadObject` ở bước confirm hoặc worker từ S3 event, xoá nếu vượt.
      (4) Multipart: giới hạn qua số part bạn chịu ký × part size, và check tổng size trước `CompleteMultipartUpload`.
    example: |-
      ```ts
      import { createPresignedPost } from "@aws-sdk/s3-presigned-post";

      const { url, fields } = await createPresignedPost(s3, {
        Bucket: "uploads-quarantine",
        Key: `u/${userId}/${crypto.randomUUID()}`,
        Conditions: [
          ["content-length-range", 1, 100 * 1024 * 1024],
          ["starts-with", "$Content-Type", "video/"],
        ],
        Fields: { "Content-Type": declaredType },
        Expires: 300, // seconds
      });
      // browser: FormData(fields..., file LAST) → POST url
      ```
    followUp: "The file field in the POST form is placed before the policy fields. What happens?"
    redFlags:
      - "Check file.size in the browser and trust it"
      - "Presigned PUT enforces size because we sign Content-Type"
    verify: true
    tags: [s3, presigned-post, upload]
  - id: scenario-files-003
    level: easy
    type: scenario
    q: "Users on bad mobile networks complain that a 4 GB download restarts from zero every time the connection drops. What HTTP feature fixes that and what must your endpoint return?"
    hint: |-
      (1) **Range requests**: server quảng cáo `Accept-Ranges: bytes`; client gửi `Range: bytes=2147483648-`; server trả **`206 Partial Content`** + `Content-Range: bytes 2147483648-4294967295/4294967296` + `Content-Length` của đoạn.
      (2) Cần validator để không ghép nhầm 2 phiên bản file: `ETag`/`Last-Modified` + client gửi `If-Range`; file đổi thì server trả `200` full.
      (3) Range ngoài kích thước → `416 Range Not Satisfiable` + `Content-Range: bytes */<size>`.
      (4) Dễ nhất: redirect sang **presigned S3 GET / CloudFront** — cả hai hỗ trợ Range sẵn; tự proxy thì phải forward `Range` xuống `GetObjectCommand({ Range })`.
    followUp: "Your download goes through a Node proxy with `compression()` enabled. What breaks with Range?"
    redFlags:
      - "Split the file into zip parts manually"
      - "Returns 200 with the whole body when a Range header is sent"
    tags: [download, range, http]
  - id: scenario-files-004
    level: easy
    type: gotcha
    q: "Users can upload attachments and other users can open them in the browser. Which response headers do you set when serving those files, and why?"
    hint: |-
      (1) `Content-Type` do **server** quyết định (từ magic bytes đã verify), không echo từ client.
      (2) `X-Content-Type-Options: nosniff` → browser không tự "đoán" HTML/script từ nội dung.
      (3) `Content-Disposition: attachment; filename="invoice.pdf"; filename*=UTF-8''...` cho mọi thứ không phải ảnh an toàn → tải về thay vì render (chặn SVG/HTML chạy script).
      (4) Serve từ **domain riêng** (vd `usercontent-example.net`, không chung cookie/origin với app) + `Content-Security-Policy: sandbox` / `default-src 'none'` nếu phải inline. Với S3 presigned GET dùng `ResponseContentDisposition` / `ResponseContentType`.
    followUp: "Why is a separate registrable domain better than a subdomain like `files.app.com`?"
    redFlags:
      - "Only checks the file extension on upload"
      - "Serves uploads from the same origin as the app with the client-provided Content-Type"
    tags: [security, download, xss]
  - id: scenario-files-005
    level: easy
    type: gotcha
    q: "Finance asks why the S3 bill for the uploads bucket keeps growing even though `ListObjects` shows only 200 GB. What do you check first?"
    hint: |-
      (1) **Incomplete multipart uploads**: part đã upload nhưng chưa `Complete`/`Abort` vẫn tính tiền storage và **không hiện** trong `ListObjects`. Kiểm tra bằng `ListMultipartUploads` hoặc S3 Storage Lens (metric incomplete MPU bytes).
      (2) Fix: lifecycle rule `AbortIncompleteMultipartUpload` `DaysAfterInitiation: 1–7`.
      (3) Thủ phạm khác: bucket bật **versioning** → noncurrent versions (cần `NoncurrentVersionExpiration`), object `pending` không bao giờ confirm (lifecycle theo prefix/tag), delete markers.
      (4) Kèm: request cost (PUT ~ $0.005/1k, GET ~ $0.0004/1k ở us-east-1 — verify) và egress thường lớn hơn storage.
    example: |-
      ```json
      {
        "Rules": [
          { "ID": "abort-mpu", "Status": "Enabled", "Filter": {},
            "AbortIncompleteMultipartUpload": { "DaysAfterInitiation": 3 } },
          { "ID": "expire-pending", "Status": "Enabled",
            "Filter": { "Tag": { "Key": "status", "Value": "pending" } },
            "Expiration": { "Days": 1 } }
        ]
      }
      ```
    followUp: "How would you expire objects that were uploaded but never confirmed, without touching confirmed ones?"
    verify: true
    tags: [s3, cost, lifecycle]
  - id: scenario-files-006
    level: easy
    type: compare
    q: "You need to stream LLM tokens from your backend to a chat UI. SSE or WebSocket? Justify in one minute."
    hint: |-
      (1) Luồng là **một chiều** server→client cho mỗi câu hỏi; request của user là một HTTP POST bình thường → **SSE** (hoặc fetch streaming đọc `ReadableStream`) là đủ, đơn giản, đi qua HTTP infra/auth/cookie sẵn có.
      (2) SSE: `text/event-stream`, tự reconnect, `Last-Event-ID`; nhược: `EventSource` chỉ GET, không set header tuỳ ý → nhiều team dùng `fetch()` + parse SSE thủ công để POST body và gửi `Authorization`.
      (3) WebSocket khi cần **hai chiều liên tục**: interrupt/cancel giữa chừng qua cùng kênh, voice realtime, collaborative editing.
      (4) Cả hai đều cần: tắt proxy buffering, heartbeat, và **huỷ upstream LLM call** khi client đóng (tiết kiệm token = tiền).
    followUp: "The user closes the tab mid-answer. How does your server notice and what must it do?"
