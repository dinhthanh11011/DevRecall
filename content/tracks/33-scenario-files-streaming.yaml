    level: senior
    type: design
    q: "Design the media processing pipeline (thumbnails, previews, video transcoding) for a marketplace with free and paid sellers, with retries, poison files, and cost control."
    hint: |-
      (1) Event (S3/confirm) → **router** → queue theo loại việc & priority (image-fast, video-paid, video-free) → worker pool riêng autoscale theo queue depth/age (KEDA/ECS target tracking); ảnh nhanh (sharp, giây) tách khỏi video (phút, CPU/GPU, spot).
      (2) Job model: `media_job(upload_id, preset, version, status, attempts, lease_until)`, output key xác định → idempotent, reprocess bằng cách bump version.
      (3) Poison file: ffprobe/sharp metadata validate trước; timeout theo độ dài media; maxReceiveCount → DLQ → trạng thái `failed` hiển thị cho seller + nút re-upload; không retry vô hạn.
      (4) Cost: giới hạn độ dài/độ phân giải theo plan, preset ít rendition cho free, spot + checkpoint, lifecycle xoá bản gốc sau khi transcode (nếu chính sách cho phép), đo cost/phút video.
    followUp: "A new preset must be applied to 10 million existing images. How do you backfill without hurting live traffic?"
    tags: [media, pipeline, queue]
  - id: scenario-files-054
    level: senior
    type: open
    q: "You are asked to security-review a new file upload and sharing feature before launch. What is your threat model and checklist?"
    hint: |-
      (1) Tài sản & kẻ tấn công: file của tenant khác (IDOR), app origin (XSS), server (RCE qua parser, path traversal, SSRF khi "upload from URL"), hạ tầng (DoS/cost: size, zip bomb, pixel bomb, request flood), người dùng khác (malware phân phối qua link của bạn).
      (2) Upload: auth + quota trước khi ký, key server sinh, presigned POST có size/type, quarantine + scan, magic bytes + re-encode, giới hạn giải nén, sandbox các parser (ImageMagick/ffmpeg/PDF) trong container ít quyền, "upload from URL" chặn IP nội bộ/metadata endpoint (169.254.169.254).
      (3) Download/share: kiểm quyền mỗi lần ký, TTL ngắn, share link có expiry + revoke (token trong DB, không chỉ presigned), domain riêng, `Content-Disposition`, `nosniff`, CSP sandbox, không public bucket, Block Public Access bật.
      (4) Vận hành: audit log, rate limit, alert khi tỉ lệ infected tăng, retention/xoá theo luật (GDPR), pentest case list theo OWASP File Upload Cheat Sheet.
    followUp: "Which one item on this list would you refuse to launch without, and why?"
    tags: [security, threat-model, upload]
  - id: scenario-files-055
    level: senior
    type: design
    q: "Accountants export 5 million transaction rows as CSV from PostgreSQL. The current endpoint builds the file in memory and times out. Stream it directly, or run a background job? Show how you would do each."
    hint: |-
      (1) Stream trực tiếp: `COPY (SELECT ...) TO STDOUT WITH (FORMAT csv, HEADER)` qua `pg-copy-streams` → `pipeline(copyStream, gzip, res)`; memory ổn định, DB làm việc serialize (nhanh nhất). Nhược: giữ transaction/connection suốt thời gian tải (client chậm = connection pool bị giữ, snapshot giữ lâu → cản VACUUM), không resume, timeout LB.
      (2) Background job: worker chạy cùng `COPY`/keyset pagination (`WHERE id > $last ORDER BY id LIMIT 10000`) → gzip → multipart lên S3 → presigned link + notify; resume được, không giữ connection theo tốc độ client, retry job.
      (3) Chọn: < ~50 MB & nhanh → stream; lớn/không đoán được → job. Luôn chạy trên **read replica**, statement_timeout riêng, giới hạn export đồng thời mỗi tenant.
      (4) SQL Server: không có `COPY TO STDOUT` — dùng `bcp`/SSIS hoặc stream từ `tedious` với `request.pause()/resume()` để có backpressure; MySQL `SELECT ... INTO OUTFILE` ghi file trên DB server (cần quyền, không hợp managed DB).
    example: |-
      ```ts
      import { to as copyTo } from "pg-copy-streams";
      import { pipeline } from "node:stream/promises";
      import { createGzip } from "node:zlib";

      if (!/^[0-9a-f-]{36}$/i.test(tenantId)) throw new Error("bad tenant id"); // COPY has no bind params
      const client = await replicaPool.connect();
      try {
        await client.query("SET statement_timeout = '10min'");
        const src = client.query(copyTo(
          "COPY (SELECT id, booked_at, amount, currency FROM txn WHERE tenant_id = '" + tenantId + "') TO STDOUT WITH (FORMAT csv, HEADER)"
        ));
        res.setHeader("Content-Type", "text/csv");
        res.setHeader("Content-Encoding", "gzip");
        res.setHeader("Content-Disposition", 'attachment; filename="transactions.csv"');
        await pipeline(src, createGzip(), res);
      } finally { client.release(); }
      // NOTE: COPY does not accept bind parameters — tenantId must be a validated UUID (or use a view/temp function).
      ```
    followUp: "COPY can't take bind parameters. How do you avoid SQL injection while keeping COPY's speed?"
    verify: true
    tags: [export, postgres, streaming]
  - id: scenario-files-056
    level: senior
    type: scenario
    q: "Users in Southeast Asia and Europe upload 2 GB files to a bucket in us-east-1 and complain it takes 40 minutes. Data residency rules also apply to EU customers. What do you propose?"
    hint: |-
      (1) Đo: throughput thực tế (Mbps) theo region, RTT, số part song song; TCP qua đường dài với 1 connection bị giới hạn bởi RTT → **multipart song song 6–10 part** thường cải thiện nhiều.
      (2) **S3 Transfer Acceleration** (upload vào edge CloudFront gần nhất rồi đi backbone AWS) — tốn thêm phí/GB, chỉ tính khi thực sự nhanh hơn (verify giá); hoặc CloudFront trước upload.
      (3) Data residency: bucket **theo region của tenant** (eu-central-1 cho EU), API chọn bucket theo tenant khi ký; metadata DB cũng phải tuân thủ nếu chứa PII; không replicate EU data ra ngoài (CRR chỉ trong EU).
      (4) Trade-off: nhiều bucket = nhiều config/lifecycle/IAM → IaC module hoá; download từ CloudFront gần user; theo dõi p95 upload duration theo region làm SLO.
    followUp: "An EU tenant's file is shared with a US user. Where is it served from, and does that violate residency?"
    verify: true
    tags: [global, s3, residency]
  - id: scenario-files-057
    level: cv
    type: behavioral
    q: "Tell me about a time you had to make large file uploads or exports reliable in production. What broke, what did you change, and how did you measure the result?"
    hint: |-
      STAR:
      - **S**: tính năng upload/export file lớn (kích thước, số user đồng thời), triệu chứng (OOM, timeout, 413, file hỏng).
      - **T**: mục tiêu đo được (vd không còn OOM, p95 upload < X phút, fail rate < 1%).
      - **A**: đo trước (memory/pod, lỗi theo layer), chuyển sang presigned/multipart hoặc streaming có backpressure, giới hạn size/concurrency, state machine + worker, lifecycle cleanup.
      - **R**: con số trước/sau (RSS từ 2 GB → 200 MB, fail rate, cost).
      Reflection: cái bạn sẽ làm khác (load test burst sớm hơn, abort path, alert incomplete MPU).
    followUp: "What was the one failure mode you only discovered after launch?"
    redFlags:
      - "No numbers, no before/after"
      - "Takes credit for the whole team's work without saying what they personally did"
    tags: [behavioral, upload]
  - id: scenario-files-058
    level: cv
    type: behavioral
    q: "Tell me about a time a real-time stream (WebSocket/Socket.IO/SSE) misbehaved under load or after reconnects. How did you find the cause and what did you change?"
    hint: |-
      STAR:
      - **S**: loại dữ liệu (giá, trạng thái, notification), số connection, triệu chứng (dữ liệu trễ, mất update sau reconnect, memory tăng, reconnect storm).
      - **T**: SLO (latency, không mất event quan trọng).
      - **A**: instrument (timestamp theo chặng, buffered bytes, disconnect reason), giả lập mạng xấu, thêm seq + snapshot/replay, conflation cho data lossy, heartbeat/timeout khớp LB, adapter/sticky session khi scale.
      - **R**: con số (p99 từ 3 s → 300 ms, memory ổn định, không còn ticket "số dư sai").
      Reflection: tách kênh lossy vs lossless ngay từ thiết kế.
    followUp: "How did you test reconnect behaviour before shipping, not just after incidents?"
    redFlags:
      - "Only says 'we used Socket.IO auto-reconnect'"
    tags: [behavioral, realtime]
