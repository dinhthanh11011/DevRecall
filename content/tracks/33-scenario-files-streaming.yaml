  - id: scenario-files-007
    level: easy
    type: concept
    q: "In a direct-to-S3 design, why keep an upload row with a status column instead of inserting the file record only after the client says it is done?"
    hint: |-
      (1) Cần **ràng buộc key với user/tenant trước khi ký** (key do server sinh, lưu DB) để bước confirm kiểm được "key này là của bạn".
      (2) Client có thể không bao giờ gọi confirm (đóng tab, crash) → row `pending` + TTL giúp dọn object mồ côi; S3 event có thể đến **trước** confirm.
      (3) State machine: `pending → uploaded → scanning → ready | rejected | expired`; chỉ `ready` mới được serve/attach vào business entity. Update có điều kiện (`WHERE status='pending'`) để idempotent.
      (4) Có số liệu vận hành: tỉ lệ upload bỏ dở, thời gian scan, lỗi theo client.
    example: |-
      ```sql
      CREATE TABLE upload (
        id uuid PRIMARY KEY,
        tenant_id uuid NOT NULL,
        owner_id uuid NOT NULL,
        s3_key text NOT NULL UNIQUE,
        declared_size bigint NOT NULL,
        declared_type text NOT NULL,
        status text NOT NULL CHECK (status IN ('pending','uploaded','scanning','ready','rejected','expired')),
        sha256 text,
        created_at timestamptz NOT NULL DEFAULT now()
      );
      UPDATE upload SET status = 'uploaded' WHERE id = $1 AND owner_id = $2 AND status = 'pending';
      ```
    followUp: "The S3 event arrives before the client calls confirm. Does your state machine handle it?"
    tags: [upload, state-machine, db]
  - id: scenario-files-008
    level: easy
    type: concept
    q: "Recite the S3 multipart upload limits, then pick a part size for a 200 GB database backup upload."
    hint: |-
      (1) Part: tối thiểu **5 MiB** (trừ part cuối), tối đa **5 GiB**; tối đa **10,000 part**; part number 1–10000. Object tối đa 5 TiB (AWS thông báo nâng lên 50 TB cuối 2025 — verify). Single PUT tối đa 5 GiB; AWS khuyên multipart khi > 100 MB.
      (2) 200 GB / 10,000 = 20 MB → chọn ≥ **32 MiB** (chừa dư, số part ~6,400).
      (3) Trade-off: part to → ít request (rẻ hơn), nhưng retry 1 part tốn hơn và buffer RAM lớn hơn (`partSize × queueSize`); part nhỏ → nhiều request, overhead.
      (4) Song song 4–10 part tuỳ bandwidth; mỗi part có checksum riêng.
    followUp: "Why is the ETag of a multipart object not the MD5 of the file, and how do you verify integrity then?"
    verify: true
    tags: [s3, multipart]
  - id: scenario-files-009
    level: medium
    type: design
    q: "Walk me through a direct-to-S3 upload flow end to end. What exactly does your confirm endpoint check before marking the file as uploaded?"
    hint: |-
      (1) `POST /uploads` → auth, quota, validate size/type **khai báo** → server sinh key `t/<tenant>/<uuid>` → INSERT `pending` → trả presigned POST (hoặc multipart) TTL 5–15 phút.
      (2) Client upload thẳng S3 (bucket quarantine, không public).
      (3) `POST /uploads/:id/complete`: row thuộc user + `status='pending'`; `HeadObject(key)` tồn tại; `ContentLength` ≤ limit và ≈ declared; `ContentType`/metadata khớp; (nếu có) checksum khớp giá trị client gửi → `UPDATE ... WHERE status='pending'` → publish job scan.
      (4) Không tin confirm là đủ: S3 `ObjectCreated` → SQS cũng kích hoạt cùng logic (idempotent) để phòng client không gọi confirm. Magic bytes + AV scan ở worker, chỉ `ready` mới serve.
    followUp: "Where do you enforce the per-tenant storage quota when bytes never touch your API?"
    redFlags:
      - "Confirm endpoint just trusts the key and size sent by the client"
      - "Makes the bucket public-read so the frontend can display files immediately"
    tags: [upload, s3, design]
  - id: scenario-files-010
    level: medium
    type: debug
    q: "Code review: this presigned URL helper is from an old service and is being copied into a new NestJS service. What is wrong with it today?"
    example: |-
      ```ts
      import AWS from "aws-sdk";
      const s3 = new AWS.S3();

      export async function getUploadUrl(fileName: string) {
        return s3.getSignedUrlPromise("putObject", {
          Bucket: "uploads",
          Key: `videos/${fileName}`,
          ContentType: "video/mp4",
          Expires: 3600,
        });
      }
      ```
    hint: |-
      (1) **AWS SDK v2** (`aws-sdk`) đã **end-of-support từ 2025-09-08** (maintenance từ 2024-09-08) → không nhận bản vá; dùng v3: `getSignedUrl` từ `@aws-sdk/s3-request-presigner` + `PutObjectCommand`, `expiresIn` (giây).
      (2) Key lấy từ `fileName` của client → ghi đè file người khác, path lạ, ký tự đặc biệt; phải sinh `uuid` + prefix theo tenant/user, lưu tên gốc vào DB.
      (3) TTL 1 giờ quá dài cho upload; 5–15 phút là đủ.
      (4) Presigned PUT **không giới hạn size** → dùng presigned POST với `content-length-range` nếu cần chặn size. Không có auth/quota check trước khi ký.
    followUp: "The new URL signed with `ContentType` returns `403 SignatureDoesNotMatch` from the browser. Why?"
    redFlags:
      - "Only comments on the promise style"
    verify: true
    tags: [s3, sdk-v3, debug]
  - id: scenario-files-011
    level: medium
    type: debug
    q: "Browser multipart upload with presigned part URLs: every part returns 200, but `CompleteMultipartUpload` fails because the ETags array is full of `null`. Here is the bucket CORS config."
    example: |-
      ```json
      [
        {
          "AllowedOrigins": ["https://app.example.com"],
          "AllowedMethods": ["PUT", "POST", "GET"],
          "AllowedHeaders": ["*"],
          "MaxAgeSeconds": 3000
        }
      ]
      ```
    hint: |-
      (1) Thiếu `"ExposeHeaders": ["ETag"]` → browser chặn JS đọc header `ETag` từ response cross-origin (không phải CORS-safelisted header) → `xhr.getResponseHeader("ETag")` = `null`.
      (2) Fix: thêm `ExposeHeaders: ["ETag"]` (và `x-amz-checksum-*` nếu dùng checksum). Lưu ý ETag có dấu nháy kép, gửi nguyên văn khi Complete.
      (3) Cách khác không phụ thuộc CORS: backend gọi `ListParts(uploadId)` để lấy ETag rồi tự `Complete` — cũng là cách để resume.
      (4) Kiểm thêm: `AllowedOrigins` phải khớp chính xác scheme+host; preflight bị cache `MaxAgeSeconds`.
    followUp: "Would you let the browser call CompleteMultipartUpload itself or do it server side? Why?"
    tags: [s3, cors, multipart, debug]
  - id: scenario-files-012
    level: medium
    type: scenario
    q: "Your thumbnail worker consumes S3 ObjectCreated events via SQS. Ops sees some images processed twice and a few never processed. Explain and fix."
    hint: |-
      (1) S3 event notification là **at-least-once**, có thể **trùng** và **không đảm bảo thứ tự**; rất hiếm khi mất nhưng event có thể bị bỏ lỡ nếu config/permission sai hoặc SQS message vào DLQ/hết retention.
      (2) Xử lý trùng: worker **idempotent** — output key xác định (`thumbs/<uploadId>/256.webp`), `UPDATE upload SET status='ready' WHERE id=$1 AND status IN ('uploaded','scanning')`, hoặc bảng `processed(event_key, version_id/sequencer)`.
      (3) Không được xử lý: visibility timeout < thời gian xử lý → message quay lại/đến DLQ; bắt lỗi nhưng ack; kiểm DLQ + alarm. Thêm **reconciler** định kỳ: row `uploaded` quá 15 phút chưa `ready` → enqueue lại.
      (4) Dùng `sequencer` trong event để bỏ event cũ hơn khi cùng key bị ghi đè.
    followUp: "Why would you prefer EventBridge over direct S3 → SQS notifications, or not?"
    redFlags:
      - "S3 events are exactly-once so no dedup is needed"
    tags: [s3, events, idempotency]
  - id: scenario-files-013
    level: medium
    type: debug
    q: "A colleague says this NestJS endpoint streams 150 MB uploads to S3 with only ~64 KB of RAM per request. Is that true?"
    example: |-
      ```ts
      @Post("upload")
      @UseInterceptors(FileInterceptor("file", { limits: { fileSize: 150 * 1024 * 1024 } }))
      upload(@UploadedFile() file: Express.Multer.File) {
        return s3.upload({ Bucket, Key: `v/${file.originalname}`, Body: file.stream }).promise();
      }
      ```
    hint: |-
      (1) **Không**. `FileInterceptor` dùng Multer; không truyền `storage` → **memoryStorage**: toàn bộ file đã nằm trong `file.buffer` **trước khi** handler chạy. `diskStorage` thì ghi ra disk và cho `file.path`. Engine built-in **không populate `file.stream`** → `Body: undefined`.
      (2) `s3.upload().promise()` là **SDK v2** (end-of-support 2025-09-08); v3 dùng `Upload` từ `@aws-sdk/lib-storage`. Key từ `originalname` = path traversal/ghi đè.
      (3) Streaming thật: dùng **busboy** trực tiếp (hoặc custom Multer storage engine, nơi `_handleFile` nhận `file.stream`) → `new Upload({ client, params: { Body: fileStream } })`; hoặc Fastify + `@fastify/multipart` `request.file()`.
      (4) RAM thật khi stream qua lib-storage ≈ `partSize × queueSize` (mặc định 5 MiB × 4 ≈ 20 MB/upload — verify), không phải 64 KB.
    followUp: "Write the busboy version and show where you enforce the size limit and abort on disconnect."
    redFlags:
      - "Agrees it streams because the limit is set"
      - "Thinks fileSize limit prevents memory buffering"
    verify: true
    tags: [nestjs, multer, streaming, debug]
  - id: scenario-files-014
    level: medium
    type: scenario
    q: "Compliance requires every upload to pass through your backend (inline DLP scan). Show how you stream a multipart upload into S3 without buffering the whole file."
    hint: |-
      (1) Parse bằng **busboy** (`limits: { files: 1, fileSize }`), lấy `file` stream ngay khi field đến.
      (2) Pipe qua Transform kiểm tra (magic bytes, DLP, hash) rồi vào `Upload` của `@aws-sdk/lib-storage` — nó tự chia multipart, backpressure: part queue đầy → không đọc tiếp → busboy pause → socket ngừng đọc.
      (3) Khi `file.on('limit')` hoặc `req` `close` trước khi xong → `upload.abort()` (gọi `AbortMultipartUpload`) và trả 413/499; không để part rác.
      (4) Memory ≈ `partSize × queueSize` mỗi upload + buffer của Transform; giới hạn số upload đồng thời mỗi pod (vd 20) để RAM ≤ 20 × 20 MB = 400 MB.
    example: |-
      ```ts
      import busboy from "busboy";
      import { Upload } from "@aws-sdk/lib-storage";
      import { PassThrough } from "node:stream";

      app.post("/upload", (req, res) => {
        const bb = busboy({ headers: req.headers, limits: { files: 1, fileSize: 150 * 1024 * 1024 } });
        bb.on("file", (_name, file, info) => {
          const body = new PassThrough();
          const upload = new Upload({
            client: s3,
            params: { Bucket, Key: `q/${crypto.randomUUID()}`, Body: body, ContentType: "application/octet-stream" },
            partSize: 8 * 1024 * 1024,
            queueSize: 2,
          });
          file.on("limit", () => { upload.abort(); res.status(413).end(); });
          req.on("close", () => { if (!res.writableEnded) upload.abort(); });
          file.pipe(body);
          upload.done().then(() => res.status(201).json({ ok: true })).catch(() => { if (!res.headersSent) res.status(500).end(); });
        });
        req.pipe(bb);
      });
      ```
    followUp: "Where does backpressure actually stop the client from sending more bytes — at which layer?"
    redFlags:
      - "Writes to /tmp then uploads (without discussing disk limits)"
      - "No abort path when the client disconnects"
    verify: true
    tags: [busboy, lib-storage, streaming]
  - id: scenario-files-015
    level: medium
    type: gotcha
    q: "You moved to streaming uploads with `@aws-sdk/lib-storage`, but pods still hit 2 GB RSS during peak with ~100 concurrent uploads. Why?"
    hint: |-
      (1) `Upload` buffer mỗi part trong RAM để có thể retry/tính checksum: mặc định **partSize 5 MiB × queueSize 4** ≈ 20 MB/upload (verify) → 100 upload ≈ 2 GB. "Stream" ≠ "64 KB".
      (2) Cộng thêm: TLS buffers, busboy/Transform highWaterMark, retry giữ part cũ.
      (3) Fix: giảm `queueSize` (1–2) khi nhiều upload đồng thời, cân nhắc partSize ↔ số part; **giới hạn upload đồng thời mỗi pod** (semaphore trước khi đọc body, vượt thì 503 + `Retry-After`); scale ngang theo metric "bytes in-flight".
      (4) Tốt nhất: đưa upload ra khỏi backend (presigned multipart) — memory API ≈ 0.
    followUp: "Which metric would you autoscale upload pods on — CPU, memory, or something else?"
    redFlags:
      - "Streams always use constant 64 KB memory"
    verify: true
    tags: [lib-storage, memory]
  - id: scenario-files-016
    level: medium
    type: gotcha
    q: "To protect the server, someone wrapped S3 uploads in `new PQueue({ concurrency: 5 })` inside the upload handler. During a spike, memory still explodes. Why doesn't this help?"
    example: |-
      ```ts
      const queue = new PQueue({ concurrency: 5 });
      app.post("/upload", upload.single("file"), (req, res) => {
        queue.add(() => uploadToS3(req.file!.buffer)).then(() => res.sendStatus(201));
      });
      ```
    hint: |-
      (1) PQueue chỉ giới hạn **số job đang chạy**; 500 request vẫn được accept, Multer vẫn đọc **toàn bộ** body vào RAM, rồi file nằm chờ trong queue → memory = 500 × size. Queue còn **kéo dài** thời gian giữ buffer.
      (2) Admission control phải xảy ra **trước khi đọc body**: đếm upload in-flight/pod, vượt ngưỡng → `503`/`429` + `Retry-After` ngay (client chưa gửi body nếu dùng `Expect: 100-continue`), giới hạn ở nginx (`limit_conn`), ALB/WAF rate limit, và giới hạn trên client (Uppy concurrency).
      (3) Chuyển sang stream (không buffer) hoặc presigned upload.
      (4) Nếu vẫn cần queue: bounded queue (reject khi đầy), không unbounded.
    followUp: "How would you implement a per-pod upload semaphore that also releases correctly when the client disconnects?"
    redFlags:
      - "Increase concurrency to 50 so the queue drains faster"
    tags: [admission-control, concurrency]
  - id: scenario-files-017
    level: medium
    type: scenario
    q: "Uploads through your API work for small files, but anything above ~6 MB fails in one environment, ~10 MB in another, and ~1 GB uploads fail after exactly 60 seconds in a third. Map each symptom to a layer."
    hint: |-
      (1) **~6 MB** → Lambda: payload sync invoke 6 MB request/response (verify) — base64 còn làm file nhỏ hơn ~4.5 MB đã fail.
      (2) **~10 MB** → API Gateway payload limit 10 MB (REST và HTTP API — verify).
      (3) **60 s** → ALB **idle timeout mặc định 60 s** (hoặc nginx `proxy_read_timeout`/`client_body_timeout` 60 s): khi nginx `proxy_request_buffering on` buffer hết body mới gửi upstream, hoặc backend im lặng quá lâu. Node `server.requestTimeout` mặc định 300 s (Node 18+ — verify) cũng có thể cắt.
      (4) Fix đúng: cả 3 → **presigned upload** thẳng S3. Nếu buộc phải qua: tăng idle timeout có kiểm soát, `proxy_request_buffering off`, `client_max_body_size` hợp lý (mặc định 1m).
    followUp: "Why is raising every timeout to 1 hour a bad idea?"
    redFlags:
      - "Blames the network and asks users to retry"
    verify: true
    tags: [limits, lambda, api-gateway, alb]
  - id: scenario-files-018
    level: medium
    type: gotcha
    q: "Your upload API accepts only PNG/JPEG. It checks the extension and the `Content-Type` header. A pentester still uploads an HTML file. How, and what do you do instead?"
    hint: |-
      (1) Extension và `Content-Type` (cả header multipart part) đều do client đặt → giả mạo trivial: `evil.png` với `Content-Type: image/png` chứa `<script>`.
      (2) Sniff **magic bytes** (vd lib `file-type` đọc ~4 KB đầu): PNG `89 50 4E 47 0D 0A 1A 0A`, JPEG `FF D8 FF`. Allowlist theo format thật.
      (3) Magic bytes vẫn chưa đủ (polyglot: file vừa là JPEG vừa chứa HTML/JS) → **re-encode** bằng `sharp` sang format chuẩn, strip metadata; serve với `Content-Type` từ server + `nosniff` + domain riêng.
      (4) Với presigned upload: sniff ở worker sau khi upload, object ở quarantine tới khi pass.
    example: |-
      ```ts
      import { fileTypeFromBuffer } from "file-type"; // ESM-only

      const head = await readFirstBytes(s3Stream, 4100);
      const ft = await fileTypeFromBuffer(head);
      if (!ft || !["image/png", "image/jpeg"].includes(ft.mime)) throw new RejectedUpload("type");
      ```
    followUp: "How do you sniff magic bytes in a streaming pipeline without buffering the whole file?"
    redFlags:
      - "Validate with a regex on the filename"
    verify: true
    tags: [validation, security, magic-bytes]
  - id: scenario-files-019
    level: medium
    type: scenario
    q: "A support ticket shows that opening a user-uploaded SVG avatar in a new tab runs JavaScript on your app domain. Walk through the fix."
    hint: |-
      (1) SVG là XML có thể chứa `<script>`, `onload=`, `<foreignObject>` HTML → mở trực tiếp (top-level navigation) trên origin app = **stored XSS**, đọc được cookie/localStorage/CSRF token. (`<img src=svg>` không chạy script, nhưng mở tab thì có.)
      (2) Ngay: serve uploads từ **domain riêng** (không chung site/cookie), `Content-Disposition: attachment` cho SVG, `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; sandbox`, `X-Content-Type-Options: nosniff`.
      (3) Gốc: không cho SVG làm avatar hoặc **rasterize** sang PNG/WebP bằng `sharp`; nếu phải giữ SVG thì sanitize (DOMPurify với profile SVG) — nhưng rasterize an toàn hơn.
      (4) Rà lại các type khác: HTML, XML, PDF có JS, `.html` đổi tên.
    followUp: "Why is `Content-Type: image/svg+xml` plus CSP on the same domain still weaker than a separate domain?"
    redFlags:
      - "Strip the word script with a regex"
    tags: [security, svg, xss]
  - id: scenario-files-020
    level: medium
    type: debug
    q: "This on-prem file service writes uploads to disk. Find the vulnerability and fix it."
    example: |-
      ```ts
      import path from "node:path";
      import fs from "node:fs";

      bb.on("file", (_field, file, info) => {
        const target = path.join("/data/uploads", req.user.tenantId, info.filename);
        file.pipe(fs.createWriteStream(target));
      });
      ```
    hint: |-
      (1) **Path traversal**: `info.filename` = `../../../etc/cron.d/x` hoặc `..\\..\\` → `path.join` chuẩn hoá và thoát khỏi thư mục tenant, ghi đè file hệ thống / file tenant khác.
      (2) Còn: trùng tên ghi đè file cũ, tên chứa null byte/ký tự điều khiển/Unicode RTL, không giới hạn size (đầy disk), `.pipe` không xử lý lỗi (file dở dang không bị xoá).
      (3) Fix: **không dùng tên client làm path** — `const target = path.join(base, tenantId, crypto.randomUUID())`; lưu `originalName` đã sanitize vào DB để hiển thị/`Content-Disposition`; nếu buộc dùng tên thì `path.resolve` rồi kiểm `startsWith(base + path.sep)`.
      (4) `await pipeline(file, fs.createWriteStream(target, { flags: "wx" }))` + xoá file khi lỗi hoặc `file.truncated`.
    followUp: "The same bug in a zip extraction feature has a name. What is it and how do you prevent it?"
    redFlags:
      - "Replace '../' with '' once (bypassable with '....//')"
    tags: [path-traversal, security, debug]
  - id: scenario-files-021
    level: medium
    type: scenario
    q: "Customers download private invoices (PDF). Currently the API reads from S3 and returns the bytes. Traffic is growing. How do you redesign, and what about links that get forwarded?"
    hint: |-
      (1) API chỉ **kiểm quyền rồi ký presigned GET** TTL ngắn (30–300 s) và trả `302`/JSON URL; bytes đi thẳng S3 (hoặc CloudFront signed URL để có cache edge + WAF).
      (2) Đặt `ResponseContentDisposition: attachment; filename="INV-2026-001.pdf"` và `ResponseContentType` khi ký → tên file đúng, không render lạ.
      (3) Link bị forward: trong TTL thì **ai cũng dùng được** (bearer URL) → TTL ngắn, ký ngay khi user bấm (không nhúng sẵn trong email), không log full URL, CloudFront có thể giới hạn IP (custom policy) nếu cần.
      (4) Audit: log sự kiện "signed download" (user, object, time) ở API vì S3 không biết user là ai (bật S3 server access log/CloudTrail data events nếu cần).
    followUp: "Your presigned URLs sometimes expire after 1 hour even though you set 12 hours. Why?"
    redFlags:
      - "Make invoices public with unguessable UUID keys and no expiry"
    tags: [download, presigned-get, security]
  - id: scenario-files-022
    level: medium
    type: debug
    q: "A download proxy endpoint makes memory spike when users fetch 2 GB exports, and aborted downloads keep S3 connections busy. Review it."
    example: |-
      ```ts
      app.get("/exports/:id/download", async (req, res) => {
        const obj = await s3.send(new GetObjectCommand({ Bucket, Key: keyFor(req.params.id) }));
        const bytes = await obj.Body!.transformToByteArray();
        res.setHeader("Content-Type", "application/zip");
        res.send(Buffer.from(bytes));
      });
      ```
    hint: |-
      (1) `transformToByteArray()` đọc **toàn bộ** 2 GB vào RAM (và `Buffer.from` có thể copy thêm lần nữa) → OOM; còn vượt giới hạn Buffer tối đa ở vài version.
      (2) Fix: stream — `await pipeline(obj.Body as Readable, res)` (từ `node:stream/promises`); `pipeline` destroy S3 body khi client abort → trả socket về pool. `.pipe()` thì **không** destroy source khi `res` đóng → socket S3 treo tới timeout, pool cạn (`maxSockets`).
      (3) Forward `Range` → `GetObjectCommand({ Range })`, trả `206` + `Content-Range`; set `Content-Length` từ `ContentLength`, `ETag`, `Content-Disposition`.
      (4) Tốt hơn nữa: không proxy — redirect sang presigned GET/CloudFront.
    followUp: "How do you log a failed download when the error happens after headers were already sent?"
    redFlags:
      - "Increase the pod memory"
      - "Use res.write in a loop without checking the return value"
    tags: [download, streaming, debug]
  - id: scenario-files-023
    level: medium
    type: compare
    q: "For private content, compare S3 presigned GET, CloudFront signed URLs and CloudFront signed cookies. Which do you use for a private HLS course video?"
    hint: |-
      (1) **S3 presigned GET**: ký bằng IAM credential, 1 URL = 1 object, không cache edge, tối đa 7 ngày (ngắn hơn nếu temp creds). Hợp: file đơn lẻ, ít traffic.
      (2) **CloudFront signed URL**: ký bằng key pair của **key group** (không dùng root key cũ), canned policy (1 URL, hết hạn) hoặc custom policy (wildcard path, IP range, start time); có cache edge, OAC khoá bucket.
      (3) **Signed cookies**: 1 lần set cookie cho cả path `/courses/42/*` → hợp **HLS/DASH** vì playlist tham chiếu hàng trăm segment `.ts`/`.m4s`, không thể ký từng URL trong manifest (hoặc phải rewrite manifest).
      (4) Trade-off: cookie cần domain CloudFront là subdomain của site (cookie domain), CORS/`SameSite`; URL dễ share hơn → TTL ngắn.
    followUp: "How would you revoke access for a user whose subscription ended five minutes ago?"
    tags: [cloudfront, signed-url, hls]
  - id: scenario-files-024
    level: medium
    type: scenario
    q: "Users upload 5 GB raw footage from a browser. The upload dies at 80% when the laptop sleeps and they must start over. Design resumable uploads on S3."
    hint: |-
      (1) Server `CreateMultipartUpload` → lưu `uploadId`, key, part size, owner vào DB (row `uploading`).
      (2) Client xin presigned URL **từng part** (hoặc theo batch) → PUT song song 3–6 part, retry từng part với backoff; lưu progress local (IndexedDB: `uploadId`, part đã xong).
      (3) Resume: client gửi `uploadId` → server gọi **`ListParts`** (nguồn sự thật, không tin client) → trả part còn thiếu → tiếp tục. File phải là **cùng file** (so kích thước + `lastModified` + hash vài MB đầu).
      (4) Xong: server `CompleteMultipartUpload` với danh sách `{PartNumber, ETag}`; lifecycle `AbortIncompleteMultipartUpload` dọn upload bỏ dở; presigned part TTL ngắn nhưng xin lại được.
    followUp: "Would you use tus instead? What changes on the server side?"
    redFlags:
      - "Store the whole file in localStorage to resume"
    tags: [multipart, resumable, upload]
  - id: scenario-files-025
    level: medium
    type: debug
    q: "An export endpoint tries to stream a JSON array of 1M orders. Clients get invalid JSON, and sometimes the server logs `write after end`. What's wrong?"
    example: |-
      ```ts
      app.get("/orders/export", (req, res) => {
        const stream = db.streamOrders();
        res.write("[");
        stream.on("data", (row) => {
          res.write(JSON.stringify(row));
        });
        res.end("]");
      });
      ```
    hint: |-
      (1) `res.end("]")` chạy **ngay** (đồng bộ) trước khi event `data` nào tới → mọi `write` sau đó là `write after end`.
      (2) Không có dấu phẩy giữa các object → JSON không hợp lệ; không kiểm `res.write()` trả `false` → không backpressure, buffer phình; không xử lý lỗi DB giữa chừng hay client abort.
      (3) Fix: dùng **NDJSON** (`application/x-ndjson`, mỗi dòng 1 object) qua `pipeline(dbStream, toNdjson, res)`; hoặc nếu phải là JSON array thì Transform tự chèn `[`, `,`, `]` ở `transform`/`flush`.
      (4) Lỗi giữa chừng sau khi đã gửi 200 → không đổi status được: `res.destroy(err)` để client thấy connection bị cắt, hoặc ghi dòng trailer `{"error":...}`; export rất lớn → background job + file S3.
    followUp: "How does the client parse NDJSON incrementally with `fetch`?"
    tags: [ndjson, streaming, debug]
  - id: scenario-files-026
    level: medium
    type: scenario
    q: "Your dashboard uses SSE. Users with 7 tabs open say the 7th tab never loads anything, and after a deploy all clients miss events that happened during the restart. Explain both."
    hint: |-
      (1) **HTTP/1.1**: browser giới hạn ~**6 connection/host** (Chrome/Firefox); mỗi SSE giữ 1 connection mãi → tab thứ 7 (và cả XHR khác tới cùng host) bị treo. Fix: HTTP/2 (multiplex, mặc định ~100 stream) ở edge, hoặc 1 connection chia sẻ giữa các tab (`SharedWorker`/`BroadcastChannel`).
      (2) Mất event khi restart: SSE tự reconnect và gửi header **`Last-Event-ID`** chỉ khi server đã gửi `id:` cho mỗi event. Server phải lưu event gần đây (Redis Stream/DB, vd 5 phút) và **replay từ id đó**; gap quá xa → gửi snapshot.
      (3) Gửi `retry: 3000` để điều khiển reconnect; thêm jitter phía server để tránh reconnect storm sau deploy.
