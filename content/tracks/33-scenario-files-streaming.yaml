  - id: scenario-files-052
    level: senior
    type: design
    q: "On-prem constraint: no direct client-to-storage access, every byte must pass through your Node service for inline encryption. Support 200 concurrent 1 GB uploads on pods with 2 GB RAM. Design it."
    hint: |-
      (1) Ngân sách memory: 2 GB pod − ~300 MB baseline → ~1.5 GB cho upload → 200 upload/N pod. Với partSize 8 MB × queueSize 1 + buffer cipher ≈ 10 MB/upload → ~150 upload/pod an toàn → tối thiểu 2 pod + dư (4–6 pod) vì peak/rolling deploy.
      (2) Pipeline: LB (idle timeout đủ, không buffer body) → nginx `proxy_request_buffering off`, `client_max_body_size 1100m` → busboy → `crypto.createCipheriv('aes-256-gcm')` Transform (GCM auth tag ở cuối, lưu riêng; hoặc envelope encryption với data key từ KMS/Vault per file) → lib-storage tới MinIO/S3-compatible.
      (3) Admission: semaphore per pod, vượt → `503 Retry-After`; LB least-connections (không round-robin) vì request dài; graceful shutdown chờ upload đang chạy (terminationGracePeriod dài hoặc drain + client resume).
      (4) Resumable: chunk API riêng (mỗi chunk 8–16 MB là request ngắn, dễ retry, hợp LB timeout) thay vì 1 request 1 GB; metric bytes in-flight, throughput/pod, 5xx theo lý do.
