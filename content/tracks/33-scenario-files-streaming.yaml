  - id: scenario-files-051
    level: senior
    type: open
    q: "For resumable uploads across web, iOS and Android, would you build on raw S3 multipart, adopt the tus protocol, or write your own chunked upload API? What drives the decision?"
    hint: |-
      (1) **S3 multipart presigned**: bytes không qua server, rẻ, scale sẵn; nhưng client phải hiểu S3 (ETag, CORS, part rules), lock-in S3 API, logic resume tự viết mỗi platform.
