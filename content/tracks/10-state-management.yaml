id: 10-state-management
slug: state-management
title: State Management & Data Fetching
tier: 3
status: drafted
summary: Local vs global vs server state, Redux Toolkit & RTK Query, TanStack Query (cache, staleTime, invalidation), Zustand/Context, optimistic updates, real-time data vào cache, SSR store per request.
cvLinked: true
prerequisites: [09-react]
overview: |-
  ## TL;DR

  - Câu hỏi đầu tiên không phải "Redux hay Zustand" mà là **state này thuộc loại nào**: server state (dữ liệu của backend, cache có thể cũ), client/UI state (chỉ tồn tại ở browser), URL state, form draft.
  - **Server state** cần: cache, dedupe, stale-while-revalidate, refetch, invalidation, retry, pagination → dùng **TanStack Query** hoặc **RTK Query** (hoặc RSC ở Next.js). Copy response vào global store thủ công là nguồn bug số 1.
  - **Client state** toàn cục (nhiều màn hình cùng ghi/đọc) → Redux Toolkit / Zustand / Jotai; ít đổi → Context.
  - **Optimistic update** = cập nhật cache trước, rollback khi lỗi, luôn **reconcile** với server (invalidate/refetch) sau cùng.
  - Selector + reference stability quyết định hiệu năng: selector trả object mới mỗi lần = re-render mỗi lần.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Server state | Bản sao **có thể cũ** của dữ liệu thuộc backend | danh sách order, profile |
  | Client state | Dữ liệu chỉ có ở client | modal mở, theme, bước wizard, cart offline |
  | Query key | Định danh cache entry (TanStack Query) | `['orders', { status, page }]` |
  | `staleTime` | Bao lâu dữ liệu được coi là **fresh** (không refetch khi mount/focus) | default `0` → luôn stale |
  | `gcTime` | Entry **không còn observer** bị xoá khỏi cache sau bao lâu | default 5 phút (v5, trước là `cacheTime`) |
  | Invalidation | Đánh dấu stale + refetch query đang active | `invalidateQueries({ queryKey: ['orders'] })` |
  | Tags (RTK Query) | Query `providesTags`, mutation `invalidatesTags` | `['Order', { type: 'Order', id }]` |
  | Selector | Hàm đọc một phần store; memoized khi derive | `createSelector([selectItems], items => total(items))` |
  | Normalization | Lưu entity theo id, list chỉ giữ id | `createEntityAdapter()` → `{ ids, entities }` |
  | Optimistic update | Cập nhật UI trước khi server xác nhận | like/unlike, kéo thả sắp xếp |

  ## Cơ chế hoạt động

  ### TanStack Query — vòng đời một query

  ```mermaid
  flowchart TD
    A["Component mount<br/>useQuery(key)"] --> B{"Có cache cho key?"}
    B -- no --> C["status: pending<br/>fetch"]
    B -- yes --> D{"Còn fresh?<br/>(age < staleTime)"}
    D -- yes --> E["Trả cache, KHÔNG fetch"]
    D -- no --> F["Trả cache ngay (stale)<br/>+ refetch nền (isFetching)"]
    C --> G["success → cache[key]"]
    F --> G
    G --> H["Trigger refetch khi stale:<br/>mount mới, window focus,<br/>reconnect, invalidate, interval"]
    I["Observer cuối unmount"] --> J["Đếm gcTime → xoá entry"]
  ```

  ### Optimistic update có rollback (TanStack Query)

  ```mermaid
  sequenceDiagram
    participant UI
    participant QC as QueryClient cache
    participant API
    UI->>QC: onMutate: cancelQueries(key)
    UI->>QC: snapshot = getQueryData(key)
    UI->>QC: setQueryData(key, optimistic)
    UI->>API: mutationFn()
    alt thành công
      API-->>UI: 200
    else lỗi
      API-->>UI: 4xx/5xx
      UI->>QC: onError: setQueryData(key, snapshot)
    end
    UI->>QC: onSettled: invalidateQueries(key) (reconcile)
  ```

  ### Redux Toolkit data flow

  ```mermaid
  flowchart LR
    A["UI dispatch(action)"] --> B["Middleware<br/>(thunk, listener, RTK Query)"]
    B --> C["Reducers (createSlice + Immer)<br/>pure, sync"]
    C --> D["New state (immutable)"]
    D --> E["useSelector re-run<br/>so sánh ===, render nếu khác"]
  ```

  ## Trade-offs

  | Tool | Mạnh | Yếu | Hợp khi |
  |---|---|---|---|
  | Context + `useReducer` | Không thêm dependency | Không selector → consumer re-render hết | Theme, auth, locale, DI |
  | Redux Toolkit | Kiến trúc rõ, DevTools, middleware, team lớn | Boilerplate hơn, học nhiều khái niệm | App lớn, nhiều người, logic client phức tạp |
  | RTK Query | Cache server state tích hợp Redux, tags | Gắn với Redux; normalized cache không có sẵn | Đã dùng Redux |
  | TanStack Query | Server state mạnh nhất, devtools, infinite, SSR hydration | Chỉ lo server state | Hầu hết app có API |
  | Zustand | Nhỏ, selector, ngoài React dùng được | Ít convention, dễ thành "bãi rác" | Client state vừa phải |
  | Jotai / atoms | State dạng nguyên tử, derive tự nhiên | Graph atom khó theo dõi khi lớn | UI state phân mảnh, editor |
  | URL (search params) | Share link, back/forward | Chỉ serializable, giới hạn độ dài | Filter, sort, page, tab |

  ## Pitfalls

  - Lưu response API vào Redux **và** React Query → hai nguồn sự thật lệch nhau.
  - `staleTime: 0` mặc định + nhiều component cùng key → refetch khi mỗi component mount/khi focus — tưởng là bug "gọi API liên tục".
  - Query key thiếu biến (`['orders']` nhưng queryFn dùng `status`) → cache trả nhầm dữ liệu.
  - Selector trả object/array mới (`state => ({ a: state.a })`, `.filter`) → re-render mỗi action.
  - Tạo Redux store/QueryClient ở **module scope** trong app SSR → dữ liệu user A lộ sang user B.
  - Optimistic update quên `cancelQueries` → refetch đang bay ghi đè giá trị optimistic.
  - Thunk/effect không huỷ khi rời màn hình → set state vào store của màn hình khác.
  - Lưu dữ liệu non-serializable (Date, class, Promise) vào Redux → DevTools/persist hỏng.

  ## Cheat sheet

  - TanStack Query v5: `staleTime` 0, `gcTime` 5 phút, `retry` 3 (client), refetch khi mount/focus/reconnect nếu stale. `isPending` = chưa có data; `isFetching` = đang fetch (kể cả nền); `isLoading` = `isPending && isFetching`.
  - `invalidateQueries` (stale + refetch active) vs `refetchQueries` (fetch ngay) vs `setQueryData` (ghi tay) vs `removeQueries`.
  - Query key: array, serializable, **chứa mọi biến queryFn dùng**; dùng key factory.
  - RTK: `configureStore` (thunk + dev checks), `createSlice` (Immer), `createAsyncThunk`, `createEntityAdapter`, `createListenerMiddleware`, `createSelector`.
  - RTK Query: `providesTags`/`invalidatesTags`, `keepUnusedDataFor` (default 60s), optimistic qua `onQueryStarted` + `updateQueryData` + `patch.undo()`.
  - Zustand: luôn select slice; nhiều field → `useShallow`.
  - SSR/Next.js: store & QueryClient **per request**; Server Components không dùng được store client.
