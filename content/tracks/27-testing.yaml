id: 27-testing
slug: testing
title: Testing Strategy
tier: 7
status: drafted
summary: Test pyramid vs trophy, unit/integration/e2e/contract (Pact), Jest/Vitest, Supertest, React Testing Library, Playwright, test doubles, testcontainers, flaky tests, TDD, coverage, test auth & tenant isolation, test Kafka consumer, mutation testing.
cvLinked: true
prerequisites: []
overview: |-
  ## TL;DR

  - Mục tiêu của test không phải coverage mà là **tự tin để thay đổi code và deploy** — test tốt bắt bug thật, chạy nhanh, ít flaky, và **không vỡ khi refactor** (test hành vi, không test implementation).
  - Pyramid (nhiều unit, ít e2e) vs **trophy** (static + nhiều **integration**) — với backend Node gọi DB và frontend React, integration test với **dependency thật** (testcontainers, RTL render component thật) thường cho tỉ lệ tự tin/chi phí tốt nhất.
  - Senior interview xoáy vào: **mock cái gì và không mock cái gì**, test với **DB thật**, **flaky test**, **contract test** giữa microservices, test **auth & tenant isolation**, test **consumer Kafka** (idempotency, retry), giới hạn của coverage.
  - Công cụ cần nói được: Jest/Vitest, Supertest, React Testing Library (+ user-event, MSW), Playwright, Testcontainers, Pact, Stryker, k6 (xem track Observability).

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Unit test | Test một đơn vị logic cô lập, nhanh (ms) | `calculateDiscount(cart, coupon)` |
  | Integration test | Test nhiều thành phần thật phối hợp (HTTP + service + DB) | Supertest `POST /orders` → Postgres thật trong container |
  | E2E test | Test cả hệ thống qua UI/API như người dùng | Playwright: đăng nhập → thêm giỏ → checkout |
  | Contract test | Xác minh consumer và provider đồng ý về API/message | Pact: consumer sinh contract, provider verify trong CI |
  | Test double | Thứ thay thế dependency thật trong test | dummy, stub, spy, mock, fake (Meszaros) |
  | Fake | Implementation thật nhưng đơn giản | `InMemoryOrderRepository` |
  | Flaky test | Kết quả khác nhau với cùng code | Pass local, fail CI 1/10 lần do race timer |
  | Testcontainers | Khởi động dependency thật (Postgres, Kafka, Redis) bằng Docker trong test | `new PostgreSqlContainer("postgres:16").start()` |
  | Mutation testing | Sửa code có chủ đích (mutant) xem test có bắt được không | Đổi `>=` thành `>` mà test vẫn xanh → test yếu |
  | Coverage | % code được **chạy** bởi test — không phải % được **kiểm tra** | 100% line coverage với test không có assertion |

  ## Cơ chế hoạt động

  **Chọn loại test cho một thay đổi:**

  ```mermaid
  flowchart TD
    A["Thay đổi cần test"] --> B{"Logic thuần<br/>(tính toán, parse, rule)?"}
    B -- "có" --> U["Unit test<br/>table-driven, edge cases"]
    B -- "không" --> C{"Chạm DB / queue / HTTP?"}
    C -- "có" --> I["Integration test<br/>Supertest + testcontainers<br/>(DB thật, mock chỉ 3rd-party)"]
    C -- "không" --> D{"UI component?"}
    D -- "có" --> R["RTL: render + user-event<br/>MSW cho network"]
    D -- "không" --> E{"Ranh giới giữa 2 service/team?"}
    E -- "có" --> P["Contract test (Pact)"]
    A --> F{"Journey quan trọng<br/>(login, checkout)?"}
    F -- "có" --> E2E["Vài Playwright e2e<br/>smoke trên staging/prod"]
  ```

  **Consumer-driven contract testing (Pact):**

  ```mermaid
  sequenceDiagram
    participant C as Consumer CI (web / order-service)
    participant B as Pact Broker
    participant P as Provider CI (catalog-service)
    C->>C: test với Pact mock server → sinh pact (contract)
    C->>B: publish pact (version = git SHA)
    B->>P: webhook: có contract mới
    P->>P: replay request trong pact vào provider thật (provider states)
    P->>B: publish verification result
    C->>B: can-i-deploy? (consumer SHA vs provider đang ở prod)
    B-->>C: yes / no
  ```

  ## Trade-offs

  | Loại test | Tốc độ | Độ tự tin | Chi phí bảo trì | Hay vỡ vì |
  |---|---|---|---|---|
  | Unit (mock nhiều) | Rất nhanh | Thấp–vừa | Cao nếu mock implementation | Refactor |
  | Unit (logic thuần) | Rất nhanh | Vừa | Thấp | Đổi requirement |
  | Integration (DB thật) | Vừa (giây) | Cao | Vừa | Schema/fixture |
  | Contract | Nhanh | Cao cho ranh giới API | Vừa (cần broker, quy trình) | Đổi API |
  | E2E UI | Chậm | Cao nhất cho journey | Cao | Selector, timing, dữ liệu, môi trường |

  | Công cụ | Chọn khi | Lưu ý |
  |---|---|---|
  | Jest | Codebase CJS có sẵn, ecosystem lớn | ESM/TS cần cấu hình transform |
  | Vitest | Dự án Vite/ESM/TS mới, muốn nhanh | API gần Jest (`vi` thay `jest`), migrate dễ |
  | Playwright | E2E nhiều browser, auto-wait, trace | Cần quản lý dữ liệu test/auth state |
  | Cypress | Team đã quen, DX debug tốt | Mô hình chạy trong browser, hạn chế multi-tab/origin |

  ## Pitfalls

  - Mock mọi thứ (kể cả DB/ORM) → test xanh nhưng query SQL sai, migration sai, constraint không được test.
  - Test implementation (gọi hàm private, assert số lần gọi nội bộ) → vỡ khi refactor, không bắt bug.
  - `setTimeout`/`sleep` cố định trong test async → flaky; dùng `findBy*`, `waitFor`, web-first assertions.
  - Test chia sẻ state (DB không reset, biến module) → phụ thuộc thứ tự chạy.
  - Coverage là KPI → test không có assertion để đạt số.
  - E2E cho mọi case → pipeline 1 giờ, flaky, bị bỏ qua.
  - Không test đường lỗi: timeout, retry, 401/403, tenant khác, message trùng.
  - Retry flaky test tự động mà không bao giờ fix → che giấu race condition thật trong code.

  ## Cheat sheet

  - Query RTL theo ưu tiên: `getByRole` > `getByLabelText` > `getByText` > `getByTestId`. Async: `findBy*`. User action: `userEvent.setup()`.
  - Network ở FE/Node test: **MSW** thay vì mock `fetch` bằng tay.
  - API test: `supertest(app)` không cần `listen()`; DB thật qua testcontainers; mỗi test tự tạo dữ liệu, reset bằng transaction rollback hoặc truncate.
  - Double: stub (trả giá trị), spy (ghi nhận lời gọi), mock (kỳ vọng lời gọi), fake (implementation nhẹ). Chỉ mock **ranh giới** bạn không sở hữu (payment, email, clock).
  - Thời gian: fake timers / inject clock; ngẫu nhiên: seed; ID: inject generator.
  - Flaky: đo flaky rate, quarantine có owner + hạn, fix gốc (race, order, time, shared state, network).
  - Contract test cho ranh giới giữa service/team; e2e chỉ cho vài journey trọng yếu.
  - Auth/tenant: test ma trận **role × resource × tenant** ở tầng API; test "tenant A không đọc được data tenant B" cho **mọi** endpoint list/get/update/delete.
  - Kafka consumer: tách handler thuần để unit test; integration với Kafka/Redpanda container; test duplicate, out-of-order, poison message → DLQ.
  - Mutation score (Stryker) đo chất lượng test tốt hơn line coverage.
