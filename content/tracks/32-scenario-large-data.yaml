id: 32-scenario-large-data
slug: scenario-data
title: "Scenarios: Pagination, Export & Large Data"
tier: 9
status: drafted
summary: Mock interview tình huống production với dữ liệu lớn — pagination chậm ở trang sau, export/import hàng triệu row, xoá 10M row, backfill, query tự nhiên chậm, index vẫn chậm, 2 database, reporting trên OLTP, soft delete, partition & archive.
cvLinked: true
prerequisites: [13-sql-postgres, 08-api-design]
overview: |-
  ## TL;DR

  - Gần như mọi scenario "data lớn" đều quy về 4 câu: **đọc bao nhiêu byte/row để trả lời?**, **giữ lock/transaction bao lâu?**, **sinh ra bao nhiêu WAL/dead tuple?**, **ai khác (replica, vacuum, user) bị ảnh hưởng?**
  - Pagination: `OFFSET n` là **O(n)** — DB vẫn phải đọc và bỏ n row. Keyset/cursor với khoá sort **unique** `(created_at, id)` + index khớp `ORDER BY` cho thời gian gần như hằng số ở mọi trang.
  - Export/import triệu row: **async job** + **stream** (DB cursor / `COPY ... TO STDOUT` → transform → gzip → S3 multipart) có **backpressure**; không bao giờ `findMany()` rồi `join('\n')`. Import: `COPY FROM STDIN` vào **staging table** rồi upsert.
  - Xoá / backfill hàng chục triệu row: **batch nhỏ, transaction ngắn, resumable, throttle theo replica lag**. PostgreSQL **không có `DELETE ... LIMIT`**. Xoá cả khoảng thời gian → partition + `DETACH`/`DROP`.
  - Query "tự nhiên chậm": query không đổi nhưng **data, statistics, plan, lock, pool, cache** đổi. Luôn bắt đầu bằng đo (`pg_stat_statements`, `pg_stat_activity`, `EXPLAIN (ANALYZE, BUFFERS)`), không đoán.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Offset pagination | Bỏ qua n row đầu rồi lấy k row | `LIMIT 20 OFFSET 100000` đọc 100.020 row |
  | Keyset / cursor pagination | Lấy tiếp từ giá trị sort của row cuối | `WHERE (created_at, id) < ($1, $2) ORDER BY created_at DESC, id DESC LIMIT 21` |
  | Tie-breaker | Cột unique thêm vào cuối khoá sort để thứ tự là toàn phần | `created_at` trùng → thêm `id` |
  | Opaque cursor | Client chỉ thấy chuỗi, không thấy cấu trúc | `base64url(JSON{v:1,k:[ts,id],f:hash})` + HMAC |
  | Server-side cursor / stream | DB trả kết quả theo từng batch trên một connection | `pg-query-stream` với `batchSize: 1000` |
  | `COPY ... TO STDOUT` | Server stream CSV qua wire protocol về client | `pg-copy-streams` `to(...)` |
  | Backpressure | Consumer chậm thì producer dừng đọc | `pipeline(dbStream, csv, gzip, upload)` |
  | Staging table | Bảng tạm để load thô rồi validate/merge | `COPY staging FROM STDIN` → `INSERT ... ON CONFLICT` |
  | Batched delete | Xoá theo lô nhỏ, commit từng lô | `DELETE ... WHERE id IN (SELECT id ... LIMIT 5000)` |
  | Partition drop/detach | Bỏ cả một partition thay vì xoá từng row | `ALTER TABLE orders DETACH PARTITION orders_2022 CONCURRENTLY` |
  | Bloat | Dead tuple/page trống sau DELETE/UPDATE | Xoá 60% row, file vẫn 800 GB |
  | Generic vs custom plan | Plan cache của prepared statement trong Postgres | Sau 5 lần execute, planner có thể chuyển sang generic plan |
  | Parameter sniffing | SQL Server compile plan theo giá trị tham số đầu tiên | Plan cho tenant nhỏ bị dùng cho tenant 10M row |
  | Read model (CQRS) | Bản denormalize phục vụ đọc, đồng bộ bằng event | Document `order_view` trong Elasticsearch |
  | Outbox / CDC | Ghi event cùng transaction / đọc WAL để phát thay đổi | `outbox` table, Debezium logical slot |

  ## Cơ chế hoạt động

  ### Vì sao OFFSET chậm dần còn keyset thì không

  ```mermaid
  flowchart LR
    subgraph OFF["OFFSET 100000 LIMIT 20"]
      O1["Index scan từ đầu"] --> O2["Đọc 100.020 entry + heap"] --> O3["Vứt 100.000"] --> O4["Trả 20"]
    end
    subgraph KEY["Keyset: (created_at, id) < cursor"]
      K1["Index seek tới cursor"] --> K2["Đọc 21 entry"] --> K3["Trả 20 + hasNext"]
    end
  ```

  ### Export triệu row: async + stream + backpressure

  ```mermaid
  sequenceDiagram
    participant U as User
    participant API as API
    participant Q as Queue
    participant W as Worker
    participant DB as "Postgres (replica)"
    participant S3 as S3
    U->>API: POST /exports (Idempotency-Key)
    API->>API: INSERT export_jobs (queued) ON CONFLICT DO NOTHING
    API->>Q: enqueue jobId
    API-->>U: 202 Accepted + Location /exports/{id}
    Q->>W: jobId (concurrency limit per tenant)
    W->>DB: COPY (SELECT ...) TO STDOUT / cursor batches
    loop mỗi chunk (backpressure)
      DB-->>W: rows
      W->>W: CSV escape + formula-injection guard + gzip
      W->>S3: UploadPart (>= 5 MiB)
      W->>API: progress, checkpoint
    end
    W->>S3: CompleteMultipartUpload
    W->>API: status=succeeded
    U->>API: GET /exports/{id}
    API-->>U: presigned URL (hết hạn 15 phút)
  ```

  ### Batched delete / backfill an toàn

  ```mermaid
  flowchart TD
    S["Lấy checkpoint (last_id) từ bảng job"] --> B["DELETE/UPDATE 1 batch theo PK range<br/>trong transaction ngắn"]
    B --> C["Ghi checkpoint = max id của batch"]
    C --> M{"replica lag > 5s<br/>hoặc CPU > 70%?"}
    M -- yes --> P["Sleep / giảm batch size"] --> M
    M -- no --> D{"Còn row?"}
    D -- yes --> B
    D -- no --> V["VACUUM (ANALYZE) bảng<br/>kiểm tra bloat, REINDEX CONCURRENTLY nếu cần"]
  ```

  ### Query tự nhiên chậm: cây quyết định

  ```mermaid
  flowchart TD
    A["p99 tăng, SQL không đổi"] --> B{"pg_stat_statements:<br/>mean_exec_time tăng?"}
    B -- "không" --> P["Chậm ngoài DB: pool acquire,<br/>network, app CPU, N+1"]
    B -- "có" --> C{"pg_stat_activity:<br/>wait_event_type?"}
    C -- "Lock" --> L["Ai giữ lock? pg_blocking_pids(),<br/>DDL, long txn"]
    C -- "IO" --> I["Cold cache, bloat, disk throttling"]
    C -- "null / CPU" --> E["EXPLAIN (ANALYZE, BUFFERS):<br/>plan đổi? estimate lệch?"]
    E --> F["ANALYZE, extended stats,<br/>generic plan, index mới"]
  ```

  ## Khung trả lời

  Dùng cho mọi câu "data lớn / query chậm" trong mock interview:

  1. **Làm rõ và đo** (30 giây): bao nhiêu row, tăng bao nhanh, SLA latency, đọc hay ghi, có replica không, DB engine/version. "Trước khi sửa tôi muốn thấy `EXPLAIN (ANALYZE, BUFFERS)` và `pg_stat_statements`."
  2. **Chặn cháy trước**: giảm blast radius (giới hạn page size, tắt filter nặng, chuyển job sang replica, `statement_timeout`, pause batch job).
  3. **Nêu root cause bằng cơ chế**, không bằng từ khoá: "OFFSET đọc n row rồi bỏ", "DELETE một phát tạo một transaction dài giữ xmin và sinh WAL cho từng row".
  4. **Fix theo thứ tự ưu tiên**: thay đổi rẻ nhất có tác dụng (index, rewrite query) → thay đổi thiết kế (keyset, async job, read model) → thay đổi hạ tầng (partition, replica, warehouse).
  5. **Trade-off + con số**: "keyset mất khả năng nhảy trang", "REPEATABLE READ 2 giờ giữ vacuum", "batch 5k row ~ 50–200 ms".
  6. **Vận hành**: resumable, idempotent, có metric/alert, có kế hoạch rollback, và làm sao để không lặp lại (lint, guardrail, runbook).

  ## Trade-offs

  | Vấn đề | Cách | Được | Mất | Hợp khi |
  |---|---|---|---|---|
  | Pagination | OFFSET | Nhảy trang, đơn giản | O(offset), trùng/sót khi data đổi | Dataset nhỏ, admin, page ≤ ~100 |
  | Pagination | Keyset | Hằng số, ổn định khi insert | Không nhảy trang, cursor gắn với sort | Feed, API public, infinite scroll |
  | Export | Sync stream qua HTTP | Không cần hạ tầng job | Timeout LB, retry = chạy lại từ đầu | < ~100k row, vài giây |
  | Export | Async job + S3 | Resumable, giới hạn concurrency | Phức tạp hơn, cần notify | Triệu row, multi-tenant |
  | Đọc dữ liệu export | Cursor stream | Một query, một snapshot | Giữ connection + transaction suốt job | Vài phút |
  | Đọc dữ liệu export | Keyset batches | Transaction ngắn, resume dễ | Không có snapshot chung | Hàng giờ, chấp nhận "gần đúng" |
  | Xoá dữ liệu cũ | Batched DELETE | Không cần đổi schema | WAL + bloat, chậm | Một lần, vài % bảng |
  | Xoá dữ liệu cũ | Partition DROP/DETACH | Gần như tức thì, không bloat | Phải thiết kế partition, PK chứa partition key | Retention theo thời gian, định kỳ |
  | Xoá dữ liệu cũ | Copy keepers + swap | Bảng mới gọn | Cần catch-up + cutover, FK/view phức tạp | Giữ lại < ~20% |
  | Reporting | Replica | Rẻ, nhanh triển khai | Lag, query conflict trên standby | Báo cáo gần real-time |
  | Reporting | MV / summary table | Đọc cực nhanh | Stale, chi phí refresh | Dashboard lặp lại |
  | Reporting | Warehouse + CDC | Tách hẳn OLTP, columnar | Hạ tầng, eventual | Analytics nặng, nhiều nguồn |

  ## Pitfalls

  - `DELETE FROM t WHERE ... LIMIT 10000` trên Postgres → **syntax error**. Đó là MySQL; SQL Server là `DELETE TOP (10000)`.
  - Keyset mà khoá sort không unique (`ORDER BY created_at` một mình) → **sót row** trùng timestamp ở biên trang.
  - Đổi filter/sort nhưng vẫn nhận cursor cũ → trang trả về vô nghĩa; cursor phải mang hash của filter/sort.
  - `COPY table TO '/path/file.csv'` từ app → file nằm trên **máy DB**, cần superuser/`pg_write_server_files`; managed DB (RDS) không cho.
  - Stream mà bỏ qua giá trị trả về của `write()` → không có backpressure → OOM chậm rãi.
  - Export "consistent" bằng một transaction `REPEATABLE READ` chạy 3 giờ trên primary → vacuum không dọn được gì trong 3 giờ.
  - Batched delete không có index trên predicate hoặc trên **FK của bảng con** → mỗi batch seq scan.
  - Xoá xong tưởng disk giảm: `VACUUM` thường **không trả space cho OS** (trừ trang cuối file).
  - Coi "parameter sniffing" là khái niệm Postgres, hoặc nhắc "MySQL query cache" (đã **bị xoá ở MySQL 8.0**).
  - Soft delete với `UNIQUE(email)` thường → user không đăng ký lại được; mọi query quên `deleted_at IS NULL`.

  ## Cheat sheet

  - Keyset: khoá sort unique `(created_at, id)`, index cùng thứ tự/chiều, `LIMIT n+1` để biết `hasNext`, cursor = base64url(JSON) + HMAC + version + filter hash.
  - Mixed direction (`created_at DESC, id ASC`) → không dùng được row value; viết `OR` mở rộng và index `(created_at DESC, id ASC)`.
  - Total count: bỏ, hoặc `EXPLAIN` estimate, hoặc capped count (`count(*) FROM (... LIMIT 10001)` → "10.000+").
  - Elasticsearch deep paging: `from + size` ≤ `index.max_result_window` (mặc định 10.000) → dùng `search_after` + PIT.
  - Export: `POST` → 202 → worker → `COPY (SELECT ...) TO STDOUT WITH (FORMAT csv, HEADER)` → gzip → `@aws-sdk/lib-storage` `Upload` → presigned URL ngắn hạn. Chạy trên replica, giới hạn concurrency theo tenant.
  - Excel: tối đa **1.048.576 row / sheet** → chia sheet/file hoặc đưa CSV. Chặn formula injection: ô bắt đầu bằng `= + - @` tab CR → prefix `'`.
  - Import: stream parse → `COPY staging FROM STDIN` → validate bằng SQL → `INSERT ... ON CONFLICT DO UPDATE` theo batch; lưu `file_sha256` để idempotent; trả error report CSV.
  - Bind parameter tối đa **65.535** mỗi statement ở Postgres (SQL Server 2.100) → batch size = floor(65535 / số cột) hoặc dùng `unnest($1::int[], ...)`.
  - Delete lớn: `WHERE id IN (SELECT id ... ORDER BY id LIMIT 5000)` hoặc PK range; index trên predicate và FK con; sleep; throttle theo `pg_stat_replication.replay_lag`; sau đó `VACUUM (ANALYZE)`.
  - Partition: `DETACH PARTITION ... CONCURRENTLY` (PG14+, ngoài transaction block) rồi `DROP TABLE`; PK/unique phải chứa partition key; query phải filter theo partition key để được pruning.
  - Query chậm: `pg_stat_statements` → `pg_stat_activity` (wait_event, state, xact_start) → `pg_locks`/`pg_blocking_pids()` → `EXPLAIN (ANALYZE, BUFFERS)` → `auto_explain` cho plan thật ở prod.
  - Prepared statement chậm từ lần 6: generic plan → `plan_cache_mode = force_custom_plan` cho query đó. SQL Server: `OPTION (RECOMPILE)`, Query Store plan forcing.
  - Index vẫn chậm: leftmost prefix, `ORDER BY` không khớp, function/cast trên cột, selectivity thấp, heap fetches (→ `INCLUDE` + vacuum), estimate lệch (→ `ANALYZE`, `CREATE STATISTICS`).
  - `idle_in_transaction_session_timeout`, `statement_timeout`, `lock_timeout` là ba guardrail rẻ nhất.
