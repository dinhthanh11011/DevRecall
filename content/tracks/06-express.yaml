id: 06-express
slug: express
title: Express.js
tier: 2
status: drafted
summary: Middleware chain, async error handling (Express 4 vs 5), security middleware, trust proxy, cấu trúc app lớn, graceful shutdown, Express vs Fastify vs NestJS.
cvLinked: true
prerequisites: [05-nodejs]
overview: |-
  ## TL;DR

  - Express là một **router + chuỗi middleware** mỏng trên `http` của Node. Mọi thứ (body parsing, auth, CORS, logging, error handling) đều là middleware chạy **theo thứ tự đăng ký**.
  - **Express 5** (5.0 ra 09/2024, thành `latest` trên npm từ 5.1 — verify) thay đổi quan trọng: promise bị reject trong handler/middleware được **tự chuyển tới error handler**; cú pháp path mới (path-to-regexp v8: wildcard phải có tên `/*splat`, optional dùng `{}`); `req.query` chỉ là getter; `req.body` là `undefined` khi chưa có body parser; yêu cầu Node 18+.
  - Senior interview hỏi: thứ tự middleware, xử lý lỗi async, `trust proxy`, bảo mật (helmet, CORS, rate limit, body size), cấu trúc codebase lớn, graceful shutdown, và khi nào chọn Fastify/NestJS.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Middleware | `(req, res, next) => void`, xử lý rồi gọi `next()` hoặc kết thúc response | `app.use(express.json())` |
  | Error middleware | 4 tham số `(err, req, res, next)`, chỉ chạy khi có lỗi | `app.use((err, req, res, next) => res.status(500)...)` |
  | Router | Mini-app có middleware/route riêng, mount theo prefix | `app.use("/orders", ordersRouter)` |
  | `next(err)` | Bỏ qua middleware thường, nhảy tới error middleware | `next(new NotFoundError())` |
  | `next("route")` / `next("router")` | Bỏ qua các handler còn lại của route / của router | Feature flag route |
  | `res.locals` | Dữ liệu sống trong một request | `res.locals.user = user` |
  | `trust proxy` | Tin header `X-Forwarded-*` từ proxy để tính `req.ip`, `req.protocol` | `app.set("trust proxy", 1)` |
  | `app.param` | Middleware chạy khi route có param đó | Load `:orderId` một lần |

  ## Cơ chế hoạt động

  ```mermaid
  flowchart TD
    REQ["HTTP request"] --> M1["helmet / cors"]
    M1 --> M2["express.json({ limit })"]
    M2 --> M3["requestId + logger (AsyncLocalStorage)"]
    M3 --> M4["auth: verify JWT -> req.user"]
    M4 --> R{"Router match<br/>method + path?"}
    R -- "no" --> NF["404 handler"]
    R -- "yes" --> V["validate(schema)"]
    V --> P["requirePermission('order:write')"]
    P --> H["route handler (async)"]
    H -- "res.json()" --> RES["response"]
    M4 -- "next(err)" --> EH
    V -- "next(err)" --> EH
    H -- "throw / reject<br/>(Express 5 auto; Express 4 needs next(err))" --> EH["error middleware<br/>(err, req, res, next)"]
    NF --> RES
    EH --> RES
  ```

  - Middleware **không match path** thì bị bỏ qua; `app.use("/api", mw)` match theo **prefix**, `app.get("/api")` match chính xác.
  - Handler phải **hoặc** gửi response, **hoặc** gọi `next()` — không làm cả hai, không làm cái nào (request treo).
  - Error middleware đặt **cuối cùng**, sau tất cả route.

  ### Express 4 vs 5: async error

  ```mermaid
  sequenceDiagram
    participant C as Client
    participant E4 as Express 4
    participant E5 as Express 5
    C->>E4: GET /users/1
    E4->>E4: async handler rejects
    Note over E4: Promise ignored -> unhandledRejection,<br/>request hangs until timeout (or process crashes)
    C->>E5: GET /users/1
    E5->>E5: async handler rejects
    E5->>E5: next(err) called automatically
    E5-->>C: error middleware -> 500 JSON
  ```

  ## Trade-offs

  | | Express | Fastify | NestJS |
  |---|---|---|---|
  | Triết lý | Tối giản, không ý kiến | Hiệu năng, schema-first, plugin encapsulation | Framework đầy đủ, DI, module, decorator |
  | Hiệu năng overhead | Trung bình | Thấp (JSON schema serialization) | Phụ thuộc adapter (Express/Fastify) + tầng DI |
  | Validation | Tự chọn (zod, joi) | JSON Schema built-in | Pipes + class-validator / schema |
  | Async error | Express 5 tự xử lý; 4 cần wrapper | Built-in | Built-in (exception filters) |
  | Cấu trúc codebase lớn | Tự xây convention | Plugin giúp tách | Có sẵn convention (module/provider) |
  | Ecosystem middleware | Lớn nhất | Tốt, có `@fastify/express` compat | Dùng lại middleware Express |
  | Hợp khi | Service nhỏ-vừa, team tự kỷ luật | API throughput cao | Team lớn, domain phức tạp |

  ## Pitfalls

  - Quên `return` sau `res.json()` trong nhánh lỗi → "Cannot set headers after they are sent".
  - Express 4 + async handler không có wrapper → rejection bị nuốt, request treo.
  - Error middleware khai báo 3 tham số → Express coi là middleware thường.
  - Đặt `express.json()` sau router, hoặc CORS sau route → không có tác dụng.
  - `trust proxy` sai: `req.ip` là IP load balancer → rate limit chặn tất cả user cùng lúc, hoặc cho phép client giả `X-Forwarded-For`.
  - Không giới hạn body size / upload lưu memory → DoS/OOM.
  - Trả `err.stack` hoặc lỗi DB thô cho client.
  - Upgrade lên v5 mà không sửa route pattern (`*`, `?`, regex) → route không match hoặc lỗi lúc khởi động.

  ## Cheat sheet

  - Thứ tự đề xuất: security headers → CORS → body parser (có `limit`) → requestId/logging → auth → routes → 404 → error handler.
  - `next()` tiếp · `next(err)` tới error handler · `next("route")` bỏ phần còn lại của route · `next("router")` thoát router.
  - `res.headersSent` để kiểm tra trước khi ghi response trong error handler (nếu đã gửi thì `next(err)` để Express đóng connection).
  - Express 5 path (verify): `/*splat` (wildcard có tên, không match root), `/{*splat}` (có cả root), `/:file{.:ext}` (optional), không còn regex inline trong string path.
  - Express 5 xoá: `app.del`, `req.param()`, `res.send(status)`, `res.redirect("back")`, chữ ký `res.json(obj, status)`; `express.urlencoded` mặc định `extended: false`; `express.static` mặc định bỏ qua dotfiles.
  - `express.json()` mặc định `limit: "100kb"`.
