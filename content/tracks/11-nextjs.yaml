  - id: nextjs-013
    level: medium
    type: gotcha
    q: In Next.js 16, how must you access `params`, `searchParams`, `cookies()` and `headers()`, and why did this change?
    hint: |-
      - Tất cả là **Promise**: `const { slug } = await params`, `const q = (await searchParams).q`, `const c = await cookies()`. Next 15 đổi sang async nhưng còn sync compat (warning); **Next 16 xoá hẳn** truy cập sync.
      - Lý do: cho phép framework prerender phần không cần request data và chỉ "chờ" khi thật sự đọc → nền tảng cho streaming/PPR; đọc càng sâu trong cây, static shell càng lớn.
      - Có thể truyền promise xuống con và `await` trong `<Suspense>` thay vì await ở layout.
      - Type helper: `PageProps<'/blog/[slug]'>`, `LayoutProps`, `RouteContext` (sinh bởi `next typegen`).
      - Codemod: `npx @next/codemod@canary next-async-request-api .`.
    example: |-
      ```tsx
      export default async function Page(props: PageProps<'/blog/[slug]'>) {
        const { slug } = await props.params;
        const { page = '1' } = await props.searchParams;
        return <Post slug={slug} page={Number(page)} />;
      }
      ```
