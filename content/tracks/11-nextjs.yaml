  - id: nextjs-028
    level: medium
    type: concept
    q: Are Route Handlers cached? How do you make a `GET` handler cacheable in the previous model vs with Cache Components?
    hint: |-
      - Từ Next 15: Route Handler **không cache mặc định**; method khác GET không bao giờ cache.
      - Mô hình cũ: opt-in bằng segment config `export const dynamic = 'force-static'` (+ `revalidate`).
      - Cache Components: GET handler theo **mô hình prerender như page** — không dùng request/uncached data thì prerender lúc build; đọc `request.headers`, `cookies()`, DB không cache → chạy lúc request. Không đặt `'use cache'` trực tiếp trong body handler — tách ra helper function có `'use cache'`.
      - Metadata route (`sitemap.ts`, `opengraph-image`) mặc định static.
      - Webhook/POST: không cache, trả nhanh.
