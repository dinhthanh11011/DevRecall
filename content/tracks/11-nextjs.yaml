  - id: nextjs-020
    level: medium
    type: concept
    q: How do you use React Context (theme, auth, query client) in the App Router?
    hint: |-
      - Server Components **không** dùng được context. Tạo provider là Client Component (`'use client'`) nhận `children`, rồi render trong `layout` (Server Component).
      - Đặt provider **càng sâu càng tốt** (bao `{children}` thay vì cả `<html>`) để Next tối ưu phần tĩnh.
      - Dữ liệu server cho provider: fetch trong layout (server), truyền props xuống provider, hoặc truyền **promise** và `use()` bên trong.
      - Instance mutable (QueryClient, Redux store) tạo **một lần trong provider** (`useState(() => new QueryClient())`), không ở module scope (rò giữa request).
