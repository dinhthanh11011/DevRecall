  - id: nextjs-014
    level: medium
    type: compare
    q: How did caching defaults change between Next.js 14, 15 and 16? Why does it matter in an interview answer?
    hint: |-
      - **14**: `fetch` cache mặc định (`force-cache`), GET Route Handler cache mặc định, router cache giữ page động 30s → nhiều bug "dữ liệu không cập nhật".
      - **15**: đảo lại — `fetch` **không** cache mặc định, GET handler không cache, `staleTimes.dynamic` = 0; request API async (còn sync compat).
      - **16**: request API chỉ async; mô hình mới **Cache Components** opt-in (`cacheComponents: true`) với `'use cache'`/`cacheLife`/`cacheTag`/`updateTag`, PPR mặc định khi bật; mô hình cũ (fetch options, `unstable_cache`, segment config) vẫn dùng được khi **không** bật; `revalidateTag` bắt buộc argument thứ 2.
      - Trả lời phỏng vấn: luôn nói rõ version + có bật cacheComponents không; tránh nói "Next cache fetch mặc định" như chân lý.
    followUp: You upgrade from 14 to 15 and the database load triples. What happened?
    verify: true
    tags: [caching, versions]
  - id: nextjs-015
    level: medium
    type: concept
    q: How do `'use cache'`, `cacheLife` and `cacheTag` work with Cache Components? What becomes the cache key?
    hint: |-
      - `'use cache'` ở đầu function/component (hoặc đầu file) → cache **giá trị trả về** (serialized RSC). Dùng được ở mức data (`getProducts()`) hoặc UI (component/page).
      - **Cache key** = build id + id của function + **arguments và biến closure** được serialize → input khác = entry khác. `children`/slot JSX truyền qua không ảnh hưởng key nếu không đọc trong body.
      - `cacheLife('hours' | {stale, revalidate, expire})`: `stale` (client dùng không hỏi server), `revalidate` (server refresh nền), `expire` (quá hạn → chờ dữ liệu mới). Khuyến nghị luôn khai báo; thiếu thì dùng `default` (5m / 15m / never).
      - `cacheTag('products')` để invalidate on-demand.
      - Cache short-lived (`seconds`, `revalidate: 0`, `expire` < 5m) bị loại khỏi prerender → thành dynamic hole.
      - Không đọc được `cookies()`/`headers()` bên trong; args phải serializable.
    example: |-
      ```ts
      import { cacheLife, cacheTag } from 'next/cache';

      export async function getProduct(tenantId: string, slug: string) {
        'use cache';
        cacheLife('hours');
        cacheTag(`product:${tenantId}:${slug}`);
        return db.product.findUnique({ where: { tenantId_slug: { tenantId, slug } } });
      }
      ```
    followUp: Where is this cache stored by default on serverless vs a long-running Node server?
    verify: true
    tags: [caching, use-cache, nextjs-16]
  - id: nextjs-016
    level: medium
    type: compare
    q: "`revalidateTag` vs `updateTag` vs `revalidatePath` vs `refresh` in Next.js 16 — when do you use each?"
    hint: |-
      - `revalidateTag(tag, 'max')`: **stale-while-revalidate** — người sau vẫn thấy dữ liệu cũ trong lúc refresh nền; dùng trong Server Action **và** Route Handler (webhook CMS). Response của action **không** kèm re-render ngay. Next 16: dạng một argument deprecated.
      - `updateTag(tag)`: **hết hạn ngay**, read-your-own-writes — user thấy thay đổi của mình trong chính response; **chỉ trong Server Action**.
      - `revalidatePath('/orders')`: invalidate theo path (dựa trên soft tag của route); tiện khi không biết tag, dễ over-invalidate.
      - `refresh()` (`next/cache`): refetch RSC của route hiện tại **không xoá cache** — khi view phụ thuộc state ngoài cache (VD đếm notification).
      - Gọi revalidate **trước** `redirect()` (redirect throw, code sau không chạy).
    followUp: A CMS webhook calls a Route Handler to update a blog post. Which API do you use, and why can't it be `updateTag`?
    verify: true
    tags: [caching, revalidation, nextjs-16]
  - id: nextjs-017
    level: medium
    type: design
    q: Write a Server Action for "update profile" with validation, auth, and error display using `useActionState`. What do you return on validation failure?
    hint: |-
      - Action: `'use server'` → `auth()` → validate `FormData` bằng schema (zod) → authorize (user chỉ sửa profile của mình, id lấy từ session không lấy từ form) → mutate → `updateTag`/`revalidatePath` → return.
      - **Lỗi mong đợi** (validation, conflict) → **return** object `{ errors }` (không throw); `throw` dành cho lỗi bất ngờ → error boundary.
      - Chỉ trả dữ liệu UI cần — không trả nguyên record DB (được serialize xuống client).
      - Client: `useActionState(action, initialState)` → `[state, formAction, isPending]`; hiển thị `state.errors`.
    example: |-
      ```ts
      'use server';
      import { z } from 'zod';
      import { updateTag } from 'next/cache';
      import { verifySession } from '@/lib/dal';

      const Schema = z.object({ displayName: z.string().min(2).max(50) });
      export type State = { errors?: Record<string, string[]>; ok?: boolean };

      export async function updateProfile(_prev: State, formData: FormData): Promise<State> {
        const session = await verifySession(); // throws/redirects if not logged in
        const parsed = Schema.safeParse({ displayName: formData.get('displayName') });
        if (!parsed.success) return { errors: parsed.error.flatten().fieldErrors };
        await db.user.update({ where: { id: session.userId }, data: parsed.data });
        updateTag(`user:${session.userId}`);
        return { ok: true };
      }
      ```
    followUp: How does this form behave before JavaScript has loaded (progressive enhancement)?
    verify: true
    tags: [server-actions, forms, security]
  - id: nextjs-018
    level: medium
    type: gotcha
    q: What can and cannot be passed as props from a Server Component to a Client Component?
    hint: |-
      - Phải **serializable bởi React**: primitive, plain object/array, `Date`, `Map`/`Set`, `BigInt`, typed array, Promise (client đọc bằng `use()`), JSX/Server Component đã render, và **Server Actions** (function có `'use server'`).
      - Không được: function thường/callback, class instance có method, Symbol không đăng ký, object có prototype riêng.
      - Mọi prop nằm trong **RSC payload** gửi xuống browser → coi như public; chỉ truyền field cần (DTO), không truyền record DB có field nhạy cảm.
      - React taint API (`experimental.taint`) chặn thêm một lớp cho object/value nhạy cảm.
    followUp: How would you pass an `onSelect` handler to a Client Component from a Server Component?
    verify: true
    tags: [rsc, serialization, security]
  - id: nextjs-019
    level: medium
    type: concept
    q: How can a Client Component render Server Components inside it? Explain the `children` slot pattern.
    hint: |-
      - Client Component **không import** được Server Component (import vào client module graph → thành client).
      - Nhưng có thể **nhận** Server Component qua `children` hoặc prop JSX: parent (Server Component) render `<Modal><Cart/></Modal>` — `Cart` render trên server, `Modal` (client) chỉ nhận kết quả đã render và đặt vào slot.
      - Dùng cho: modal/tab/accordion client bao nội dung server; provider client bao cả app.
      - RSC payload chứa output của `Cart` + placeholder cho `Modal`.
    example: |-
      ```tsx
      // app/page.tsx (Server Component)
      import Modal from './modal'; // 'use client'
      import Cart from './cart';   // Server Component, reads DB
      export default function Page() {
        return <Modal><Cart /></Modal>;
      }
      ```
