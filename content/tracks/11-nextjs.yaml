overview: |-
  ## TL;DR

  - **Next.js 16** (bản đang cài: 16.3) thay đổi nhiều so với kiến thức cũ: `middleware` đổi tên thành **`proxy`** (chạy Node.js runtime), `cookies()`/`headers()`/`params`/`searchParams` **chỉ còn async**, **Turbopack mặc định**, và mô hình cache mới **Cache Components** (`cacheComponents: true` + `'use cache'`, `cacheLife`, `cacheTag`, `updateTag`) — PPR trở thành mặc định khi bật nó.
  - App Router mặc định là **Server Components**: code chạy trên server, không ship JS; chỉ phần có `'use client'` được hydrate. Ranh giới server/client là nơi sinh ra phần lớn bug (props không serializable, lộ dữ liệu, import nhầm module server).
  - Caching là chủ đề hay bị hỏi nhất và **phụ thuộc version**: Next 14 cache `fetch` mặc định; Next 15 đảo lại (không cache mặc định); Next 16 thêm Cache Components opt-in. Luôn hỏi lại "version nào, có bật cacheComponents không".
  - **Server Actions là public POST endpoint**: phải tự xác thực + phân quyền **trong từng action**, validate input, chỉ trả dữ liệu cần. Proxy chỉ là **optimistic check**.
  - Self-hosting nhiều instance cần: shared cache handler (+ đồng bộ tag), `NEXT_SERVER_ACTIONS_ENCRYPTION_KEY` chung, `deploymentId` chống version skew, proxy không buffer để streaming hoạt động.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Server Component | Render trên server thành RSC payload, không có state/effect, đọc DB trực tiếp được | `async function Page() { const o = await db.order.findMany() }` |
  | Client Component | File có `'use client'` và mọi thứ nó import; được SSR rồi hydrate | nút Like dùng `useState` |
  | RSC payload | Dạng serialize của cây Server Components + chỗ đặt Client Components + props | dùng cho navigation phía client |
  | Prerender | Render lúc build/revalidate, kết quả được cache (static shell) | trang marketing |
  | Dynamic rendering | Render lúc request vì dùng runtime data | trang đọc `cookies()` |
  | Streaming | Gửi HTML theo từng `<Suspense>` boundary | `loading.tsx` → skeleton trước |
  | PPR | Một route = static shell (prerender) + dynamic holes (stream) | header tĩnh + giỏ hàng động |
  | `'use cache'` | Cache kết quả function/component; args thành cache key | `getProducts()` cache `hours` |
  | Server Action | Server Function gọi qua `<form action>`/transition; là POST tới route | `createPost(formData)` |
  | Proxy | Code chạy trước request tới route (rewrite, redirect, header) | redirect `/login` nếu thiếu cookie |

  ## Cơ chế hoạt động

  ### Server/Client boundary và first load

  ```mermaid
  sequenceDiagram
    participant B as Browser
    participant N as Next server
    participant D as DB/API
    B->>N: GET /orders
    N->>D: Server Components fetch data
    D-->>N: rows
    N->>N: render Server Components -> RSC payload
    N->>N: prerender HTML (Server + Client Components)
    N-->>B: HTML (stream theo Suspense) + RSC payload inline
    B->>B: hiển thị HTML ngay (chưa tương tác)
    B->>N: tải JS của Client Components
    B->>B: hydrate Client Components (gắn event)
    Note over B,N: Navigation sau đó: chỉ fetch RSC payload (prefetch bởi Link)
  ```

  ### Cache Components (Next 16, `cacheComponents: true`) quyết định static shell

  ```mermaid
  flowchart TD
    A["Component trong route lúc prerender"] --> B{"Dùng gì?"}
    B -- "chỉ sync/pure, import module" --> S["Vào static shell"]
    B -- "'use cache' (lifetime đủ dài)" --> S
    B -- "cookies() / headers() / searchParams /<br/>fetch không cache / Date.now()" --> C{"Có Suspense bao ngoài?"}
    C -- yes --> H["Fallback vào shell,<br/>nội dung stream lúc request"]
    C -- no --> E["Dev/build báo lỗi 'blocking route'<br/>→ thêm Suspense hoặc use cache"]
  ```

  ### Mutation với Server Action (một round-trip)

  ```mermaid
  sequenceDiagram
    participant C as Client (form)
    participant A as Server Action
    participant DB
    C->>A: POST (action id + FormData)
    A->>A: auth + authz + validate (BẮT BUỘC)
    A->>DB: mutate
    A->>A: updateTag / revalidatePath / refresh
    A-->>C: một Flight response = return value + RSC payload mới của route
    Note over C,A: revalidateTag(tag, 'max') là SWR: KHÔNG kèm re-render ngay
  ```

  ### Caching theo version (tóm tắt, cần verify với docs của version bạn dùng)

  | | Next 14 | Next 15 | Next 16 (không bật cacheComponents) | Next 16 + `cacheComponents` |
  |---|---|---|---|---|
  | `fetch` mặc định | cached (`force-cache`) | **không** cache | không cache | không cache; dùng `'use cache'` |
  | GET Route Handler | cached mặc định | **không** cache mặc định | không cache | theo mô hình prerender như page |
  | Client router cache (page động) | 30s | 0s (`staleTimes.dynamic`) | 0s | theo `cacheLife.stale` (tối thiểu 30s) |
  | Request APIs | sync | async (còn sync compat) | **chỉ async** | chỉ async |
  | Công cụ cache non-fetch | `unstable_cache` | `unstable_cache` | `unstable_cache` | `'use cache'` + `cacheLife`/`cacheTag` |
  | Segment config `dynamic`/`revalidate` | có | có | có | **lỗi** — thay bằng `use cache`/Suspense |

  ## Trade-offs

  | Quyết định | Lựa chọn | Đánh đổi |
  |---|---|---|
  | Server Component vs Client Component | Server mặc định; client chỉ ở lá cần tương tác | Client lớn → bundle lớn; server → không có state/effect, cần round-trip để cập nhật |
  | Server Action vs Route Handler | Action cho mutation từ UI của chính app; Route Handler cho webhook, API public, client ngoài, GET cacheable | Action tuần tự trên client, gắn với build (action id); Route Handler phải tự lo CSRF/format |
  | `use cache` vs Suspense stream | Cache khi dữ liệu dùng chung, chấp nhận cũ; stream khi phải tươi/theo user | Cache → nguy cơ stale & invalidation; stream → tốn server mỗi request |
  | `revalidateTag` vs `updateTag` | SWR nền vs hết hạn ngay (read-your-writes) | `updateTag` chỉ trong Server Action, request đó chậm hơn |
  | Vercel vs self-host | Managed (CDN, ISR, skew protection sẵn) vs tự quản | Self-host phải tự làm cache handler, streaming, skew, image |
  | Proxy vs check trong DAL | Proxy: optimistic, rẻ, chạy mọi route | Không đủ để bảo mật; DAL gần dữ liệu mới là lớp thật |

  ## Pitfalls

  - Kiểm tra auth ở `page`/`layout` rồi nghĩ Server Action trong trang đó được bảo vệ — **không**, action là endpoint riêng.
  - Layout không re-render khi navigate giữa các trang con → auth check trong layout không chạy lại.
  - Truyền cả record DB (có `passwordHash`, `internalNote`) xuống Client Component → nằm trong RSC payload, xem được bằng DevTools.
  - Gọi `redirect()`/`notFound()` bên trong `try` → bị `catch` nuốt (chúng hoạt động bằng cách throw).
  - Đọc `cookies()` bên trong `'use cache'` → lỗi; phải đọc bên ngoài và truyền giá trị làm argument.
  - `NEXT_PUBLIC_*` bị **inline lúc build** → một Docker image cho nhiều môi trường sẽ mang giá trị lúc build.
  - Nhiều pod + cache mặc định (per instance) → `revalidateTag` chỉ xoá trên một pod.
  - Proxy matcher quên loại `_next/static`, `_next/image` → auth redirect chặn cả CSS/JS.

  ## Cheat sheet

  - File conventions: `layout` · `page` · `loading` (Suspense) · `error` (client, boundary) · `global-error` (có `<html><body>`) · `not-found` · `template` (remount mỗi navigation) · `route` · `default` (bắt buộc cho parallel slot ở v16).
  - `'use client'` = ranh giới module graph; `'use server'` = đánh dấu **Server Function** (không phải Server Component).
  - Props server → client phải serializable; function chỉ được truyền nếu là Server Action.
  - `cacheLife` profiles: `seconds`, `minutes`, `hours`, `days`, `weeks`, `max`, `default` (stale 5m / revalidate 15m / expire never).
  - `revalidateTag(tag, 'max')` (v16 bắt buộc arg 2) · `updateTag(tag)` (chỉ Server Action) · `revalidatePath(path)` · `refresh()` (refetch router, không xoá cache).
  - `connection()` = "chờ tới request" trước khi đọc `Math.random()`/env runtime.
  - Proxy: Node.js runtime, một file `proxy.ts`, dùng `matcher`; không fetch cache; không dùng thay authorization.
  - Server Action: `bodySizeLimit` mặc định 1MB, `allowedOrigins` khi sau reverse proxy, closure được mã hoá, ID đổi theo build.
  - Self-host: `output: 'standalone'`, `cacheHandler`/`cacheHandlers`, `deploymentId`, `NEXT_SERVER_ACTIONS_ENCRYPTION_KEY`, nginx `X-Accel-Buffering: no`, SIGTERM drain.
