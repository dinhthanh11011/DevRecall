questions:
  - id: nextjs-001
    level: easy
    type: compare
    q: App Router vs Pages Router — what are the fundamental differences, and can they coexist?
    hint: |-
      - **Pages Router** (`pages/`): mọi page là Client Component được SSR; data qua `getServerSideProps`/`getStaticProps`/`getStaticPaths`; `_app`/`_document`; API routes `pages/api`.
      - **App Router** (`app/`): mặc định **Server Components**, nested layouts giữ state khi navigate, streaming với Suspense, data fetch bằng `async` component, Server Actions, Route Handlers (`route.ts`), caching/revalidation tích hợp.
      - Cùng tồn tại được trong một project (migrate từng route); route không được trùng giữa hai thư mục. Navigation giữa hai router là hard navigation.
      - Pages Router vẫn được hỗ trợ nhưng tính năng mới tập trung ở App Router.
    followUp: What breaks conceptually when you move a page using `getServerSideProps` and a global Redux store into the App Router?
    tags: [app-router, pages-router, fundamentals]
  - id: nextjs-002
    level: easy
    type: compare
    q: When do you use a Server Component and when a Client Component? Give three examples of each.
    hint: |-
      - **Server**: fetch data gần nguồn (DB/API nội bộ), dùng secret/API key, render nội dung nặng thư viện (markdown, syntax highlight) mà không ship JS, SEO content.
      - **Client**: state & event (`useState`, `onClick`), effect/lifecycle, browser API (`localStorage`, `window`, geolocation), custom hooks, thư viện chỉ chạy client (map, chart tương tác).
      - Nguyên tắc: Server mặc định, **đẩy `'use client'` xuống lá** (nút, search box) thay vì đánh dấu cả layout.
      - Client Component vẫn được SSR lần đầu (có HTML), sau đó hydrate.
    followUp: Your whole layout became a Client Component because it has one search box. How do you restructure it?
    tags: [rsc, fundamentals]
  - id: nextjs-003
    level: easy
    type: concept
    q: What exactly does the `'use client'` directive do? Does every client component need it?
    hint: |-
      - Đánh dấu **ranh giới** giữa module graph server và client: file đó **và mọi module nó import, mọi component nó render trực tiếp** vào client bundle.
      - Không cần thêm vào từng component con — chỉ ở entry point của nhánh client.
      - Không áp dụng cho Server Components được truyền vào qua `children`/props: chúng vẫn render trên server, client nhận kết quả đã render.
      - Không phải "chỉ chạy trên client": Client Component vẫn chạy trên server lúc prerender/SSR → không truy cập `window` ngay trong render.
      - `'use server'` khác hẳn: đánh dấu **Server Functions** (actions), không phải Server Component.
    followUp: A third-party carousel uses `useState` but has no `'use client'`. What error do you get in a Server Component and how do you fix it?
    tags: [rsc, use-client]
  - id: nextjs-004
    level: easy
    type: concept
    q: Name the App Router file conventions (`layout`, `page`, `loading`, `error`, `not-found`, `template`, `route`, `default`) and what each one does.
    hint: |-
      - `layout`: UI bao ngoài, **giữ state** và không re-render khi navigate giữa các con; root layout có `<html><body>`.
      - `page`: UI của route, làm route public.
      - `loading`: tự bọc `page` trong `<Suspense>` → skeleton khi navigate/stream.
      - `error`: error boundary (phải là Client Component) cho segment; `global-error` cho root (tự khai báo `<html><body>`).
      - `not-found`: UI khi gọi `notFound()` hoặc route không match.
      - `template`: như layout nhưng **remount** mỗi navigation (reset state, chạy lại effect).
      - `route`: Route Handler (GET/POST…) — không cùng cấp với `page`.
      - `default`: fallback cho parallel route slot; Next 16 **bắt buộc** cho mọi slot (thiếu → build fail).
    followUp: In what order are these nested for one segment, and why does it matter for error boundaries around layouts?
    verify: true
    tags: [app-router, file-conventions]
  - id: nextjs-005
    level: easy
    type: compare
    q: What is the difference between prerendering and dynamic rendering, and what makes a route dynamic?
    hint: |-
      - **Prerender**: render lúc build (hoặc revalidate), kết quả được cache/serve từ CDN.
      - **Dynamic**: render mỗi request vì cần dữ liệu chỉ có lúc request.
      - Kích hoạt dynamic: runtime API (`cookies()`, `headers()`, `searchParams`, `connection()`, `draftMode`), `params` không có trong `generateStaticParams`, fetch/DB không cache, giá trị không xác định (`Math.random()`, `Date.now()`).
      - Mô hình cũ (không Cache Components): một chỗ dynamic làm **cả route** dynamic. Với Cache Components: chỉ phần trong `<Suspense>` là dynamic, phần còn lại vẫn vào static shell (PPR).
    followUp: How can you tell in development whether a route is static or dynamic?
    verify: true
    tags: [rendering]
  - id: nextjs-006
    level: easy
    type: concept
    q: How do `loading.tsx` and `<Suspense>` enable streaming, and when is `loading.tsx` not enough?
    hint: |-
      - `loading.tsx` = `<Suspense fallback>` tự động bọc `page` của segment → navigation hiển thị skeleton ngay, layout vẫn tương tác được; còn cho phép **partial prefetch** route động.
      - `<Suspense>` thủ công chi tiết hơn: phần ngoài boundary hiển thị ngay, từng phần chậm stream riêng.
      - Không đủ khi: **layout** của chính segment đó đọc runtime/uncached data → nó nằm **ngoài** boundary của `loading` → chặn navigation. Fix: Suspense riêng quanh phần dynamic trong layout hoặc chuyển fetch xuống page.
      - Streaming cần hạ tầng không buffer (nginx, LB).
    followUp: Why do bots and crawlers receive a fully rendered page instead of a streamed shell?
    tags: [streaming, suspense]
  - id: nextjs-007
    level: easy
    type: compare
    q: Route Handler vs Server Action — which do you use for what?
    hint: |-
      - **Server Action**: mutation khởi phát từ UI của chính app (form submit, nút) — tích hợp `useActionState`, progressive enhancement, trả kèm UI mới trong một round-trip, revalidate cache.
      - **Route Handler** (`app/api/.../route.ts`): HTTP endpoint thật — webhook bên thứ ba, API cho mobile/đối tác, GET cần cache/CDN, streaming response, file download, OAuth callback.
      - Action luôn là POST, dispatch **tuần tự** trên client, ID gắn với build → không làm public API.
      - Cả hai đều phải tự auth + validate.
    followUp: Why should you not fetch data for rendering by calling a Server Action from a Client Component?
    tags: [server-actions, route-handlers]
  - id: nextjs-008
    level: easy
    type: gotcha
    q: How do environment variables work in Next.js, and what is the trap with `NEXT_PUBLIC_`?
    hint: |-
      - Mặc định biến môi trường **chỉ có ở server**. Biến có prefix `NEXT_PUBLIC_` được **inline vào JS bundle lúc `next build`** → xem được bởi bất kỳ ai, và **không đổi** khi chạy image ở môi trường khác.
      - Biến không prefix mà import vào client code → bị thay bằng chuỗi rỗng (không lộ, nhưng code chạy sai).
      - Một Docker image cho nhiều môi trường: đọc env **runtime** trên server (dynamic rendering; `await connection()` trước khi đọc `process.env` để không bị bake lúc prerender) rồi truyền xuống client khi cần.
      - Next 16 đã **bỏ** `serverRuntimeConfig`/`publicRuntimeConfig`.
      - Secret chỉ nên được đọc ở data access layer; dùng `server-only` cho module chứa secret.
    followUp: Your staging image shows the production API URL in the browser. Why, and how do you redesign config?
    verify: true
    tags: [env, deployment, security]
  - id: nextjs-009
    level: easy
    type: concept
    q: What does `generateStaticParams` do, and what happens to params that were not returned by it?
    hint: |-
      - Trả danh sách params để **prerender lúc build** cho dynamic segment (`/products/[slug]`).
      - Params không có trong danh sách: mặc định render **lúc request** lần đầu rồi cache (ISR); mô hình cũ có `dynamicParams = false` để trả 404.
      - Với Cache Components: `dynamicParams` **không còn hỗ trợ** (build lỗi) — gọi `notFound()` khi param không hợp lệ; URL chưa biết được serve **App Shell** rồi nâng cấp nền; `generateStaticParams` phải trả ít nhất một param.
      - Không cần prerender tất cả 1 triệu sản phẩm — chỉ top N, phần còn lại ISR.
    followUp: Build time went from 3 to 40 minutes after adding every product to `generateStaticParams`. What do you change?
    verify: true
    tags: [rendering, isr, static]
  - id: nextjs-010
    level: easy
    type: concept
    q: How does `<Link>` prefetching work in the App Router, and when would you disable it?
    hint: |-
      - `<Link>` tự prefetch khi vào viewport (production): route tĩnh → prefetch đầy đủ; route động → bỏ qua hoặc prefetch một phần (tới `loading.tsx`/shell).
      - Navigation là **client-side transition**: giữ layout chung, chỉ đổi phần khác, không reload trang.
      - Next 16: layout dùng chung chỉ tải một lần, prefetch incremental phần chưa có → nhiều request nhỏ hơn.
      - Tắt (`prefetch={false}`) cho danh sách link rất dài (bảng vô hạn), hoặc prefetch khi hover để giảm tải server.
      - `<Link>` là Client Component: phải hydrate xong mới prefetch → bundle lớn làm chậm prefetch.
    followUp: Every link in an infinite table triggers a server render during prefetch and your server CPU doubles. Options?
    verify: true
    tags: [navigation, prefetch]
  - id: nextjs-011
    level: easy
    type: concept
    q: What is `proxy.ts` in Next.js 16, how does it relate to `middleware.ts`, and what is it (not) for?
    hint: |-
      - Next 16 **đổi tên** `middleware` → `proxy` (file `proxy.ts`, export `proxy`); `middleware` bị deprecated; flag đổi tên (`skipMiddlewareUrlNormalize` → `skipProxyUrlNormalize`); có codemod.
      - Proxy chạy **Node.js runtime** (không cấu hình được; muốn edge thì tạm giữ `middleware`).
      - Dùng cho: rewrite (A/B test, multi-tenant theo host), redirect theo request, set header, optimistic auth redirect.
      - Không dùng cho: data fetching chậm, session management/authorization đầy đủ (fetch cache options không có tác dụng trong proxy).
      - Một file duy nhất mỗi project; dùng `matcher` để giới hạn route.
