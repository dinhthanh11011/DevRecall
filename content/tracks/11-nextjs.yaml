    q: How do you set SEO metadata in the App Router, and what are the performance implications of `generateMetadata`?
    hint: |-
      - Static: `export const metadata = { title, description, openGraph }` trong layout/page; merge theo cây (con ghi đè), `title.template`.
      - Dynamic: `export async function generateMetadata({ params })` — fetch dữ liệu (dedupe với page nhờ fetch memoization/`React.cache`).
