  - id: nextjs-027
    level: medium
    type: gotcha
    q: With Cache Components enabled, why does rendering `Math.random()`, `Date.now()` or `crypto.randomUUID()` trigger an error, and what are the two fixes?
    hint: |-
      - Giá trị **không xác định** khác nhau mỗi lần chạy → Next cần biết bạn muốn "mỗi request một giá trị" hay "cache một giá trị"; nếu không nó sẽ bị bake vào static shell ngoài ý muốn.
      - Fix 1 (mỗi request): `await connection()` trước khi tạo giá trị + bọc component trong `<Suspense>`.
      - Fix 2 (dùng chung): đặt trong `'use cache'` → mọi user thấy cùng giá trị tới khi revalidate.
      - `performance.now()` được coi là telemetry, không bị chặn.
      - Code sync, import module, `fs.readFileSync` là "predictable" → vào shell tự động.
