  - id: nextjs-021
    level: medium
    type: compare
    q: Compare fetch memoization, `React.cache`, `'use cache'` and `unstable_cache`. What is the scope of each?
    hint: |-
      - **Fetch memoization**: `fetch` GET cùng URL + options trong **một render pass/request** được dedupe tự động — không cache giữa request.
      - **`React.cache(fn)`**: memo **per request** cho function bất kỳ (ORM/DB) → nhiều component gọi `getUser()` chỉ query một lần; không chia sẻ giữa request. Bị cô lập bên trong scope `'use cache'`.
      - **`'use cache'`** (Cache Components): cache **giữa các request** (in-memory LRU mặc định, per instance; `'use cache: remote'` cho store dùng chung), có lifetime/tag; không qua deploy (key chứa build id).
      - **`unstable_cache`** (mô hình cũ): cache kết quả async function giữa request với `tags`/`revalidate`; tồn tại qua deploy theo docs.
      - Chọn: dedupe trong request → `React.cache`; dữ liệu dùng chung nhiều request → `'use cache'`.
    followUp: You wrap `getCurrentUser` (reads cookies) in `'use cache'` to "make it faster". What happens?
    verify: true
    tags: [caching, react-cache]
  - id: nextjs-022
    level: medium
    type: debug
    q: This page takes 1.8 s to respond although each query takes ~600 ms. Why, and how do you fix it?
    example: |-
      ```tsx
      export default async function Page(props: PageProps<'/users/[id]'>) {
        const { id } = await props.params;
        const user = await getUser(id);          // 600 ms
        const orders = await getOrders(id);      // 600 ms
        const recommendations = await getRecs(id); // 600 ms
        return <Dashboard user={user} orders={orders} recs={recommendations} />;
      }
      ```
    hint: |-
      - **Waterfall tuần tự**: ba `await` nối nhau dù không phụ thuộc → 3 × 600 ms.
      - Fix 1: khởi động song song `const [user, orders, recs] = await Promise.all([...])` (hoặc `allSettled` để một cái lỗi không làm hỏng trang).
      - Fix 2 (tốt hơn cho UX): tách thành component con, mỗi cái fetch dữ liệu của mình trong `<Suspense>` riêng → phần nhanh hiển thị trước, recommendations stream sau.
      - Dedupe khi nhiều component cần `getUser(id)`: `React.cache`.
      - Cache dữ liệu ít đổi (`'use cache'` cho recommendations theo `id`).
    followUp: Recommendations fail 5% of the time. How do you keep the rest of the page working?
    tags: [data-fetching, performance, debug]
  - id: nextjs-023
    level: medium
    type: concept
    q: How does error handling work in the App Router — `error.tsx`, `global-error.tsx`, `not-found`, and component-level boundaries?
    hint: |-
      - Lỗi **mong đợi** → return value (Server Action + `useActionState`) hoặc render có điều kiện; `notFound()` → `not-found.tsx`.
      - Lỗi **bất ngờ** → throw → `error.tsx` gần nhất (phải `'use client'`), nhận `error` và cách retry.
      - `error.tsx` của segment **không bắt lỗi của `layout` cùng segment** (layout nằm ngoài boundary) → lỗi layout lên boundary cha; lỗi root layout → `global-error.tsx` (tự khai báo `<html><body>`).
      - Component-level: `catchError` (`next/error`, stable từ 16.3) tạo boundary bọc bất kỳ phần nào, xử lý đúng `redirect()`/`notFound()` và reset khi navigate.
      - Không bắt lỗi trong event handler → tự `try/catch` + state.
      - Production: message lỗi Server Component bị ẩn, chỉ còn `digest` để tra log.
    followUp: How do you correlate the `digest` shown to the user with your server logs?
    verify: true
    tags: [errors, error-boundary]
  - id: nextjs-024
    level: medium
    type: concept
    q: How do parallel routes and intercepting routes let you build a modal that has its own URL (e.g., photo feed → `/photo/123`)?
    hint: |-
      - **Parallel route**: slot `@modal` trong layout (`layout({ children, modal })`) render đồng thời với trang chính.
      - **Intercepting route**: `@modal/(.)photo/[id]/page.tsx` bắt navigation client-side tới `/photo/123` và render trong slot modal, trong khi trang feed vẫn ở dưới.
      - Truy cập trực tiếp/refresh `/photo/123` → không intercept → render trang `photo/[id]` đầy đủ.
      - Back đóng modal (URL thay đổi); share link hoạt động.
      - Next 16: mọi slot cần `default.tsx` (trả `null` hoặc `notFound()`), thiếu thì build fail.
    followUp: After closing the modal and navigating elsewhere, the modal reappears. Which file is missing or wrong?
