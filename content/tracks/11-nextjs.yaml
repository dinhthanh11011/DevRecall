  - id: nextjs-029
    level: medium
    type: design
    q: What is the recommended authentication architecture in the App Router? Where do session checks live?
    hint: |-
      - **Session**: cookie `HttpOnly`, `Secure`, `SameSite=Lax`, chứa session id (database session) hoặc JWT đã mã hoá/ký (stateless); không để token ở localStorage.
      - **Data Access Layer (DAL)**: module `server-only` với `verifySession()` (bọc `React.cache`) và các hàm lấy dữ liệu tự kiểm tra quyền, trả **DTO** tối thiểu. Mọi Server Component, Server Action, Route Handler đi qua DAL.
      - **Proxy**: chỉ **optimistic check** (đọc cookie, redirect `/login`), không query DB (chạy cả trên prefetch).
      - Không dựa vào **layout** để chặn (không re-render khi navigate, không chặn render của segment con/slot).
      - Check gần dữ liệu và ở component render UI nhạy cảm.
      - Thư viện: Auth.js, Better Auth, Clerk, WorkOS…
    followUp: Why is a check in `proxy.ts` alone insufficient, even if its matcher covers every route?
    tags: [auth, security, dal]
  - id: nextjs-030
    level: medium
    type: gotcha
    q: What are the common `matcher` mistakes in `proxy.ts`?
    hint: |-
      - Không có `matcher` → proxy chạy trên **mọi request**, kể cả `_next/static`, `_next/image`, file `public/` → auth redirect làm hỏng CSS/JS/ảnh, tốn CPU.
      - Dùng negative lookahead để loại tài nguyên tĩnh: `'/((?!api|_next/static|_next/image|favicon.ico).*)'`.
      - Giá trị `matcher` phải là **hằng số** phân tích tĩnh lúc build — biến bị bỏ qua.
      - Proxy chạy cả với **prefetch** → logic nặng/DB làm prefetch chậm; có thể dùng `missing: [{ type: 'header', key: 'next-router-prefetch' }]` để bỏ qua prefetch.
      - **Server Functions** là POST tới route nơi chúng dùng → matcher loại route đó thì action cũng không qua proxy; refactor chuyển action sang route khác có thể **âm thầm** mất coverage.
    followUp: How do you unit test proxy logic?
    verify: true
    tags: [proxy, gotcha]
  - id: nextjs-031
    level: medium
    type: gotcha
    q: What changed about the build toolchain in Next.js 16 (Turbopack, `next lint`), and what breaks when upgrading?
    hint: |-
      - **Turbopack mặc định** cho cả `next dev` và `next build` (không cần `--turbopack`).
      - Project có **custom `webpack` config** (kể cả do plugin thêm vào) → `next build` **fail** để tránh cấu hình sai; chọn: migrate sang option `turbopack`, chạy `--webpack`, hoặc `--turbopack` bỏ qua webpack config.
      - `experimental.turbopack` → top-level `turbopack`; `resolve.fallback` → `turbopack.resolveAlias`; Sass `~` import không hỗ trợ.
      - `next lint` bị **xoá**; `next build` không lint nữa → dùng ESLint CLI (flat config) hoặc Biome; codemod có sẵn.
      - Node ≥ 20.9, TypeScript ≥ 5.1; bỏ `size`/`First Load JS` khỏi output build.
    followUp: Your CI relied on `next build` failing on lint errors. What do you add back?
    verify: true
    tags: [nextjs-16, tooling, upgrade]
  - id: nextjs-032
    level: medium
    type: concept
    q: What is `after()` in Next.js, and what are the deployment caveats?
    hint: |-
      - `after(callback)` (`next/server`): chạy việc **sau khi response đã gửi** (log, analytics, sync nhẹ) mà không làm chậm user; dùng trong Server Component, Server Action, Route Handler, proxy.
      - Vẫn chạy trong vòng đời request của server → trên serverless cần platform hỗ trợ `waitUntil`; self-host `next start` hỗ trợ đầy đủ.
      - Graceful shutdown: gửi SIGTERM/SIGINT và **chờ drain** (10–30s) để callback pending chạy xong; kill ngay → mất việc.
      - Không dùng cho việc quan trọng phải đảm bảo (gửi email thanh toán) → queue bền vững (outbox, job queue).
    followUp: Why is `after()` not a replacement for a job queue?
    verify: true
    tags: [after, background-work, deployment]
  - id: nextjs-033
    level: medium
    type: compare
    q: When do you still fetch on the client (SWR/TanStack Query) in an App Router app?
    hint: |-
      - Dữ liệu **thay đổi liên tục theo tương tác** trên cùng màn hình: polling, infinite scroll, search-as-you-type, dashboard realtime.
      - Dữ liệu chỉ client biết: theo vị trí, theo state client chưa có trên URL.
      - Muốn cache client lâu, optimistic update phức tạp, offline.
      - Pattern kết hợp: Server Component fetch lần đầu (hoặc prefetch + `HydrationBoundary`) → client library tiếp quản refetch/mutation.
      - Tránh: gọi Route Handler của chính app từ Server Component (thêm một hop HTTP vô ích) — gọi thẳng DAL.
    followUp: Why is calling your own `/api/*` route from a Server Component an anti-pattern?
    tags: [data-fetching, client]
  - id: nextjs-034
    level: medium
    type: gotcha
    q: "What do you lose with `output: 'export'` (static export)?"
    hint: |-
      - Chỉ HTML/JS/CSS tĩnh — host ở S3/CDN bất kỳ, không cần Node server.
      - Mất mọi thứ cần server lúc request: proxy, Server Actions, Route Handler động (chỉ GET static), ISR/revalidation, `cookies()`/`headers()`, dynamic route không có trong `generateStaticParams`, image optimization mặc định (cần custom loader), `'use cache'`.
      - Hợp cho: docs, marketing, SPA thuần client gọi API riêng.
      - Nếu cần một ít dynamic → cân nhắc Node server/`standalone` thay vì cố lách.
    followUp: A static-exported SPA needs per-user redirects after login. Where does that logic go?
    tags: [deployment, static-export]
  - id: nextjs-035
    level: hard
    type: debug
    q: The admin page redirects non-admins, yet a security review shows any logged-in user can delete records. Find the hole.
    example: |-
      ```tsx
      // app/admin/page.tsx
      import { auth } from '@/lib/auth';
      import { redirect } from 'next/navigation';
      import { deleteAllRecords } from './actions';

      export default async function AdminPage() {
        const session = await auth();
        if (!session?.user?.isAdmin) redirect('/login');
        return (
          <form action={deleteAllRecords}>
            <button>Delete all</button>
          </form>
        );
      }

      // app/admin/actions.ts
      'use server';
      export async function deleteAllRecords() {
        await db.record.deleteMany();
      }
      ```
    hint: |-
      - Server Action là **endpoint POST riêng**, gọi trực tiếp được (chỉ cần action id — lấy từ bundle/HTML của bất kỳ trang nào dùng nó, hoặc một user admin để lộ). Check ở `page` chỉ quyết định **UI nào render**, không bảo vệ action.
      - Fix: trong action gọi `auth()` + kiểm tra `isAdmin` (authorization, không chỉ authentication), tốt nhất đặt logic trong DAL `server-only` để mọi đường gọi đều qua check; audit log.
      - Thêm: validate input, rate limit cho thao tác nguy hiểm, xác nhận hai bước.
      - Action ID mã hoá/không đoán được chỉ giảm rủi ro, **không** phải cơ chế bảo mật.
    followUp: How would you write an automated test that proves the action rejects non-admins?
    redFlags:
      - Says action IDs are secret so the action cannot be called
      - Relies on the proxy matcher covering /admin
    tags: [server-actions, security, debug]
  - id: nextjs-036
    level: hard
    type: debug
    q: A penetration tester finds password hashes and internal notes in the page source of the profile page. Where do they come from?
    example: |-
      ```tsx
      // app/profile/[slug]/page.tsx
      export default async function Page(props: PageProps<'/profile/[slug]'>) {
        const { slug } = await props.params;
        const user = await db.user.findUnique({ where: { slug } }); // full row
        return <ProfileCard user={user} />; // 'use client' component
      }
      ```
    hint: |-
      - Props truyền cho **Client Component** được serialize vào **RSC payload** (inline trong HTML ở lần tải đầu, và trong response khi navigate) → mọi field của `user` (`passwordHash`, `internalNotes`, `email`) nằm ở client dù component chỉ hiển thị `name`.
      - Fix: DAL trả **DTO** tối thiểu (`{ name, avatarUrl }`) với logic quyền (ai được xem email); Client Component nhận props hẹp; `import 'server-only'` cho module DB.
      - Lớp phòng thủ thêm: React taint (`experimental_taintObjectReference`/`taintUniqueValue` với `experimental.taint`) để build/render lỗi khi object nhạy cảm đi xuống client.
      - Cũng kiểm tra: return value của Server Action (cũng được serialize).
    followUp: Why is marking the component `'use client'` the key detail here — would a Server Component rendering only `user.name` leak the hash?
    tags: [security, rsc, data-exposure, debug]
  - id: nextjs-037
    level: hard
    type: debug
    q: With Cache Components enabled, this build passes but `next start` throws on the dashboard route. Why, and what is the fix?
    example: |-
      ```tsx
      import { cookies } from 'next/headers';

      async function getTenant() {
        const tenantId = (await cookies()).get('tenant')?.value;
        return db.tenant.findUnique({ where: { id: tenantId } });
      }

      export async function TenantBanner() {
        'use cache';
        const tenant = await getTenant();
        return <Banner name={tenant?.name} />;
      }
      ```
    hint: |-
      - Scope `'use cache'` **không được** truy cập runtime API (`cookies()`, `headers()`, `searchParams`) — kể cả gián tiếp qua helper (`getTenant`) → lỗi `next-request-in-use-cache`. Trên route dynamic lỗi chỉ lộ lúc chạy, nên build có thể pass.
      - Về logic: nếu được phép, cache key không chứa tenant → **mọi tenant thấy banner của tenant đầu tiên** (rò dữ liệu).
      - Fix: đọc cookie **bên ngoài** (component không cache trong `<Suspense>`), truyền `tenantId` làm **argument** → thành một phần cache key: `<TenantBannerCached tenantId={id} />` với `'use cache'` + `cacheTag('tenant:' + id)`.
      - Thay thế: `'use cache: private'` khi thực sự phải đọc runtime data bên trong (cache ở browser, không chia sẻ).
    followUp: What is the risk of putting the session id (instead of the tenant id) into a shared cache key?
    verify: true
    tags: [cache-components, use-cache, debug, multi-tenancy]
  - id: nextjs-038
    level: hard
    type: debug
    q: After a successful create, the user is never redirected; instead the error toast shows "NEXT_REDIRECT". Why?
    example: |-
      ```ts
      'use server';
      import { redirect } from 'next/navigation';

      export async function createOrder(_: State, formData: FormData): Promise<State> {
        try {
          const order = await orders.create(parse(formData));
          revalidatePath('/orders');
          redirect(`/orders/${order.id}`);
        } catch (err) {
          return { error: String(err) };
        }
      }
      ```
    hint: |-
      - `redirect()` (và `notFound()`, `forbidden()`, `unauthorized()`) hoạt động bằng cách **throw** một error đặc biệt để framework xử lý; `catch` bắt luôn nó → trả về như lỗi thường.
      - Fix: gọi `redirect` **ngoài** `try` (sau khi try thành công), hoặc trong catch gọi `unstable_rethrow(err)` trước khi xử lý lỗi thật.
      - Gọi `revalidatePath`/`updateTag` **trước** `redirect` (code sau redirect không chạy).
      - Đừng trả `String(err)` cho client — lộ chi tiết nội bộ; log server, trả message thân thiện + mã lỗi.
    followUp: Where else does this "control-flow exception" pattern bite you (e.g., in data-fetching helpers)?
    tags: [server-actions, redirect, debug]
  - id: nextjs-039
    level: hard
    type: scenario
    q: You self-host Next.js on 4 Kubernetes pods. After an admin updates a product, some users see the new price and others the old one for a long time. Explain and fix.
    hint: |-
      - Cache mặc định (ISR/data/`'use cache'`) nằm **trên disk/memory của từng pod**; `revalidateTag`/`revalidatePath` chỉ chạy trên **pod nhận request** → 3 pod còn lại vẫn phục vụ entry cũ tới khi tự hết hạn. Load balancer phân phối → user thấy khác nhau.
      - Fix: **custom cache handler** dùng chung (Redis/S3) — `cacheHandler` (ISR/route cache, mô hình cũ) và `cacheHandlers` (cho `'use cache'`/`'use cache: remote'`); triển khai `updateTags()` (ghi sự kiện invalidate vào shared store) và `refreshTags()` (đọc trước mỗi request) để đồng bộ tag; tắt/giảm in-memory cache.
      - Handler phải bắt lỗi: `get` lỗi → trả `undefined` (miss), `refreshTags` lỗi → không throw.
      - Kiểm tra thêm: CDN phía trước có cache HTML/RSC khác TTL không; `Vary` được tôn trọng không.
    followUp: Your Redis goes down. What should the cache handler do, and what do users experience?
    verify: true
    tags: [self-hosting, caching, kubernetes, scenario]
  - id: nextjs-040
    level: hard
    type: scenario
    q: Right after each deploy, a spike of "Failed to find Server Action" errors appears and some form submissions fail. What causes it and how do you mitigate?
    hint: |-
      - **Version skew**: browser đang chạy JS của build cũ gọi action id của build cũ; server mới không nhận ra (ID đổi theo build, và rotate tối đa mỗi 14 ngày).
      - Nhiều instance mà **encryption key khác nhau** (mỗi build tự sinh) → instance này không giải mã được closure/reference của instance kia → cùng lỗi ngay cả khi không deploy.
      - Mitigate: `deploymentId` → client gửi `x-deployment-id`, mismatch thì **hard navigation** tải build mới; `NEXT_SERVER_ACTIONS_ENCRYPTION_KEY` (base64, 16/24/32 byte) **giống nhau** trên mọi instance; build một lần, promote image qua môi trường; rolling deploy, giữ asset build cũ trên CDN một thời gian; UI bắt lỗi và mời reload thay vì lỗi cứng.
    followUp: Why must the same build (not a rebuild per environment) be promoted from staging to production?
    verify: true
    tags: [server-actions, deployment, version-skew, scenario]
  - id: nextjs-041
    level: hard
    type: scenario
    q: A page shows the hydration error only for users in certain countries and only on the order list. How do you track it down?
    hint: |-
      - Dấu hiệu "theo quốc gia" → **timezone/locale**: server render `toLocaleString()`/`Intl.DateTimeFormat()` với timezone của server (UTC), client render với timezone/locale browser → text khác → mismatch.
      - Xác nhận: React 19 in diff chi tiết trong console dev; tái hiện bằng đổi timezone trong DevTools (Sensors) hoặc `TZ` env.
      - Fix: format ở server với timezone **của user** (lưu trong profile/cookie) và truyền chuỗi đã format; hoặc render ngày chỉ trên client sau mount (component client-only / `useEffect`); hoặc `suppressHydrationWarning` cho **đúng node text** thời gian.
      - Nguyên nhân khác cùng nhóm: số tiền `toLocaleString`, sort phụ thuộc locale (`localeCompare`), extension dịch trang (Google Translate sửa DOM).
    followUp: How do you prevent a "flash" of the wrong theme (light/dark) before hydration?
    tags: [hydration, i18n, scenario]
  - id: nextjs-042
    level: hard
    type: scenario
    q: Streaming works locally, but behind your nginx + load balancer the page arrives all at once after 3 seconds. Why?
    hint: |-
      - Proxy/LB **buffer** response: nginx mặc định `proxy_buffering on` → giữ chunk tới khi đủ/xong → mất streaming (Suspense fallback không bao giờ hiện, TTFB = thời gian render toàn bộ).
      - Fix: header `X-Accel-Buffering: no` (có thể set qua `headers()` trong `next.config`) hoặc `proxy_buffering off` cho location đó; bảo đảm LB hỗ trợ chunked/HTTP2 streaming (một số tích hợp như ALB + Lambda buffer mặc định); tắt compression buffer ở tầng trung gian nếu nó gom chunk.
      - Kiểm tra bằng `curl -N` xem chunk đến dần hay không.
      - Nhắc thêm: bot/crawler luôn nhận trang render xong (không stream) — đừng nhầm khi test bằng user-agent bot.
    followUp: Without streaming, what happens to PPR's static shell advantage?
    verify: true
    tags: [streaming, self-hosting, nginx, scenario]
  - id: nextjs-043
    level: hard
    type: gotcha
    q: Why is an authorization check inside a shared `layout.tsx` unsafe in the App Router?
    hint: |-
      - **Partial rendering**: khi navigate giữa các trang con, layout dùng chung **không re-render** → check trong layout không chạy lại (session hết hạn/role bị thu hồi vẫn xem được trang mới).
      - Layout không kiểm soát việc render của `children`/parallel slots: segment con vẫn được router render và **có mặt trong RSC payload** kể cả khi layout "ẩn" nó → dữ liệu nhạy cảm vẫn đi xuống.
      - Layout await auth ở top-level còn **chặn streaming** cả segment.
      - Đúng: check trong DAL (mỗi lần lấy dữ liệu), trong page/leaf component render dữ liệu nhạy cảm, trong mỗi Server Action/Route Handler; layout chỉ nên lấy user để hiển thị (avatar).
    followUp: Where does the check go for a parallel `@analytics` slot visible only to admins?
    tags: [auth, security, layouts]
  - id: nextjs-044
    level: hard
    type: gotcha
    q: What was the March 2025 Next.js middleware vulnerability (CVE-2025-29927), and what architectural lesson does it teach?
    hint: |-
      - Middleware có thể bị **bỏ qua hoàn toàn** bằng cách gửi header nội bộ `x-middleware-subrequest` (dùng để chống vòng lặp đệ quy) → app chỉ dựa vào middleware để auth bị bypass.
      - Ảnh hưởng bản self-host nhiều major; bản vá ở 15.2.3 / 14.2.25 / 13.5.9 / 12.3.5 (verify với advisory); mitigation tạm: chặn header đó ở reverse proxy/WAF.
      - Bài học: **defense in depth** — proxy/middleware chỉ là optimistic check; authorization thật ở DAL/Server Action/Route Handler gần dữ liệu. Docs Next 16 nhấn mạnh đúng điều này.
      - Quy trình: theo dõi advisory, có khả năng patch nhanh (dependency update tự động, test hồi quy).
    followUp: How would you verify, in a running environment, that your app is not vulnerable to a similar header-based bypass?
    verify: true
    tags: [security, proxy, middleware, cve]
  - id: nextjs-045
    level: hard
    type: gotcha
    q: After enabling Cache Components, a dropdown stays open and a form keeps old input when the user navigates away and back. Why?
    hint: |-
      - Với Cache Components, Next **giữ route cũ bằng React `<Activity mode="hidden">`** thay vì unmount → `useState`, input, scroll **được giữ** khi quay lại; effect vẫn cleanup/re-run.
      - Code cũ ngầm dựa vào unmount để reset (popover đóng, form trống) → hành vi đổi.
      - Fix: reset tường minh — đóng popover trong cleanup của `useLayoutEffect`, reset form sau submit thành công, dùng `key` theo entity để remount khi cần; state thuộc URL thì đưa lên URL.
      - Đây là thay đổi UX có chủ đích (back navigation nhanh, giữ state) — nhưng cần QA lại các flow.
    followUp: Which kinds of components are most likely to misbehave under this change?
    verify: true
    tags: [cache-components, activity, state, nextjs-16]
  - id: nextjs-046
    level: hard
    type: design
    q: A shop layout awaits `params` and the user session at the top, making the whole page wait. How do you restructure it to maximize the static shell?
    hint: |-
      - Await ở top-level layout (params không có trong `generateStaticParams`, `cookies()`) → layout là dynamic → không vào shell; mọi `children` chờ theo.
      - **Đẩy dynamic access xuống**: layout không `async`, truyền **promise** `params` xuống component con, `await` bên trong `<Suspense>`; phần tĩnh (nav, sidebar, footer) vào shell.
      - User menu đọc session → component riêng trong `<Suspense fallback={<AvatarSkeleton/>}>`.
      - Dữ liệu dùng chung ít đổi (category tree) → `'use cache'` + `cacheLife('days')`.
      - Kết quả: shell tức thì từ CDN, chỉ vài ô stream.
    example: |-
      ```tsx
      export default function Layout({ children, params }: LayoutProps<'/shop/[slug]'>) {
        return (
          <div>
            <Sidebar />{/* static / cached */}
            <Suspense fallback={<h1>Loading…</h1>}>
              {params.then(({ slug }) => <ShopHeading slug={slug} />)}
            </Suspense>
            <Suspense fallback={<AvatarSkeleton />}><UserMenu /></Suspense>
            {children}
          </div>
        );
      }
      ```
    followUp: How do you verify what ended up in the static shell?
    verify: true
    tags: [ppr, performance, design]
  - id: nextjs-047
    level: hard
    type: debug
    q: The Docker image runs fine in staging but calls the staging API from production browsers, and a server-side feature flag never turns on. Why?
    example: |-
      ```ts
      // lib/config.ts
      export const API_URL = process.env.NEXT_PUBLIC_API_URL!;
      export const NEW_CHECKOUT = process.env.FEATURE_NEW_CHECKOUT === 'true';

      // app/checkout/page.tsx (prerendered at build)
      import { NEW_CHECKOUT } from '@/lib/config';
      export default function Page() {
        return NEW_CHECKOUT ? <NewCheckout /> : <OldCheckout />;
      }
      ```
    hint: |-
      - `NEXT_PUBLIC_API_URL` bị **inline lúc `next build`** (build trong pipeline staging) → image mang giá trị staging mãi mãi.
      - `FEATURE_NEW_CHECKOUT` đọc ở **module scope** trong trang **prerender** → giá trị lúc build bị bake vào HTML tĩnh; đổi env lúc chạy không có tác dụng.
      - Fix: build **một** image, config runtime đọc trên server lúc request (`await connection()` trước khi đọc `process.env`, hoặc route dynamic) rồi truyền xuống client (props/context/`/config` endpoint); feature flag qua service flag có cache ngắn thay vì env.
      - Giữ `NEXT_PUBLIC_*` chỉ cho giá trị thật sự cố định theo build.
    followUp: How would you expose runtime public config to Client Components without an extra request?
    verify: true
    tags: [env, deployment, docker, debug]
  - id: nextjs-048
    level: hard
    type: gotcha
    q: Why are Server Actions a poor fit for parallel data loading, and what does "sequential dispatch" mean?
    hint: |-
      - Next dispatch Server Actions **tuần tự mỗi client**: action 2 chờ action 1 xong → `Promise.all([a(), b(), c()])` từ client vẫn chạy nối tiếp.
      - Lý do: mỗi action có thể trả kèm RSC tree mới; tuần tự giữ UI nhất quán với kết quả.
      - Hệ quả: dùng action để **đọc dữ liệu** (search-as-you-type, load widget) → chậm, xếp hàng sau mutation.
      - Đúng: đọc dữ liệu trong Server Component (song song), hoặc Route Handler/GET cho client fetch; nếu cần song song nhiều việc trong mutation → làm song song **bên trong** một action.
      - Ngoài ra action là POST → không cache HTTP.
    followUp: A user double-clicks "Save" and two actions are queued. How do you avoid a duplicate write?
    verify: true
    tags: [server-actions, performance]
  - id: nextjs-049
    level: hard
    type: gotcha
    q: Why can a page render fine for users but fail for Googlebot under Cache Components/PPR?
    hint: |-
      - Browser nhận **static shell** (đã prerender lúc build) rồi stream phần động. Bot/crawler (nhận diện theo user-agent) thì **không** dùng shell: Next render **toàn trang lúc request** rồi gửi HTML hoàn chỉnh.
      - Công việc "đã xong lúc build" cho user sẽ **chạy lại lúc request** cho bot → nếu shell dựa vào input chỉ có lúc build (file build-time, secret chỉ có ở CI, API nội bộ không truy cập được từ runtime), bot nhận lỗi.
      - Fix: bảo đảm mọi dữ liệu shell cũng truy cập được lúc runtime; test bằng user-agent bot; theo dõi lỗi render theo UA.
      - Hệ quả hiệu năng: bot không được hưởng tốc độ shell; cache cho bot nếu crawl nặng.
    followUp: How do you test your SEO-critical pages the way a crawler sees them?
    verify: true
    tags: [seo, ppr, bots]
  - id: nextjs-050
    level: hard
    type: design
    q: Design routing for a multi-tenant storefront where each retailer has its own domain or subdomain, on one Next.js deployment.
    hint: |-
      - **Proxy** đọc `host` → map domain/subdomain → `tenantSlug` (bảng mapping cache ngắn), **rewrite** nội bộ sang `/[tenant]/…` (URL user không đổi); domain lạ → 404.
      - Cây `app/[tenant]/…`: params tenant là một phần route → cache/prerender theo tenant (`generateStaticParams` cho tenant lớn, còn lại ISR).
      - Mọi cache key/tag có tenant (`product:${tenant}:${slug}`); data layer lọc tenant từ context server, không từ client.
      - Theme/branding per tenant (CSS variables từ config), metadata/SEO riêng (canonical theo domain), sitemap per tenant.
      - Auth cookie scope theo domain; custom domain cần TLS tự động.
      - Guide `multi-tenant` trong docs Next có ví dụ tham khảo.
    followUp: A retailer changes their custom domain. What caches and routes must be updated?
    tags: [multi-tenancy, routing, proxy, design]
  - id: nextjs-051
    level: senior
    type: open
    q: How would you migrate a large Pages Router app (getServerSideProps everywhere, Redux, API routes) to the App Router without a big-bang rewrite?
    hint: |-
      Đánh giá lập luận:
      - Hai router cùng tồn tại → migrate **từng route**; bắt đầu từ trang ít phụ thuộc state client (marketing, detail read-only), đo trước/sau.
      - Root layout mới + provider client (Redux, theme) bọc `children`; store per request.
      - `getServerSideProps` → async Server Component + DAL; `getStaticProps` → cache (`'use cache'`/fetch cache) + `generateStaticParams`.
      - API routes giữ nguyên (vẫn chạy), mutation mới dùng Server Actions khi hợp lý.
      - Rủi ro: navigation giữa hai router là hard navigation; shared components phải tách client/server; thư viện CSS-in-JS runtime; auth phải hoạt động ở cả hai.
      - Guardrails: lint cấm import server module vào client, test E2E flow chính.
    followUp: Which pages would you deliberately leave on the Pages Router, and why?
    tags: [migration, app-router, strategy]
  - id: nextjs-052
    level: senior
    type: open
    q: Your team runs Next 15 with heavy use of `fetch` cache options, `unstable_cache` and `export const revalidate`. Should you enable Cache Components after upgrading to 16? How would you roll it out?
    hint: |-
      - Nâng lên 16 **không bắt buộc** bật `cacheComponents`; mô hình cũ vẫn chạy. Bật nó là thay đổi mô hình (không phải rename): segment config `dynamic`/`revalidate`/`fetchCache` sẽ lỗi, `dynamicParams` không hỗ trợ, edge runtime không hỗ trợ, route giữ state bằng Activity.
      - Lợi ích: PPR mặc định (shell tức thì), cache tường minh theo function/component, prefetch/instant navigation tốt hơn.
      - Kế hoạch: upgrade 16 trước (async APIs, proxy, Turbopack), ổn định; rồi bật flag trên nhánh, xử lý từng insight (Suspense/`use cache`), dùng `instant: false` để tạm hoãn segment chưa sẵn sàng; map `unstable_cache` → `'use cache'` + `cacheLife`/`cacheTag`, `revalidateTag` thêm profile, cân nhắc `updateTag`.
      - Self-host: `cacheHandlers` cho `'use cache: remote'`; kiểm tra cache không qua deploy.
      - Đo: TTFB/LCP, số render server, bug stale.
    followUp: Which of your pages would gain the least from Cache Components?
    verify: true
    tags: [cache-components, migration, nextjs-16]
  - id: nextjs-053
    level: senior
    type: design
    q: Design a production self-hosted deployment of Next.js 16 on Kubernetes behind a CDN. List everything you must configure that Vercel would otherwise handle.
    hint: |-
      - Build: `output: 'standalone'`, build **một lần**, promote image; `deploymentId` cố định theo release (skew protection).
      - Multi-instance: `NEXT_SERVER_ACTIONS_ENCRYPTION_KEY` chung; custom `cacheHandler` + `cacheHandlers` trên Redis/S3 với `updateTags`/`refreshTags`; tắt/giới hạn in-memory cache.
      - Networking: reverse proxy (nginx) trước Node (slowloris, body size, rate limit), **tắt buffering** cho streaming, TLS, HTTP/2.
      - CDN: tôn trọng `Cache-Control`/`Vary`, cache HTML và RSC cùng policy, không cache response `private`; asset `/_next/static` immutable (có thể `assetPrefix`), giữ asset build cũ một thời gian.
      - Image optimization: sharp, giới hạn memory (glibc allocator), hoặc loader ngoài.
      - Vận hành: readiness/liveness, SIGTERM drain 10–30s cho `after()`, HPA theo CPU/latency, OpenTelemetry (`instrumentation.ts`), log có request id.
    followUp: How do you do a zero-downtime rolling deploy without users hitting "Failed to find Server Action"?
    verify: true
    tags: [self-hosting, kubernetes, deployment, design]
  - id: nextjs-054
    level: senior
    type: open
    q: Should the Next.js app talk to the database directly (DAL in Server Components) or go through a separate Node/Nest API? Argue both sides for a B2B2C platform.
    hint: |-
      - **DAL trực tiếp**: ít hop, ít latency, type chia sẻ, đơn giản cho team full-stack nhỏ; Next docs khuyến nghị DAL cho project mới.
      - **API riêng**: nhiều client (mobile, đối tác, integration) cần cùng business logic; team backend riêng/ngôn ngữ khác; scale/deploy độc lập; tách trách nhiệm bảo mật; Next làm **BFF** (zero trust, forward token).
      - Tiêu chí: số loại client, ownership tổ chức, yêu cầu compliance/audit, chỗ đặt logic multi-tenant/authorization (một nơi!), kỹ năng team.
      - Hybrid phổ biến: API domain riêng + Next gọi qua `fetch` từ Server Components với cache tag; tránh logic nghiệp vụ nhân đôi.
      - Next docs: chọn **một** cách tiếp cận data fetching và nhất quán để dễ audit.
    followUp: If you choose the separate API, how do you pass the user's identity from Next to it securely?
    tags: [architecture, bff, dal]
  - id: nextjs-055
    level: senior
    type: design
    q: You are asked to security-review a Next.js App Router codebase before launch. What is your checklist?
    hint: |-
      - **Server Actions**: mỗi action có authn + authz + validate (zod) + trả DTO; không nhận ownership từ client (IDOR); rate limit thao tác đắt; `bodySizeLimit`, `allowedOrigins` nếu sau proxy.
      - **Data exposure**: props xuống Client Components là DTO; `server-only` cho DAL/secret; taint cho object nhạy cảm; `NEXT_PUBLIC_*` không chứa secret.
      - **Auth**: cookie HttpOnly/Secure/SameSite; không dựa layout/proxy; session hết hạn và revoke.
      - **Cache**: không `'use cache'`/CDN cache dữ liệu per user; key có tenant; `Cache-Control: private` cho trang cá nhân.
      - **Headers**: CSP (nonce với proxy), HSTS, `X-Frame-Options`/`frame-ancestors`, tắt `poweredByHeader`.
      - **Route Handlers/webhooks**: verify chữ ký, CSRF cho POST dùng cookie.
      - **Dependencies**: phiên bản Next đã vá advisory; image `remotePatterns` chặt (SSRF), không bật `dangerouslyAllowLocalIP` bừa.
    followUp: Which item on this list is most often missed in practice?
    verify: true
    tags: [security, review, checklist]
  - id: nextjs-056
    level: senior
    type: design
    q: For an e-commerce site, choose the rendering and caching strategy for home, category, product detail, search, cart and checkout pages. Justify each.
    hint: |-
      Không có một đáp án; lý lẽ mới quan trọng:
      - **Home/category**: static shell + `'use cache'` nội dung chung (`cacheLife` giờ/ngày + tag từ CMS); cá nhân hoá (gợi ý, "xin chào") trong Suspense.
      - **Product detail**: prerender top N (`generateStaticParams`) + ISR cho phần còn lại; giá/tồn kho thay đổi nhanh → cache ngắn hoặc stream; tag theo product để invalidate khi cập nhật.
      - **Search**: dynamic theo `searchParams`; cache kết quả theo query (`'use cache'` với args) nếu hợp; client-side refinement.
      - **Cart**: per user → không cache chung; stream/đọc cookie; optimistic UI.
      - **Checkout**: luôn dynamic, không cache, Server Actions có idempotency, tính giá phía server.
      - Multi-tenant: tenant trong mọi key.
    followUp: A flash sale changes prices for 10,000 products at 12:00:00. How do you make every page correct within seconds?
    verify: true
    tags: [rendering, caching, ecommerce, design]
  - id: nextjs-057
    level: senior
    type: design
    q: How do you make a Next.js app observable in production — tracing server rendering, Server Actions and downstream calls?
    hint: |-
      - `instrumentation.ts` (`register()`) khởi tạo OpenTelemetry (`@vercel/otel` hoặc SDK Node) → Next tự tạo span cho render route, fetch, Route Handler; `onRequestError` hook để báo lỗi server tập trung (Sentry…).
      - `instrumentation-client.ts` cho monitoring phía browser (Web Vitals, lỗi client).
      - Propagate trace context sang API/DB (header `traceparent`); log có trace id; `digest` của lỗi Server Component để đối chiếu.
      - Metric: latency theo route (TTFB, render time), cache hit/miss (log `NEXT_PRIVATE_DEBUG_CACHE` khi debug), tỷ lệ lỗi action, Web Vitals (LCP/INP/CLS) theo release.
      - Alert theo SLO, dashboard theo tenant nếu multi-tenant.
    followUp: A route's p95 doubled after a release but no errors. What spans do you look at first?
    verify: true
    tags: [observability, opentelemetry, production]
  - id: nextjs-058
    level: cv
    type: design
    q: On the multi-tenant B2B2C commerce platform you worked with React/Next.js. Which rendering strategy did storefront pages use, and why?
    hint: |-
      Câu trả lời mạnh:
      - Nói rõ **version và router** thật (Pages hay App Router, Next 12/13/14/15…) — đừng mô tả tính năng của Next 16 nếu dự án không dùng.
      - Mỗi loại trang dùng gì (SSR/SSG/ISR/CSR) và lý do (SEO, dữ liệu theo tenant, giá thay đổi).
      - Cách xử lý tenant trong routing/caching, và cách invalidate khi retailer cập nhật.
      - Số liệu: TTFB/LCP, tỷ lệ cache hit, tải server (điền số liệu thật của bạn).
      - Nếu làm lại với Next 16 bạn đổi gì (PPR/Cache Components).
    followUp: What would break if two tenants shared a cache entry by mistake, and how did you guard against it?
    tags: [cv, rendering, multi-tenancy]
  - id: nextjs-059
    level: cv
    type: scenario
    q: You implemented JWT/OAuth including Google OAuth for the platform. In the Next.js frontend, where did tokens live, how was the session checked on server-rendered pages, and how did refresh work?
    hint: |-
      Gợi ý câu trả lời mạnh:
      - Token ở **HttpOnly cookie** (không localStorage); access token ngắn hạn + refresh token (rotation) hoặc session id phía server.
      - OAuth flow: redirect → callback (Route Handler/API route) → đổi code lấy token (PKCE) → tạo session nội bộ; `state` chống CSRF.
      - SSR: đọc cookie trên server, verify, forward tới backend API; xử lý hết hạn (refresh phía server, tránh nhiều request refresh song song).
      - Tenant + role trong session; logout xoá cookie + revoke.
      - (Điền chi tiết thật của bạn: thư viện, thời hạn token, sự cố gặp phải.)
    followUp: Two parallel server requests both find the access token expired and both try to refresh. What happens with refresh-token rotation?
    tags: [cv, auth, oauth, jwt]
  - id: nextjs-060
    level: cv
    type: design
    q: You built Checkout end to end. If you rebuilt the checkout submit today in Next.js 16, would you use a Server Action or a Route Handler? Walk through the trade-offs using your real flow.
    hint: |-
      Câu trả lời mạnh:
      - Mô tả flow thật (cart → address → shipping → payment → confirm) và điểm tích hợp (payment provider, webhook).
      - Server Action: tích hợp form/`useActionState`, pending state, revalidate cart/order trong cùng round-trip; nhưng phải tự auth/authz/idempotency, gắn với build (version skew giữa lúc thanh toán!).
      - Route Handler: hợp cho webhook của payment provider, client mobile dùng chung, kiểm soát HTTP (idempotency header, status code).
      - Hybrid hợp lý: Action cho UI, logic nằm trong service/DAL dùng chung với Route Handler.
      - (Điền chi tiết thật của bạn.)
    followUp: The payment webhook arrives before the Server Action finishes writing the order. How is that race handled?
    verify: true
    tags: [cv, checkout, server-actions]
  - id: nextjs-061
    level: cv
    type: scenario
    q: You did production debugging across backend, database and frontend. Tell me about a slow or broken Next.js page and how you found which layer was at fault.
    hint: |-
      STAR:
      - **S**: trang nào, triệu chứng (TTFB cao, hydration error, dữ liệu sai theo tenant), ai báo, ảnh hưởng.
      - **A**: chia tầng — browser (Performance, network waterfall) → Next server (log/trace render, cache hit/miss) → API (trace, latency) → DB (slow query log, execution plan) → Redis/Elasticsearch; loại trừ giả thuyết; fix gốc.
      - **R**: số liệu trước/sau (điền số liệu thật của bạn).
      - Reflection: observability thêm vào để lần sau nhanh hơn.
    followUp: What single piece of telemetry would have cut your investigation time in half?
    tags: [cv, debugging, production, behavioral]
  - id: nextjs-062
    level: cv
    type: design
    q: The platform used Redis caching on the backend. How did that interact with caching in the Next.js layer and the browser? Where did you invalidate on writes?
    hint: |-
      Gợi ý:
      - Vẽ các tầng: browser/router cache → CDN → Next server cache (ISR/fetch/`use cache`) → backend API → Redis → DB.
      - Mỗi tầng TTL/invalidation ra sao; tránh "double caching" khó đoán (Next cache 1h trên dữ liệu Redis đã cache 10 phút → stale tới 70 phút).
      - Invalidate khi ghi: backend xoá/cập nhật key Redis (cache-aside) + phát event → Next `revalidateTag` qua webhook/Route Handler.
      - Key theo tenant ở mọi tầng.
      - (Điền chi tiết thật của bạn: TTL, key design, incident stale.)
    followUp: A retailer updates stock and customers can still add an out-of-stock item for a few minutes. Which layer do you fix first?
    tags: [cv, caching, redis]
  - id: nextjs-063
    level: cv
    type: scenario
    q: You led legacy refactors. Have you migrated React SPA screens or Pages Router routes into Next.js App Router? How did you decide which components become Server vs Client Components?
    hint: |-
      Câu trả lời mạnh:
      - Tiêu chí thật: component có state/effect/browser API → client; hiển thị dữ liệu, không tương tác → server; lá tương tác nhỏ tách riêng.
      - Xử lý thư viện client-only (bọc `'use client'`), global store (provider per request), CSS-in-JS runtime.
      - Rủi ro gặp phải: hydration mismatch, props không serializable, bundle không giảm như kỳ vọng.
      - Kết quả đo được: JS gửi xuống, LCP (điền số liệu thật của bạn). Nếu chưa từng migrate, nói thật và mô tả cách bạn sẽ làm.
    followUp: How did you prevent server-only modules from being imported into client components during the migration?
    tags: [cv, migration, rsc, refactoring]
  - id: nextjs-064
    level: cv
    type: behavioral
    q: You use AI-assisted development. Next.js 16 changed many APIs (proxy, async request APIs, Cache Components). How do you stop an AI assistant from generating outdated Next.js code, and how do you verify its output?
    hint: |-
      Gợi ý câu trả lời mạnh:
      - Ground assistant bằng **docs đúng version**: Next 16.2+ đóng gói docs trong `node_modules/next/dist/docs/` và có `AGENTS.md` trỏ tới đó (codemod `agents-md`); nêu version rõ trong prompt.
      - Nhận diện output cũ: `middleware.ts`, `cookies()` sync, `revalidateTag(tag)` một arg, `experimental.ppr`, `next lint`, `getServerSideProps` trong App Router.
      - Verify: type-check + build + test E2E, đọc diff như review PR, chạy codemod chính thức thay vì để AI sửa tay hàng loạt.
      - Ví dụ thật: một lần AI sinh code sai và cách bạn phát hiện (điền ví dụ thật của bạn).
    followUp: Where does AI assistance save you the most time on a Next.js codebase, and where do you not trust it at all?
    verify: true
    tags: [cv, ai-assisted, nextjs-16, behavioral]
  - id: nextjs-065
    level: cv
    type: design
    q: Your Elasticsearch-backed search was exposed in the storefront. How would you build the search results page in the App Router — server rendering, URL state, caching and SEO?
    hint: |-
      Câu trả lời mạnh:
      - URL là nguồn state (`?q=&category=&page=`) → share/back hoạt động; `searchParams` async, đọc sâu trong `<Suspense>`.
      - Server Component gọi search service (tenant filter bắt buộc), trả DTO; cache ngắn theo query nếu hợp (`'use cache'` với args, `cacheLife('minutes')`) hoặc không cache cho truy vấn dài đuôi.
      - Client component cho ô search/facet: cập nhật URL bằng `router.replace` + transition (không spam history), debounce.
      - SEO: `noindex` cho trang kết quả tuỳ ý, canonical cho trang category; tránh vô hạn URL tổ hợp facet.
      - Số liệu thật: p95 search, tỷ lệ zero-result (điền số liệu thật của bạn).
    followUp: How do you keep the input responsive while results for each keystroke stream in?
    verify: true
    tags: [cv, search, elasticsearch, url-state]
