  - id: nextjs-026
    level: medium
    type: concept
    q: What is Partial Prerendering (PPR), and how do you enable it in Next.js 16?
    hint: |-
      - Một route gồm **static shell** (HTML + RSC prerender lúc build, serve từ CDN tức thì) + **dynamic holes** (nội dung trong `<Suspense>` stream lúc request) trong **cùng một response**.
      - Next 16: bỏ flag `experimental.ppr` và `experimental_ppr`; PPR là hành vi mặc định khi bật **`cacheComponents: true`**.
      - Cách đưa phần vào shell: code thuần/sync, `'use cache'`; phần runtime (`cookies()`, fetch không cache) phải nằm trong `<Suspense>` (nếu không, dev báo lỗi blocking route).
      - Đẩy dynamic access **xuống sâu** → shell lớn hơn.
      - Cần hạ tầng hỗ trợ streaming; không streaming → shell và dynamic đến cùng lúc, mất lợi thế TTFB.
