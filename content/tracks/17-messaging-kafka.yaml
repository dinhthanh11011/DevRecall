slug: messaging-kafka
title: Messaging & Kafka
tier: 5
status: drafted
summary: Partitions, consumer groups, ordering, delivery semantics, idempotency, outbox/CDC, DLQ, consumer lag, schema evolution, Kafka vs RabbitMQ/SQS, Node consumer pitfalls, Socket.IO scaling.
