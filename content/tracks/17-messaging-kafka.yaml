overview: |-
  ## TL;DR

  - Kafka là **distributed, partitioned, replicated commit log**: message không bị xoá khi đọc; consumer tự quản **offset**. Khác hẳn queue truyền thống (RabbitMQ/SQS) nơi broker xoá message sau khi ack.
  - Thứ tự chỉ được đảm bảo **trong một partition**; key quyết định partition → chọn key = chọn đơn vị ordering và đơn vị song song.
  - Delivery thực tế là **at-least-once** + **idempotent consumer**. "Exactly-once" của Kafka (idempotent producer + transactions) chỉ áp dụng trong phạm vi *Kafka → Kafka*; side effect ra ngoài (DB, email, HTTP) cần idempotency riêng.
  - Bài toán senior hay hỏi: **dual write** (DB + publish) → **transactional outbox**/CDC; poison pill → retry topic + DLQ; consumer lag; rebalance storm; schema evolution.
  - Kafka **4.0 (2025) bỏ hẳn ZooKeeper** — cluster chạy **KRaft**; consumer rebalance protocol mới (KIP-848) GA ở 4.0; **share groups** (queue semantics, KIP-932) production-ready ở 4.2 — kiểm tra lại theo version bạn chạy.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Topic / partition | Topic chia thành partition; mỗi partition là log append-only có thứ tự | `orders` có 12 partition |
  | Offset | Vị trí record trong partition; consumer group commit offset đã xử lý | Group `billing` ở offset 1042 của p3 |
  | Key → partition | Default partitioner: `murmur2(key) % numPartitions`; key null → sticky partitioner | key = `orderId` giữ thứ tự của 1 đơn |
  | Consumer group | Mỗi partition gán cho **đúng 1** consumer trong group | 12 partition, 4 consumer → mỗi con 3 |
  | Replication / ISR | Mỗi partition có leader + follower; ISR = replica bắt kịp leader | RF=3, ISR={1,2,3} |
  | `acks` | Producer chờ bao nhiêu replica xác nhận: `0`, `1`, `all` | `acks=all` + `min.insync.replicas=2` |
  | Idempotent producer | Broker dedupe retry bằng producer id + sequence number | Mặc định bật từ Kafka 3.0 |
  | Transactions | Ghi nhiều partition + commit offset **atomic** | read-process-write exactly-once |
  | Consumer lag | Log-end offset − committed offset | Lag 2M trên p7 → consumer chậm/kẹt |
  | Log compaction | Giữ bản ghi **mới nhất theo key**; value null = tombstone | Topic `customer-state` |
  | Outbox | Ghi event vào bảng outbox **cùng transaction** với business data | `orders` + `outbox` trong 1 tx |
  | DLQ | Nơi đậu message xử lý thất bại sau N lần | `orders.dlq` |

  ## Cơ chế hoạt động

  ### Produce → replicate → consume

  ```mermaid
  sequenceDiagram
    participant P as Producer
    participant L as Leader (p3)
    participant F as Followers (ISR)
    participant C as Consumer (group billing)
    P->>L: ProduceRequest(key=order-42, acks=all, pid, seq)
    L->>F: followers fetch
    F-->>L: caught up (high watermark advances)
    L-->>P: ack (offset 1043)
    C->>L: Fetch from committed offset
    L-->>C: records up to high watermark
    C->>C: process (idempotent)
    C->>L: commit offset 1044 (next to read)
  ```

  ### Transactional outbox + CDC

  ```mermaid
  flowchart LR
    API["Order service"] -->|"BEGIN; INSERT order; INSERT outbox; COMMIT"| DB[("DB")]
    DB -->|"WAL / binlog / CDC"| DBZ["Debezium or polling relay"]
    DBZ --> K["Kafka topic orders"]
    K --> S1["Billing consumer<br/>(dedupe by event_id)"]
    K --> S2["Indexer consumer"]
    S1 -->|"fail N times"| DLQ["orders.dlq"]
  ```

  ### Rebalance (classic protocol)

  - **Eager**: mọi consumer revoke hết partition → stop-the-world → assign lại.
  - **Cooperative (incremental)**: chỉ revoke partition cần chuyển; consumer khác tiếp tục xử lý.
  - **KIP-848 (`group.protocol=consumer`)**: broker (group coordinator) tính assignment, rebalance incremental, không còn barrier đồng bộ toàn group.

  ## Trade-offs

  | | Kafka | RabbitMQ | SQS (+SNS) |
  |---|---|---|---|
  | Mô hình | Log bền, consumer kéo (pull) theo offset | Broker định tuyến (exchange → queue), push + ack | Queue managed, pull, visibility timeout |
  | Replay | Có (theo retention/compaction) | Không với classic queue (Streams thì có) | Không (trừ tính năng redrive DLQ) |
  | Ordering | Theo partition | Theo queue (1 consumer) | Standard: best-effort; FIFO: theo `MessageGroupId` |
  | Throughput | Rất cao, scale theo partition | Cao vừa | Gần như không giới hạn (standard) |
  | Routing | Đơn giản (topic/key) | Rất linh hoạt (topic/headers/fanout exchange) | SNS filter policy + fanout |
  | Vận hành | Nặng (hoặc managed: MSK/Confluent) | Vừa | Không có server |
  | Hợp | Event streaming, nhiều consumer độc lập, replay, CDC | Task queue, routing phức tạp, RPC-ish | Task queue đơn giản trên AWS, fanout với SNS |

  | Delivery | Cách đạt | Rủi ro |
  |---|---|---|
  | At-most-once | Commit offset **trước** khi xử lý | Mất message khi crash |
  | At-least-once | Commit **sau** khi xử lý | Trùng lặp → cần idempotent consumer |
  | Exactly-once (Kafka→Kafka) | Idempotent producer + transactions + `read_committed` | Không bao phủ side effect ngoài Kafka |

  ## Pitfalls

  - Thêm partition cho topic có key → mapping key→partition đổi → **mất thứ tự** giữa bản cũ và mới của cùng key.
  - Xử lý lâu hơn `max.poll.interval.ms` → consumer bị đá khỏi group → rebalance → xử lý lại → vòng lặp.
  - Handler async fire-and-forget (KafkaJS) → offset commit trước khi xử lý xong → mất message khi crash.
  - Retry vô hạn trên poison pill → partition kẹt, lag tăng mãi.
  - Gửi message sang DLQ/retry topic cho một key nhưng vẫn xử lý message sau của cùng key → vỡ ordering.
  - `acks=all` nhưng `min.insync.replicas=1` → vẫn có thể mất dữ liệu khi chỉ leader xác nhận.
  - Dual write (commit DB rồi `producer.send`) không atomic → mất hoặc thừa event.
  - Coi Redis Pub/Sub hay Socket.IO adapter là "message bus bền" — chúng at-most-once.

  ## Cheat sheet

  - Producer bền: `acks=all`, `enable.idempotence=true` (default từ 3.0), topic RF=3, `min.insync.replicas=2`, `unclean.leader.election.enable=false` (default).
  - Consumer: commit sau xử lý; handler idempotent (unique `event_id`, upsert, version check); `max.poll.records` nhỏ khi xử lý chậm.
  - Ordering: 1 key = 1 partition; idempotent producer giữ thứ tự với `max.in.flight.requests.per.connection ≤ 5`.
  - Rebalance: cooperative-sticky hoặc KIP-848; static membership `group.instance.id` cho rolling deploy.
  - Error: phân loại lỗi transient (retry với backoff) vs permanent (DLQ ngay); DLQ có header lý do + offset gốc; có quy trình replay.
  - Schema Registry: `BACKWARD` (default) → nâng cấp **consumer trước**; `FORWARD` → producer trước; `FULL` → thứ tự nào cũng được.
  - Lag: đo theo partition (Burrow/kafka-consumer-groups/exporter), alert theo **thời gian trễ** chứ không chỉ số message.
  - Socket.IO nhiều node: sticky session (khi có HTTP long-polling) + adapter (Redis/Redis Streams) để broadcast giữa node.
