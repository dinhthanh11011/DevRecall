overview: |-
  ## TL;DR

  - **Process** = không gian địa chỉ + tài nguyên riêng; **thread** = luồng thực thi chia sẻ memory trong process. Node.js chạy JS trên **một thread** nhưng process có thêm libuv threadpool và V8 helper threads.
  - **Concurrency** là cấu trúc (nhiều việc tiến triển xen kẽ); **parallelism** là thực thi đồng thời trên nhiều core. Event loop cho concurrency, không cho parallelism CPU.
  - Race condition **vẫn xảy ra trong JS single-threaded** — mọi `await` là một điểm xen kẽ; và luôn xảy ra giữa nhiều instance/pod dùng chung DB/Redis.
  - Deadlock cần đủ 4 điều kiện Coffman; phá một điều kiện (thường là **thứ tự lock cố định** hoặc timeout) là hết.
  - Production: hiểu **signals** (SIGTERM → graceful shutdown), **PID 1 trong container**, **file descriptor limit**, **cgroup memory/CPU limit** và OOM killer.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Process | Chương trình đang chạy với virtual memory, FD table, PID riêng | Mỗi `node server.js` là một process |
  | Thread | Luồng thực thi trong process, chia sẻ heap, có stack riêng | `worker_threads` tạo thread với V8 isolate riêng |
  | Context switch | OS lưu/khôi phục register để chuyển CPU giữa thread/process | 1000 thread blocking → CPU tốn cho switching |
  | Blocking I/O | Thread đứng chờ tới khi I/O xong | `fs.readFileSync` chặn event loop |
  | Non-blocking I/O + multiplexing | Đăng ký nhiều FD, kernel báo khi sẵn sàng (epoll/kqueue/IOCP) | libuv poll phase |
  | Race condition | Kết quả phụ thuộc thứ tự xen kẽ không kiểm soát | Hai request cùng trừ tồn kho |
  | Critical section | Đoạn code truy cập shared state cần loại trừ lẫn nhau | `SELECT ... FOR UPDATE` bao đoạn trừ stock |
  | Mutex / Semaphore | Mutex: 1 holder; semaphore: tối đa N holder | Semaphore 10 = giới hạn 10 call đồng thời |
  | Deadlock | Các bên chờ nhau mãi mãi | Tx A lock row 1 chờ row 2, Tx B ngược lại |
  | Atomic / CAS | Thao tác không thể bị chen ngang; compare-and-swap | `UPDATE ... SET v = v + 1 WHERE version = 3` |
  | Signal | Thông báo bất đồng bộ từ OS tới process | `SIGTERM` khi Kubernetes stop pod |

  ## Cơ chế hoạt động

  ### Blocking vs non-blocking I/O trong một server

  ```mermaid
  flowchart LR
    subgraph TPR["Thread-per-request (blocking)"]
      R1["req 1"] --> T1["thread 1<br/>chờ DB"]
      R2["req 2"] --> T2["thread 2<br/>chờ DB"]
      R3["req N"] --> T3["thread N<br/>(stack ~MB mỗi thread)"]
    end
    subgraph EL["Event loop (non-blocking)"]
      Q["N requests"] --> L["1 JS thread"]
      L -- "register FD" --> K["kernel epoll/kqueue"]
      K -- "ready events" --> L
      L -- "fs, dns.lookup, crypto, zlib" --> P["libuv threadpool<br/>(mặc định 4)"]
      P -- "done callback" --> L
    end
  ```

  ### Check-then-act race qua `await`

  ```mermaid
  sequenceDiagram
    participant A as Request A
    participant DB as DB (stock = 1)
    participant B as Request B
    A->>DB: SELECT stock → 1
    B->>DB: SELECT stock → 1
    A->>DB: UPDATE stock = 0, tạo order
    B->>DB: UPDATE stock = 0, tạo order
    Note over DB: Oversell: 2 orders, 1 item
  ```

  Fix: một câu lệnh atomic `UPDATE products SET stock = stock - 1 WHERE id = $1 AND stock > 0` rồi kiểm tra `rowCount`, hoặc `SELECT ... FOR UPDATE` trong transaction, hoặc optimistic locking theo `version`.

  ### Graceful shutdown khi nhận SIGTERM

  ```mermaid
  flowchart TD
    S["SIGTERM (k8s / docker stop)"] --> A["Readiness = false<br/>(ngừng nhận traffic mới)"]
    A --> B["server.close(): không accept connection mới"]
    B --> C["Chờ in-flight requests / jobs xong<br/>(có deadline)"]
    C --> D["Đóng DB pool, Redis, Kafka consumer (commit offset)"]
    D --> E["process.exit(0)"]
    C -- "quá deadline" --> F["exit(1) — trước khi bị SIGKILL"]
  ```

  ## Trade-offs

  | Mô hình | Ưu | Nhược | Hợp với |
  |---|---|---|---|
  | Thread-per-request | Code tuần tự dễ đọc, tận dụng nhiều core | Memory/thread, context switch, cần lock shared state | CPU-bound vừa, stack Java/.NET truyền thống |
  | Event loop (Node) | Hàng chục nghìn connection với ít memory, không lock cho JS state | Một tác vụ CPU chặn tất cả; chỉ 1 core cho JS | I/O-bound API, gateway, realtime |
  | Multi-process (cluster, nhiều pod) | Tận dụng core, cô lập crash | Không share memory → state phải ra Redis/DB | Scale Node trên máy nhiều core |
  | worker_threads | Parallel CPU trong cùng process, share `SharedArrayBuffer` | Chi phí khởi tạo isolate, message copy | Parse, nén, hash, image |
  | Pessimistic lock | Đơn giản, đúng ngay | Giảm throughput, deadlock | Contention cao, xung đột đắt |
  | Optimistic (version/CAS) | Không giữ lock, throughput cao | Retry khi conflict | Contention thấp |

  ## Pitfalls

  - Tin rằng "Node single-thread nên không có race condition".
  - Dùng API `*Sync` (`readFileSync`, `bcrypt.hashSync`, `JSON.parse` 50 MB) trong request path.
  - `CMD npm start` trong Dockerfile: npm là PID 1, có thể không forward SIGTERM → app bị SIGKILL sau grace period, mất request.
  - `os.cpus().length` trong container trả số core của **host**, không phải CPU quota → spawn quá nhiều worker; dùng `os.availableParallelism()` và vẫn kiểm tra cgroup quota.
  - Không đặt `--max-old-space-size` phù hợp memory limit của container → OOMKilled thay vì GC sớm.
  - Lock phân tán (Redis) không có TTL/fencing token → lock "vĩnh viễn" hoặc hai holder cùng lúc.
  - Unbounded `Promise.all` trên 10k item → cạn connection pool / FD.

  ## Cheat sheet

  - Coffman: **mutual exclusion, hold-and-wait, no preemption, circular wait** → phá circular wait bằng lock ordering.
  - Deadlock (không ai tiến) · Livelock (bận rộn nhưng không tiến) · Starvation (một bên không bao giờ được chạy).
  - `SIGTERM` bắt được (graceful) · `SIGKILL`/`SIGSTOP` **không** bắt được · `SIGINT` = Ctrl+C · exit code 137 = 128 + 9 (SIGKILL, thường OOM) · 143 = 128 + 15 (SIGTERM).
  - libuv threadpool: `fs`, `dns.lookup`, `crypto` (pbkdf2, scrypt, randomBytes async), `zlib`; network socket **không** dùng threadpool. `UV_THREADPOOL_SIZE` mặc định 4.
  - Zombie = process con đã exit nhưng cha chưa `wait()`; orphan = cha chết trước, được init nhận nuôi.
  - "EMFILE: too many open files" → FD limit (`ulimit -n`) hoặc leak socket/file.
