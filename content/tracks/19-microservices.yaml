id: 19-microservices
slug: microservices
title: Monolith → Microservices
tier: 5
status: drafted
summary: Monolith vs modular monolith vs microservices, DDD bounded contexts, strangler fig, backward compatibility & contract testing, database-per-service, sync vs async, API gateway/BFF, service mesh, tracing, distributed monolith.
cvLinked: true
# Must-know questions, highest priority first (study plans take the first few).
essentials:
  - microservices-001
  - microservices-003
  - microservices-025
  - microservices-015
  - microservices-036
  - microservices-011
  - microservices-026
  - microservices-042
overview: |-
  ## TL;DR

  - Microservices là cách tổ chức hệ thống quanh **khả năng deploy và sở hữu độc lập** của từng team — không phải mục tiêu tự thân. Cái giá: mọi function call thành network call, transaction thành saga, debug cần tracing.
  - Thứ tự hợp lý thường là **monolith → modular monolith → tách service** khi có lý do rõ (scale khác nhau, team độc lập, release cadence, isolation lỗi/compliance).
  - Ranh giới service đến từ **bounded context** (DDD) và dữ liệu mà service **sở hữu** (database-per-service). Ranh giới sai → **distributed monolith**: tất cả nhược điểm của cả hai.
  - Migration an toàn = **strangler fig** (facade route dần), **anti-corruption layer**, đồng bộ dữ liệu (CDC/outbox), **backward compatibility** (expand/contract, tolerant reader, contract test), đo parity trước khi cắt.
  - Hạ tầng tối thiểu trước khi tách: CI/CD mỗi service, observability (log có correlation id, metrics, distributed tracing), config/secrets, service discovery, gateway.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Modular monolith | Một deploy unit, module có ranh giới cứng (API nội bộ, không truy cập DB của nhau) | `orders/`, `catalog/` chỉ gọi nhau qua interface |
  | Bounded context | Ranh giới nơi một model/ngôn ngữ có nghĩa nhất quán | "Product" ở Catalog ≠ "Product" ở Warehouse |
  | Database per service | Mỗi service sở hữu dữ liệu; service khác chỉ qua API/event | Order service không `JOIN` bảng của Customer |
  | Strangler fig | Facade phía trước legacy, chuyển dần từng route sang service mới | `/api/invoices/*` → Billing service |
  | Anti-corruption layer | Lớp dịch giữa model legacy và model mới | Map `CUST_TP=3` → `CustomerTier.Gold` |
  | API gateway | Điểm vào chung: routing, auth, rate limit, TLS | Kong, AWS API Gateway, NGINX |
  | BFF | Backend riêng cho từng loại client | `mobile-bff` gom 5 call thành 1 |
  | Service discovery | Tìm địa chỉ instance động | K8s Service DNS, Consul |
  | Service mesh | Sidecar/proxy lo mTLS, retry, traffic shifting, telemetry | Istio, Linkerd |
  | Contract testing | Kiểm tra provider thoả mãn kỳ vọng của consumer | Pact |
  | Distributed tracing | Theo dõi một request qua nhiều service bằng trace id | W3C `traceparent`, OpenTelemetry |
  | Expand / contract | Thay đổi schema/API theo 2 pha tương thích | Thêm cột mới → migrate → bỏ cột cũ |

  ## Cơ chế hoạt động

  ### Strangler fig migration

  ```mermaid
  flowchart LR
    U["Clients"] --> F["Facade / API gateway<br/>(routing rules, feature flags)"]
    F -->|"/orders/* (legacy)"| M["Legacy monolith"]
    F -->|"/invoices/* (migrated)"| B["Billing service"]
    B --> ACL["Anti-corruption layer"]
    ACL --> M
    M -->|"CDC / outbox events"| K["Kafka"]
    K --> B
    B --> BDB[("Billing DB")]
    M --> MDB[("Legacy DB")]
  ```

  ### Các bước cắt một capability

  ```mermaid
  flowchart TD
    A["Chọn capability: ít coupling,<br/>giá trị rõ, team sở hữu"] --> B["Vẽ ranh giới: dữ liệu nào sở hữu,<br/>ai đọc/ghi"]
    B --> C["Modularize trong monolith trước<br/>(interface + cấm truy cập chéo)"]
    C --> D["Dựng service mới + ACL<br/>+ đồng bộ dữ liệu (CDC/outbox)"]
    D --> E["Shadow / dark launch:<br/>so sánh kết quả với legacy"]
    E --> F["Chuyển traffic dần (1% → 100%)<br/>qua facade, có rollback"]
    F --> G["Đổi source of truth,<br/>xoá code + bảng legacy (contract)"]
  ```

  ## Trade-offs

  | | Monolith | Modular monolith | Microservices |
  |---|---|---|---|
  | Deploy | Một đơn vị | Một đơn vị | Độc lập từng service |
  | Transaction | ACID dễ | ACID dễ | Saga, eventual consistency |
  | Scale team | Kém khi > vài team | Tốt vừa | Tốt nếu ranh giới đúng |
  | Vận hành | Đơn giản | Đơn giản | Nặng: CI/CD, observability, network, on-call |
  | Isolation lỗi | Thấp | Thấp | Cao (nếu có timeout/bulkhead) |
  | Latency | Function call | Function call | Network hop mỗi call |
  | Refactor ranh giới | Dễ | Dễ vừa | Đắt (API/data migration) |

  | Giao tiếp | Ưu | Nhược | Dùng khi |
  |---|---|---|---|
  | Sync (REST/gRPC) | Đơn giản, có kết quả ngay | Temporal coupling, cascading failure, latency cộng dồn | Query cần trả lời ngay, validate |
  | Async (event/queue) | Loose coupling, chịu lỗi, fan-out | Eventual consistency, debug khó, cần idempotency | Thông báo thay đổi, workflow dài, đồng bộ read model |

  ## Pitfalls

  - Tách theo **layer kỹ thuật** (auth-service, db-service, validation-service) thay vì theo capability nghiệp vụ.
  - **Shared database** giữa service → không deploy/đổi schema độc lập được.
  - Một user action cần **gọi đồng bộ 5 service nối tiếp** → availability = tích (0.99^5 ≈ 95%), latency cộng dồn.
  - Deploy phải theo thứ tự ("B trước rồi mới A") → dấu hiệu distributed monolith.
  - Shared library chứa domain model dùng chung → mọi service phải nâng version cùng lúc.
  - Breaking API/event change không có versioning, không contract test.
  - Tách service trước khi có CI/CD, tracing, dashboard → không biết lỗi ở đâu.
  - Big-bang rewrite: đóng băng feature nhiều tháng rồi cắt một lần.

  ## Cheat sheet

  - Bắt đầu: modular monolith; tách khi có lý do đo được (team, scale, release, compliance).
  - Ranh giới: bounded context + dữ liệu sở hữu + tần suất thay đổi cùng nhau (change coupling từ git log).
  - Migration: strangler fig + ACL + CDC/outbox + shadow traffic + chuyển dần + rollback bằng routing.
  - Tương thích: thêm field optional, không đổi nghĩa/xoá field khi còn consumer; tolerant reader; expand/contract; version khi buộc phải breaking; consumer-driven contract test trong CI.
  - Data: database-per-service; query xuyên service bằng API composition hoặc read model (CQRS) cập nhật qua event.
  - Mỗi call: timeout, retry có budget, circuit breaker, correlation/trace id (`traceparent`).
  - Gateway: cross-cutting (auth, rate limit, routing), **không** chứa business logic; BFF cho nhu cầu riêng từng client.
  - Distributed monolith smell: lockstep deploy, shared DB, chatty sync call, một thay đổi chạm nhiều service.
