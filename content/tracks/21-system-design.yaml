overview: |-
  ## TL;DR

  - System design interview không chấm "đáp án đúng" — chấm **quy trình**: làm rõ yêu cầu, ước lượng, chọn thành phần có lý do, đào sâu chỗ khó, và **nói rõ trade-off**.
  - Khung 8 bước: **requirements → estimates → API → data model → high-level design → deep dive → bottlenecks → trade-offs**. Dành 5–8 phút cho requirements; đừng vẽ Kafka ở phút thứ hai.
  - Mọi thiết kế đều xoay quanh vài câu hỏi lặp lại: dữ liệu nào là **source of truth**, **consistency** cần mạnh tới đâu, chỗ nào **hot** (key, partition, tenant), chuyện gì xảy ra khi **retry/duplicate**, và hệ thống **degrade** thế nào khi một phần chết.
  - Với senior: nối thiết kế với kinh nghiệm thật (multi-tenant, checkout, indexer, Socket.IO) — số liệu thật của bạn đáng giá hơn số trong sách.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Functional vs non-functional req | Hệ thống **làm gì** vs **tốt tới mức nào** (latency, availability, consistency, scale) | "p99 < 200 ms, 99.9% availability, không oversell" |
  | Back-of-envelope | Ước lượng bậc độ lớn để chọn kiến trúc | 10M DAU × 20 req ÷ 86 400 s ≈ 2.3k QPS avg |
  | Stateless service | Không giữ state theo user trong process → scale ngang tự do | Session trong Redis, không trong memory |
  | Replication | Bản sao dữ liệu để đọc nhiều / chịu lỗi | Primary + 2 read replica, lag vài trăm ms |
  | Sharding / partitioning | Chia dữ liệu theo key sang nhiều node | `hash(user_id) % 64` |
  | Idempotency | Gọi lại nhiều lần = một lần | `Idempotency-Key` trên `POST /payments` |
  | Fan-out | Đẩy một sự kiện tới nhiều người nhận | Feed: fan-out on write vs on read |
  | Backpressure | Bên nhận làm chậm bên gửi khi quá tải | Queue depth → giảm consumer fetch, trả 429 |
  | Consistent hashing | Thêm/bớt node chỉ di chuyển ~1/N key | Distributed cache ring với virtual nodes |

  ## Cơ chế hoạt động

  ### Quy trình phỏng vấn

  ```mermaid
  flowchart LR
    R["1 Requirements<br/>functional + NFR<br/>(5-8 min)"] --> E["2 Estimates<br/>QPS, storage, bandwidth"]
    E --> A["3 API<br/>endpoints / events"]
    A --> D["4 Data model<br/>entities, keys, access patterns"]
    D --> H["5 High-level design<br/>boxes + arrows"]
    H --> DD["6 Deep dive<br/>1-2 hardest parts"]
    DD --> B["7 Bottlenecks<br/>hot keys, SPOF, failure"]
    B --> T["8 Trade-offs<br/>what you'd change at 10x"]
    T -. "interviewer pushes" .-> DD
  ```

  ### Một kiến trúc web "mặc định" để bắt đầu

  ```mermaid
  flowchart LR
    U["Client"] --> CDN["CDN<br/>static + cache"]
    U --> LB["Load balancer (L7)"]
    LB --> API["Stateless API x N"]
    API --> C["Redis<br/>cache / rate limit / session"]
    API --> DB[("Primary DB")]
    DB --> RR[("Read replicas")]
    API --> Q["Queue / Kafka"]
    Q --> W["Workers"]
    W --> S["Object storage (S3)"]
    W --> ES["Search index"]
  ```

  Bắt đầu từ đây rồi **bỏ bớt / thêm** theo yêu cầu — đừng thêm component nào mà không nói được nó giải quyết vấn đề gì.

  ### Back-of-envelope numbers (bậc độ lớn)

  | Thao tác | Xấp xỉ |
  |---|---|
  | L1 cache / main memory reference | ~1 ns / ~100 ns |
  | SSD random read | ~100 µs |
  | Round trip trong cùng datacenter | ~0.5 ms |
  | Redis GET qua mạng (cùng AZ) | ~0.2–1 ms |
  | Query DB có index | ~1–10 ms |
  | Round trip xuyên lục địa | ~100–150 ms |
  | 1 ngày | 86 400 s ≈ 10⁵ s |
  | 1M request/ngày | ≈ 12 QPS trung bình |

  Peak thường ×2–×5 so với trung bình (flash sale có thể ×50). Luôn nói giả định ra.

  ## Trade-offs

  | Quyết định | Lựa chọn A | Lựa chọn B | Chọn A khi |
  |---|---|---|---|
  | Consistency | Strong (single leader, transaction) | Eventual (replica, async) | Tiền, tồn kho, quyền truy cập |
  | Feed | Fan-out on write | Fan-out on read | Đa số user ít follower; celebrity → hybrid |
  | Realtime | WebSocket | SSE / polling | Cần hai chiều, độ trễ thấp |
  | ID | UUIDv7 / Snowflake | DB sequence | Nhiều writer, không muốn round trip DB |
  | Pagination | Cursor (keyset) | Offset | Dataset lớn, dữ liệu thay đổi liên tục |
  | Tenant isolation | Pool (shared schema + `tenant_id`) | Silo (DB riêng) | Nhiều tenant nhỏ; silo cho enterprise/compliance |
  | Communication | Sync (HTTP/gRPC) | Async (queue/event) | Cần kết quả ngay, chuỗi ngắn |

  ## Pitfalls

  - Nhảy vào vẽ ngay mà không hỏi **scale, consistency, read/write ratio**.
  - Ước lượng xong nhưng **không dùng** con số để ra quyết định.
  - "Thêm cache" mà không nói invalidation, TTL, stampede, cache key theo tenant.
  - Bỏ qua **retry + duplicate** (webhook, queue at-least-once, user bấm hai lần).
  - Single point of failure ẩn: một Redis, một cron instance, một region.
  - Dùng distributed transaction (2PC) cho mọi thứ thay vì saga + idempotency.
  - Lưu thời gian lịch làm việc bằng offset cố định (`+07:00`) thay vì IANA time zone.
  - Không nói về **observability** và cách hệ thống degrade.

  ## Cheat sheet

  - Khung: Req → Estimate → API → Data → HLD → Deep dive → Bottleneck → Trade-off.
  - QPS = DAU × req/user/day ÷ 86 400; peak ×2–5. Storage = records × size × retention × replication.
  - Rate limiter: token bucket trong Redis bằng Lua (atomic), key theo user/IP/tenant, fail-open vs fail-closed phải quyết định.
  - Chat: WebSocket gateway stateless + pub/sub (Redis adapter/Kafka), message store phân vùng theo `conversation_id`, sequence per conversation, ack + resend khi reconnect.
  - Checkout: reserve stock bằng conditional update, idempotency key, payment state machine, webhook + reconciliation, outbox cho event.
  - Search indexing: DB là source of truth → CDC/outbox → indexer idempotent (version) → alias swap khi reindex.
  - Scheduler: lưu job trong DB/queue, lease + heartbeat, at-least-once + idempotent handler.
  - Time zone: lưu IANA zone + local wall time cho lịch lặp; lưu UTC instant cho occurrence cụ thể.
