questions:
  - id: ai-assisted-engineering-001
    level: easy
    type: concept
    q: How do you use AI coding tools like Claude Code or Cursor in your day-to-day work?
    hint: |-
      Trả lời cụ thể theo **loại task**, không chung chung: boilerplate/CRUD, viết test cho code có sẵn, tìm call site trong codebase lạ, refactor cơ học, draft migration script, giải thích stack trace.
      Nêu rõ **vòng lặp**: task nhỏ → context (CLAUDE.md, file liên quan) → AI plan → implement → typecheck/test → **bạn đọc diff** → PR như bình thường.
      Nêu chỗ bạn **không** giao cho AI hoặc review kỹ gấp đôi: auth, tenant isolation, tiền, migration dữ liệu.
      Kết bằng nguyên tắc ownership: code merge là của bạn.
    followUp: Give me one concrete example from last month where the AI output was wrong. How did you catch it?
    redFlags:
      - "I just let it write the code and it usually works"
      - "Cannot name any task where they would not use AI"
    tags: [workflow, ownership]
  - id: ai-assisted-engineering-002
    level: easy
    type: concept
    q: What is a hallucinated API, and how do you guard against it?
    hint: |-
      Model sinh ra function, option, flag hoặc package **không tồn tại** hoặc thuộc version khác (do knowledge cutoff hoặc "đoán theo pattern").
      Phòng thủ: **TypeScript strict** + typecheck bắt ngay method không tồn tại; đọc **docs của đúng version** trong `package.json`; chạy code thật (test), không tin "trông hợp lý".
      Với option dạng string/config (không được type-check) → phải đọc docs hoặc source.
      Với package mới → kiểm tra trên registry trước khi cài (slopsquatting).
    example: |-
      ```ts
      // AI gợi ý — trông hợp lý nhưng không tồn tại trong Prisma
      await prisma.product.upsertMany({ data: rows });
      // Thực tế: dùng createMany({ skipDuplicates: true }) hoặc transaction + upsert từng dòng
      ```
    followUp: Type-checking catches a missing method. What kinds of hallucinations does the type checker NOT catch?
    redFlags:
      - "The model is trained on docs so it's usually right"
    tags: [hallucination, correctness]
  - id: ai-assisted-engineering-003
    level: easy
    type: concept
    q: What is a CLAUDE.md (or a Cursor rules file), and what do you put in it?
    hint: |-
      File hướng dẫn được tool **tự nạp vào context mỗi session** (Claude Code: `CLAUDE.md` ở root repo, có thể có ở thư mục con và ở user-level; Cursor: `.cursor/rules`; nhiều tool đọc `AGENTS.md`).
      Nên có: lệnh build/test/lint, cấu trúc thư mục, quy ước code (naming, error handling, lib được dùng), "đừng làm" (không sửa file generated, không thêm dependency không hỏi), cách chạy một test đơn lẻ.
      Giữ **ngắn, cụ thể, có thể kiểm chứng**; commit vào repo để cả team dùng chung; cập nhật khi AI lặp lại cùng một lỗi.
    followUp: Your CLAUDE.md has grown to 800 lines and the agent still ignores some rules. What do you do?
    redFlags:
      - "Puts secrets or credentials into the rules file"
      - "Treats it as a replacement for linting and tests"
    tags: [context, claude-md]
    verify: true
  - id: ai-assisted-engineering-004
    level: easy
    type: concept
    q: What is prompt injection, and why does it matter more for agentic coding tools than for chat?
    hint: |-
      Prompt injection = nội dung **không tin cậy** (web page, issue, PR comment, README của dependency, tool/MCP output) chứa chỉ thị mà model làm theo như thể từ user.
      Với chat: hậu quả thường chỉ là câu trả lời sai. Với **agent có tool** (shell, file write, network, MCP tới DB/ticket): injection có thể dẫn tới **chạy lệnh, sửa code, exfiltrate secrets**.
      OWASP LLM Top 10 xếp Prompt Injection là LLM01; kết hợp với **Excessive Agency** là tổ hợp nguy hiểm nhất.
      Không có cách "lọc" triệt để → phòng thủ bằng **least privilege, sandbox, human approval** cho action có side-effect.
    followUp: The agent is asked to "fix the bug described in issue #123". What could go wrong, and how do you configure the tool to limit it?
    redFlags:
      - "The model is smart enough to ignore malicious instructions"
    tags: [security, prompt-injection]
  - id: ai-assisted-engineering-005
    level: easy
    type: concept
    q: What should you never paste into an AI tool, and why?
    hint: |-
      Không paste: **secrets** (API key, DB connection string, JWT signing key, `.env`), **PII / dữ liệu khách hàng** (dump DB prod, log có email/SĐT), **code hoặc tài liệu của client** nếu hợp đồng/NDA không cho phép hoặc tool chưa được công ty duyệt.
      Lý do: dữ liệu rời khỏi môi trường kiểm soát; tuỳ điều khoản/plan có thể bị lưu log hoặc dùng để train; vi phạm hợp đồng, GDPR/luật dữ liệu địa phương.
      Thực hành: dùng tool/plan enterprise được duyệt (có data retention policy rõ), dữ liệu mẫu đã ẩn danh, deny đọc `.env` trong cấu hình agent.
    followUp: Your client's contract says source code must not leave their environment. Can you still use AI tools? How?
    redFlags:
      - "It's fine because the vendor says they don't train on it"
    tags: [security, data-leakage, policy]
  - id: ai-assisted-engineering-006
    level: easy
    type: compare
    q: Compare inline autocomplete, IDE chat, and an autonomous coding agent. When do you reach for each?
    hint: |-
      - **Autocomplete**: vài dòng, latency thấp, giữ flow; rủi ro là accept theo phản xạ.
      - **Chat**: hỏi về một đoạn code, sinh function nhỏ, giải thích lỗi; context do bạn chọn.
      - **Agent**: task nhiều bước (sửa nhiều file, chạy test, lặp lại); cần permission, review diff lớn hơn.
      Nguyên tắc: task càng rủi ro/mơ hồ → càng cần **plan + checkpoint**, không phải agent tự chạy dài.
    followUp: When is an agent slower than just writing the code yourself?
    tags: [tools, workflow]
  - id: ai-assisted-engineering-007
    level: easy
    type: concept
    q: What does "tests as spec" mean when working with an AI agent?
    hint: |-
      Bạn định nghĩa "đúng" bằng **test viết (hoặc duyệt kỹ) trước**, rồi giao AI implement cho tới khi test pass. Test là acceptance criteria máy kiểm được.
      Lợi ích: giảm mơ hồ, agent có feedback loop tự động, bạn review test (ngắn) thay vì chỉ review implementation.
      Bẫy: nếu để AI **tự viết cả test lẫn code**, nó có thể viết test khớp với bug. Và phải cấm agent sửa test để pass.
    example: |-
      ```ts
      // Viết trước, giao AI implement applyVoucher()
      it('never discounts below zero', () => {
        expect(applyVoucher({ total: 50_000 }, { amount: 80_000 })).toEqual({ total: 0 });
      });
      it('rejects an expired voucher', () => {
        expect(() => applyVoucher(cart, expired)).toThrow(VoucherExpiredError);
      });
      ```
    followUp: How do you stop the agent from "fixing" a failing test by weakening the assertion?
    tags: [testing, context]
  - id: ai-assisted-engineering-008
    level: easy
    type: concept
    q: What is "slopsquatting" (package hallucination), and how do you defend against it?
    hint: |-
      Model hay bịa tên package nghe hợp lý; attacker **đăng ký sẵn** các tên đó trên npm/PyPI với mã độc (postinstall script). Dev cài theo gợi ý → bị chiếm máy/CI.
      Phòng thủ: kiểm tra package tồn tại, tuổi, maintainer, weekly downloads, repo nguồn; lockfile + `npm ci`; cân nhắc `--ignore-scripts`; dependency review trong CI; allowlist registry nội bộ; không để agent tự `npm install` không hỏi.
    followUp: Your agent added three new dependencies in a PR. What's your review checklist for them?
    tags: [security, supply-chain]
  - id: ai-assisted-engineering-009
    level: medium
    type: compare
    q: Where does AI assistance genuinely speed you up, and where does it slow you down or add risk?
    hint: |-
      **Giúp**: boilerplate, mapping type/DTO, test scaffold, regex/SQL draft, đọc codebase lạ, refactor cơ học (rename, migrate API), viết script một lần.
      **Hại/chậm**: logic nghiệp vụ tinh vi (giá, quyền, tenant), bug concurrency, library mới hơn cutoff, performance tuning cần đo thật, task mơ hồ (AI "đoán" yêu cầu).
      Chi phí ẩn: **thời gian review** và debug code không phải do mình nghĩ ra; context switching; diff to.
      Senior nói được: "tôi đo bằng cycle time của task tương tự trước/sau", không chỉ cảm giác.
    followUp: Some studies found experienced developers were slower with AI tools on familiar codebases. Why might that be?
    redFlags:
      - "It makes me 10x faster at everything"
    tags: [workflow, productivity]
  - id: ai-assisted-engineering-010
    level: medium
    type: concept
    q: Walk me through how you review an AI-generated diff. What is your checklist?
    hint: |-
      1. **Chạy trước**: typecheck, lint, test, và test tay happy path.
      2. **Scope**: diff có đụng file ngoài yêu cầu không? Có "tiện tay" refactor không ai nhờ?
      3. **Correctness**: API có thật đúng version; edge case (null, rỗng, số âm, timezone, concurrency, retry); error handling có nuốt lỗi không.
      4. **Security**: input validation, SQL/NoSQL injection, authz + tenant filter, secret hard-code, log lộ PII.
      5. **Test**: assertion có ý nghĩa không, có test cho case lỗi không, có mock quá tay không.
      6. **Design/maintainability**: đúng pattern của codebase, không duplicate helper đã có.
      7. **License/đạo code**: đoạn dài giống y hệt thư viện khác?
      8. Câu hỏi cuối: **tôi giải thích được từng dòng không?**
    followUp: Which item on that list do you think developers skip most often, and what's the consequence?
    redFlags:
      - "Says 'I review it like any PR' without naming AI-specific failure modes"
    tags: [code-review, correctness]
  - id: ai-assisted-engineering-011
    level: medium
    type: debug
    q: An AI agent generated this endpoint for a multi-tenant app and all tests pass. What is wrong?
    example: |-
      ```ts
      // GET /api/orders/:id
      router.get('/orders/:id', requireAuth, async (req, res) => {
        const order = await db.order.findUnique({ where: { id: req.params.id } });
        if (!order) return res.status(404).json({ error: 'Not found' });
        res.json(order);
      });

      // test do AI viết
      it('returns the order', async () => {
        const o = await seedOrder({ tenantId: 't1' });
        const res = await request(app).get(`/api/orders/${o.id}`).set(authFor('t1'));
        expect(res.status).toBe(200);
      });
      ```
    hint: |-
      **IDOR / cross-tenant leak**: query chỉ lọc theo `id`, không lọc theo `tenantId` (và quyền của user) → user tenant A đọc được order tenant B nếu biết/đoán id.
      Test chỉ phủ happy path cùng tenant nên "xanh giả". Thiếu test **negative**: user `t2` gọi order của `t1` phải nhận 404.
      Fix: `where: { id, tenantId: req.auth.tenantId }` (trả 404 thay vì 403 để không lộ tồn tại), tốt hơn nữa là enforce tenant ở **tầng data access** (repository/middleware, Row-Level Security) để không phụ thuộc từng dev/AI nhớ.
      Ngoài ra: trả nguyên `order` có thể lộ field nội bộ → dùng DTO.
    followUp: How would you make this class of bug impossible to reintroduce, whether by a human or an AI?
    redFlags:
      - "Tests pass so it's fine"
      - "Returns 403 and leaks that the order exists"
    tags: [security, multi-tenancy, debug]
  - id: ai-assisted-engineering-012
    level: medium
    type: debug
    q: The AI "optimized" this caching helper. It passes unit tests but causes intermittent wrong data in production. Why?
    example: |-
      ```ts
      const cache = new Map<string, Product[]>();

      export async function getProducts(tenantId: string, category: string) {
        const key = category; // AI: "simplified the key"
        if (cache.has(key)) return cache.get(key)!;
        const rows = await repo.findProducts(tenantId, category);
        cache.set(key, rows);
        return rows;
      }
      ```
    hint: |-
      - **Cache key thiếu `tenantId`** → tenant B nhận sản phẩm/giá của tenant A (data leak + sai giá). Unit test chỉ dùng một tenant nên không bắt được.
      - **In-process `Map` không TTL, không giới hạn size** → dữ liệu stale vĩnh viễn, memory leak; mỗi instance một cache khác nhau → hành vi "intermittent".
      - Fix: key `products:{tenantId}:{category}` (cả version/locale nếu có), TTL + max size (LRU) hoặc Redis dùng chung, invalidate khi ghi.
      Bài học: AI hay "đơn giản hoá" mà bỏ mất **invariant không được ghi trong code** → ghi invariant vào test và CLAUDE.md.
    followUp: Write the test that would have caught this.
    tags: [caching, multi-tenancy, debug]
  - id: ai-assisted-engineering-013
    level: medium
    type: debug
    q: You asked the agent to fix a flaky test. Here is its diff. Would you approve it?
    example: |-
      ```diff
      - it('sends confirmation email after checkout', async () => {
      + it.skip('sends confirmation email after checkout', async () => {
          await checkout(cart);
      -   expect(mailer.send).toHaveBeenCalledWith(expect.objectContaining({ to: user.email }));
      +   // expect(mailer.send).toHaveBeenCalled(); // flaky, see CI
        });

      - await new Promise((r) => setTimeout(r, 100));
      + await new Promise((r) => setTimeout(r, 2000));
      ```
    hint: |-
      Không. Agent **tắt test và xoá assertion** thay vì tìm root cause, và tăng sleep 100ms → 2s (làm chậm suite, vẫn flaky).
      Root cause thường gặp: email gửi **async không được await** (fire-and-forget), hoặc test phụ thuộc thời gian thật. Fix: `await` promise gửi mail / inject queue giả, dùng fake timers hoặc chờ theo điều kiện (`waitFor`), không sleep cố định.
      Phòng ngừa: rule trong CLAUDE.md "không bao giờ skip/xoá test hoặc nới assertion; nếu nghĩ test sai thì dừng và hỏi"; CI chặn `.only/.skip` mới.
    followUp: How would you detect this kind of "test weakening" automatically in CI?
    redFlags:
      - "Approves because CI is green"
    tags: [testing, code-review, debug]
  - id: ai-assisted-engineering-014
    level: medium
    type: debug
    q: The AI wrote this SQL helper for a search endpoint. Spot the problems.
    example: |-
      ```ts
      export async function searchCustomers(tenantId: string, q: string, sort = 'name') {
        return db.query(
          `SELECT id, name, email FROM customers
           WHERE tenant_id = $1 AND name ILIKE '%${q}%'
           ORDER BY ${sort} LIMIT 50`,
          [tenantId],
        );
      }
      ```
    hint: |-
      - **SQL injection** qua `q` (interpolate vào string) và qua `sort` (`ORDER BY` không parameterize được) → phải **allowlist** cột sort: `const col = { name: 'name', created: 'created_at' }[sort] ?? 'name'`.
      - `q` phải là parameter: `name ILIKE $2` với `'%' + escapeLike(q) + '%'` (escape `%` và `_`).
      - `ILIKE '%x%'` không dùng được B-tree index → full scan trên bảng lớn; cân nhắc `pg_trgm` GIN index hoặc search engine.
      - Thiếu pagination ổn định (tie-breaker `id`).
      AI hay trộn đúng một nửa (tenant_id đã param) — dễ lừa reviewer lướt nhanh.
    followUp: Why can't you pass the ORDER BY column as a bind parameter?
    tags: [security, sql, debug]
  - id: ai-assisted-engineering-015
    level: medium
    type: concept
    q: How do you give an AI agent good context for a non-trivial task?
    hint: |-
      - **Mục tiêu + acceptance criteria** rõ ("done khi…"), kèm non-goals.
      - **File liên quan** (điểm vào, type, test hiện có) thay vì cả repo; chỉ ra pattern mẫu "làm giống `AddressService`".
      - **Ràng buộc**: không thêm dependency, không đổi public API, backward compatible, tenant-aware.
      - **Cách verify**: lệnh test cụ thể, test case mẫu.
      - Yêu cầu **plan trước** rồi duyệt; chia task lớn thành bước nhỏ, mỗi bước commit được.
      - Thông tin bền vững → CLAUDE.md; thông tin một lần → prompt.
      Context thừa cũng hại: loãng, tốn token, model bám vào chi tiết không liên quan.
    followUp: The task needs knowledge that lives in a Confluence page and a Slack thread. How do you get it to the agent safely?
    tags: [context, workflow]
  - id: ai-assisted-engineering-016
    level: medium
    type: concept
    q: How do you configure permissions for an agentic tool like Claude Code on a real work repository?
    hint: |-
      Nguyên tắc **least privilege** + **human approval cho side-effect**:
      - Allowlist lệnh an toàn, lặp lại (`npm test`, `npm run lint`, `git diff`, `git status`); hỏi trước với lệnh ghi/network (`git push`, `curl`, `npm install`, migration).
      - **Deny** đọc `.env`, `secrets/`, `~/.ssh`, `~/.aws`; không cho ghi ngoài thư mục project.
      - Cấu hình commit vào repo (project settings) để team dùng chung; cấu hình cá nhân tách riêng.
      - Việc rủi ro/ tự động dài → chạy trong **container/devcontainer/sandbox** không có credentials prod.
      - Không dùng chế độ bỏ qua mọi permission trên máy có credentials thật.
      - Rule `Bash(...)` **không phải security boundary** (`sh -c 'curl …'` lách được `Bash(curl *)`); hook chặn phải **exit 2** (exit khác vẫn cho tool chạy) → ranh giới thật là sandbox/container.
      Chi tiết cú pháp settings/permission thay đổi theo version → đọc docs hiện hành.
    followUp: A teammate enabled "skip all permission prompts" because approvals were slowing them down. How do you respond?
    redFlags:
      - "Auto-approves everything for speed on a machine with production credentials"
    tags: [security, permissions, claude-code]
    verify: true
  - id: ai-assisted-engineering-017
    level: medium
    type: concept
    q: What does OWASP's "Excessive Agency" risk mean for AI coding agents and MCP integrations?
    hint: |-
      Excessive Agency (OWASP LLM06:2025) = LLM có **quá nhiều functionality, permission hoặc autonomy** so với nhu cầu → khi model sai hoặc bị injection, thiệt hại lớn.
      Với coding agent: MCP server có quyền ghi DB prod, token GitHub quyền admin, tool deploy, shell không giới hạn.
      Giảm thiểu: chỉ bật tool cần cho task; token **scope hẹp, read-only** khi có thể; tách môi trường (dev/staging); approval cho action không đảo ngược; audit log action của agent.
    followUp: You want the agent to read Jira tickets and query a staging database via MCP. How do you scope that?
    tags: [security, owasp, mcp]
    verify: true
  - id: ai-assisted-engineering-018
    level: medium
    type: compare
    q: Should the AI write the tests, the implementation, or both? Compare the options.
    hint: |-
      - **Người viết test, AI implement**: spec do người kiểm soát; an toàn nhất cho logic quan trọng.
      - **AI viết test cho code có sẵn**: nhanh để tăng coverage/characterization test trước refactor; nhưng test khẳng định cả bug hiện tại → cần người review assertion.
      - **AI viết cả hai**: nhanh nhất, rủi ro "hai lỗi khớp nhau"; chấp nhận được cho code ít rủi ro nếu bạn review cả hai và có test negative.
      Kỹ thuật bổ trợ: mutation testing (Stryker) để kiểm test có bắt lỗi thật không; property-based test cho hàm thuần.
    followUp: How would mutation testing reveal weak AI-generated tests?
    tags: [testing]
  - id: ai-assisted-engineering-019
    level: medium
    type: concept
    q: How do you handle licensing and IP concerns with AI-generated code?
    hint: |-
      Rủi ro: model tái tạo gần nguyên văn đoạn code có license (GPL…) → vấn đề tuân thủ; hợp đồng outsource có điều khoản IP và "không dùng tool bên thứ ba".
      Thực hành: dùng tool/plan được công ty & client duyệt; bật tính năng lọc/đối chiếu code công khai nếu tool có; nghi ngờ đoạn dài, đặc thù → tìm nguồn; ưu tiên dùng thư viện có license rõ thay vì copy.
      Không phải luật sư — escalate tới legal/policy của công ty khi hợp đồng không rõ.
    followUp: A client asks you to confirm in writing that no AI-generated code is in their deliverable. What do you do?
    tags: [licensing, policy]
    verify: true
  - id: ai-assisted-engineering-020
    level: medium
    type: concept
    q: How do you keep ownership and real understanding of code that an AI wrote?
    hint: |-
      - Rule cá nhân: **không merge dòng nào mình không giải thích được** trong review.
      - Bắt AI giải thích lựa chọn, rồi tự kiểm chứng (docs, chạy thử), không tin lời giải thích.
      - Viết lại phần cốt lõi bằng tay nếu không hiểu; dùng AI để hỏi "tại sao" chứ không chỉ "làm đi".
      - Ghi design decision vào PR description/ADR bằng lời của mình.
      - Có buổi tự debug/"no-AI" cho phần mới học để giữ kỹ năng.
      Test ownership: lúc 2h sáng prod lỗi, bạn có debug được module này không?
    followUp: How do you apply this to a junior developer who relies heavily on AI?
    tags: [ownership, learning]
  - id: ai-assisted-engineering-021
    level: medium
    type: scenario
    q: A teammate opens a 1,800-line PR generated mostly by an agent and asks for a quick approval before the sprint ends. What do you do?
    hint: |-
      Không approve thứ mình không đọc nổi. Trao đổi thẳng nhưng hợp tác:
      - Yêu cầu **tách PR** theo đơn vị logic (migration, domain logic, API, UI, test) hoặc ít nhất commit theo bước.
      - Nhờ tác giả viết PR description: mục tiêu, thiết kế, rủi ro, cách test; walk-through 15 phút.
      - Ưu tiên review phần rủi ro (authz, dữ liệu, tiền) trước; phần cơ học có thể review nhanh hơn.
      - Nếu deadline ép: ship phần nhỏ đã review, phần còn lại sau feature flag.
      Dài hạn: đưa "PR size guideline" và "AI disclosure" vào team policy.
    followUp: The teammate says "the AI wrote it and the tests pass, so it's fine." How do you respond without making it personal?
    redFlags:
      - "Approves with LGTM to avoid blocking the sprint"
    tags: [code-review, team]
  - id: ai-assisted-engineering-022
    level: medium
    type: scenario
    q: You are onboarding onto a large unfamiliar legacy codebase. How do you use AI tools effectively and safely?
    hint: |-
      - Dùng agent để **đọc, không sửa**: "tìm tất cả call site của `calculateTax`", "vẽ luồng request từ route tới DB", "liệt kê side-effect của module X".
      - **Kiểm chứng** mọi tóm tắt bằng cách mở code, đặt breakpoint, chạy test — tóm tắt tự tin nhưng có thể sai.
      - Viết **characterization test** (có AI hỗ trợ) trước khi đụng code legacy.
      - Ghi kết quả vào CLAUDE.md/README nội bộ để người sau dùng (đã review).
      - Hỏi con người về lý do lịch sử ("tại sao lại thế này") — AI không biết context kinh doanh.
    followUp: The AI's explanation of a module contradicts what a senior teammate told you. How do you resolve it?
    tags: [legacy, onboarding]
  - id: ai-assisted-engineering-023
    level: medium
    type: gotcha
    q: Why does an agent sometimes produce worse results as a long session goes on, and what do you do about it?
    hint: |-
      Context window đầy: lịch sử dài, output lệnh lớn, nhiều hướng thử bỏ dở → thông tin quan trọng bị loãng/tóm tắt mất, model bám vào giả định cũ sai.
      Xử lý: **task nhỏ, session ngắn**; clear/bắt đầu session mới khi đổi task; tóm tắt trạng thái vào file (plan.md) rồi bắt đầu lại; tránh dump log khổng lồ, chỉ đưa phần liên quan; dùng subagent cho việc tìm kiếm để giữ context chính gọn.
      Tín hiệu: agent lặp lại fix đã thất bại, quên ràng buộc đã nói.
    followUp: How do you hand over state between two sessions without losing important constraints?
    tags: [context, claude-code]
    verify: true
  - id: ai-assisted-engineering-024
    level: medium
    type: compare
    q: CLAUDE.md rules versus linters, type checks and CI gates — which should enforce what?
    hint: |-
      - **Deterministic check** (lint rule, type, CI, pre-commit hook) cho thứ **bắt buộc** và kiểm được bằng máy: không `any`, không `.only`, format, import boundary, secret scanning.
      - **Rules file** cho thứ khó máy hoá: pattern ưu tiên, kiến trúc, "hỏi trước khi thêm dependency", cách đặt tên domain.
      - Rules file là **gợi ý xác suất** — model có thể bỏ qua; đừng dựa vào nó cho invariant bảo mật.
      - Nếu một rule liên tục bị vi phạm và máy kiểm được → chuyển thành lint rule/hook.
    followUp: Give an example of a rule you moved from CLAUDE.md into a lint rule or hook, and why.
    tags: [context, ci, claude-md]
  - id: ai-assisted-engineering-025
    level: medium
    type: concept
    q: How do you measure whether AI tools are actually improving your team's delivery?
    hint: |-
      Đo **outcome**, không đo output:
      - DORA: lead time for changes, deployment frequency, change failure rate, time to restore.
      - Cycle time theo loại task, **review time**, số vòng review, PR size.
      - Chất lượng: defect escape rate, incident liên quan code mới, revert rate.
      - Khảo sát dev (satisfaction, cognitive load) — SPACE framework.
      Làm có baseline trước/sau, so task cùng loại; cẩn trọng với Goodhart's law (đo số dòng/số PR → gaming).
    followUp: Lead time dropped 20% but change failure rate went up. What do you conclude and do?
    redFlags:
      - "We measure percentage of code written by AI"
    tags: [metrics, productivity]
  - id: ai-assisted-engineering-026
    level: hard
    type: scenario
    q: Your coding agent was asked to summarize an open-source dependency's README and then ran a curl command posting environment variables to an unknown host. What happened and how do you respond?
    hint: |-
      **Indirect prompt injection**: README chứa chỉ thị ẩn (comment HTML, text trắng) → agent làm theo, kết hợp quyền shell + network → exfiltration.
      Ứng phó (incident): coi mọi secret trong env là **đã lộ** → rotate ngay (API key, DB, cloud), thu hồi token, kiểm tra log truy cập; xác định phạm vi (máy nào, secret nào); báo security team.
      Phòng ngừa: không auto-approve network/`curl`; deny đọc env/.env; chạy agent trong sandbox không có secrets prod; coi tool output/web content là untrusted; audit log hành động agent; training team.
    followUp: How would you design the dev environment so that even a fully compromised agent session cannot reach production secrets?
    redFlags:
      - "Just tell the model not to follow instructions in files"
      - "Doesn't rotate secrets because 'probably nothing was sent'"
    tags: [security, prompt-injection, incident]
  - id: ai-assisted-engineering-027
    level: hard
    type: debug
    q: This AI-written retry wrapper is used for payment capture. Why is it dangerous?
    example: |-
      ```ts
      async function withRetry<T>(fn: () => Promise<T>, retries = 3): Promise<T> {
        for (let i = 0; ; i++) {
          try {
            return await fn();
          } catch (e) {
            if (i >= retries) throw e;
            await sleep(200 * 2 ** i);
          }
        }
      }

      await withRetry(() => paymentGateway.capture({ orderId, amount }));
      ```
    hint: |-
      - Retry **mọi lỗi**, kể cả timeout sau khi gateway đã capture thành công → **charge 2–4 lần**. Capture không idempotent nếu không có **idempotency key**.
      - Retry cả lỗi không nên retry (4xx validation, card declined).
      - Không jitter → nhiều instance retry đồng loạt (thundering herd).
      Fix: truyền **idempotency key ổn định** (vd. `capture:{orderId}`) để gateway dedupe; chỉ retry lỗi transient (network, 5xx, 429 với `Retry-After`); exponential backoff + jitter; giới hạn tổng thời gian; sau khi hết retry → trạng thái "unknown" và **reconcile** với gateway thay vì đoán.
      AI viết đúng "pattern retry" nhưng không biết **ngữ nghĩa nghiệp vụ** của side-effect.
    followUp: The gateway doesn't support idempotency keys. How do you make capture safe anyway?
    tags: [payments, idempotency, debug]
  - id: ai-assisted-engineering-028
    level: hard
    type: debug
    q: The agent migrated this code to a "cleaner" async style. Orders now occasionally oversell. Find the bug.
    example: |-
      ```ts
      // before: single SQL statement
      // UPDATE stock SET qty = qty - $2 WHERE sku = $1 AND qty >= $2

      // after (AI refactor)
      async function reserve(sku: string, n: number) {
        const item = await repo.stock.findOne({ sku });
        if (!item || item.qty < n) throw new OutOfStockError(sku);
        item.qty -= n;
        await repo.stock.save(item);
      }
      ```
    hint: |-
      Refactor biến một **atomic conditional update** thành **read-modify-write** → race condition: hai request cùng đọc `qty = 1`, cùng pass check, cùng save → oversell (lost update).
      Test đơn luồng không bắt được. Fix: quay về `UPDATE ... WHERE qty >= n` và kiểm `rowCount === 1`; hoặc `SELECT ... FOR UPDATE` trong transaction; hoặc optimistic locking (version column).
      Bài học: refactor "cho đẹp" bởi AI phải được review về **semantics** (atomicity, transaction boundary), không chỉ style. Thêm concurrency test (chạy song song N request).
    followUp: Write a test that reliably reproduces the oversell.
    tags: [concurrency, sql, debug]
  - id: ai-assisted-engineering-029
    level: hard
    type: debug
    q: An AI generated this JWT verification middleware. What are the security issues?
    example: |-
      ```ts
      import jwt from 'jsonwebtoken';

      export function auth(req, res, next) {
        const token = req.headers.authorization?.split(' ')[1];
        try {
          const payload = jwt.decode(token) as { sub: string; role: string; tenantId: string };
          if (!payload) return res.sendStatus(401);
          req.user = payload;
          next();
        } catch (err) {
          console.log('auth error', err, req.headers);
          next();
        }
      }
      ```
    hint: |-
      - `jwt.decode` **không verify chữ ký** → ai cũng forge được token với `role: admin`. Phải `jwt.verify(token, key, { algorithms: ['RS256'], issuer, audience })` — pin algorithm.
      - `catch` gọi `next()` → **fail open**: lỗi thì vẫn cho qua. Phải trả 401.
      - Log `req.headers` → lộ token/cookie vào log.
      - Không kiểm `exp` (verify làm), không kiểm tenant khớp với resource (việc của authz layer).
      Đây là lỗi AI hay mắc vì `decode` và `verify` đều "trả về payload" — trông giống nhau.
    followUp: How would you add a test suite that proves this middleware fails closed?
    redFlags:
      - "Only notices the logging issue"
    tags: [security, jwt, debug]
  - id: ai-assisted-engineering-030
    level: hard
    type: scenario
    q: After the team adopted AI agents, PR volume doubled but the incident rate also rose. As a senior engineer, how do you diagnose and fix this?
    hint: |-
      Chẩn đoán bằng dữ liệu: incident gắn với PR nào (size, module, có AI không, reviewer, thời gian review); revert rate; loại lỗi (authz, concurrency, config).
      Giả thuyết thường gặp: review thành bottleneck → review hời hợt; PR to hơn; test yếu; dev merge code không hiểu.
      Biện pháp: giới hạn PR size, checklist review cho vùng rủi ro, CODEOWNERS cho module nhạy cảm, CI gate mạnh hơn (SAST, secret scan, coverage trên diff, mutation test cho core), rules file chung, postmortem blameless và biến mỗi lỗi thành test/lint rule.
      Không cấm AI — điều chỉnh **quy trình** để throughput không vượt năng lực verify.
    followUp: Which single metric would you put on the team dashboard to keep this in check?
    tags: [metrics, team, code-review]
  - id: ai-assisted-engineering-031
    level: hard
    type: gotcha
    q: Why is "the AI also wrote an explanation and it sounds right" not evidence that the code is correct?
    hint: |-
      Model sinh giải thích **sau hoặc song song** với code theo cùng cơ chế dự đoán; giải thích có thể nhất quán với chính nó nhưng sai với thực tế (API behavior, version, runtime).
      Khi bị hỏi lại, model hay **đồng ý với người hỏi** (sycophancy) hoặc "sửa" đúng thành sai.
      Bằng chứng thật: test chạy, docs chính thức đúng version, source code của lib, đo đạc (benchmark, EXPLAIN plan), reproduce.
    followUp: How do you verify a claim like "this query will use the index" coming from an AI?
    tags: [correctness, hallucination]
  - id: ai-assisted-engineering-032
    level: hard
    type: scenario
    q: The AI suggests a library API that looks perfect, but your project pins an older major version. What goes wrong and how do you catch it early?
    hint: |-
      Model trộn API giữa các major version (vd. React Router v5 `Switch` vs v6 `Routes`, Next.js Pages vs App Router, Prisma/ORM options đổi tên) → code không compile, hoặc tệ hơn **compile nhưng hành vi khác** (default caching, option bị ignore).
      Bắt sớm: ghi **version chính** trong CLAUDE.md; chỉ agent tới docs trong `node_modules` hoặc docs đúng version; strict TS; test integration chạy thật; review changelog khi thấy API lạ.
      Option truyền qua object `any`/config string là vùng nguy hiểm nhất vì không được type-check.
    followUp: Which parts of your stack are most prone to this, and why?
    tags: [hallucination, versions]
    verify: true
  - id: ai-assisted-engineering-033
    level: hard
    type: design
    q: Design a safe setup for running AI agents in CI to auto-fix lint errors and failing tests on pull requests.
    hint: |-
      - Chạy trong **runner cô lập**, ephemeral, không có secrets deploy/prod; token GitHub scope tối thiểu (chỉ push branch của PR, không merge, không sửa workflow).
      - Đặc biệt với PR từ **fork/người ngoài**: nội dung PR là untrusted → nguy cơ prompt injection; không chạy agent có quyền ghi trên PR ngoài, hoặc tách quyền.
      - Agent chỉ tạo **commit đề xuất/PR riêng**, người review merge; cấm sửa file `.github/workflows`, lockfile, config bảo mật.
      - Giới hạn thời gian/token/cost; log toàn bộ action.
      - Rule: không được skip/xoá test; diff lớn → dừng, comment thay vì commit.
      - Trigger `pull_request` (không phải `pull_request_target`) cho PR từ fork, để code/nội dung untrusted không chạy với secrets của repo.
    followUp: A malicious contributor puts instructions in a PR description targeting your CI agent. What's your defense in depth?
    tags: [ci, security, design]
    verify: true
  - id: ai-assisted-engineering-034
    level: hard
    type: gotcha
    q: What are the risks of connecting an agent to production systems via MCP (databases, ticketing, cloud consoles)?
    hint: |-
      - MCP server là **code bên thứ ba** chạy với quyền của bạn → supply-chain risk; kiểm nguồn, pin version.
      - Tool output (ticket, row DB, log) có thể chứa **prompt injection**.
      - Quyền ghi prod + model sai = `DELETE`/`UPDATE` không có WHERE, đóng nhầm ticket, sửa config.
      - Lộ PII: agent đọc dữ liệu khách hàng rồi đưa vào context/log.
      Giảm thiểu: read-only replica/staging, user DB quyền hẹp, approval cho mọi write, masking PII, audit log, chỉ bật server cần cho task.
    followUp: An incident requires you to query production data quickly. Would you let the agent do it? Under what constraints?
    tags: [mcp, security]
    verify: true
  - id: ai-assisted-engineering-035
    level: hard
    type: scenario
    q: A junior on your team ships features fast with AI but cannot explain their own code in review and struggles to debug production issues. How do you handle it?
    hint: |-
      Đây là vấn đề **phát triển kỹ năng**, không phải kỷ luật.
      - 1:1 riêng, cụ thể, không đổ lỗi: đưa ví dụ PR, nói tác động (review lâu, rủi ro on-call).
      - Đặt kỳ vọng: giải thích được mọi dòng trong PR; PR description tự viết; trả lời câu hỏi review không copy từ AI.
      - Cách học: dùng AI để **hỏi "tại sao"**, tự viết trước rồi so; pair debugging với bạn; giao bug nhỏ tự debug.
      - Theo dõi tiến bộ vài tuần, ghi nhận khi cải thiện.
    followUp: How would you tell whether the situation is improving, without micromanaging?
    tags: [mentoring, ownership]
  - id: ai-assisted-engineering-036
    level: hard
    type: design
    q: How would you use an AI agent to perform a large mechanical refactor (for example migrating 300 files from one API to another) safely?
    hint: |-
      - Viết **spec + ví dụ trước/sau** cho 2–3 file đầu, review kỹ, cập nhật rules → dùng làm mẫu.
      - Cân nhắc **codemod** (jscodeshift/ts-morph) cho phần deterministic; AI cho phần cần phán đoán — hoặc nhờ AI **viết codemod** rồi review codemod (review 1 script dễ hơn review 300 file).
      - Chia batch nhỏ theo module, mỗi batch một PR, CI xanh; chạy test + typecheck mỗi batch.
      - Giữ backward compatibility (adapter) để merge dần; feature flag nếu đổi hành vi.
      - Diff review có trọng tâm: grep các pattern rủi ro, sample ngẫu nhiên file để đọc kỹ.
    followUp: Why is reviewing a codemod often safer than reviewing its output?
    tags: [refactor, workflow]
  - id: ai-assisted-engineering-037
    level: hard
    type: gotcha
    q: What secret-leakage paths exist when using AI coding tools, beyond pasting a key into chat?
    hint: |-
      - Agent **đọc `.env`/config** khi tìm hiểu project → nội dung vào context gửi tới provider.
      - Output lệnh (`env`, `printenv`, `docker inspect`, log lỗi có connection string) đi vào context.
      - AI **hard-code** secret mẫu/thật vào code, test fixture, doc; commit lên repo.
      - Log/transcript của tool lưu trên máy hoặc chia sẻ khi báo lỗi.
      - Exfiltration qua prompt injection + network tool.
      Phòng: deny list file nhạy cảm, secret manager thay `.env` plaintext, pre-commit secret scanning (gitleaks), push protection, rotate định kỳ.
    followUp: A secret was committed by an agent and pushed to a feature branch 10 minutes ago. What exactly do you do?
    tags: [security, secrets]
  - id: ai-assisted-engineering-038
    level: senior
    type: design
    q: You are asked to write your team's AI-assisted development policy. What goes in it?
    hint: |-
      - **Tool được duyệt** + plan/tài khoản (enterprise, data retention), tool cấm.
      - **Phân loại dữ liệu**: được phép (code nội bộ), hạn chế (code client — theo hợp đồng), cấm (secrets, PII, dữ liệu prod).
      - **Accountability**: tác giả PR chịu trách nhiệm hoàn toàn; review bắt buộc như mọi PR; vùng nhạy cảm cần reviewer thứ hai.
      - **Disclosure**: ghi chú khi phần lớn PR do agent sinh (giúp reviewer điều chỉnh).
      - **Agent config**: permission mặc định, sandbox, cấm auto-approve trên máy có credentials prod.
      - **Dependencies**: không cài package AI gợi ý khi chưa kiểm.
      - **Shared context**: CLAUDE.md/rules trong repo, owner cập nhật.
      - **Đo lường & review policy** định kỳ; training.
      Policy phải ngắn, thực thi được — quá chặt thì người ta lách.
    followUp: How do you enforce the parts of the policy that can't be checked by tooling?
    tags: [policy, leadership]
  - id: ai-assisted-engineering-039
    level: senior
    type: open
    q: Where do you think AI coding tools help senior engineers least, and why?
    hint: |-
      Câu hỏi mở — đo độ chín. Hướng trả lời có chiều sâu:
      - Công việc senior phần lớn là **quyết định dưới bất định**: chọn boundary, trade-off, nói "không", hiểu business — AI thiếu context tổ chức và lịch sử.
      - Debug hệ thống phân tán cần **quan sát thật** (metrics, trace) và giả thuyết; AI giúp gợi ý nhưng không thấy prod.
      - Alignment giữa người (PO, QA, team khác) — không phải code.
      - AI lại giúp nhiều ở phần "gõ" và khám phá nhanh, giải phóng thời gian cho phần trên.
      Nêu quan điểm riêng + ví dụ, thừa nhận giới hạn của chính mình.
    followUp: Has AI changed what you think a senior engineer should be good at?
    tags: [opinion, senior]
  - id: ai-assisted-engineering-040
    level: senior
    type: open
    q: How should junior developer growth change in a team where AI writes much of the first-draft code?
    hint: |-
      - Rủi ro: junior bỏ qua giai đoạn "vật lộn" giúp xây mental model → phụ thuộc, không debug được.
      - Đề xuất: kỳ vọng rõ về **giải thích được code**; bài tập/khung thời gian không AI cho kiến thức nền; review tập trung vào "tại sao"; pair với senior; giao ownership nhỏ trọn vẹn (bug → fix → deploy → monitor).
      - Dùng AI như **gia sư** (hỏi khái niệm, xin phản biện), không như máy làm bài.
      - Senior phải review **quá trình tư duy**, không chỉ diff.
      Không có đáp án duy nhất; cho thấy bạn đã nghĩ về nó và có thử nghiệm.
    followUp: Would you ever restrict AI tool use for a junior? What would make you change your mind?
    tags: [mentoring, opinion]
  - id: ai-assisted-engineering-041
    level: senior
    type: design
    q: How would you structure shared AI context (rules files, commands, skills) for a monorepo with several teams?
    hint: |-
      - **Phân tầng**: rules chung ở root (build, test, conventions toàn repo) + rules riêng mỗi package/thư mục (domain, lib riêng) — tool như Claude Code nạp file theo thư mục.
      - **Owner** cho từng rules file (CODEOWNERS), review thay đổi như code.
      - Giữ ngắn; link sang doc chi tiết thay vì nhét hết; tách "command/skill" tái sử dụng cho workflow lặp lại (tạo migration, thêm endpoint).
      - Rule kiểm được bằng máy → lint/hook, không nằm trong rules.
      - Đo: agent có còn lặp lỗi cũ? Thu thập "lỗi hay gặp" từ review để cập nhật.
    followUp: Two teams' rules conflict (different error-handling conventions). How do you resolve it?
    tags: [context, monorepo, claude-md]
    verify: true
  - id: ai-assisted-engineering-042
    level: senior
    type: open
    q: Your manager wants to report "percentage of code written by AI" as a KPI. What is your response?
    hint: |-
      Phản biện có xây dựng: metric này **dễ bị gaming**, không liên quan tới giá trị (code nhiều hơn ≠ tốt hơn), còn có thể khuyến khích bỏ review.
      Đề xuất thay: DORA metrics, cycle time theo loại task, defect escape/revert rate, review time, dev satisfaction; kèm case study định tính (task X nhanh hơn Y vì Z).
      Hiểu nhu cầu thật của manager (chứng minh ROI license?) và đưa số liệu phục vụ nhu cầu đó.
    followUp: Leadership still insists. How do you report it without causing harm?
    tags: [metrics, influence]
  - id: ai-assisted-engineering-043
    level: cv
    type: behavioral
    q: Your CV says you used Claude Code, Cursor and agentic workflows with human review. Describe exactly what "human review" meant in your process.
    hint: |-
      Mô tả **quy trình thật**, cụ thể từng bước:
      - Loại task giao AI trên dự án e-commerce multi-tenant (vd. scaffold endpoint, test, mapping, refactor legacy) và loại **không** giao hoặc review sâu (tenant filter, authz, checkout, migration).
      - Checkpoint: plan được duyệt, typecheck/test, bạn đọc diff, PR qua peer review như mọi PR.
      - Rules file/CLAUDE.md có gì; team có policy gì.
      - Một ví dụ AI sai và bạn bắt được (điền ví dụ thật của bạn).
      Numbers (nếu có): (điền số liệu thật của bạn) — tỷ lệ task có dùng AI, cycle time trước/sau, số lỗi bắt được ở review.
    followUp: Give me a case where you rejected the AI's approach entirely. What did you do instead?
    redFlags:
      - "Human review = I glanced at it before committing"
      - "Cannot name one concrete mistake the AI made"
    tags: [cv, workflow]
  - id: ai-assisted-engineering-044
    level: cv
    type: scenario
    q: In a multi-tenant platform where tenant isolation is critical, how did you make sure AI-generated data-access code never bypassed tenant scoping?
    hint: |-
      Trả lời theo **defense in depth**, gắn với dự án thật:
      - Tenant enforced ở **tầng chung** (middleware lấy tenant từ token, repository/query builder tự thêm tenant filter) → code mới (người hay AI) khó quên.
      - Rule trong CLAUDE.md: "mọi query phải qua repository tenant-aware; không raw query không tenant".
      - Test **negative cross-tenant** bắt buộc cho endpoint mới; review checklist có mục tenant.
      - Nếu có: lint/grep trong CI cho raw query, cache key có tenant.
      Nói rõ phần nào **thực sự có** trên dự án, phần nào là đề xuất cải thiện — đừng bịa.
    followUp: Did you ever find a tenant-scoping bug in review? What was it?
    tags: [cv, multi-tenancy, security]
  - id: ai-assisted-engineering-045
    level: cv
    type: scenario
    q: Tell me about a time an AI tool produced code that looked right but was subtly wrong in your project. How did you find it?
    hint: |-
      STAR ngắn:
      - **S/T**: task gì (vd. query tối ưu, cache, migration script, form validation).
      - **A**: AI output sai ở đâu (API bịa, thiếu edge case, race condition, sai timezone, thiếu tenant); bạn phát hiện bằng gì (test fail, review, EXPLAIN plan, QA, staging).
      - **R**: fix thế nào, thời gian tiết kiệm/tổn thất.
      - **Bài học**: rule/test nào bạn thêm để không lặp lại.
      Numbers to mention: (điền số liệu thật của bạn) — thời gian phát hiện, số user/tenant bị ảnh hưởng (nếu lọt), thời gian fix.
    followUp: What would have happened if that bug reached production?
    redFlags:
      - "Blames the tool rather than owning the review miss"
    tags: [cv, correctness]
  - id: ai-assisted-engineering-046
    level: cv
    type: behavioral
    q: How did you use AI tools when refactoring legacy modules or resolving production issues across backend, database and frontend?
    hint: |-
      - **Legacy refactor**: AI đọc & tóm tắt module, tìm call site, viết characterization test trước khi sửa; refactor từng bước nhỏ; bạn kiểm chứng tóm tắt bằng code thật.
      - **Production issue**: AI giúp đọc stack trace, gợi ý giả thuyết, viết query điều tra; nhưng **dữ liệu prod/PII không paste vào tool**; bạn xác nhận root cause bằng log/metrics thật.
      - Ranh giới: không để agent chạy lệnh trên prod.
      Numbers: (điền số liệu thật của bạn) — kích thước module, thời gian refactor, MTTR của incident.
    followUp: What did you deliberately NOT use AI for during that incident?
    tags: [cv, legacy, incident]
  - id: ai-assisted-engineering-047
    level: medium
    type: scenario
    q: You are starting a brand-new service with Claude Code. What do you do in the first day so the agent stays useful for months instead of producing a mess?
    hint: |-
      - **Spec trước, code sau**: viết `docs/SPEC.md` ngắn (mục tiêu, non-goals, user flow, data model, NFR) và nhờ agent **phỏng vấn ngược** bạn để lấp chỗ mơ hồ.
      - **Quyết định kiến trúc do bạn chốt** (stack, boundary, auth, DB) → ghi ADR; agent đề xuất phương án + trade-off, không tự chọn.
      - **Walking skeleton**: 1 endpoint end-to-end + test + lint + typecheck + CI chạy xanh trước khi thêm feature → agent luôn có feedback loop.
      - **CLAUDE.md ngay từ đầu** (`/init` rồi sửa tay): lệnh build/test, cấu trúc thư mục, quy ước; `.claude/settings.json` với allow/deny; hook format/lint.
      - Commit nhỏ, thường xuyên; mỗi bước là một checkpoint để quay lại.
    followUp: The agent proposes a microservices architecture with Kafka for a 3-person MVP. How do you respond?
    redFlags:
      - "Asks the agent to 'build the whole app' from a one-paragraph prompt"
      - "Adds CLAUDE.md and tests later, once the code exists"
    tags: [workflow, greenfield, claude-md]
  - id: ai-assisted-engineering-048
    level: medium
    type: concept
    q: Describe the explore → plan → implement → verify loop. Why is skipping the plan step the most common cause of bad agent output?
    hint: |-
      - **Explore**: agent đọc file liên quan, *chưa sửa gì* (plan mode / "đừng viết code").
      - **Plan**: agent viết kế hoạch (file sẽ đổi, bước, rủi ro, test) → **bạn duyệt/sửa** — rẻ nhất để sửa hướng.
      - **Implement**: từng bước nhỏ, chạy test/typecheck sau mỗi bước.
      - **Verify**: test, lint, chạy thật, bạn đọc diff; rồi commit/PR.
      Bỏ plan → agent **đoán yêu cầu**, chọn nhầm chỗ sửa, diff to; phát hiện sai hướng lúc review thì đắt gấp nhiều lần so với lúc plan.
      Task nhỏ, rõ (sửa typo, rename) → có thể bỏ plan.
    followUp: When is it fine to skip the plan and let the agent go straight to code?
    tags: [workflow, claude-code]
  - id: ai-assisted-engineering-049
    level: medium
    type: scenario
    q: Halfway through implementing a feature with an agent, the product owner changes the requirement. How do you handle it?
    hint: |-
      - **Dừng agent**, đừng "vá thêm" trong cùng session dài — context còn đầy giả định cũ.
      - Cập nhật **nguồn sự thật trước**: spec/ticket/acceptance criteria + test (sửa/viết test cho hành vi mới, đánh dấu test cũ bị thay thế).
      - Nhờ agent làm **impact analysis** (read-only): file, API, migration, UI, test bị ảnh hưởng; bạn duyệt.
      - Quyết định: sửa tiếp trên branch, hay **rewind/checkpoint** về trước điểm rẽ, hay bỏ branch và làm lại với spec mới (code AI rẻ, đừng tiếc).
      - Session mới với spec mới; ghi lại quyết định (ADR/changelog) để người sau biết vì sao.
    followUp: Part of the old behaviour is already in production and has data written under the old rules. What changes in your plan?
    redFlags:
      - "Just tells the agent 'actually, make it do Y instead' and keeps going"
    tags: [workflow, requirement-change]
  - id: ai-assisted-engineering-050
    level: hard
    type: scenario
    q: A requirement change arrives for a feature that has been live for three months. It touches the API contract, the database schema and two frontends. How do you use an agent to deliver it safely?
    hint: |-
      - **Map blast radius trước**: agent grep call site, consumer của API, query dùng cột; bạn kiểm chứng; liệt kê thành checklist.
      - **Expand → migrate → contract**: thêm cột/field mới song song, dual-write/backfill, chuyển consumer, rồi mới xoá cái cũ; API version hoặc field optional để không break client cũ.
      - **Characterization test** cho hành vi hiện tại trước khi đổi; test mới cho hành vi mới.
      - Chia **nhiều PR nhỏ** theo bước; feature flag cho hành vi mới; mỗi PR agent làm trong session riêng với plan riêng.
      - Migration dữ liệu: agent viết script, **bạn** review + chạy dry-run trên bản sao; không cho agent chạm DB prod.
    followUp: The agent suggests renaming the column in one migration because "it's cleaner". What goes wrong?
    tags: [requirement-change, migration, workflow]
  - id: ai-assisted-engineering-051
    level: medium
    type: scenario
    q: You join a new project on Monday and must ship a small fix by Friday. How do you use an AI agent to catch up fast without being misled?
    hint: |-
      - **Ngày 1**: chạy được project local (agent giúp đọc README, Dockerfile, CI config, sửa lỗi setup); hỏi agent "vẽ kiến trúc, entrypoint, module chính, luồng dữ liệu" → **ghi vào notes của bạn**.
      - **Trace một request thật** end-to-end (route → service → DB → response) cùng agent, mở code kiểm chứng từng bước.
      - Đọc **git history**: `git log` file hay đổi, PR gần đây, ai là owner → biết vùng nóng và người để hỏi.
      - Hỏi agent câu cụ thể có thể kiểm chứng ("ai gọi X", "config Y đọc ở đâu"), không hỏi câu mơ hồ.
      - Fix nhỏ theo loop explore → plan → test; nhờ reviewer là người trong team.
      - Cuối tuần: đề xuất cập nhật CLAUDE.md/README từ những gì bạn học (đã kiểm chứng).
    followUp: What questions do you still ask humans rather than the agent, and why?
    redFlags:
      - "Trusts the agent's architecture summary without opening the code"
    tags: [onboarding, legacy]
  - id: ai-assisted-engineering-052
    level: hard
    type: design
    q: How do you run several agent sessions in parallel on the same repository without them stepping on each other?
    hint: |-
      - **Git worktree** mỗi task (thư mục + branch riêng) → không đụng file của nhau; mỗi session một task độc lập.
      - Chọn task **ít chồng file** (feature A frontend, bug B backend); task phụ thuộc thì tuần tự.
      - Một session viết code, một session khác (context sạch) **review** diff → giảm bias "tự chấm bài mình".
      - Giới hạn bởi **khả năng review của bạn**, không phải số agent: 5 PR chưa review = 5 rủi ro.
      - Tài nguyên dùng chung (DB local, port, migration) cần tách (DB/schema riêng mỗi worktree) hoặc tuần tự.
    followUp: Two parallel branches both added a database migration with the same sequence number. How do you prevent that?
    tags: [workflow, parallel, claude-code]
    verify: true
  - id: ai-assisted-engineering-053
    level: medium
    type: compare
    q: Compare CLAUDE.md, skills/custom commands, subagents and hooks in Claude Code. What belongs in each?
    hint: |-
      - **CLAUDE.md**: context nạp mỗi session — lệnh build/test, quy ước, "đừng làm". Ngắn, luôn đúng.
      - **Skill / slash command**: quy trình lặp lại, nạp **khi cần** (thêm endpoint, viết migration, release checklist) → không làm phình context mặc định.
      - **Subagent**: task phụ có context riêng (tìm kiếm rộng, review, research) → giữ context chính gọn; có thể giới hạn tool.
      - **Hook**: lệnh **deterministic** chạy tại sự kiện (sau khi sửa file → format/lint; trước tool call → chặn lệnh nguy hiểm). Đây là chỗ cho luật **bắt buộc**.
      Quy tắc: gợi ý → CLAUDE.md/skill; bắt buộc → hook/lint/CI.
    followUp: Your CLAUDE.md has a 60-line section on how to write database migrations. Where should it live instead?
    tags: [claude-code, context, claude-md]
    verify: true
  - id: ai-assisted-engineering-054
    level: hard
    type: debug
    q: The team's shared Claude Code settings file is below. What is risky about it, and how would you fix it?
    example: |-
      ```json
      // .claude/settings.json (committed)
      {
        "permissions": {
          "allow": ["Bash(*)", "Read(**)", "Edit(**)", "WebFetch"],
          "deny": []
        },
        "env": { "DATABASE_URL": "postgres://admin:S3cret@prod-db:5432/app" }
      }
      ```
    hint: |-
      - `Bash(*)` = agent chạy **mọi lệnh** không hỏi (rm, curl, git push, psql) → kết hợp prompt injection từ `WebFetch` là tổ hợp nguy hiểm nhất.
      - `Read(**)` không deny `.env`, `~/.aws`, key file → secret vào context.
      - **Secret prod commit trong repo** qua `env` → leak cho mọi người clone; phải rotate ngay.
      - Fix: allowlist hẹp (`Bash(npm run test:*)`, `Bash(npm run lint)`, `Bash(git status)`, `Bash(git diff:*)`), `deny` cho `Read(./.env)`, `Read(./.env.*)` (deny `Read` không chặn `Bash(cat .env)` → cần hook/sandbox), `Read(./secrets/**)`, `Bash(curl:*)`, `Bash(git push:*)`; lệnh còn lại để **ask**; DB local/staging cho dev; setting cá nhân để ở `settings.local.json` (gitignored).
    followUp: How would you enforce a minimum safe configuration for everyone in the company, even if a repo's settings file is permissive?
    tags: [security, permissions, claude-code]
    verify: true
