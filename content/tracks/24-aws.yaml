overview: |-
  ## TL;DR

  - Phỏng vấn AWS cho full-stack **không phải đề thi chứng chỉ**: interviewer muốn nghe bạn deploy một app Node/Next.js thật — traffic đi qua đâu, secret nằm ở đâu, cái gì chết thì hệ thống sống sót thế nào, và hoá đơn cuối tháng bao nhiêu.
  - 5 trục phải nói trôi chảy: **IAM** (ai được gọi API nào — role + STS, least privilege, thứ tự evaluate policy), **VPC** (public/private subnet, NAT, SG vs NACL, VPC endpoint), **compute** (ECS/Fargate vs Lambda vs EKS vs EC2), **data** (RDS/Aurora Multi-AZ vs read replica, DynamoDB, ElastiCache, S3), **integration** (SQS/SNS/EventBridge, visibility timeout, DLQ).
  - Mọi câu trả lời tốt đều có 3 lớp: **cơ chế** (nó hoạt động thế nào) → **failure mode** (nó hỏng thế nào) → **cost/ops** (nó tốn bao nhiêu, ai vận hành).
  - Con số (limit, giá, quota) **thay đổi liên tục** — nói con số kèm "khoảng / theo docs hiện tại", và luôn kiểm tra Service Quotas trước khi thiết kế.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | IAM role + STS | Identity không có long-term key; ai được phép `AssumeRole` sẽ nhận **temporary credentials** | ECS task role cho phép task đọc đúng 1 bucket, không cần access key trong `.env` |
  | Policy evaluation | Mặc định deny → explicit **Deny thắng tất cả** → cần ít nhất một Allow, và mọi "trần" (SCP, permission boundary, session policy) đều phải cho phép | SCP chặn `ap-southeast-1` thì admin cũng không tạo được EC2 ở region đó |
  | Public vs private subnet | Public = route table có `0.0.0.0/0 → IGW`; private thì không | ALB ở public subnet, ECS task + RDS ở private subnet |
  | NAT Gateway | Cho private subnet gọi **ra** internet, không cho gọi **vào**; tính tiền theo giờ **và** theo GB | Task gọi Stripe API qua NAT; kéo image ECR qua NAT → hoá đơn data processing tăng vọt |
  | Security Group vs NACL | SG: stateful, chỉ allow, gắn ENI, reference được SG khác. NACL: stateless, có deny, gắn subnet, rule có thứ tự | RDS SG chỉ allow 5432 từ `sg-app` |
  | VPC endpoint | Đi tới AWS service bằng mạng nội bộ; Gateway endpoint (S3, DynamoDB) miễn phí, Interface endpoint (PrivateLink) tính theo giờ + GB | S3 gateway endpoint cắt phí NAT cho upload/download |
  | Lambda cold start | Lần đầu (hoặc khi scale out) phải tạo execution environment + chạy init code | Next.js SSR trên Lambda: request đầu sau khi idle chậm hơn vài trăm ms tới vài giây |
  | Multi-AZ vs read replica | Multi-AZ = **availability** (standby đồng bộ, failover tự động). Read replica = **scale đọc** (async, có lag) | Aurora: replica vừa là failover target vừa phục vụ đọc |
  | SQS visibility timeout | Message đang được xử lý bị ẩn trong khoảng này; hết giờ mà chưa delete → message hiện lại → xử lý **lần hai** | Lambda timeout 60s nhưng visibility 30s → duplicate |
  | Presigned URL | URL tạm thời ký bằng credential của bạn, cho client upload/download S3 trực tiếp | Browser `PUT` ảnh 20 MB thẳng lên S3, API server không phải stream file |

  ## Cơ chế hoạt động — một app Next.js + Node API trên AWS

  ```mermaid
  flowchart LR
    U["User"] --> R53["Route 53"]
    R53 --> CF["CloudFront + WAF"]
    CF -- "/_next/static, images" --> S3[("S3 bucket<br/>OAC, private")]
    CF -- "dynamic" --> ALB["ALB<br/>(public subnets, 2+ AZ)"]
    subgraph VPC["VPC"]
      ALB --> ECS["ECS Fargate tasks<br/>Next.js + API<br/>(private subnets)"]
      ECS --> RDSP["RDS Proxy"] --> AUR[("Aurora PostgreSQL<br/>writer + reader")]
      ECS --> REDIS[("ElastiCache")]
      ECS --> SQS[["SQS queue"]]
      SQS --> WRK["Worker (Lambda/ECS)"]
      WRK --> DLQ[["DLQ"]]
      ECS -- "gateway endpoint" --> S3
      ECS -- "egress" --> NAT["NAT Gateway"] --> EXT["3rd-party APIs"]
    end
    ECS -. "task role (STS)" .-> SM["Secrets Manager / KMS"]
    ECS -. "logs, metrics, traces" .-> CW["CloudWatch / X-Ray (OTel)"]
  ```

  **IAM policy evaluation (trong một account, rút gọn):**

  ```mermaid
  flowchart TD
    A["Request: principal + action + resource"] --> B{"Explicit Deny ở bất kỳ policy nào?"}
    B -- "có" --> DENY["DENY"]
    B -- "không" --> C{"SCP / RCP của Organization cho phép?"}
    C -- "không" --> DENY
    C -- "có" --> D{"Resource-based policy Allow?"}
    D -- "có (cùng account)" --> ALLOW["ALLOW"]
    D -- "không" --> E{"Identity-based policy Allow?"}
    E -- "không" --> DENY
    E -- "có" --> F{"Permission boundary + session policy cũng cho phép?"}
    F -- "không" --> DENY
    F -- "có" --> ALLOW
  ```

  > Cross-account: cần **cả hai phía** cho phép — identity policy ở account gọi **và** resource policy (hoặc trust policy của role) ở account đích. Chi tiết edge case (resource policy grant trực tiếp cho role session, permission boundary) xem docs "Policy evaluation logic".

  ## Trade-offs

  | Lựa chọn | Hợp khi | Không hợp khi | Chi phí vận hành |
  |---|---|---|---|
  | **Lambda** | Traffic đột biến / thưa, event-driven (S3, SQS), job ngắn | Request dài (> 15 phút), WebSocket giữ lâu, cần connection pool ổn định, latency p99 nhạy cold start | Thấp nhất; nhưng debug phân tán, quota concurrency |
  | **ECS Fargate** | Web/API container chạy liên tục, Socket.IO, team không muốn quản node | Cần GPU/daemonset/tuỳ biến kernel; workload rất lớn thì EC2 rẻ hơn | Thấp–vừa |
  | **EKS** | Đã có chuẩn Kubernetes, multi-cloud, nhiều team, cần ecosystem (Argo, operators) | Team nhỏ, 3–5 service | Cao (upgrade cluster, add-on, networking) |
  | **EC2 + ASG** | Cần kiểm soát OS, workload ổn định dùng Savings Plans | Muốn deploy nhanh, ít ops | Cao nhất (patch, AMI) |
  | **ALB** | HTTP/HTTPS, route theo host/path, WebSocket, OIDC auth | Non-HTTP, cần IP tĩnh | Theo giờ + LCU |
  | **NLB** | TCP/UDP/TLS, IP tĩnh, latency thấp, PrivateLink | Cần route L7 | Theo giờ + NLCU |
  | **API Gateway** | API cho Lambda, cần throttling/usage plan/API key, auth tích hợp | Payload lớn, request dài, traffic rất cao ổn định (giá per-request) | Theo request |
  | **RDS/Aurora** | Dữ liệu quan hệ, transaction, query linh hoạt | Access pattern key-value ở quy mô cực lớn | Vừa |
  | **DynamoDB** | Access pattern biết trước, key-value, scale gần như vô hạn | Ad-hoc query, join, báo cáo | Thấp |
  | **SQS** | Work queue, buffer, retry + DLQ | Cần replay, nhiều consumer đọc cùng stream | Rất thấp |
  | **SNS / EventBridge** | Fan-out (SNS) / route theo nội dung event, SaaS integration, scheduler (EventBridge) | Cần ordering nghiêm ngặt + replay dài hạn (→ Kinesis/MSK) | Thấp |

  ## Pitfalls

  - Nhét **access key** vào `.env` của container thay vì dùng task role / instance profile / IRSA / Pod Identity.
  - Policy `"Resource": "*"` và `"Action": "s3:*"` "cho chạy được đã" — rồi không bao giờ siết lại.
  - Đặt RDS ở public subnet với `0.0.0.0/0:5432` để "debug nhanh".
  - Quên **NAT Gateway data processing**: kéo image ECR, gọi S3 qua NAT thay vì VPC endpoint → hoá đơn lớn bất ngờ. NAT Gateway nên có **một cái mỗi AZ** nếu cần HA (và traffic cross-AZ cũng tốn tiền).
  - Lambda mở DB connection trong handler → connection storm khi scale; không dùng RDS Proxy.
  - SQS visibility timeout ngắn hơn thời gian xử lý → duplicate; không có DLQ → poison message lặp vô hạn.
  - Nghĩ "Multi-AZ = scale đọc" (sai với RDS Multi-AZ instance: standby không phục vụ đọc).
  - Bucket S3 public để CloudFront đọc — dùng **OAC** và bucket private.
  - Không đặt **budget alarm** và không tag tài nguyên → không biết tiền đi đâu.

  ## Cheat sheet

  - Người/CI dùng **Identity Center / OIDC federation** (GitHub Actions → `AssumeRoleWithWebIdentity`), workload dùng **role**. Không có long-term key.
  - Explicit Deny > mọi thứ. SCP không *cấp* quyền, chỉ đặt trần.
  - Private subnet đi ra: NAT GW (tốn tiền) hoặc VPC endpoint (S3/DynamoDB gateway: miễn phí).
  - SG reference SG: `sg-rds` allow 5432 từ `sg-app` — không dùng CIDR.
  - S3: strong read-after-write consistency (từ 12/2020). Upload lớn → presigned URL + multipart.
  - CloudFront → S3: **OAC** (OAI là legacy).
  - Lambda + RDS → **RDS Proxy**; tạo client **ngoài** handler.
  - SQS: visibility timeout ≥ ~6× function timeout khi dùng Lambda event source (khuyến nghị của AWS); DLQ với `maxReceiveCount`; consumer phải **idempotent** (at-least-once).
  - Multi-AZ = HA; read replica = scale đọc; Aurora Global Database / cross-region replica = DR.
  - DR theo chi phí tăng dần: backup & restore → pilot light → warm standby → multi-site active/active.
  - Well-Architected: 6 pillars — Operational Excellence, Security, Reliability, Performance Efficiency, Cost Optimization, Sustainability.
