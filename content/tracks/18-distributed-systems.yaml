overview: |-
  ## TL;DR

  - Hệ phân tán = nhiều máy giao tiếp qua **mạng không tin cậy**, **không có đồng hồ chung**, và **có thể pause bất kỳ lúc nào**. Mọi pattern trong track này là cách sống chung với 3 sự thật đó.
  - **CAP** chỉ nói về lúc có network partition: chọn Consistency (từ chối) hay Availability (trả lời có thể sai). **PACELC** bổ sung: khi không partition, vẫn phải đổi **Latency** lấy **Consistency**.
  - Resilience cơ bản: **timeout** ở mọi network call, **retry có backoff + jitter** chỉ cho thao tác **idempotent**, **circuit breaker**, **bulkhead**, **load shedding**.
  - Transaction xuyên service: tránh **2PC** (blocking, coupling) → **saga** với compensating actions + outbox.
  - Lock phân tán cần **lease + fencing token**; consensus (Raft) cho leader election và metadata; consistent hashing để chia dữ liệu mà ít phải di chuyển khi đổi số node.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Network partition | Một nhóm node không nói chuyện được với nhóm khác | AZ-a mất kết nối AZ-b |
  | Linearizability | Mọi thao tác như xảy ra tức thời tại một điểm, theo thời gian thực | Đọc sau khi write được ack luôn thấy giá trị mới |
  | Eventual consistency | Không có write mới thì cuối cùng mọi replica hội tụ | DNS, read replica |
  | Read-your-writes | Một client luôn thấy write của chính mình | Sửa profile xong reload thấy ngay |
  | Quorum | R + W > N ⇒ tập đọc và tập ghi giao nhau | N=3, W=2, R=2 |
  | Idempotency | Thực hiện nhiều lần = một lần | `PUT /users/1`, `Idempotency-Key` cho POST |
  | Circuit breaker | Ngừng gọi dependency đang hỏng một thời gian | Closed → Open → Half-open |
  | Bulkhead | Chia tài nguyên riêng cho từng dependency | Pool 20 connection cho payment, 10 cho search |
  | Saga | Chuỗi local transaction + compensation | Reserve stock → charge → (fail) → release stock |
  | Fencing token | Số tăng đơn điệu kèm lock; storage từ chối token cũ | Lock #34 bị từ chối sau khi #35 đã ghi |
  | Lamport clock | Counter logic cho thứ tự happens-before | `max(local, received) + 1` |
  | Consistent hashing | Hash node và key lên vòng; thêm node chỉ chuyển ~1/N key | Vnodes cân bằng tải |

  ## Cơ chế hoạt động

  ### Retry an toàn

  ```mermaid
  flowchart TD
    A["Call dependency<br/>(with timeout / deadline)"] --> B{"Success?"}
    B -- yes --> Z["Return"]
    B -- no --> C{"Retryable?<br/>(timeout, 503, 429, conn reset)"}
    C -- no --> F["Fail fast / DLQ"]
    C -- yes --> D{"Operation idempotent<br/>or has idempotency key?"}
    D -- no --> F
    D -- yes --> E{"Attempts < max AND<br/>deadline remaining AND<br/>retry budget OK AND<br/>breaker closed?"}
    E -- no --> F
    E -- yes --> G["Sleep random(0, base * 2^n)<br/>(full jitter)"] --> A
  ```

  ### Saga orchestration (happy path + compensation)

  ```mermaid
  sequenceDiagram
    participant O as Orchestrator
    participant I as Inventory
    participant P as Payment
    participant S as Shipping
    O->>I: ReserveStock(order 42)
    I-->>O: Reserved
    O->>P: Charge(order 42, idemKey)
    P-->>O: Charged
    O->>S: CreateShipment
    S-->>O: Failed (no carrier)
    O->>P: Refund(order 42)
    O->>I: ReleaseStock(order 42)
    Note over O: order 42 = CANCELLED (saga state persisted at every step)
  ```

  ### Raft (tóm tắt)

  - Mỗi node là follower/candidate/leader; thời gian chia thành **term**. Follower hết **election timeout (ngẫu nhiên)** mà không nghe heartbeat → thành candidate, tăng term, xin vote; đạt **đa số** → leader.
  - Leader nhận lệnh, append vào log, replicate; entry được **commit** khi đa số đã ghi. Chỉ node có log đủ mới nhất mới được bầu (election restriction).
  - Cluster 2f+1 node chịu được f node lỗi (3 → 1, 5 → 2).

  ## Trade-offs

  | Lựa chọn | Được | Mất | Khi nào |
  |---|---|---|---|
  | CP (từ chối khi partition) | Không bao giờ trả dữ liệu sai | Availability khi partition | Tiền, tồn kho, lock, metadata |
  | AP (trả lời khi partition) | Luôn phản hồi | Có thể stale/xung đột → cần merge | Giỏ hàng, feed, counter |
  | 2PC | Atomic xuyên resource | Blocking khi coordinator chết, latency, coupling | Trong một hệ DB/XA có kiểm soát |
  | Saga choreography | Loose coupling, không điểm trung tâm | Khó theo dõi flow, dễ vòng event | Ít bước, ít team |
  | Saga orchestration | Flow tường minh, dễ timeout/retry/observe | Orchestrator là thành phần thêm | Nhiều bước, long-running |
  | Retry | Vượt lỗi tạm thời | Khuếch đại tải (retry storm), trùng | Chỉ với idempotent + backoff + budget |

  ## Pitfalls

  - Retry ở **mọi tầng** (client, gateway, service, SDK) → một request thành 3×3×3 = 27 request khi downstream chậm.
  - Timeout của caller **ngắn hơn** tổng timeout+retry của callee → callee vẫn làm việc cho request đã bị bỏ.
  - Retry POST không có idempotency key → trừ tiền hai lần.
  - Dùng wall clock (`Date.now()`) để sắp thứ tự sự kiện giữa các máy hoặc đo khoảng thời gian (dùng monotonic clock: `performance.now()`, `process.hrtime.bigint()`).
  - Tin rằng lock có TTL đảm bảo mutual exclusion khi process có thể bị GC pause.
  - Circuit breaker dùng chung cho mọi endpoint của một dependency → một endpoint hỏng làm "tắt" cả dependency.
  - Nói "chúng tôi chọn CA" — không có lựa chọn bỏ P trong hệ phân tán thật.

  ## Cheat sheet

  - CAP: khi partition, chọn C hoặc A. PACELC: Else → Latency vs Consistency.
  - Quorum: R + W > N; N=3, W=2, R=2 phổ biến; quorum ≠ linearizable tuyệt đối (sloppy quorum, clock).
  - Retry: max 2–3 lần, exponential backoff + **full jitter**, retry budget (vd ≤ 10% traffic), chỉ lỗi transient, tôn trọng `Retry-After`.
  - Timeout: đặt theo p99.9 của dependency, **deadline propagation** qua các hop.
  - Circuit breaker: failure-rate threshold trên sliding window + minimum calls, open → half-open probe.
  - Idempotency key: client sinh UUID; server lưu (key → response) với unique constraint; so sánh payload hash.
  - Lock đúng: lease (TTL) + fencing token kiểm tra ở storage; consensus store (etcd/ZooKeeper) cho correctness.
  - Clocks: wall clock có thể nhảy lùi; monotonic cho duration; Lamport/vector clock cho thứ tự nhân quả; LWW theo timestamp = mất write.
