overview: |-
  ## TL;DR

  - Cache là **bản sao có thể sai** của dữ liệu gốc. Mọi quyết định cache thực chất là trả lời 3 câu: *được phép stale bao lâu?*, *invalidate thế nào?*, *khi cache chết thì hệ thống sống ra sao?*
  - Pattern phổ biến nhất ở backend Node/TS là **cache-aside** + TTL + **delete-on-write**. Các pattern khác (read-through, write-through, write-behind, refresh-ahead) là biến thể đổi latency/consistency/complexity.
  - Senior interview xoáy vào **failure modes**: stampede (thundering herd), penetration, avalanche, hot key, big key, race giữa writer và reader, Redis down → DB sập theo.
  - Redis không chỉ là key-value: data structures, persistence (RDB/AOF), eviction policy, Cluster 16384 slots, Lua atomic, pub/sub, lock (và **giới hạn** của Redlock).
  - Multi-tenant: **tenant id phải nằm trong cache key** (và trong CDN cache key / `Vary`), nếu không là data leak chứ không chỉ là bug.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Cache-aside (lazy loading) | App tự đọc cache → miss thì đọc DB rồi set cache | `get(k) ?? set(k, await db.find(), ttl)` |
  | Read-through | Cache layer/library tự load từ DB khi miss | DataLoader/cache library có `loader` function |
  | Write-through | Ghi DB **và** cache đồng bộ trong cùng request | Update profile → `db.update` rồi `cache.set` |
  | Write-behind (write-back) | Ghi cache trước, flush DB bất đồng bộ | Counter view count gom batch mỗi 5s |
  | Refresh-ahead | Làm mới key **trước** khi hết hạn | Còn 10% TTL thì background refresh |
  | TTL + jitter | Hạn sống + ngẫu nhiên hoá để key không hết hạn cùng lúc | `ttl = 300 + rand(0..60)` |
  | Stampede / thundering herd | Hot key hết hạn → N request cùng miss và cùng đánh DB | Trang chủ hết hạn lúc 12:00:00 |
  | Penetration | Query key **không tồn tại** → luôn miss → luôn đánh DB | `GET /product/-1` bị bot spam |
  | Avalanche | **Nhiều** key hết hạn cùng lúc hoặc cache cluster chết | Warm cache lúc deploy với cùng TTL |
  | Hot key / big key | 1 key nhận quá nhiều traffic / 1 key quá lớn | `config:global` 200k rps; hash 2GB |
  | Negative caching | Cache cả kết quả "không có" với TTL ngắn | `set("p:-1", NULL_SENTINEL, 30)` |
  | Eviction vs expiration | Eviction = bị đuổi vì hết memory; expiration = hết TTL | `maxmemory-policy allkeys-lru` |

  ## Cơ chế hoạt động

  ### Cache-aside read + delete-on-write

  ```mermaid
  sequenceDiagram
    participant C as Client
    participant A as API (Node)
    participant R as Redis
    participant D as DB
    C->>A: GET /products/42
    A->>R: GET t:acme:product:42:v3
    alt hit
      R-->>A: JSON
    else miss
      R-->>A: nil
      A->>D: SELECT ... WHERE id=42 AND tenant_id='acme'
      D-->>A: row
      A->>R: SET key JSON EX 300+jitter
    end
    A-->>C: 200
    Note over A,D: Write path
    C->>A: PUT /products/42
    A->>D: UPDATE (commit)
    A->>R: DEL t:acme:product:42:v3
  ```

  ### Chống stampede (quyết định khi miss)

  ```mermaid
  flowchart TD
    M["Cache miss / near expiry"] --> L{"In-process singleflight<br/>đã có promise cho key?"}
    L -- yes --> W["await promise hiện có"]
    L -- no --> S{"Còn bản stale<br/>(stale-while-revalidate)?"}
    S -- yes --> RS["Trả stale ngay +<br/>refresh nền (1 lần)"]
    S -- no --> K{"SET lock NX PX<br/>thành công?"}
    K -- yes --> DB["Query DB → SET cache<br/>→ release lock"]
    K -- no --> BO["Chờ ngắn + đọc lại cache<br/>(hoặc trả fallback)"]
  ```

  ### Redis Cluster routing

  - `slot = CRC16(key) mod 16384`; mỗi master giữ một dải slot. Client cluster-aware cache bảng slot và xử lý `MOVED`/`ASK`.
  - Multi-key command (MGET, Lua, MULTI) chỉ chạy khi các key **cùng slot** → dùng **hash tag** `{tenant:acme}:cart` (chỉ phần trong `{}` được hash). Lạm dụng hash tag = dồn hết vào một node (hot shard).

  ## Trade-offs

  | Pattern | Read latency | Write latency | Consistency | Rủi ro chính | Hợp khi |
  |---|---|---|---|---|---|
  | Cache-aside | Miss chậm (2 round-trip) | Không đổi | Eventual, cửa sổ stale = TTL hoặc tới lúc DEL | Race reader/writer, stampede | Read-heavy, default choice |
  | Read-through | Như cache-aside | Không đổi | Eventual | Phụ thuộc library/provider | Muốn gom logic load vào 1 chỗ |
  | Write-through | Hit rate cao sau write | Tăng (2 lần ghi) | Tốt hơn nhưng **không atomic** giữa DB và cache | Cache chứa data không ai đọc; lỗi nửa chừng | Data vừa ghi được đọc ngay |
  | Write-behind | Nhanh | Rất nhanh | Yếu; DB trễ | **Mất dữ liệu** nếu cache chết trước flush | Counter, metrics, chấp nhận mất |
  | Refresh-ahead | Luôn hit với hot key | Không đổi | Vẫn stale trong khoảng refresh | Refresh cả key không còn ai dùng | Hot key dự đoán được |

  | | Redis | Memcached |
  |---|---|---|
  | Data model | String, Hash, List, Set, ZSet, Stream, Bitmap, HyperLogLog, Geo, JSON (module/8.x) | Chỉ string/blob |
  | Threading | Command execution đơn luồng (I/O threads từ 6.0) | Multi-threaded |
  | Persistence / replication | RDB, AOF, replica, Sentinel, Cluster | Không (thuần cache) |
  | Eviction | Nhiều policy cấu hình được | LRU theo slab class |
  | Hợp | Cần data structure, atomic op, lock, pub/sub, rate limit | Cache blob đơn giản, scale theo core, ít vận hành |

  ## Pitfalls

  - **Update cache thay vì delete** khi write → hai writer đồng thời có thể để lại giá trị cũ trong cache vĩnh viễn (đến hết TTL).
  - Không có TTL "vì sẽ invalidate khi write" → bất kỳ đường ghi nào quên DEL (script, migration, service khác) = stale mãi mãi.
  - Cache **lỗi / `undefined` / response rỗng do timeout** như dữ liệu thật.
  - Key thiếu `tenantId`, `locale`, `currency`, `role` → user A thấy dữ liệu user B.
  - Dùng `KEYS *` hoặc `DEL` một big key trên production → block event loop của Redis.
  - Coi Redis là "luôn sống": không timeout, không circuit breaker → Redis chậm kéo toàn bộ API chậm theo; Redis chết → 100% traffic đổ vào DB.
  - Distributed lock bằng `SET NX` rồi `DEL` không kiểm tra owner → xoá lock của người khác.
  - HTTP: `Cache-Control: public` cho response có cookie/Authorization → CDN cache dữ liệu cá nhân.

  ## Cheat sheet

  - Default: cache-aside + TTL có jitter + **DEL sau khi commit DB** + singleflight trong process.
  - Stampede: singleflight · lock `SET k v NX PX` · stale-while-revalidate · refresh-ahead · probabilistic early expiration (XFetch).
  - Penetration: validate input · cache null TTL ngắn · Bloom filter. Avalanche: jitter TTL · multi-level cache · HA cluster · rate limit tới DB.
  - Hot key: L1 in-process cache vài giây · nhân bản key `k#1..k#N` · client-side caching (RESP3 tracking).
  - Big key: `redis-cli --bigkeys` / `--memkeys`, `MEMORY USAGE`, chia nhỏ, `UNLINK` thay `DEL`.
  - Eviction: default `noeviction`; cache thuần → `allkeys-lru` hoặc `allkeys-lfu`; `volatile-*` chỉ đuổi key có TTL.
  - Persistence: RDB = snapshot (fork + copy-on-write), AOF = log ghi (`appendfsync everysec` mặc định). Cache thuần có thể tắt cả hai.
  - Lock: `SET lock:k <uuid> NX PX 10000`; release bằng Lua compare-and-delete; việc quan trọng cần **fencing token**.
  - HTTP: `no-cache` = được lưu nhưng phải revalidate; `no-store` = không lưu; `s-maxage` cho shared cache; `ETag` → `304`; `Vary` nằm trong cache key.
