id: 34-scenario-migration-zero-loss
slug: scenario-migration
title: "Scenarios: Zero-Downtime Migration & Zero Data Loss"
tier: 9
status: drafted
summary: "Mock interview tình huống production: đổi schema Postgres không downtime (lock queue, CONCURRENTLY, NOT VALID), backfill bảng lớn, đổi DB engine bằng snapshot + CDC, strangler fig cho legacy, outbox, drain Kafka backlog 10M, durability knobs và cutover/rollback."
cvLinked: true
prerequisites: [13-sql-postgres, 17-messaging-kafka, 25-devops-cicd]
# Must-know questions, highest priority first (study plans take the first few).
essentials:
  - scenario-migration-001
  - scenario-migration-030
  - scenario-migration-028
  - scenario-migration-013
  - scenario-migration-011
  - scenario-migration-014
  - scenario-migration-048
  - scenario-migration-056
overview: |-
  ## TL;DR

  - "Zero-downtime" = **mọi bước đều tương thích với cả code version N và N-1 đang chạy song song** (rolling deploy, blue/green, canary). Công cụ chính: **expand → migrate → contract**, mỗi bước deploy riêng và rollback được.
  - Postgres hiếm khi chết vì DDL *chậm*; nó chết vì **lock queue**: một `ALTER TABLE` cần `ACCESS EXCLUSIVE` xếp hàng sau một query dài và **chặn mọi query đến sau nó**. Luôn đặt `lock_timeout` (vài giây) + retry, dùng `CONCURRENTLY` / `NOT VALID` + `VALIDATE`.
  - Đổi DB engine / cluster không downtime = **snapshot + CDC** (Debezium, AWS DMS, logical replication) → **verify** (count, checksum theo chunk, shadow read) → **cutover ngắn** (write freeze vài giây–phút) → **reverse replication** để có đường lui. Dual-write từ app là phương án cuối vì không atomic.
  - "Zero data loss" không phải một config mà là một **chuỗi durability**: client retry + idempotency key → API chỉ ack khi đã durable → outbox / Kafka `acks=all` + `min.insync.replicas=2` → consumer commit **sau** xử lý → DB sync replication / PITR → **reconciliation** để chứng minh.
  - Kafka backlog 10M: tính ETA trước (`backlog / (consume − produce)`), scale consumer **tối đa bằng số partition**, song song theo key bên trong partition nếu cần ordering, bảo vệ downstream bằng rate limit, **đừng tăng partition vội** vì nó đổi mapping key → partition.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Expand–contract (parallel change) | Thêm cái mới song song cái cũ, chuyển dần, rồi mới xoá cái cũ | `zip` → thêm `postal_code`, dual-write, backfill, đổi read, drop `zip` |
  | Lock queue | Lock request chờ sẽ chặn các request đến sau xung đột với nó | `ALTER` chờ sau `SELECT` 10 phút → mọi `SELECT` mới cũng chờ |
  | `lock_timeout` | Hủy statement nếu chờ lock quá N ms | `SET lock_timeout = '3s'` rồi retry có backoff |
  | `NOT VALID` + `VALIDATE` | Tạo constraint chỉ áp cho row mới, validate row cũ sau với lock nhẹ | FK / CHECK trên bảng 500M rows |
  | `CREATE INDEX CONCURRENTLY` | Build index không chặn write, đổi lại chậm hơn và có thể để lại index `INVALID` | Không chạy được trong transaction block |
  | Backfill | Điền dữ liệu cho cột/bảng mới theo batch, idempotent, resume được | `UPDATE ... WHERE id BETWEEN $1 AND $2 AND new_col IS NULL` |
  | CDC | Đọc change log (WAL / binlog / SQL Server CDC) để stream thay đổi | Debezium → Kafka → sink Postgres |
  | Shadow read | Đọc cả nguồn cũ và mới, so sánh, vẫn trả kết quả cũ | Log diff 0.02% → tìm bug mapping |
  | Strangler fig | Proxy route từng endpoint từ hệ cũ sang hệ mới | `/v1/orders/*` → Node, còn lại → PHP |
  | RPO / RTO | Mất tối đa bao nhiêu dữ liệu / khôi phục trong bao lâu | RPO = 0, RTO = 5 phút cho payments |
  | Transactional outbox | Ghi business row + event trong cùng transaction, relay publish sau | `orders` + `outbox` trong 1 `COMMIT` |
  | Reconciliation | Job so sánh định kỳ nguồn và đích để phát hiện lệch | Count + sum amount mỗi giờ theo tenant |
  | Rehash-on-login | Nâng cấp hash password dần khi user đăng nhập | MD5 → argon2id |

  ## Cơ chế hoạt động

  ### Expand–contract qua nhiều lần deploy

  ```mermaid
  flowchart LR
    E1["1. Expand schema<br/>ADD COLUMN nullable<br/>(lock_timeout + retry)"] --> D1["2. Deploy code v2<br/>ghi cả cũ + mới<br/>đọc cũ"]
    D1 --> B["3. Backfill theo batch<br/>idempotent, throttle<br/>theo replica lag"]
    B --> V["4. Verify<br/>count mismatch = 0"]
    V --> D2["5. Deploy code v3<br/>đọc mới, vẫn ghi cả hai"]
    D2 --> D3["6. Deploy code v4<br/>chỉ dùng cột mới"]
    D3 --> C["7. Contract<br/>DROP cột cũ<br/>(sau 1 chu kỳ rollback)"]
    D2 -. "rollback an toàn:<br/>v2 vẫn đúng" .-> D1
  ```

  ### Lock queue: vì sao một ALTER "0.1 giây" làm sập API

  ```mermaid
  sequenceDiagram
    participant R as Report query (T1)
    participant M as Migration (T2)
    participant A as API queries (T3..Tn)
    R->>R: SELECT ... chạy 10 phút (ACCESS SHARE)
    M->>M: ALTER TABLE orders ADD COLUMN ... (cần ACCESS EXCLUSIVE)
    Note over M: Chờ T1 → vào lock queue
    A->>A: SELECT * FROM orders (ACCESS SHARE)
    Note over A: Xung đột với T2 đang chờ → cũng chờ
    Note over A: Pool cạn, timeout, 5xx
    Note over M: Fix: SET lock_timeout = '3s' → T2 tự hủy, API chạy tiếp, retry sau
  ```

  ### Đổi DB engine: snapshot + CDC + cutover + đường lui

  ```mermaid
  sequenceDiagram
    participant App
    participant Old as Old DB (SQL Server)
    participant CDC as CDC (Debezium / DMS)
    participant New as New DB (Postgres)
    CDC->>Old: Ghi nhận vị trí log (LSN) + snapshot nhất quán
    CDC->>New: Full load
    loop Catch-up
      Old-->>CDC: Changes từ LSN đã lưu
      CDC->>New: Apply (idempotent upsert)
    end
    App->>Old: Read/write bình thường
    App-->>New: Shadow read + so sánh (không trả cho user)
    Note over App,New: Cutover: freeze write → chờ lag = 0 → verify → setval sequences → flip config
    App->>New: Read/write
    New-->>Old: Reverse replication (giữ đường rollback N ngày)
  ```

  ### Chuỗi durability (không ack cho tới khi durable)

  ```mermaid
  flowchart LR
    C["Client<br/>retry + Idempotency-Key"] --> API["API<br/>ack SAU khi commit"]
    API --> TX[("Postgres TX<br/>orders + outbox")]
    TX --> RL["Relay / CDC<br/>at-least-once"]
    RL --> K["Kafka<br/>acks=all, RF=3,<br/>min.insync=2"]
    K --> CO["Consumer<br/>xử lý → commit offset"]
    CO --> S[("Sink<br/>upsert idempotent")]
    S --> REC["Reconciliation<br/>count / sum theo giờ"]
    REC -. "lệch → replay từ outbox / offset" .-> RL
  ```

  ## Khung trả lời

  Dùng lại cho mọi câu "migrate X không downtime / không mất dữ liệu":

  1. **Làm rõ ràng buộc**: kích thước dữ liệu (rows, GB), QPS đọc/ghi, RPO/RTO, có được freeze write vài phút không, các app/consumer nào đang dùng, yêu cầu ordering.
  2. **Liệt kê điều phải tương thích song song**: code N và N-1, schema cũ và mới, consumer cũ và mới, client cũ (mobile không update được).
  3. **Chia bước reversible**: expand → dual (write / replicate) → backfill → verify → switch read → switch write → contract. Mỗi bước: cách rollback, tiêu chí go/no-go.
  4. **Bảo vệ production khi chạy**: `lock_timeout`, batch + throttle, theo dõi replica lag / WAL / consumer lag / error rate, kill switch (feature flag).
  5. **Chứng minh đúng**: count, checksum theo chunk, shadow read diff, reconciliation job, audit log.
  6. **Cutover + rollback**: runbook, người quyết định, thời gian freeze, reverse replication, khi nào xoá đường lui.
  7. **Nói trade-off bằng số**: "freeze 2 phút đổi lấy không phải dual-write 6 tuần", "sync commit thêm ~1–3 ms mỗi write trong cùng region".

  ## Trade-offs

  | Cách đồng bộ khi migrate | Consistency | Độ phức tạp | Rủi ro chính | Hợp khi |
  |---|---|---|---|---|
  | Downtime window (dump/restore) | Tuyệt đối | Thấp | Downtime tỉ lệ với data size | DB nhỏ, business chấp nhận maintenance |
  | Dual-write từ app | Yếu (không atomic) | Trung bình | Lệch khi 1 bên fail, race ordering | Chỉ khi không có CDC, có reconciliation mạnh |
  | CDC (Debezium / DMS / logical replication) | Tốt, theo commit order | Cao (vận hành connector) | Type mapping, DDL, lag, replication slot giữ WAL | Đa số migrate engine / cluster |
  | Snapshot restore + native replication | Tốt | Thấp–TB | Chỉ cùng engine / version tương thích | Self-hosted PG → RDS/Aurora |
  | Transactional outbox | Tốt, at-least-once | TB | Relay lag, bảng outbox phình | Sync SQL → NoSQL / event cho service khác |

  | Knob "zero data loss" | Được gì | Trả giá gì |
  |---|---|---|
  | PG `synchronous_commit=on` + sync standby | RPO ≈ 0 khi mất primary | Latency mỗi commit + write dừng nếu standby chết (trừ khi có nhiều candidate) |
  | Kafka `acks=all` + `min.insync.replicas=2` + RF=3 | Không mất message đã ack khi mất 1 broker | Latency cao hơn, mất 2 broker → producer bị từ chối |
  | `unclean.leader.election.enable=false` | Không bầu replica lỗi thời làm leader | Partition offline cho tới khi replica ISR quay lại |
  | Consumer commit sau xử lý | Không mất khi crash | Duplicate → cần idempotent sink |
  | PITR (WAL archive) | Khôi phục tới thời điểm trước lỗi người dùng | Chi phí lưu trữ, RTO phụ thuộc lượng WAL replay |

  ## Pitfalls

  - Gộp migration và code dùng schema mới trong **một** deploy → pod cũ crash / pod mới crash tùy thứ tự.
  - Migration không có `lock_timeout` → một `ALTER` "instant" chặn toàn bộ bảng phía sau một report query.
  - `CREATE INDEX CONCURRENTLY` trong migration tool mặc định bọc transaction → lỗi ngay; hoặc chạy fail để lại index `INVALID` vẫn làm chậm write.
  - Backfill bằng một `UPDATE` khổng lồ hoặc vòng lặp `OFFSET` → lock lâu, WAL bùng, replica lag, bloat.
  - Tin rằng "sync xong row count bằng nhau" = đúng. Count bằng nhau vẫn có thể sai collation, time zone, precision, trailing space.
  - Quên **reset sequence / identity** sau khi copy → `duplicate key` ngay khi app ghi vào DB mới.
  - Outbox relay "publish rồi mark done" coi là exactly-once; polling `id > last_id` bỏ sót event commit muộn.
  - Tăng partition Kafka giữa lúc backlog để "chạy nhanh hơn" → phá ordering theo key, không giảm lại được.
  - Có backup nhưng **chưa từng restore thử** → không biết RTO thật, không biết backup hỏng.
  - Traffic mirroring cho endpoint **ghi** → hệ mới gửi email/charge thẻ thật lần hai.

  ## Cheat sheet

  - Mọi DDL Postgres trong migration: `SET lock_timeout = '3s'; SET statement_timeout = '15min';` + retry có jitter.
  - Thêm cột: nullable hoặc `DEFAULT` hằng/stable (PG11+ không rewrite). Default volatile (`gen_random_uuid()`, `clock_timestamp()`) → rewrite bảng.
  - NOT NULL cột có sẵn: `ADD CONSTRAINT ... CHECK (c IS NOT NULL) NOT VALID` → `VALIDATE CONSTRAINT` → `SET NOT NULL` (PG12+ bỏ qua scan) → drop CHECK.
  - FK: `ADD CONSTRAINT ... FOREIGN KEY ... NOT VALID` → `VALIDATE CONSTRAINT` (lock nhẹ `SHARE UPDATE EXCLUSIVE`).
  - Index: `CREATE INDEX CONCURRENTLY` ngoài transaction; fail → `DROP INDEX CONCURRENTLY` rồi làm lại; kiểm `pg_index.indisvalid`.
  - MySQL: `ALGORITHM=INSTANT/INPLACE, LOCK=NONE`, bảng lớn dùng gh-ost / pt-online-schema-change. SQL Server: `WITH (ONLINE = ON, RESUMABLE = ON)` (edition-dependent).
  - Backfill: keyset theo PK, batch 1k–10k, commit mỗi batch, sleep / throttle theo `replay_lag`, checkpoint để resume, `WHERE new IS NULL` để idempotent.
  - DB migration: snapshot + CDC → count + checksum theo chunk + shadow read → freeze → lag 0 → `setval` → flip → reverse replication.
  - Kafka zero loss: `acks=all`, idempotent producer, RF=3, `min.insync.replicas=2`, `unclean.leader.election.enable=false`, commit sau xử lý, sink idempotent.
  - Backlog: ETA = backlog / (consume − produce); consumers ≤ partitions; per-key concurrency; rate limit downstream; park poison message; ưu tiên traffic mới.
  - Legacy: strangler proxy, contract test, shadow traffic chỉ cho read, adapter XML ↔ JSON, `Deprecation` / `Sunset` header, feature flag theo tenant, canary.
