questions:
  - id: nodejs-001
    level: easy
    type: concept
    q: Node.js is often called single-threaded. Is that accurate? What are V8 and libuv responsible for?
    hint: |-
      - **JS code** chạy trên một main thread (một call stack) — đúng. **Process** thì nhiều thread: libuv thread pool, V8 GC/JIT background threads, (tuỳ chọn) worker threads.
      - V8: parse/JIT JS, quản lý heap + GC.
      - libuv: event loop, abstraction async I/O cross-platform (epoll/kqueue/IOCP), thread pool, timers, signals, child processes.
      - Bindings C++ nối API Node (`fs`, `net`, `crypto`) với libuv/OpenSSL/zlib.
      - Hệ quả: I/O-bound concurrency rất tốt; CPU-bound một request làm **mọi request khác** đứng chờ.
    followUp: If Node has a thread pool, why can't two HTTP handlers run JavaScript at the same time?
    redFlags:
      - "Node is single-threaded so it can only do one I/O at a time"
      - "Every request gets its own thread from the pool"
    tags: [architecture, v8, libuv]
  - id: nodejs-002
    level: easy
    type: concept
    q: Name the phases of the Node.js event loop and what runs in each.
    hint: |-
      1. **timers**: callback `setTimeout`/`setInterval` đã hết hạn.
      2. **pending callbacks**: một số I/O callback bị hoãn sang vòng sau (vd lỗi TCP `ECONNREFUSED` trên một số hệ).
      3. **idle, prepare**: nội bộ.
      4. **poll**: lấy I/O event mới và chạy I/O callback; nếu không có gì, **block chờ** (có giới hạn bởi timer gần nhất / `setImmediate` đang chờ).
      5. **check**: `setImmediate`.
      6. **close callbacks**: `'close'` của socket/handle.
      `process.nextTick` và promise microtasks **không phải phase** — chúng được drain sau mỗi callback.
    followUp: Why does the poll phase sometimes block, and what makes it stop waiting?
    redFlags:
      - "Microtasks are a phase of the event loop"
    tags: [event-loop]
  - id: nodejs-003
    level: easy
    type: compare
    q: Compare `process.nextTick`, `queueMicrotask`/`Promise.then`, `setImmediate` and `setTimeout(fn, 0)`.
    hint: |-
      - `process.nextTick`: queue riêng của Node, chạy **ngay sau operation hiện tại**, trước promise microtasks. Dùng để emit event/lỗi async nhưng trước I/O.
      - `queueMicrotask`/`Promise.then`: V8 microtask queue, chạy sau nextTick queue, trước khi loop đi tiếp.
      - `setImmediate`: check phase (sau poll) — "chạy sau I/O hiện tại".
      - `setTimeout(fn, 0)`: timers phase, delay thực tế ≥ 1 ms.
      - Tên gây nhầm: `nextTick` chạy "ngay lập tức" hơn `setImmediate`.
    example: |-
      ```ts
      setTimeout(() => console.log("timeout"));
      setImmediate(() => console.log("immediate"));
      Promise.resolve().then(() => console.log("promise"));
      process.nextTick(() => console.log("nextTick"));
      // nextTick, promise, then timeout/immediate in non-deterministic order (main module)
      ```
    followUp: Why do Node docs recommend `setImmediate` over `process.nextTick` for most use cases?
    tags: [event-loop, timers]
  - id: nodejs-004
    level: easy
    type: concept
    q: What does "blocking the event loop" mean? Give four realistic ways production code does it by accident.
    hint: |-
      - Callback JS chạy quá lâu → không callback nào khác (request, timer, health check) chạy được → latency toàn service tăng, health check fail.
      - Ví dụ thật: `JSON.parse`/`JSON.stringify` payload vài chục MB; `*Sync` API (`readFileSync`, `pbkdf2Sync`, `gzipSync`) trong handler; regex backtracking (ReDoS); vòng lặp O(n²) trên mảng lớn (join dữ liệu in-memory); sort/format report hàng trăm nghìn dòng; template render lớn.
      - `async` **không** làm code CPU-bound thành non-blocking.
    followUp: How would you detect event loop blocking in production without attaching a debugger?
    redFlags:
      - "Wrapping it in a Promise makes it non-blocking"
    tags: [event-loop, performance]
  - id: nodejs-005
    level: easy
    type: concept
    q: What is a `Buffer`? What's the difference between `Buffer.alloc` and `Buffer.allocUnsafe`, and why does `Buffer` memory not show up in `heapUsed`?
    hint: |-
      - `Buffer` = byte array cố định kích thước (subclass `Uint8Array`), cho binary data: file, socket, crypto.
      - `alloc(n)`: zero-fill, an toàn. `allocUnsafe(n)`: không zero-fill (có thể lấy từ pool nội bộ) → nhanh hơn nhưng có thể chứa **dữ liệu cũ** trong memory → lộ thông tin nếu gửi ra ngoài trước khi ghi đè.
      - Dữ liệu Buffer nằm ngoài V8 heap → thấy ở `external`/`arrayBuffers`, và trong `rss`.
      - Encoding: `buf.toString("utf8")` với chunk bị cắt giữa ký tự multi-byte → lỗi ký tự; dùng `StringDecoder`/`setEncoding`.
    followUp: Your RSS keeps growing but `heapUsed` is flat. What do you suspect?
    tags: [buffer, memory]
  - id: nodejs-006
    level: easy
    type: concept
    q: Name the four stream types and give a real backend use case for each.
    hint: |-
      - **Readable**: nguồn dữ liệu — `fs.createReadStream`, HTTP request body (`req`), DB cursor stream.
      - **Writable**: đích — HTTP response (`res`), file, S3 multipart upload.
      - **Duplex**: đọc và ghi độc lập — TCP socket.
      - **Transform**: Duplex biến đổi input → output — gzip, CSV parser, JSON-lines transform.
      - Lợi ích: RAM tỉ lệ với **chunk size**, không với **file size**; bắt đầu xử lý/trả về sớm (time-to-first-byte).
    followUp: What is `objectMode`, and how does `highWaterMark` behave in object mode?
    tags: [streams]
  - id: nodejs-007
    level: easy
    type: gotcha
    q: What happens if an `EventEmitter` emits `'error'` and nobody is listening? What does `MaxListenersExceededWarning` tell you?
    hint: |-
      - `'error'` không có listener → emitter **throw** lỗi → nếu không ai bắt thành `uncaughtException` → process crash. Stream, socket, `http.ClientRequest` đều là EventEmitter.
      - `MaxListenersExceededWarning`: hơn 10 listener (mặc định) cho cùng một event trên một emitter — thường là dấu hiệu **leak** (đăng ký listener mỗi request). Không phải giới hạn cứng.
      - Đừng "fix" bằng `setMaxListeners(0)` trước khi hiểu nguyên nhân.
    followUp: Why can an `async` listener on an EventEmitter cause an unhandled rejection, and what does `captureRejections` do?
    tags: [events, error-handling]
  - id: nodejs-008
    level: easy
    type: compare
    q: How does Node decide whether a file is CommonJS or ESM, and can CommonJS `require()` an ES module today?
    hint: |-
      - `.mjs` → ESM, `.cjs` → CJS, `.js` → theo field `"type"` gần nhất trong `package.json` (`"module"` hoặc `"commonjs"`, mặc định CJS). Node mới hơn còn có detect syntax cho file mơ hồ.
      - ESM: `import`, top-level `await`, không có `__dirname`/`require` (dùng `import.meta.dirname`, `import.meta.filename`, `createRequire`).
      - `require(esm)`: được bật mặc định từ Node 22.12 / 20.19 cho ESM **không** có top-level await (verify theo version).
      - `exports` field trong package.json quyết định entry theo condition (`import`/`require`/`types`).
    followUp: What is the "dual package hazard", and how can it break `instanceof` checks or singletons?
    verify: true
    tags: [modules, esm, cjs]
  - id: nodejs-009
    level: easy
    type: compare
    q: "`uncaughtException` vs `unhandledRejection`: what triggers each, what's the default behavior, and what should a handler do?"
    hint: |-
      - `uncaughtException`: exception throw ra đến event loop mà không ai catch (sync, callback, emitter `'error'` không listener).
      - `unhandledRejection`: promise reject mà không có handler trước khi microtask queue drain xong.
      - Mặc định từ Node 15: `--unhandled-rejections=throw` → rejection không xử lý thành uncaught exception → **crash**.
      - Handler nên: log đầy đủ (kèm context), flush log/metric, **graceful shutdown rồi exit(1)**; để orchestrator restart. Không "nuốt lỗi và chạy tiếp".
    followUp: Why is continuing after `uncaughtException` unsafe even if the error looks harmless?
    redFlags:
      - "Add process.on('uncaughtException', console.error) so the server never crashes"
    tags: [error-handling, process]
  - id: nodejs-010
    level: easy
    type: compare
    q: "`dependencies`, `devDependencies`, `peerDependencies`, and lockfiles — what does each control, and why use `npm ci` in CI/Docker?"
    hint: |-
      - `dependencies`: cần lúc runtime; `devDependencies`: build/test (không cài với `--omit=dev`); `peerDependencies`: package của bạn cần host cài (plugin, React lib) để tránh 2 bản copy.
      - Lockfile ghi **cây dependency chính xác** (version + integrity hash) → build lặp lại được.
      - `npm ci`: cài đúng theo lockfile, fail nếu lockfile lệch `package.json`, xoá `node_modules` trước → deterministic, nhanh trong CI.
      - Semver range `^1.2.3` cho phép minor/patch mới → không có lockfile là "build hôm nay khác hôm qua".
    followUp: A transitive dependency ships a malicious patch release. Which of these settings protect you and which don't?
    tags: [npm, supply-chain]
  - id: nodejs-011
    level: easy
    type: concept
    q: How do you manage configuration and secrets for a Node service across environments?
    hint: |-
      - 12-factor: config qua **env vars**; đọc và **validate một lần lúc startup** (zod schema) → fail fast nếu thiếu.
      - Node có `--env-file=.env` và `process.loadEnvFile()` built-in cho local dev (verify version) — không cần `dotenv` trong nhiều trường hợp.
      - Secret: lấy từ secret manager (AWS Secrets Manager/SSM, Vault, K8s Secret) inject vào env hoặc file mount; không commit `.env`, không log config nguyên cục.
      - `process.env.X` luôn là `string | undefined` — parse số/boolean explicit (`"false"` là truthy!).
    example: |-
      ```ts
      const Env = z.object({
        PORT: z.coerce.number().default(3000),
        DATABASE_URL: z.string().url(),
        FEATURE_X: z.enum(["true", "false"]).transform((v) => v === "true"),
      });
      export const env = Env.parse(process.env); // crash at boot, not at 3am
      ```
    followUp: How do you rotate a DB password without restarting every pod at the same time?
    verify: true
    tags: [config, secrets]
  - id: nodejs-012
    level: easy
    type: concept
    q: How does Node's release/LTS model work, and which version would you run in production today?
    hint: |-
      - Major chẵn (even) trở thành **LTS**; major lẻ chỉ là "Current" ngắn hạn. LTS gồm giai đoạn Active rồi Maintenance, tổng khoảng 30 tháng (verify lịch cụ thể).
      - Production: dùng **Active LTS** (ở thời điểm 2026 là Node 24; Node 22 đang Maintenance; Node 20 đã EOL — verify trên trang release).
      - Upgrade theo lịch, không để chạy version EOL (không có security patch).
      - Pin version ở `.nvmrc`/`engines`/Docker base image digest.
    followUp: What breaks most often when you jump two Node majors?
    verify: true
    tags: [release, versions]
  - id: nodejs-013
    level: medium
    type: output
    q: What is the output order of each snippet, and why do they differ?
    example: |-
      ```ts
      // A: main module
      setTimeout(() => console.log("timeout"), 0);
      setImmediate(() => console.log("immediate"));

      // B: inside an I/O callback
      import { readFile } from "node:fs";
      readFile(import.meta.filename, () => {
        setTimeout(() => console.log("timeout"), 0);
        setImmediate(() => console.log("immediate"));
      });
      ```
    hint: |-
      - A: **không xác định** — phụ thuộc loop bắt đầu trước hay sau khi timer 1 ms hết hạn (hiệu năng máy lúc đó).
      - B: luôn `immediate` rồi `timeout` — callback I/O chạy ở poll phase, phase kế tiếp là **check** (`setImmediate`), timers phải đợi vòng sau.
      - Bài học: muốn "chạy sau I/O hiện tại" một cách deterministic → `setImmediate`.
    followUp: How did the libuv 1.45 change to when timers run affect ordering guarantees you may have relied on?
    verify: true
    tags: [event-loop, output]
  - id: nodejs-014
    level: medium
    type: output
    q: Predict the output. What changed in Node 11 that affects it?
    example: |-
      ```ts
      setTimeout(() => {
        console.log("t1");
        Promise.resolve().then(() => console.log("p1"));
        process.nextTick(() => console.log("n1"));
      }, 0);
      setTimeout(() => {
        console.log("t2");
      }, 0);
      ```
    hint: |-
      - Output (Node ≥ 11): `t1 n1 p1 t2`.
      - Sau **mỗi** callback timer, Node drain nextTick queue rồi promise microtasks trước khi chạy callback timer kế tiếp (giống browser).
      - Node ≤ 10: chạy hết các timer đã hết hạn rồi mới drain → `t1 t2 n1 p1`.
      - Takeaway: đừng viết code phụ thuộc vào ranh giới giữa các callback cùng phase.
    followUp: What happens if a `process.nextTick` callback recursively schedules another `nextTick` forever?
