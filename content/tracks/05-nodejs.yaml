slug: nodejs
title: Node.js Internals
tier: 1
status: drafted
summary: V8 + libuv, event loop phases, thread pool, streams/backpressure, worker_threads vs cluster vs child_process, memory leak & heap snapshot, graceful shutdown, profiling, security.
