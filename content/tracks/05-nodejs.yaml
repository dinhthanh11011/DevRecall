overview: |-
  ## TL;DR

  - Node.js = **V8** (chạy JS, GC) + **libuv** (event loop, async I/O, thread pool) + C++ bindings. JS chạy trên **một main thread**, nhưng process có nhiều thread (libuv pool, V8 GC/compiler threads).
  - Network I/O dùng cơ chế non-blocking của OS (epoll/kqueue/IOCP) — **không** dùng thread pool. File system, `dns.lookup`, một số `crypto` và `zlib` async dùng **thread pool** (mặc định 4 thread, `UV_THREADPOOL_SIZE`).
  - Throughput của một Node service phụ thuộc vào việc **không block event loop**: CPU-bound → `worker_threads`/service riêng; dữ liệu lớn → **streams + backpressure**.
  - Production-ready = biết **đo** (event loop delay/utilization, heap, GC, CPU profile), **tìm leak** (heap snapshot comparison), **shutdown đúng cách** (SIGTERM, drain keep-alive connections) và **phòng thủ** (prototype pollution, ReDoS, command injection, supply chain).
  - Version: Node 24 là LTS đang dùng (local v24); nhiều hành vi thay đổi theo major — các hint có `verify` cần check lại docs đúng version.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Event loop | Vòng lặp của libuv, chạy callback theo **phase** | timers → poll → check → close |
  | `process.nextTick` queue | Queue của Node, chạy **trước** promise microtasks, sau mỗi callback | `nextTick` in trước `Promise.then` |
  | Microtask | Promise reaction, `queueMicrotask` — drain **hết** sau mỗi macrotask callback | `await` tiếp tục trong microtask |
  | Thread pool | Pool thread của libuv cho việc không có async API của OS | `fs.readFile`, `crypto.pbkdf2`, `dns.lookup` |
  | Stream | Xử lý dữ liệu theo chunk thay vì load hết vào RAM | `fs.createReadStream().pipe(res)` |
  | Backpressure | Cơ chế consumer báo producer chậm lại | `write()` trả `false` → chờ `'drain'` |
  | `worker_threads` | Thread JS riêng (V8 isolate riêng) trong cùng process | Resize ảnh, parse file lớn |
  | `cluster` | Fork nhiều process chia chung port | Tận dụng nhiều core trên VM |
  | Heap snapshot | Ảnh chụp heap V8 để tìm object bị giữ reference | Comparison 2 snapshot → retainers |
  | `AsyncLocalStorage` | Context đi theo async call chain | request-id, tenantId cho log |

  ## Cơ chế hoạt động

  ### Event loop phases

  ```mermaid
  flowchart TD
    START["Run main module (sync)"] --> T
    T["timers<br/>setTimeout / setInterval đã hết hạn"] --> P["pending callbacks<br/>một số I/O callback bị hoãn (vd TCP error)"]
    P --> I["idle, prepare (nội bộ)"]
    I --> POLL["poll<br/>lấy I/O event mới, chạy I/O callback;<br/>block chờ nếu không có việc"]
    POLL --> C["check<br/>setImmediate"]
    C --> CL["close callbacks<br/>socket.on('close')"]
    CL --> ALIVE{"Còn handle/request active?"}
    ALIVE -- yes --> T
    ALIVE -- no --> EXIT["process exit"]
    MT["Sau MỖI callback:<br/>1. drain process.nextTick queue<br/>2. drain promise microtasks"] -.-> T
    MT -.-> POLL
    MT -.-> C
  ```

  - Từ Node 11, nextTick + microtasks được drain **sau mỗi callback** (không phải chỉ giữa các phase) — giống browser.
  - Từ libuv 1.45 (Node 20), timers chạy **sau** poll trong mỗi iteration (trước đó chạy trước poll); libuv vẫn chạy timers một lần trước khi vào loop (verify khi dựa vào thứ tự chi tiết).

  ### Ai dùng thread pool, ai không

  ```mermaid
  flowchart LR
    JS["JS main thread"] -->|"socket read/write,<br/>http, net, dns.resolve*"| OS["OS async I/O<br/>(epoll/kqueue/IOCP)<br/>+ c-ares cho dns.resolve"]
    JS -->|"fs.*, dns.lookup,<br/>crypto.pbkdf2/scrypt/randomBytes (async),<br/>zlib async, native addon async work"| POOL["libuv thread pool<br/>(default 4, UV_THREADPOOL_SIZE)"]
    OS --> Q["callback vào poll phase"]
    POOL --> Q
    Q --> JS
  ```

  ### Streams & backpressure

  ```mermaid
  sequenceDiagram
    participant R as Readable (file / DB cursor)
    participant T as Transform (parse CSV)
    participant W as Writable (DB bulk insert)
    R->>T: push(chunk)
    T->>W: write(row)
    W-->>T: returns false (buffer >= highWaterMark)
    Note over T,R: pipeline() pauses upstream
    W-->>T: 'drain'
    T->>R: resume reading
  ```

  ### Graceful shutdown (Kubernetes)

  ```mermaid
  sequenceDiagram
    participant K as Kubelet
    participant App as Node process
    participant LB as Service / LB
    K->>App: SIGTERM (pod Terminating)
    K->>LB: remove endpoint (song song, có độ trễ)
    App->>App: readiness = false, ngừng nhận job mới
    App->>App: server.close() + đóng idle keep-alive connections
    App->>App: chờ in-flight requests / consumer commit offset
    App->>App: đóng DB pool, Redis, Kafka producer
    App->>K: exit(0)
    K-->>App: SIGKILL nếu quá terminationGracePeriodSeconds
  ```

  ## Trade-offs

  | Cách chạy song song | Isolation | Chia sẻ memory | Chi phí khởi tạo | Dùng khi |
  |---|---|---|---|---|
  | `worker_threads` | V8 isolate riêng, cùng process | `SharedArrayBuffer`, transfer `ArrayBuffer` | Thấp–vừa (vài ms, MB heap) | CPU-bound trong service (parse, hash, image) |
  | `cluster` | Process riêng | Không (IPC) | Cao | Nhiều core trên VM không có orchestrator |
  | `child_process` | Process riêng, có thể là binary khác | Không (stdio/IPC) | Cao | Gọi ffmpeg, script Python, tool CLI |
  | N container/pod | Hoàn toàn | Không | Cao nhất | Mặc định trên Kubernetes — scale bằng replica |

  | Xử lý dữ liệu lớn | RAM | Độ phức tạp | Ghi chú |
  |---|---|---|---|
  | `readFile` + `JSON.parse` | O(file) | Thấp | Block event loop khi parse, OOM với file lớn |
  | Streams + `pipeline` | O(highWaterMark × stages) | Vừa | Backpressure tự động, xử lý lỗi/cleanup đúng |
  | Job queue + worker | Tuỳ | Cao | Tách khỏi request path, retry, quan sát được |

  ## Pitfalls

  - Sync API trong request path: `fs.readFileSync`, `crypto.pbkdf2Sync`, `zlib.gzipSync`, `JSON.parse`/`stringify` payload lớn, regex backtracking.
  - `bcrypt`/`pbkdf2` async chiếm hết 4 thread pool → `fs` và `dns.lookup` của request khác bị xếp hàng.
  - `readable.pipe(writable)` **không** destroy stream khi lỗi → leak file descriptor; dùng `stream.pipeline`.
  - Bỏ qua giá trị trả về của `write()` → buffer phình trong RAM.
  - Listener `on(...)` đăng ký mỗi request mà không `off` → leak + `MaxListenersExceededWarning`.
  - Cache `Map` không giới hạn, closure giữ object lớn, timer không `clearInterval`.
  - `server.keepAliveTimeout` nhỏ hơn idle timeout của load balancer → 502 lẻ tẻ.
  - Chạy `npm start` làm PID 1 trong container → signal có thể không tới Node; dùng `node` trực tiếp hoặc init (`tini`, `--init`).
  - `process.on('uncaughtException')` rồi chạy tiếp → process ở trạng thái không xác định.
  - Deep merge JSON từ client → **prototype pollution**; `exec("convert " + userInput)` → command injection.

  ## Cheat sheet

  - Thứ tự trong một tick: sync code → `process.nextTick` queue → promise microtasks → phase kế tiếp.
  - Main module: `setTimeout(0)` vs `setImmediate` **không xác định**; trong I/O callback: `setImmediate` luôn trước.
  - Thread pool: default 4, max 1024; set `UV_THREADPOOL_SIZE` **trước khi** pool được dùng lần đầu (tốt nhất là env var khi start).
  - Stream highWaterMark mặc định: 64 KiB cho byte stream từ Node 22 (trước đó 16 KiB), 16 object cho objectMode (verify).
  - Đo: `performance.eventLoopUtilization()`, `perf_hooks.monitorEventLoopDelay()`, `--cpu-prof`, `--heap-prof`, `--heapsnapshot-signal=SIGUSR2`, `--heapsnapshot-near-heap-limit=N`, `--trace-gc`.
  - `process.memoryUsage()`: `rss` (toàn process) · `heapUsed/heapTotal` (V8 heap) · `external` + `arrayBuffers` (Buffer ngoài heap).
  - `--unhandled-rejections` mặc định `throw` (từ Node 15) → rejection không có handler làm crash process.
  - `setTimeout` với delay > 2147483647 ms bị set thành 1 ms (kèm `TimeoutOverflowWarning`).
  - Default EventEmitter `maxListeners` = 10 (chỉ là warning, không phải giới hạn cứng).
