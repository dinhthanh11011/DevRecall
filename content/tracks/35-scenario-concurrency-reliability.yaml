id: 35-scenario-concurrency-reliability
slug: scenario-reliability
title: "Scenarios: Concurrency, Idempotency & Reliability"
tier: 9
status: drafted
summary: Mock interview tình huống production — oversell, double charge, rate limit, retry/circuit breaker, graceful shutdown trên K8s, webhook, idempotent consumer, deadlock, distributed lock, cron chạy 2 lần, OTP/MFA, race condition trong Node.
cvLinked: true
prerequisites: [13-sql-postgres, 17-messaging-kafka, 18-distributed-systems]
# Must-know questions, highest priority first (study plans take the first few).
essentials:
