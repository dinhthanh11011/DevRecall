overview: |-
  ## TL;DR

  - Mọi scenario trong track này quy về 3 câu hỏi: **(1) hai actor cùng chạm một resource thì ai thắng?** (concurrency), **(2) cùng một việc bị làm hai lần thì sao?** (idempotency), **(3) dependency chậm/chết/đang deploy thì hệ thống cư xử thế nào?** (reliability).
  - Sửa race condition = **đẩy invariant xuống nơi có atomicity** (một câu `UPDATE ... WHERE`, unique constraint, Lua script), không phải "check trong code rồi ghi".
  - At-least-once là thực tế của mạng: client retry, provider retry webhook, Kafka redeliver sau rebalance. Mọi handler có side effect phải **idempotent** — dedup bằng key + unique constraint **trong cùng transaction** với side effect.
  - Retry chỉ an toàn khi: lỗi transient, operation idempotent, có **backoff + full jitter**, có **retry budget** và **deadline**. Nếu không, retry biến một sự cố nhỏ thành retry storm.
  - Vận hành: graceful shutdown trên K8s là bài toán **race giữa SIGTERM và việc gỡ endpoint** → readiness fail + `preStop` sleep + đóng keep-alive + drain consumer. Liveness **không bao giờ** check DB.

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Read-modify-write race | Đọc → quyết định trong app → ghi; khoảng giữa là nơi request khác chen vào | 2 request cùng đọc `stock=1`, cùng trừ |
  | Atomic conditional UPDATE | Điều kiện nằm trong `WHERE`, DB kiểm và ghi trong 1 lệnh | `UPDATE ... SET stock=stock-1 WHERE id=$1 AND stock>=1` → `rowCount` |
  | Optimistic lock | Ghi kèm `WHERE version=$old`; 0 row → conflict → retry | `version = version + 1` |
  | Pessimistic lock | Khoá row khi đọc (`FOR UPDATE`), người khác chờ | `NOWAIT` = lỗi ngay, `SKIP LOCKED` = bỏ qua row đang bị khoá |
  | Idempotency key | Client gửi 1 key/1 thao tác; server lưu key + fingerprint + response | `Idempotency-Key: 7c3e...` |
  | Idempotent consumer | Dedup theo `event_id` bằng unique constraint trong cùng transaction với business write | `INSERT INTO processed_events ... ON CONFLICT DO NOTHING` |
  | Token bucket | Bucket dung lượng B, nạp r token/s; request lấy 1 token | B=20, r=100/60 → burst 20, trung bình 100/phút |
  | Full jitter | `sleep = random(0, min(cap, base·2^n))` | n=3, base=100ms → random 0..800ms |
  | Retry budget | Giới hạn tỉ lệ retry / request (vd ≤10%) | 1000 rps → tối đa 100 retry/s |
  | Circuit breaker | Closed → Open (fail fast) → Half-open (thử) | opossum `errorThresholdPercentage: 50` |
  | Fencing token | Số tăng dần cấp kèm lock; storage từ chối token cũ | `WHERE last_token < $token` |
  | Reservation/hold | Giữ tài nguyên có hạn (`expires_at`), hết hạn thì trả lại | Giữ ghế 10 phút khi checkout |
  | Pivot transaction | Bước trong saga mà sau nó chỉ được đi tiếp (retry), không compensate | Capture payment thành công |
  | Read-your-writes | User luôn thấy chính thứ mình vừa ghi | Route read về primary 5s sau write |

  ## Cơ chế hoạt động

  ### Chống double charge bằng idempotency key (có xử lý in-flight và crash)

  ```mermaid
  flowchart TD
    R["POST /payments + Idempotency-Key"] --> I{"INSERT key, fingerprint,<br/>status=processing,<br/>locked_until=now+30s<br/>ON CONFLICT DO NOTHING"}
    I -- "inserted (winner)" --> P["Call provider với<br/>CÙNG idempotency key"]
    P --> S["UPDATE status=done,<br/>response_code, response_body"]
    S --> OK["Trả response"]
    I -- "conflict" --> F{"fingerprint khớp?"}
    F -- no --> E422["422: key reused<br/>with different body"]
    F -- yes --> ST{"status?"}
    ST -- done --> RP["Replay response đã lưu"]
    ST -- "processing, lease còn hạn" --> C409["409 / Retry-After"]
    ST -- "processing, lease hết hạn" --> RC["Recovery: hỏi provider<br/>theo key rồi hoàn tất"]
  ```

  ### Graceful shutdown của pod Node trên Kubernetes

  ```mermaid
  sequenceDiagram
    participant K as kubelet
    participant EP as EndpointSlice / kube-proxy / LB
    participant P as Node process
    K->>EP: Pod Terminating → gỡ khỏi endpoints (bất đồng bộ)
    K->>P: preStop (sleep 5-10s)
    Note over P: Vẫn nhận traffic đến khi LB cập nhật xong
    K->>P: SIGTERM (sau preStop)
    P->>P: readiness=503, server.close()
    P->>P: closeIdleConnections, Connection close cho request đang chạy
    P->>P: consumer.disconnect() → commit offset
    P->>P: đóng DB pool, Redis → exit(0)
    K-->>P: SIGKILL nếu quá terminationGracePeriodSeconds (tính từ lúc bắt đầu preStop)
  ```

  ### Idempotent consumer + DLQ

  ```mermaid
  flowchart LR
    T["Topic partition<br/>(key = orderId)"] --> H["Handler"]
    H --> TX{"BEGIN<br/>INSERT processed_events(event_id)<br/>ON CONFLICT DO NOTHING"}
    TX -- "0 row: đã xử lý" --> CM["COMMIT → commit offset"]
    TX -- "1 row" --> BL["Business write"] --> CM
    H -- "transient error" --> RT["Retry có backoff<br/>(giới hạn số lần)"]
    RT --> H
    H -- "poison / hết retry" --> DLQ["DLQ + alert<br/>(+ park key nếu cần ordering)"]
    DLQ --> RE["Fix → replay"]
  ```

  ## Khung trả lời (dùng cho mọi scenario trong track)

  1. **Clarify & đo**: volume (QPS, số item), invariant nghiệp vụ ("không bao giờ bán quá 100 vé", "mỗi order tối đa 1 lần charge"), chấp nhận stale/lỗi đến đâu, hiện có metric/log gì.
  2. **Gọi tên cơ chế**: race (read-modify-write, check-then-act), duplicate (retry, redelivery), amplification (retry storm), race hạ tầng (SIGTERM vs endpoint removal).
  3. **Fix theo lớp, rẻ nhất trước**: constraint/atomic op ở storage → idempotency/dedup → lock (DB trước Redis) → thay đổi kiến trúc (queue, reservation, saga).
  4. **Failure modes của chính cái fix**: lock hết hạn, Redis chết, key "processing" kẹt, DLQ phá ordering, fail-open vs fail-closed.
  5. **Chứng minh**: test song song (k6/autocannon + assert invariant), metric (conflict rate, 409, DLQ size, retry ratio), reconciliation job định kỳ như lưới an toàn cuối.

  ## Trade-offs

  | Kỹ thuật | Throughput khi contention cao | Độ phức tạp | Khi nào dùng | Rủi ro chính |
  |---|---|---|---|---|
  | Atomic conditional UPDATE | Cao nhưng serialize trên 1 row | Thấp | Counter/tồn kho đơn giản | Hot row: mọi request xếp hàng trên 1 row lock |
  | Optimistic (version) | Kém khi conflict nhiều (retry liên tục) | Trung bình | Logic phức tạp, conflict hiếm | Retry storm, starvation |
  | `SELECT ... FOR UPDATE` | Trung bình, giữ lock suốt transaction | Trung bình | Nhiều bước đọc/ghi cần nhất quán | Deadlock, pool cạn nếu transaction dài |
  | `FOR UPDATE SKIP LOCKED` | Cao | Trung bình | Phân phát item bất kỳ (ghế trống bất kỳ, job queue) | Không dùng được khi cần đúng 1 row cụ thể |
  | Redis Lua pre-decrement | Rất cao (~100k ops/s một node, verify) | Cao | Flash sale | Lệch với DB → cần reconciliation |
  | Sharded counter | Cao | Trung bình | Counter nóng (view, stock pool) | Đọc tổng tốn hơn; check "≥0" khó hơn |
  | Redis lock | Cao | Trung bình | Tránh làm trùng việc tốn kém (efficiency) | Không an toàn cho correctness nếu thiếu fencing |
  | Postgres advisory lock | Trung bình | Thấp | Job/cron singleton, đã có Postgres | Session lock + PgBouncer transaction mode = hỏng |

  | Rate limit fail mode | Hành vi khi Redis chết | Hợp cho |
  |---|---|---|
  | Fail-open | Cho qua hết (có thể kèm local limiter) | API đọc thông thường, ưu tiên availability |
  | Fail-closed | Chặn (429/503) | Login, OTP, gửi SMS, endpoint tốn tiền |
  | Degraded local | Mỗi pod dùng limit/N in-memory | Hầu hết trường hợp — trung dung |

  ## Pitfalls

  - Kiểm tra trong code (`if (stock > 0)`) rồi mới `UPDATE` — dù dùng transaction ở READ COMMITTED vẫn race.
  - Idempotency key không có **fingerprint** (cùng key, body khác) và không có **lease** → key kẹt `processing` vĩnh viễn sau crash.
  - Không truyền idempotency key xuống **payment provider** → timeout ở giữa vẫn double charge.
  - Retry ở mọi layer (client + gateway + service + SDK) → amplification theo cấp số nhân.
  - `server.close()` rồi nghĩ là xong: keep-alive connection giữ process sống đến SIGKILL.
  - `CMD ["npm", "start"]` hoặc shell form → SIGTERM không tới được Node.
  - Liveness probe gọi DB → DB chậm 30s = restart toàn bộ fleet.
  - Verify HMAC trên `JSON.stringify(req.body)` thay vì raw body; so sánh bằng `===`; không kiểm timestamp → replay.
  - Check `exists(event_id)` **ngoài** transaction → hai consumer cùng pass check.
  - Redis lock release bằng `DEL` trơn; lock hết hạn giữa chừng mà không có fencing token.
  - OTP tạo bằng `Math.random()`, lưu plaintext, không giới hạn số lần thử, không throttle resend.

  ## Cheat sheet

  - Oversell: `UPDATE ... WHERE stock >= $qty` + check `rowCount`; ghế cụ thể → unique `(show_id, seat_id)`; flash sale → Redis Lua + queue + reconcile; hot row → sharded counter.
  - Postgres errors: `40001` serialization_failure, `40P01` deadlock_detected, `55P03` lock_not_available (NOWAIT), `23505` unique_violation. SQL Server: deadlock = error 1205; `WITH (UPDLOCK, ROWLOCK)`, `READPAST` ≈ SKIP LOCKED.
  - Idempotency record: `key, scope(user/tenant), fingerprint(sha256 body), status, locked_until, response_code, response_body, created_at` + TTL ~24h (Stripe giữ 24h, verify).
  - Rate limit: 429 + `Retry-After`; IETF `RateLimit-Policy` / `RateLimit` headers (draft, verify). Tính toán trong **Lua** để atomic.
  - Retry: chỉ transient (timeout, 502/503/504, 429 có `Retry-After`, ECONNRESET) + idempotent; full jitter; tối đa 3 attempt; retry ở **một** layer; budget 10%.
  - Shutdown: preStop sleep 5–10s → SIGTERM → readiness 503 → `server.close()` + `closeIdleConnections()` → drain → commit offset → exit. `terminationGracePeriodSeconds` mặc định 30s và **bao gồm** preStop.
  - Webhook: raw body HMAC-SHA256 + timestamp ±5 phút + `timingSafeEqual` → insert event (unique event_id) → 200 nhanh → worker → reconcile theo API.
  - Lock: `SET k token NX PX ttl` + Lua compare-and-delete + fencing token cho correctness; hoặc `pg_try_advisory_xact_lock`.
  - Cron: K8s `concurrencyPolicy: Forbid` + job idempotent (CronJob có thể tạo 2 job hoặc 0 job trong vài trường hợp — docs K8s).
  - OTP: `crypto.randomInt`, hash + TTL 5 phút, ≤5 lần thử, resend cooldown 30–60s, single-use, bind `user + purpose`, `timingSafeEqual`; ưu tiên TOTP/WebAuthn.
