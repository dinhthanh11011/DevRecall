id: 09-react
slug: react
title: React
tier: 3
status: drafted
summary: Rendering & reconciliation, hooks pitfalls, effects, memoization vs React Compiler, concurrent features, React 19 Actions (`use`, `useActionState`, `useOptimistic`), error boundaries, testing — theo React 19.2.
cvLinked: true
prerequisites: [03-javascript]
overview: |-
  ## TL;DR

  - React = **UI là function của state**. Mỗi render là một snapshot (props + state + closure); React so sánh cây mới với cây cũ (**reconciliation**) rồi **commit** thay đổi tối thiểu vào DOM.
  - Hầu hết bug React thật đến từ 4 chỗ: **effect dùng sai** (sync state bằng effect, thiếu cleanup, race condition), **stale closure**, **identity** (object/function mới mỗi render phá memo & deps), **key sai** (state dính nhầm item).
  - React 18 đưa **concurrent rendering** (transition, deferred value, Suspense streaming SSR, automatic batching). React 19 đưa **Actions** (`useActionState`, `useOptimistic`, `useFormStatus`, `<form action>`), `use()`, `ref` là prop, `<Context>` làm provider. React 19.2 thêm `<Activity>` và `useEffectEvent`.
  - **React Compiler** (1.0, 2025) tự memoize → `useMemo`/`useCallback`/`memo` thủ công ít cần hơn, nhưng code phải tuân **Rules of React** (render thuần, không mutate props/state).
  - Senior bar: biết **đo** (React Profiler, Performance panel) trước khi tối ưu; biết đặt state ở đâu (local, lifted, URL, server cache, global store).

  ## Khái niệm cốt lõi

  | Khái niệm | Một câu | Ví dụ ngắn |
  |---|---|---|
  | Render vs commit | Render = gọi component tính JSX (thuần, có thể bị gọi lại/bỏ); commit = áp vào DOM + chạy effect | `console.log` trong body chạy 2 lần ở StrictMode dev |
  | Reconciliation | So cây cũ/mới theo **type + vị trí + key** | Đổi `<Input>` thành `<textarea>` cùng vị trí → unmount state |
  | Key | Danh tính của phần tử trong list, quyết định state đi theo ai | `key={item.id}`, không phải `index` khi list đổi thứ tự |
  | Snapshot / closure | Handler thấy state **của render đã tạo ra nó** | `setCount(count + 1)` 3 lần → +1 |
  | Effect | Đồng bộ component với hệ thống **bên ngoài** React | subscribe WebSocket, đổi `document.title` |
  | Memoization | Giữ lại value/function/render giữa các render nếu deps không đổi | `memo(Row)` + `useCallback(onSelect)` |
  | Transition | Đánh dấu update **không khẩn cấp**, có thể bị ngắt | `startTransition(() => setFilter(q))` |
  | Suspense | Boundary hiển thị fallback khi con đang "chờ" (lazy, `use(promise)`, data framework) | `<Suspense fallback={<Skeleton/>}>` |
  | Action | Hàm (có thể async) chạy trong transition, gắn với form/pending/optimistic | `<form action={saveAction}>` |
  | Error boundary | Class component bắt lỗi **khi render** của cây con | `static getDerivedStateFromError` |

  ## Cơ chế hoạt động

  ### Vòng đời một update

  ```mermaid
  flowchart TD
    A["Trigger: setState / props mới /<br/>context đổi / parent render"] --> B["Schedule update<br/>(lane: sync, default, transition)"]
    B --> C["Render phase<br/>gọi component, tạo cây mới<br/>(thuần, có thể bị ngắt ở concurrent)"]
    C --> D["Reconcile: so type + key<br/>tính danh sách thay đổi"]
    D --> E["Commit phase (đồng bộ)<br/>cập nhật DOM, gắn ref"]
    E --> F["useLayoutEffect<br/>(trước paint)"]
    F --> G["Browser paint"]
    G --> H["useEffect<br/>(sau paint, thường)"]
    C -. "update khẩn cấp hơn đến" .-> B
  ```

  ### Reconciliation quyết định giữ hay huỷ state

  ```mermaid
  flowchart LR
    A["Cùng vị trí trong cây"] --> B{"Cùng type?"}
    B -- no --> C["Unmount cây cũ<br/>mount mới (mất state)"]
    B -- yes --> D{"Cùng key?"}
    D -- no --> C
    D -- yes --> E["Giữ instance/state<br/>cập nhật props"]
  ```

  ### React 19 Action với form

  ```mermaid
  sequenceDiagram
    participant U as User
    participant F as Form
    participant R as React
    participant S as Server / API
    U->>F: submit
    F->>R: startTransition(action)
    R->>R: isPending = true, useOptimistic hiển thị ngay
    R->>S: await action(prevState, formData)
    S-->>R: result / error
    R->>R: set state (useActionState), optimistic tự revert về state thật
    R-->>U: UI mới, form uncontrolled được reset
  ```

  ## Trade-offs

  | Quyết định | Lựa chọn A | Lựa chọn B | Khi nào chọn |
  |---|---|---|---|
  | Memo thủ công vs React Compiler | `memo/useMemo/useCallback` có chủ đích | Compiler tự memoize | Compiler khi codebase tuân Rules of React; thủ công cho hot path đã đo |
  | Controlled vs uncontrolled input | State React là nguồn thật (validate khi gõ) | DOM giữ giá trị, đọc lúc submit (`FormData`) | Form lớn/đơn giản → uncontrolled + Actions; cần format/validate realtime → controlled |
  | Context vs store (Redux/Zustand) | Context: dependency injection, ít đổi | Store có selector, tránh re-render toàn cây | Theme/auth/locale → context; state đổi thường xuyên nhiều consumer → store |
  | Fetch trong effect vs data library/RSC | Tự viết: race, cache, retry đều tự lo | React Query/SWR/RSC | Hầu như luôn dùng library/framework |
  | Class vs function component | Class: lifecycle, error boundary | Hooks: tái sử dụng logic, compiler hỗ trợ | Code mới dùng function; class chỉ cho error boundary/legacy |
  | `useTransition` vs `useDeferredValue` | Bọc **setter** mình kiểm soát | Trì hoãn **value** nhận từ ngoài | Có quyền với setState → transition; chỉ có prop → deferred |

  ## Pitfalls

  - Dùng `useEffect` để tính derived state (`setFullName(first + last)`) → render thừa, lệch một nhịp. Tính trực tiếp trong render.
  - Fetch trong effect không cleanup/ignore flag → **race condition** (response cũ đè response mới).
  - Object/array/function literal truyền xuống `memo` child hoặc deps → memo vô dụng, effect chạy mãi.
  - `key={index}` hoặc `key={Math.random()}` → state dính sai dòng / remount mỗi render.
  - Mutate state (`arr.push`) rồi `setArr(arr)` → cùng reference, React bỏ qua render.
  - Nghĩ error boundary bắt lỗi trong event handler/`setTimeout`/promise — **không**.
  - Đặt Context provider value là object mới mỗi render → mọi consumer re-render.
  - Test implementation details (state nội bộ, class name) thay vì hành vi người dùng.

  ## Cheat sheet

  - Rules of Hooks: chỉ gọi ở top level, chỉ trong component/custom hook. `use()` là ngoại lệ: gọi được trong `if`/loop.
  - Updater function khi state mới phụ thuộc state cũ: `setN(n => n + 1)`. Updater phải **thuần**.
  - Effect: setup + cleanup đối xứng; StrictMode dev chạy setup → cleanup → setup để lộ thiếu cleanup.
  - `useLayoutEffect`: đo DOM trước paint (tooltip position). Mặc định dùng `useEffect`.
  - `useRef`: giá trị mutable không gây render; không đọc/ghi `ref.current` trong render.
  - React 19: `ref` là prop thường cho function component; `<Ctx value={v}>` thay `<Ctx.Provider>`; ref callback có thể trả cleanup.
  - React 19 Actions: `useActionState(fn, init)` → `[state, formAction, isPending]`; `useOptimistic(state, reducer)`; `useFormStatus()` (react-dom) đọc form cha.
  - React 19.2: `<Activity mode="hidden">` giữ state nhưng unmount effect; `useEffectEvent` tách logic không reactive khỏi deps.
  - Error boundary: vẫn phải là class (hoặc thư viện `react-error-boundary`); không bắt lỗi event handler/async.
  - Test: `getByRole` > `getByText` > `getByTestId`; `findBy*` cho async; `userEvent` thay `fireEvent`; mock network bằng MSW.
